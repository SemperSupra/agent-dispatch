name: AAR Play Host Intel macOS Requalification

on:
  push:
    branches: [qual/aar-play-host-matrix-20260926]
    paths:
      - ".github/workflows/aar-play-host-macos-intel-requalification.yml"

permissions:
  contents: read

jobs:
  intel-mac:
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - name: Checkout Agent Dispatch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout corrected public AAR implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SemperSupra/android-artifact-recovery
          ref: 0f8f39bcadbc945f64d88948d8c42117aa715a9a
          path: aar
          persist-credentials: false

      - name: Validate corrected AAR contract
        working-directory: aar
        run: python3 -m unittest -v tests/test_aar_play_host.py

      - name: Execute Intel macOS lifecycle rep
        run: |
          set +e
          mkdir -p "${RUNNER_TEMP}/aar-play-host"
          python3 scripts/aar_play_host_qualification.py \
            --aar-root "${GITHUB_WORKSPACE}/aar" \
            --expect supported \
            --out "${RUNNER_TEMP}/aar-play-host/receipt.json"
          rc=$?
          exit "$rc"

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aar-play-host-macos-intel-rerun-${{ matrix.rep }}
          path: ${{ runner.temp }}/aar-play-host/receipt.json
          if-no-files-found: error
          retention-days: 7
