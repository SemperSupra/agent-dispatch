name: CirrOS V1 direct QEMU CPU discriminator

on:
  push:
    branches:
      - experiment/cirros-v1-direct-cpu-discriminator-20261006
    paths:
      - '.github/workflows/cirros-v1-direct-cpu-discriminator.yml'
      - 'scripts/compute_guest_seed.py'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install bounded QEMU fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils xorriso ovmf

      - name: Build exact repaired V1 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v1/seed"
          cd "$RUNNER_TEMP/v1"
          curl --fail --location --retry 3 --silent --show-error \
            https://download.cirros-cloud.net/0.6.3/cirros-0.6.3-x86_64-disk.img \
            -o cirros.qcow2
          echo "7d6355852aeb6dbcd191bcda7cd74f1536cfe5cbf8a10495a7283a8396e4b75b  cirros.qcow2" | sha256sum -c -
          qemu-img convert -f qcow2 -O raw cirros.qcow2 pristine.raw
          python3 "$GITHUB_WORKSPACE/scripts/compute_guest_seed.py" \
            --nonce v1directcpusmoke20261006 \
            --instance-id rdte-v1-direct-cpu-smoke \
            --out-dir seed
          (
            cd seed
            xorriso -as mkisofs -quiet -output ../seed.iso -volid cidata -joliet -rock user-data meta-data
          )
          sha256sum pristine.raw seed.iso | tee fixture-sha256.txt

      - name: Compare direct-QEMU CPU models
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v1"
          marker='AGENT_DISPATCH_V1_NONCE=v1directcpusmoke20261006'
          code="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE*.fd' ! -name '*secboot*' | head -n1)"
          vars="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_VARS*.fd' | head -n1)"
          test -n "$code" -a -n "$vars"

          run_variant() {
            local label="$1"
            local cpu="$2"
            local disk="$label.raw"
            local nvram="$label-vars.fd"
            local log="$label-console.log"
            cp --reflink=auto pristine.raw "$disk"
            cp "$vars" "$nvram"
            rm -f "$log"

            set +e
            qemu-system-x86_64 \
              -machine q35,accel=tcg \
              -cpu "$cpu" -smp 1 -m 512 \
              -display none -monitor none \
              -serial "file:$log" \
              -drive "if=pflash,format=raw,readonly=on,file=$code" \
              -drive "if=pflash,format=raw,file=$nvram" \
              -drive "file=$disk,format=raw,if=virtio" \
              -drive "file=seed.iso,format=raw,media=cdrom,readonly=on" &
            local qpid=$!
            sleep 1
            if ! kill -0 "$qpid" 2>/dev/null; then
              wait "$qpid"
              local rc=$?
              set -e
              printf '{"variant":"%s","cpu":"%s","start":false,"nonce":false,"qemu_rc":%s}\n' \
                "$label" "$cpu" "$rc" > "$label.json"
              return 0
            fi
            set -e

            local found=0
            for _ in $(seq 1 90); do
              if grep -Fq "$marker" "$log" 2>/dev/null; then
                found=1
                break
              fi
              if ! kill -0 "$qpid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            kill "$qpid" 2>/dev/null || true
            wait "$qpid" 2>/dev/null || true
            printf '{"variant":"%s","cpu":"%s","start":true,"nonce":%s}\n' \
              "$label" "$cpu" "$([[ "$found" == 1 ]] && echo true || echo false)" > "$label.json"
          }

          run_variant max max
          run_variant qemu64 qemu64
          run_variant epyc EPYC

          python3 - <<'PY'
          import json, pathlib
          rows = {p.stem: json.loads(p.read_text()) for p in pathlib.Path(".").glob("*.json")
                  if p.stem in {"max", "qemu64", "epyc"}}
          out = {"schema": "cirros-v1-direct-qemu-cpu-discriminator/v1", "variants": rows}
          pathlib.Path("direct-cpu-discriminator.json").write_text(
              json.dumps(out, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(out, indent=2, sort_keys=True))
          if rows.get("max", {}).get("nonce") is not True:
              raise SystemExit("known-good direct-QEMU -cpu max baseline failed")
          PY

      - name: Retain bounded direct CPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cirros-v1-direct-cpu-discriminator
          path: |
            ${{ runner.temp }}/v1/direct-cpu-discriminator.json
            ${{ runner.temp }}/v1/*-console.log
            ${{ runner.temp }}/v1/fixture-sha256.txt
          retention-days: 7
