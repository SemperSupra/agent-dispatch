name: CirrOS V1 direct QEMU network discriminator

on:
  push:
    branches:
      - experiment/cirros-v1-direct-network-discriminator-20261006
    paths:
      - '.github/workflows/cirros-v1-direct-network-discriminator.yml'
      - 'scripts/compute_guest_seed.py'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install bounded QEMU fixture tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils xorriso ovmf

      - name: Build exact repaired V1 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v1/seed"
          cd "$RUNNER_TEMP/v1"
          curl --fail --location --retry 3 --silent --show-error \
            https://download.cirros-cloud.net/0.6.3/cirros-0.6.3-x86_64-disk.img \
            -o cirros.qcow2
          echo "7d6355852aeb6dbcd191bcda7cd74f1536cfe5cbf8a10495a7283a8396e4b75b  cirros.qcow2" | sha256sum -c -
          qemu-img convert -f qcow2 -O raw cirros.qcow2 pristine.raw
          python3 "$GITHUB_WORKSPACE/scripts/compute_guest_seed.py" \
            --nonce v1directnetwork20261006 \
            --instance-id rdte-v1-direct-network \
            --out-dir seed
          (
            cd seed
            xorriso -as mkisofs -quiet -output ../seed.iso -volid cidata -joliet -rock user-data meta-data
          )
          sha256sum pristine.raw seed.iso | tee fixture-sha256.txt

      - name: Compare implicit default networking and explicit no-NIC
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v1"
          marker='AGENT_DISPATCH_V1_NONCE=v1directnetwork20261006'
          code="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE*.fd' ! -name '*secboot*' | head -n1)"
          vars="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_VARS*.fd' | head -n1)"
          test -n "$code" -a -n "$vars"

          run_variant() {
            local label="$1"
            shift
            local disk="$label.raw"
            local nvram="$label-vars.fd"
            local log="$label-console.log"
            cp --reflink=auto pristine.raw "$disk"
            cp "$vars" "$nvram"
            rm -f "$log"

            qemu-system-x86_64 \
              -machine q35,accel=tcg \
              -cpu qemu64 -smp 1 -m 512 \
              -display none -monitor none \
              -serial "file:$log" \
              -drive "if=pflash,format=raw,readonly=on,file=$code" \
              -drive "if=pflash,format=raw,file=$nvram" \
              -drive "file=$disk,format=raw,if=virtio" \
              -drive "file=seed.iso,format=raw,media=cdrom,readonly=on" \
              "$@" &
            local qpid=$!

            local found=0
            for _ in $(seq 1 90); do
              if grep -Fq "$marker" "$log" 2>/dev/null; then
                found=1
                break
              fi
              if ! kill -0 "$qpid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            local running=false
            kill -0 "$qpid" 2>/dev/null && running=true || true
            kill "$qpid" 2>/dev/null || true
            wait "$qpid" 2>/dev/null || true
            printf '{"variant":"%s","nonce":%s,"running_before_stop":%s}\n' \
              "$label" "$([[ "$found" == 1 ]] && echo true || echo false)" "$running" > "$label.json"
          }

          run_variant default
          run_variant no-nic -nic none

          python3 - <<'PY'
          import json, pathlib
          rows = {name: json.loads(pathlib.Path(f"{name}.json").read_text())
                  for name in ("default", "no-nic")}
          out = {"schema": "cirros-v1-direct-network-discriminator/v1", "variants": rows}
          pathlib.Path("direct-network-discriminator.json").write_text(
              json.dumps(out, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(out, indent=2, sort_keys=True))
          if rows["default"]["nonce"] is not True:
              raise SystemExit("known-good direct-QEMU default-network baseline failed")
          PY

      - name: Retain bounded network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cirros-v1-direct-network-discriminator
          path: |
            ${{ runner.temp }}/v1/direct-network-discriminator.json
            ${{ runner.temp }}/v1/fixture-sha256.txt
            ${{ runner.temp }}/v1/*-console.log
          retention-days: 7
