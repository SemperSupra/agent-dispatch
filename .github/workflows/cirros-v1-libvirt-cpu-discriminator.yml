name: CirrOS V1 libvirt CPU discriminator

on:
  push:
    branches:
      - experiment/cirros-v1-libvirt-cpu-discriminator-20261006

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install bounded libvirt fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils xorriso ovmf libvirt-daemon-system libvirt-clients util-linux
          sudo systemctl start libvirtd
          sudo virsh -c qemu:///system version
          sudo virsh -c qemu:///system cpu-models x86_64 | tee "$RUNNER_TEMP/cpu-models.txt"

      - name: Build exact repaired V1 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v1/seed"
          cd "$RUNNER_TEMP/v1"
          curl --fail --location --retry 3 --silent --show-error \
            https://download.cirros-cloud.net/0.6.3/cirros-0.6.3-x86_64-disk.img \
            -o cirros.qcow2
          echo "7d6355852aeb6dbcd191bcda7cd74f1536cfe5cbf8a10495a7283a8396e4b75b  cirros.qcow2" | sha256sum -c -
          qemu-img convert -f qcow2 -O raw cirros.qcow2 pristine.raw
          python3 "$GITHUB_WORKSPACE/scripts/compute_guest_seed.py" \
            --nonce v1libvirtcpusmoke20261006 \
            --instance-id rdte-v1-libvirt-cpu-smoke \
            --out-dir seed
          (
            cd seed
            xorriso -as mkisofs -quiet -output ../seed.iso -volid cidata -joliet -rock user-data meta-data
          )
          sha256sum pristine.raw seed.iso | tee fixture-sha256.txt

      - name: Compare host-model with direct-QEMU-like CPU models
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v1"
          marker='AGENT_DISPATCH_V1_NONCE=v1libvirtcpusmoke20261006'
          code="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE*.fd' ! -name '*secboot*' | head -n1)"
          vars="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_VARS*.fd' | head -n1)"
          test -n "$code" -a -n "$vars"

          run_variant() {
            local label="$1"
            local cpu_xml="$2"
            local uuid
            uuid="$(python3 - "$label" <<'PY'
          import sys, uuid
          print(uuid.uuid5(uuid.NAMESPACE_URL, "agent-dispatch-v1-libvirt-cpu-" + sys.argv[1]))
          PY
          )"
            local dir="/var/lib/libvirt/images/agent-dispatch-v1-cpu-$label"
            sudo install -d -o libvirt-qemu -g kvm -m 0750 "$dir"
            sudo install -o libvirt-qemu -g kvm -m 0644 pristine.raw "$dir/cirros.raw"
            sudo install -o libvirt-qemu -g kvm -m 0644 seed.iso "$dir/seed.iso"
            sudo install -o libvirt-qemu -g kvm -m 0644 "$vars" "$dir/nvram.fd"
            cat > "$label.xml" <<EOF
          <domain type='qemu'>
            <name>$uuid</name>
            <uuid>$uuid</uuid>
            <os>
              <type>hvm</type>
              <loader readonly='yes' type='pflash' secure='no'>$code</loader>
              <nvram>$dir/nvram.fd</nvram>
            </os>
            <vcpu>1</vcpu>
            $cpu_xml
            <memory unit='M'>512</memory>
            <clock offset='utc'/>
            <devices>
              <disk type='file' device='disk'>
                <driver type='raw' cache='none' discard='unmap'/>
                <source file='$dir/cirros.raw'/>
                <target bus='virtio' dev='vda'/>
                <boot order='1'/>
              </disk>
              <disk type='file' device='cdrom'>
                <driver type='raw'/>
                <source file='$dir/seed.iso'/>
                <target bus='sata' dev='sda'/>
                <boot order='2'/>
                <readonly/>
              </disk>
              <channel type='unix'>
                <target type='virtio' name='org.qemu.guest_agent.0'/>
              </channel>
              <serial type='pty'/>
            </devices>
            <features><acpi/><apic/><msrs unknown='ignore'/></features>
          </domain>
          EOF
            sudo virt-xml-validate "$label.xml"
            if ! sudo virsh -c qemu:///system define "$label.xml"; then
              printf '{"variant":"%s","start":false,"nonce":false,"detail":"define-failed"}\n' "$label" > "$label.json"
              return 0
            fi
            if ! sudo virsh -c qemu:///system start "$uuid"; then
              printf '{"variant":"%s","start":false,"nonce":false,"detail":"start-failed"}\n' "$label" > "$label.json"
              sudo virsh -c qemu:///system undefine "$uuid" --nvram >/dev/null 2>&1 || true
              sudo rm -rf "$dir"
              return 0
            fi
            sudo virsh -c qemu:///system dumpxml "$uuid" > "$label-realized.xml"
            (
              timeout 125s script -qefc "sudo virsh -c qemu:///system console '$uuid' --force" "$label-console.log" >/dev/null 2>&1
            ) &
            local cp=$!
            local found=0
            for _ in $(seq 1 115); do
              if grep -Fq "$marker" "$label-console.log" 2>/dev/null; then
                found=1
                break
              fi
              state="$(sudo virsh -c qemu:///system domstate "$uuid" 2>/dev/null || true)"
              [[ "$state" == "running" || "$state" == "idle" ]] || break
              sleep 1
            done
            kill "$cp" 2>/dev/null || true
            wait "$cp" 2>/dev/null || true
            local model
            model="$(python3 - "$label-realized.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          cpu=root.find("cpu")
          model=cpu.find("model") if cpu is not None else None
          print((model.text if model is not None else "") or "<implicit>")
          PY
          )"
            printf '{"variant":"%s","start":true,"nonce":%s,"realized_cpu_model":"%s"}\n' \
              "$label" "$([[ "$found" == 1 ]] && echo true || echo false)" "$model" > "$label.json"
            sudo virsh -c qemu:///system destroy "$uuid" >/dev/null 2>&1 || true
            sudo virsh -c qemu:///system undefine "$uuid" --nvram >/dev/null 2>&1 || \
              sudo virsh -c qemu:///system undefine "$uuid" >/dev/null 2>&1 || true
            sudo rm -rf "$dir"
          }

          run_variant host-model "<cpu mode='host-model'><topology sockets='1' cores='1' threads='1'/></cpu>"
          run_variant implicit ""
          if grep -Fxq 'max' "$RUNNER_TEMP/cpu-models.txt"; then
            run_variant max "<cpu mode='custom' match='exact'><model fallback='forbid'>max</model><topology sockets='1' cores='1' threads='1'/></cpu>"
          else
            printf '{"variant":"max","start":false,"nonce":false,"detail":"model-not-advertised"}\n' > max.json
          fi

          python3 - <<'PY'
          import json, pathlib
          rows={p.stem:json.loads(p.read_text()) for p in pathlib.Path(".").glob("*.json") if p.stem in {"host-model","implicit","max"}}
          out={"schema":"cirros-v1-libvirt-cpu-discriminator/v1","variants":rows}
          pathlib.Path("cpu-discriminator.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          if not any(r.get("nonce") is True for k,r in rows.items() if k!="host-model"):
              raise SystemExit("no non-host-model variant reached the nonce; CPU-mode hypothesis not supported by this discriminator")
          PY

      - name: Retain bounded CPU discriminator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cirros-v1-libvirt-cpu-discriminator
          path: |
            ${{ runner.temp }}/v1/cpu-discriminator.json
            ${{ runner.temp }}/v1/*-realized.xml
            ${{ runner.temp }}/v1/*-console.log
            ${{ runner.temp }}/v1/fixture-sha256.txt
            ${{ runner.temp }}/cpu-models.txt
          retention-days: 7
