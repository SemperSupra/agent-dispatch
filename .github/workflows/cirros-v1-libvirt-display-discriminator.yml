name: CirrOS V1 libvirt display discriminator

on:
  push:
    branches:
      - experiment/cirros-v1-libvirt-display-discriminator-20261006

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - name: Install bounded libvirt fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils xorriso ovmf libvirt-daemon-system libvirt-clients util-linux
          sudo systemctl start libvirtd

      - name: Build exact repaired V1 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v1/seed"
          cd "$RUNNER_TEMP/v1"
          curl --fail --location --retry 3 --silent --show-error \
            https://download.cirros-cloud.net/0.6.3/cirros-0.6.3-x86_64-disk.img -o cirros.qcow2
          echo "7d6355852aeb6dbcd191bcda7cd74f1536cfe5cbf8a10495a7283a8396e4b75b  cirros.qcow2" | sha256sum -c -
          qemu-img convert -f qcow2 -O raw cirros.qcow2 cirros.raw
          python3 "$GITHUB_WORKSPACE/scripts/compute_guest_seed.py" \
            --nonce v1libvirtdisplaysmoke20261006 \
            --instance-id rdte-v1-libvirt-display-smoke \
            --out-dir seed
          (
            cd seed
            xorriso -as mkisofs -quiet -output ../seed.iso -volid cidata -joliet -rock user-data meta-data
          )
          sha256sum cirros.raw seed.iso > fixture-sha256.txt

      - name: Exercise host-model libvirt with ensured video device
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v1"
          marker='AGENT_DISPATCH_V1_NONCE=v1libvirtdisplaysmoke20261006'
          uuid="$(python3 - <<'PY'
          import uuid
          print(uuid.uuid5(uuid.NAMESPACE_URL, 'agent-dispatch-v1-libvirt-display-smoke'))
          PY
          )"
          code="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE*.fd' ! -name '*secboot*' | head -n1)"
          vars="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_VARS*.fd' | head -n1)"
          dir="/var/lib/libvirt/images/agent-dispatch-v1-display"
          sudo install -d -o libvirt-qemu -g kvm -m 0750 "$dir"
          sudo install -o libvirt-qemu -g kvm -m 0644 cirros.raw "$dir/cirros.raw"
          sudo install -o libvirt-qemu -g kvm -m 0644 seed.iso "$dir/seed.iso"
          sudo install -o libvirt-qemu -g kvm -m 0644 "$vars" "$dir/nvram.fd"

          cat > domain.xml <<EOF
          <domain type='qemu'>
            <name>$uuid</name>
            <uuid>$uuid</uuid>
            <os>
              <type>hvm</type>
              <loader readonly='yes' type='pflash' secure='no'>$code</loader>
              <nvram>$dir/nvram.fd</nvram>
            </os>
            <vcpu>1</vcpu>
            <cpu mode='host-model'><topology sockets='1' cores='1' threads='1'/></cpu>
            <memory unit='M'>512</memory>
            <clock offset='utc'/>
            <devices>
              <disk type='file' device='disk'>
                <driver type='raw' cache='none' discard='unmap'/>
                <source file='$dir/cirros.raw'/>
                <target bus='virtio' dev='vda'/>
                <boot order='1'/>
              </disk>
              <disk type='file' device='cdrom'>
                <driver type='raw'/>
                <source file='$dir/seed.iso'/>
                <target bus='sata' dev='sda'/>
                <boot order='2'/>
                <readonly/>
              </disk>
              <channel type='unix'><target type='virtio' name='org.qemu.guest_agent.0'/></channel>
              <serial type='pty'/>
              <video/>
            </devices>
            <features><acpi/><apic/><msrs unknown='ignore'/></features>
          </domain>
          EOF

          sudo virt-xml-validate domain.xml
          sudo virsh -c qemu:///system define domain.xml
          sudo virsh -c qemu:///system start "$uuid"
          sudo virsh -c qemu:///system dumpxml "$uuid" > realized-domain.xml
          (
            timeout 130s script -qefc "sudo virsh -c qemu:///system console '$uuid' --force" console.log >/dev/null 2>&1
          ) &
          cp=$!
          found=0
          for _ in $(seq 1 120); do
            if grep -Fq "$marker" console.log 2>/dev/null; then found=1; break; fi
            state="$(sudo virsh -c qemu:///system domstate "$uuid" 2>/dev/null || true)"
            [[ "$state" == "running" || "$state" == "idle" ]] || break
            sleep 1
          done
          kill "$cp" 2>/dev/null || true
          wait "$cp" 2>/dev/null || true
          video_model="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('realized-domain.xml').getroot()
          m=root.find('./devices/video/model')
          print(m.get('type') if m is not None else '<none>')
          PY
          )"
          printf '{"schema":"cirros-v1-libvirt-display-discriminator/v1","video_enabled":true,"realized_video_model":"%s","nonce":%s}\n' \
            "$video_model" "$([[ "$found" == 1 ]] && echo true || echo false)" | tee display-discriminator.json
          tail -c 12000 console.log || true
          sudo virsh -c qemu:///system destroy "$uuid" >/dev/null 2>&1 || true
          sudo virsh -c qemu:///system undefine "$uuid" --nvram >/dev/null 2>&1 || true
          sudo rm -rf "$dir"
          [[ "$found" == 1 ]]

      - name: Retain bounded display evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cirros-v1-libvirt-display-discriminator
          path: |
            ${{ runner.temp }}/v1/display-discriminator.json
            ${{ runner.temp }}/v1/realized-domain.xml
            ${{ runner.temp }}/v1/console.log
            ${{ runner.temp }}/v1/fixture-sha256.txt
          retention-days: 7
