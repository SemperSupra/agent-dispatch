name: CirrOS V1 libvirt serial discriminator

on:
  push:
    branches:
      - experiment/cirros-v1-libvirt-serial-discriminator-20261006
    paths:
      - '.github/workflows/cirros-v1-libvirt-serial-discriminator.yml'
      - 'scripts/compute_guest_seed.py'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Install bounded libvirt fixture tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils xorriso ovmf libvirt-daemon-system libvirt-clients
          sudo systemctl start libvirtd
          sudo virsh -c qemu:///system version

      - name: Build exact repaired V1 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v1/seed"
          cd "$RUNNER_TEMP/v1"
          curl --fail --location --retry 3 --silent --show-error \
            https://download.cirros-cloud.net/0.6.3/cirros-0.6.3-x86_64-disk.img \
            -o cirros.qcow2
          echo "7d6355852aeb6dbcd191bcda7cd74f1536cfe5cbf8a10495a7283a8396e4b75b  cirros.qcow2" | sha256sum -c -
          qemu-img convert -f qcow2 -O raw cirros.qcow2 pristine.raw
          python3 "$GITHUB_WORKSPACE/scripts/compute_guest_seed.py" \
            --nonce v1libvirtserial20261006 \
            --instance-id rdte-v1-libvirt-serial \
            --out-dir seed
          (
            cd seed
            xorriso -as mkisofs -quiet -output ../seed.iso -volid cidata -joliet -rock user-data meta-data
          )
          sha256sum pristine.raw seed.iso | tee fixture-sha256.txt

      - name: Compare PTY and file serial backends
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v1"
          marker='AGENT_DISPATCH_V1_NONCE=v1libvirtserial20261006'
          code="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE*.fd' ! -name '*secboot*' | head -n1)"
          vars="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_VARS*.fd' | head -n1)"
          test -n "$code" -a -n "$vars"

          cleanup_domain() {
            local uuid="$1"
            sudo virsh -c qemu:///system destroy "$uuid" >/dev/null 2>&1 || true
            sudo virsh -c qemu:///system undefine "$uuid" --nvram >/dev/null 2>&1 || \
              sudo virsh -c qemu:///system undefine "$uuid" >/dev/null 2>&1 || true
          }

          run_variant() {
            local label="$1"
            local serial_mode="$2"
            local uuid
            uuid="$(python3 - "$label" <<'PY'
          import sys, uuid
          print(uuid.uuid5(uuid.NAMESPACE_URL, "agent-dispatch-v1-libvirt-serial-" + sys.argv[1]))
          PY
          )"
            local d="/var/lib/libvirt/images/ad-v1-serial-$label"
            sudo install -d -o libvirt-qemu -g kvm -m 0750 "$d"
            sudo install -o libvirt-qemu -g kvm -m 0644 pristine.raw "$d/cirros.raw"
            sudo install -o libvirt-qemu -g kvm -m 0644 seed.iso "$d/seed.iso"
            sudo install -o libvirt-qemu -g kvm -m 0644 "$vars" "$d/nvram.fd"

            if [[ "$serial_mode" == "pty" ]]; then
              serial_xml="<serial type='pty'><target port='0'/></serial>"
            else
              serial_xml="<serial type='file'><source path='$d/serial.log'/><target port='0'/></serial>"
            fi

            cat > "$label-domain.xml" <<EOF
          <domain type='qemu'>
            <name>$uuid</name>
            <uuid>$uuid</uuid>
            <title>rdte-v1-libvirt-serial-$label</title>
            <os>
              <type>hvm</type>
              <loader readonly='yes' type='pflash' secure='no'>$code</loader>
              <nvram>$d/nvram.fd</nvram>
            </os>
            <vcpu>1</vcpu>
            <cpu mode='custom' match='exact'>
              <model fallback='forbid'>qemu64</model>
              <topology sockets='1' cores='1' threads='1'/>
            </cpu>
            <memory unit='M'>512</memory>
            <clock offset='utc'/>
            <devices>
              <disk type='file' device='disk'>
                <driver type='raw' cache='none' discard='unmap'/>
                <source file='$d/cirros.raw'/>
                <target bus='virtio' dev='vda'/>
                <boot order='1'/>
              </disk>
              <disk type='file' device='cdrom'>
                <driver type='raw'/>
                <source file='$d/seed.iso'/>
                <target bus='sata' dev='sda'/>
                <boot order='2'/>
                <readonly/>
              </disk>
              <channel type='unix'>
                <target type='virtio' name='org.qemu.guest_agent.0'/>
              </channel>
              $serial_xml
            </devices>
            <features>
              <acpi/>
              <apic/>
              <msrs unknown='ignore'/>
            </features>
          </domain>
          EOF

            sudo virt-xml-validate "$label-domain.xml"
            sudo virsh -c qemu:///system define "$label-domain.xml"
            sudo virsh -c qemu:///system start "$uuid"
            sudo virsh -c qemu:///system dumpxml "$uuid" > "$label-realized.xml"
            sudo virsh -c qemu:///system domxml-to-native qemu-argv "$label-realized.xml" > "$label-qemu-argv.txt" 2>&1 || true

            local found=0
            local observer_pid=""
            local log
            if [[ "$serial_mode" == "pty" ]]; then
              log="$label-console.log"
              rm -f "$log"
              (
                timeout 95s script -qefc "sudo virsh -c qemu:///system console '$uuid' --force" "$log" >/dev/null 2>&1
              ) &
              observer_pid=$!
            else
              log="$d/serial.log"
            fi

            for _ in $(seq 1 90); do
              if sudo grep -Fq "$marker" "$log" 2>/dev/null; then
                found=1
                break
              fi
              state="$(sudo virsh -c qemu:///system domstate "$uuid" 2>/dev/null || true)"
              if [[ "$state" != "running" && "$state" != "idle" ]]; then
                break
              fi
              sleep 1
            done

            if [[ -n "$observer_pid" ]]; then
              kill "$observer_pid" 2>/dev/null || true
              wait "$observer_pid" 2>/dev/null || true
            fi
            state="$(sudo virsh -c qemu:///system domstate "$uuid" 2>/dev/null || true)"
            sudo cp "$log" "$label-console.log" 2>/dev/null || true
            sudo chown "$(id -u):$(id -g)" "$label-console.log" 2>/dev/null || true

            printf '{"variant":"%s","serial":"%s","start":true,"nonce":%s,"domain_state":"%s"}\n' \
              "$label" "$serial_mode" "$([[ "$found" == 1 ]] && echo true || echo false)" "$state" > "$label.json"

            cleanup_domain "$uuid"
            sudo rm -rf "$d"
          }

          run_variant pty pty
          run_variant file file

          python3 - <<'PY'
          import json, pathlib
          rows = {name: json.loads(pathlib.Path(f"{name}.json").read_text())
                  for name in ("pty", "file")}
          out = {"schema": "cirros-v1-libvirt-serial-discriminator/v1", "variants": rows}
          pathlib.Path("serial-discriminator.json").write_text(
              json.dumps(out, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

      - name: Retain bounded serial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cirros-v1-libvirt-serial-discriminator
          path: |
            ${{ runner.temp }}/v1/serial-discriminator.json
            ${{ runner.temp }}/v1/fixture-sha256.txt
            ${{ runner.temp }}/v1/*-domain.xml
            ${{ runner.temp }}/v1/*-realized.xml
            ${{ runner.temp }}/v1/*-qemu-argv.txt
            ${{ runner.temp }}/v1/*-console.log
          retention-days: 7
