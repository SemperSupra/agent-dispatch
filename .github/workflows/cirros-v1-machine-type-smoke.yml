name: CirrOS V1 machine-type smoke

on:
  push:
    branches:
      - experiment/cirros-v1-machine-type-smoke-20261006

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install bounded QEMU fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils xorriso ovmf

      - name: Build exact repaired V1 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/v1/seed"
          cd "${RUNNER_TEMP}/v1"
          curl --fail --location --retry 3 --silent --show-error \
            https://download.cirros-cloud.net/0.6.3/cirros-0.6.3-x86_64-disk.img \
            -o cirros.qcow2
          echo "7d6355852aeb6dbcd191bcda7cd74f1536cfe5cbf8a10495a7283a8396e4b75b  cirros.qcow2" | sha256sum -c -
          qemu-img convert -f qcow2 -O raw cirros.qcow2 cirros.raw
          python3 "${GITHUB_WORKSPACE}/scripts/compute_guest_seed.py" \
            --nonce v1machinetype20261006 \
            --instance-id rdte-v1-machine-type \
            --out-dir seed
          (
            cd seed
            xorriso -as mkisofs -quiet -output ../seed.iso -volid cidata -joliet -rock user-data meta-data
          )
          python3 -m json.tool seed/meta-data
          sha256sum cirros.raw seed.iso | tee fixture-sha256.txt

      - name: Compare q35 with absent/default machine semantics
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/v1"
          marker='AGENT_DISPATCH_V1_NONCE=v1machinetype20261006'
          code="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE*.fd' ! -name '*secboot*' | head -n1)"
          vars="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_VARS*.fd' | head -n1)"
          test -n "$code" -a -n "$vars"

          run_guest() {
            local label="$1"
            local machine="$2"
            local log="${label}.console.log"
            local vars_copy="${label}.vars.fd"
            cp "$vars" "$vars_copy"
            rm -f "$log"
            local machine_args=()
            if [[ -n "$machine" ]]; then
              machine_args=(-machine "$machine,accel=tcg")
            else
              machine_args=(-accel tcg)
            fi
            qemu-system-x86_64 \
              "${machine_args[@]}" \
              -cpu max -smp 1 -m 512 \
              -display none -monitor none \
              -serial "file:$log" \
              -drive file=cirros.raw,format=raw,if=virtio,cache=none \
              -drive file=seed.iso,format=raw,media=cdrom,readonly=on \
              -drive "if=pflash,format=raw,readonly=on,file=$code" \
              -drive "if=pflash,format=raw,file=$vars_copy" &
            local qpid=$!
            local found=0
            for _ in $(seq 1 120); do
              if grep -Fq "$marker" "$log" 2>/dev/null; then
                found=1
                break
              fi
              if ! kill -0 "$qpid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            kill "$qpid" 2>/dev/null || true
            wait "$qpid" 2>/dev/null || true
            echo "=== ${label} console tail ==="
            tail -c 16000 "$log" || true
            echo
            [[ "$found" == 1 ]]
          }

          q35_rc=0
          run_guest q35 q35 || q35_rc=$?

          default_rc=0
          run_guest default "" || default_rc=$?

          printf '{"schema":"cirros-v1-machine-type-smoke/v1","q35_nonce":%s,"default_machine_nonce":%s}\n' \
            "$([[ "$q35_rc" == 0 ]] && echo true || echo false)" \
            "$([[ "$default_rc" == 0 ]] && echo true || echo false)" \
            | tee machine-type-smoke.json

          # q35 is the positive control proven previously.
          [[ "$q35_rc" == 0 ]]

      - name: Retain bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cirros-v1-machine-type-smoke
          path: |
            ${{ runner.temp }}/v1/machine-type-smoke.json
            ${{ runner.temp }}/v1/fixture-sha256.txt
            ${{ runner.temp }}/v1/q35.console.log
            ${{ runner.temp }}/v1/default.console.log
          retention-days: 7
