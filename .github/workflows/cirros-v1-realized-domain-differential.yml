name: CirrOS V1 realized-domain differential (cheap)
on:
  push:
    branches:
      - experiment/cirros-v1-realized-differential-20261011
    paths:
      - '.github/workflows/cirros-v1-realized-domain-differential.yml'
permissions:
  contents: read

jobs:
  observed-argv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install disposable QEMU and libvirt tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils xorriso ovmf libvirt-daemon-system libvirt-clients
          sudo systemctl start libvirtd
          sudo virsh -c qemu:///system version
      - name: Prepare identical pinned guest and seed
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v1-realized"
          mkdir -p "$root/seed"
          cd "$root"
          curl --fail --location --retry 3 --silent --show-error \
            https://download.cirros-cloud.net/0.6.3/cirros-0.6.3-x86_64-disk.img -o cirros.qcow2
          echo '7d6355852aeb6dbcd191bcda7cd74f1536cfe5cbf8a10495a7283a8396e4b75b  cirros.qcow2' | sha256sum -c -
          qemu-img convert -f qcow2 -O raw cirros.qcow2 pristine.raw
          python3 "$GITHUB_WORKSPACE/scripts/compute_guest_seed.py" \
            --nonce v1realizeddiff20261011 --instance-id rdte-v1-realized-diff --out-dir seed
          ( cd seed && xorriso -as mkisofs -quiet -output ../seed.iso -volid cidata -joliet -rock user-data meta-data )
          sha256sum pristine.raw seed.iso cirros.qcow2 > fixture-sha256.txt
          qemu-system-x86_64 --version > qemu-version.txt
          qemu-img --version > qemu-img-version.txt
          sudo virsh -c qemu:///system version > libvirt-version.txt
          find /usr/share/OVMF -maxdepth 1 -name 'OVMF_CODE*.fd' ! -name '*secboot*' -type f | sort > ovmf-candidates.txt
      - name: Observe direct QEMU and libvirt actual processes
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v1-realized"
          cd "$root"
          marker='AGENT_DISPATCH_V1_NONCE=v1realizeddiff20261011'
          code="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE*.fd' ! -name '*secboot*' | head -n1)"
          vars="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_VARS*.fd' | head -n1)"
          test -n "$code" -a -n "$vars"
          sha256sum "$code" "$vars" > ovmf-sha256.txt
          uuid='ed0b56c4-1467-5eca-af37-322c0f8ded18'
          name="ad-v1-realized-$uuid"
          owned="/var/lib/libvirt/images/$name"
          domain_defined=0
          owned_created=0
          qpid=''
          npid=''
          nnpid=''
          cleanup() {
            set +e
            if [[ -n "$qpid" ]]; then
              kill "$qpid" 2>/dev/null
              wait "$qpid" 2>/dev/null
            fi
            if [[ -n "$npid" ]]; then
              kill "$npid" 2>/dev/null
              wait "$npid" 2>/dev/null
            fi
            if [[ -n "$nnpid" ]]; then
              kill "$nnpid" 2>/dev/null
              wait "$nnpid" 2>/dev/null
            fi
            if [[ "$domain_defined" == 1 ]]; then
              sudo virsh -c qemu:///system destroy "$uuid" >/dev/null 2>&1
              sudo virsh -c qemu:///system undefine "$uuid" --nvram >/dev/null 2>&1 \
                || sudo virsh -c qemu:///system undefine "$uuid" >/dev/null 2>&1
            fi
            if [[ "$owned_created" == 1 && -d "$owned" ]]; then sudo rm -rf -- "$owned"; fi
            if sudo virsh -c qemu:///system dominfo "$uuid" >/dev/null 2>&1; then
              echo '{"owned_domain_absent":false}' > cleanup.json
            elif sudo test -e "$owned"; then
              echo '{"owned_domain_absent":true,"owned_files_absent":false}' > cleanup.json
            else
              echo '{"owned_domain_absent":true,"owned_files_absent":true}' > cleanup.json
            fi
          }
          trap cleanup EXIT
          if sudo virsh -c qemu:///system dominfo "$uuid" >/dev/null 2>&1 || sudo test -e "$owned"; then
            echo 'Preexisting UUID/path, refusing to touch it' >&2; exit 4
          fi
          # Only an absent, preflight-owned path is eligible for later deletion.
          owned_created=1
          cp pristine.raw direct.raw
          cp "$vars" direct-vars.fd
          qemu-system-x86_64 -machine q35,accel=tcg -cpu qemu64 -smp 1 -m 512 \
            -display none -monitor none -serial file:direct-console.log \
            -drive "if=pflash,format=raw,readonly=on,file=$code" \
            -drive "if=pflash,format=raw,file=$PWD/direct-vars.fd" \
            -drive "file=$PWD/direct.raw,format=raw,if=virtio" \
            -drive "file=$PWD/seed.iso,format=raw,media=cdrom,readonly=on" \
            >direct-stderr.log 2>&1 &
          qpid=$!
          sleep 1
          if ! kill -0 "$qpid" 2>/dev/null; then
            echo 'Direct QEMU exited before process-argv observation' >&2; exit 5
          fi
          sudo python3 - "$qpid" direct-realized-argv.json <<'PY'
          import json, pathlib, sys
          pid=int(sys.argv[1])
          args=pathlib.Path(f"/proc/{pid}/cmdline").read_bytes().rstrip(b"\0").decode().split("\0")
          assert args and args[0].endswith("qemu-system-x86_64"), args
          pathlib.Path(sys.argv[2]).write_text(json.dumps(args, indent=2)+"\n")
          PY
          found=0
          for _ in $(seq 1 90); do
            if grep -Fq "$marker" direct-console.log 2>/dev/null; then found=1; break; fi
            if ! kill -0 "$qpid" 2>/dev/null; then break; fi
            sleep 1
          done
          printf '{"nonce":%s}\n' "$([[ "$found" == 1 ]] && echo true || echo false)" > direct-oracle.json
          kill "$qpid" 2>/dev/null || true
          wait "$qpid" 2>/dev/null || true
          qpid=''

          # One-axis counterfactual: add -nodefaults to the passing direct-QEMU
          # recipe. The guest/seed and all other QEMU flags stay equivalent.
          cp pristine.raw direct-nodefaults.raw
          cp "$vars" direct-nodefaults-vars.fd
          qemu-system-x86_64 -nodefaults -machine q35,accel=tcg -cpu qemu64 -smp 1 -m 512 -display none -monitor none -serial file:direct-nodefaults-console.log -drive "if=pflash,format=raw,readonly=on,file=$code" -drive "if=pflash,format=raw,file=$PWD/direct-nodefaults-vars.fd" -drive "file=$PWD/direct-nodefaults.raw,format=raw,if=virtio" -drive "file=$PWD/seed.iso,format=raw,media=cdrom,readonly=on" >direct-nodefaults-stderr.log 2>&1 &
          npid=$!
          sleep 1
          if ! kill -0 "$npid" 2>/dev/null; then
            echo 'Direct -nodefaults QEMU exited before argv observation' >&2; exit 5
          fi
          sudo python3 - "$npid" direct-nodefaults-realized-argv.json <<'PY'
          import json, pathlib, sys
          pid=int(sys.argv[1])
          args=pathlib.Path(f"/proc/{pid}/cmdline").read_bytes().rstrip(b"\0").decode().split("\0")
          assert args and args[0].endswith("qemu-system-x86_64"), args
          assert "-nodefaults" in args, args
          pathlib.Path(sys.argv[2]).write_text(json.dumps(args, indent=2)+"\n")
          PY
          found=0
          for _ in $(seq 1 90); do
            if grep -Fq "$marker" direct-nodefaults-console.log 2>/dev/null; then found=1; break; fi
            if ! kill -0 "$npid" 2>/dev/null; then break; fi
            sleep 1
          done
          printf '{"nonce":%s}\n' "$([[ "$found" == 1 ]] && echo true || echo false)" > direct-nodefaults-oracle.json
          kill "$npid" 2>/dev/null || true
          wait "$npid" 2>/dev/null || true
          npid=''

          # Counterfactual after the observed -nodefaults negative: restore
          # user-mode NIC only; do not widen guest/source/network authority.
          cp pristine.raw direct-nodefaults-nic.raw
          cp "$vars" direct-nodefaults-nic-vars.fd
          qemu-system-x86_64 -nodefaults -nic user -machine q35,accel=tcg -cpu qemu64 -smp 1 -m 512 -display none -monitor none -serial file:direct-nodefaults-nic-console.log -drive "if=pflash,format=raw,readonly=on,file=$code" -drive "if=pflash,format=raw,file=$PWD/direct-nodefaults-nic-vars.fd" -drive "file=$PWD/direct-nodefaults-nic.raw,format=raw,if=virtio" -drive "file=$PWD/seed.iso,format=raw,media=cdrom,readonly=on" >direct-nodefaults-nic-stderr.log 2>&1 &
          nnpid=$!
          sleep 1
          if ! kill -0 "$nnpid" 2>/dev/null; then
            echo 'Direct -nodefaults with user NIC exited before argv observation' >&2; exit 5
          fi
          sudo python3 - "$nnpid" direct-nodefaults-nic-realized-argv.json <<'PY'
          import json, pathlib, sys
          pid=int(sys.argv[1])
          args=pathlib.Path(f"/proc/{pid}/cmdline").read_bytes().rstrip(b"\0").decode().split("\0")
          assert args and args[0].endswith("qemu-system-x86_64"), args
          assert "-nodefaults" in args and "-nic" in args and "user" in args, args
          pathlib.Path(sys.argv[2]).write_text(json.dumps(args, indent=2)+"\n")
          PY
          found=0
          for _ in $(seq 1 90); do
            if grep -Fq "$marker" direct-nodefaults-nic-console.log 2>/dev/null; then found=1; break; fi
            if ! kill -0 "$nnpid" 2>/dev/null; then break; fi
            sleep 1
          done
          printf '{"nonce":%s}\n' "$([[ "$found" == 1 ]] && echo true || echo false)" > direct-nodefaults-nic-oracle.json
          kill "$nnpid" 2>/dev/null || true
          wait "$nnpid" 2>/dev/null || true
          nnpid=''

          sudo install -d -o libvirt-qemu -g kvm -m 0750 "$owned"
          sudo install -o libvirt-qemu -g kvm -m 0644 pristine.raw "$owned/cirros.raw"
          sudo install -o libvirt-qemu -g kvm -m 0644 seed.iso "$owned/seed.iso"
          sudo install -o libvirt-qemu -g kvm -m 0644 "$vars" "$owned/nvram.fd"
          cat > libvirt-domain.xml <<EOF
          <domain type='qemu'>
            <name>$uuid</name><uuid>$uuid</uuid>
            <os>
              <type>hvm</type>
              <loader readonly='yes' type='pflash' secure='no'>$code</loader>
              <nvram>$owned/nvram.fd</nvram>
            </os>
            <vcpu>1</vcpu>
            <cpu mode='custom' match='exact'><model fallback='forbid'>qemu64</model>
              <topology sockets='1' cores='1' threads='1'/></cpu>
            <memory unit='M'>512</memory>
            <clock offset='utc'/>
            <devices>
              <disk type='file' device='disk'>
                <driver type='raw'/>
                <source file='$owned/cirros.raw'/>
                <target bus='virtio' dev='vda'/><boot order='1'/>
              </disk>
              <disk type='file' device='cdrom'>
                <driver type='raw'/>
                <source file='$owned/seed.iso'/>
                <target bus='sata' dev='sda'/><boot order='2'/><readonly/>
              </disk>
              <channel type='unix'><target type='virtio' name='org.qemu.guest_agent.0'/></channel>
              <serial type='file'><source path='$owned/serial.log'/><target port='0'/></serial>
            </devices>
            <features><acpi/><apic/><msrs unknown='ignore'/></features>
          </domain>
          EOF
          sudo virt-xml-validate libvirt-domain.xml
          sudo virsh -c qemu:///system define libvirt-domain.xml
          domain_defined=1
          sudo virsh -c qemu:///system start "$uuid"
          sudo virsh -c qemu:///system dumpxml "$uuid" > libvirt-realized.xml
          sudo virsh -c qemu:///system domxml-to-native qemu-argv libvirt-realized.xml > libvirt-native-argv.txt
          sudo python3 - "$uuid" libvirt-process-realized-argv.json <<'PY'
          import json, pathlib, sys
          uid=sys.argv[1]
          found=[]
          for path in pathlib.Path("/proc").iterdir():
              if not path.name.isdecimal(): continue
              try:
                  raw=(path/"cmdline").read_bytes().rstrip(b"\0")
                  args=raw.decode(errors="replace").split("\0")
                  if args and args[0].endswith("qemu-system-x86_64") and any(uid in arg for arg in args[1:]):
                      found.append(args)
              except (OSError, PermissionError):
                  pass
          assert len(found)==1, f"expected one exact-owned libvirt QEMU, observed {len(found)}"
          pathlib.Path(sys.argv[2]).write_text(json.dumps(found[0], indent=2)+"\n")
          PY
          found=0
          for _ in $(seq 1 90); do
            if sudo grep -Fq "$marker" "$owned/serial.log" 2>/dev/null; then found=1; break; fi
            state="$(sudo virsh -c qemu:///system domstate "$uuid" 2>/dev/null || true)"
            if [[ "$state" != running && "$state" != idle ]]; then break; fi
            sleep 1
          done
          sudo cp "$owned/serial.log" libvirt-console.log
          sudo chown "$(id -u):$(id -g)" libvirt-console.log
          printf '{"nonce":%s}\n' "$([[ "$found" == 1 ]] && echo true || echo false)" > libvirt-oracle.json
      - name: Classify differential (never a platform-V1 acceptance)
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          d=pathlib.Path(__import__("os").environ["RUNNER_TEMP"])/"v1-realized"
          load=lambda name: json.loads((d/name).read_text()) if (d/name).exists() else None
          direct=load("direct-oracle.json"); libvirt=load("libvirt-oracle.json")
          nodefaults=load("direct-nodefaults-oracle.json")
          nic=load("direct-nodefaults-nic-oracle.json")
          def boots(name):
              p=d/name
              return p.read_bytes().count(b"BdsDxe: starting Boot") if p.exists() else None
          cleanup=load("cleanup.json")
          classification=("HARNESS_FAILURE" if direct is None or direct.get("nonce") is not True
                          or libvirt is None or nodefaults is None or nic is None or not cleanup or
                          cleanup.get("owned_domain_absent") is not True or
                          cleanup.get("owned_files_absent") is not True or
                          load("direct-realized-argv.json") is None or
                          load("direct-nodefaults-realized-argv.json") is None or
                          load("direct-nodefaults-nic-realized-argv.json") is None or
                          load("libvirt-process-realized-argv.json") is None
                          else "DIFFERENTIAL_REPRODUCED" if libvirt.get("nonce") is False
                          else "DIFFERENTIAL_NOT_REPRODUCED")
          result={
              "schema":"cirros-v1-realized-domain-differential/v1",
              "source_run":"SemperSupra/agent-dispatch-private#426",
              "classification":classification,
              "direct_nonce":direct,
              "direct_nodefaults_nonce":nodefaults,
              "direct_nodefaults_nic_nonce":nic,
              "nodefaults_isolated_cause":False,
              "libvirt_nonce":libvirt,
              "direct_uefi_boot_starts":boots("direct-console.log"),
              "direct_nodefaults_uefi_boot_starts":boots("direct-nodefaults-console.log"),
              "direct_nodefaults_nic_uefi_boot_starts":boots("direct-nodefaults-nic-console.log"),
              "libvirt_uefi_boot_starts":boots("libvirt-console.log"),
              "realized_direct_argv":load("direct-realized-argv.json") is not None,
              "realized_direct_nodefaults_argv":load("direct-nodefaults-realized-argv.json") is not None,
              "realized_direct_nodefaults_nic_argv":load("direct-nodefaults-nic-realized-argv.json") is not None,
              "realized_libvirt_argv":load("libvirt-process-realized-argv.json") is not None,
              "cleanup":cleanup,
              "product_v1_acceptance":False,
              "trueNAS_rep006_authorized":False,
              "claim_boundary":"Same-run disposable hosted-runner differential only; no TrueNAS or WinBot product acceptance"
          }
          d.mkdir(parents=True,exist_ok=True)
          (d/"differential-receipt.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True))
          if classification=="HARNESS_FAILURE": raise SystemExit(2)
          PY
      - name: Retain bounded source and realized-domain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cirros-v1-realized-domain-differential
          retention-days: 7
          path: |
            ${{ runner.temp }}/v1-realized/differential-receipt.json
            ${{ runner.temp }}/v1-realized/*-oracle.json
            ${{ runner.temp }}/v1-realized/*-realized-argv.json
            ${{ runner.temp }}/v1-realized/libvirt-native-argv.txt
            ${{ runner.temp }}/v1-realized/libvirt-realized.xml
            ${{ runner.temp }}/v1-realized/libvirt-domain.xml
            ${{ runner.temp }}/v1-realized/*-console.log
            ${{ runner.temp }}/v1-realized/*-version.txt
            ${{ runner.temp }}/v1-realized/*-sha256.txt
            ${{ runner.temp }}/v1-realized/cleanup.json
