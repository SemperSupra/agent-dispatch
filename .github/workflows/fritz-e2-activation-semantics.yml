name: FRITZ E2 activation semantics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fritz-e2-activation-semantics.yml'
      - 'scripts/fritz_qemu_e2_activation_semantics.py'
      - 'scripts/fritz_qemu_e2_startup_semantics.py'
      - 'tests/test_fritz_qemu_e2_activation_semantics.py'
      - 'docs/fritz-e2-activation-semantics.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: python3 -m unittest -v tests/test_fritz_qemu_e2_activation_semantics.py

  exact-firmware-e2-d7:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl squashfs-tools
      - name: Recover exact activation semantics
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fritz-e2-d7" "${RUNNER_TEMP}/fritz-receipt"
          python3 scripts/fritz_qemu_e2_activation_semantics.py \
            --firmware-url 'https://download.avm.de/fritzbox/fritzbox-7590/deutschland/fritz.os/FRITZ.Box_7590-08.25.image' \
            --expected-size 42393600 \
            --expected-sha256 267ef427337d2141736ad6ed5d9389722a6a1234dd590bb7d4ebf11a00616c0d \
            --work-dir "${RUNNER_TEMP}/fritz-e2-d7" \
            --receipt "${RUNNER_TEMP}/fritz-receipt/receipt.json"
      - name: Enforce sanitizer
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"fritz-receipt"/"receipt.json"
          r=json.loads(p.read_text());assert r.get("oracleSatisfied") is True,r
          s=r["safety"]
          for k in ("rawFirmwarePublished","rootfsPublished","binaryPayloadPublished",
                    "arbitraryBinaryStringsPublished","rawInitContentPublished",
                    "physicalRouterContact","routerMutationAuthorized"):
              assert s.get(k) is False,(k,s.get(k))
          print(json.dumps({"classification":r["classification"],"activation":r["activation"]},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fritz-e2-activation-semantics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fritz-receipt/receipt.json
          retention-days: 7
