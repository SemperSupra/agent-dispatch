name: FRITZ E2 D10 static protocol recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fritz-e2-d10-protocol-static.yml'
      - 'scripts/fritz_qemu_e2_d10_protocol_static.py'
      - 'tests/test_fritz_qemu_e2_d10_protocol_static.py'
      - 'docs/fritz-e2-d10-protocol-static.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest -v tests/test_fritz_qemu_e2_d10_protocol_static.py

  exact-static-d10:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils binutils-mips-linux-gnu curl squashfs-tools
      - name: Recover exact binary and OSP protocol surface
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fritz-d10" "${RUNNER_TEMP}/fritz-receipt"
          python3 scripts/fritz_qemu_e2_d10_protocol_static.py \
            --firmware-url 'https://download.avm.de/fritzbox/fritzbox-7590/deutschland/fritz.os/FRITZ.Box_7590-08.25.image' \
            --firmware-expected-size 42393600 \
            --firmware-expected-sha256 267ef427337d2141736ad6ed5d9389722a6a1234dd590bb7d4ebf11a00616c0d \
            --osp-url 'https://osp.avm.de/fritzbox/fritzbox-7590/source-files-FRITZ.Box_7590-grx5-08.25.tar.gz' \
            --osp-expected-size 633140613 \
            --osp-expected-sha256 61e0969cf2c5e4fc3942eeb8da765115f1612fdf11c563428f54f2cfe45bf9dc \
            --work-dir "${RUNNER_TEMP}/fritz-d10" \
            --receipt "${RUNNER_TEMP}/fritz-receipt/receipt.json"
      - name: Enforce metadata-only static evidence
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"fritz-receipt"/"receipt.json").read_text())
          assert r.get("oracleSatisfied") is True,r
          assert r["firmware"]["observedSha256"] == r["firmware"]["expectedSha256"]
          assert r["osp"]["observedSha256"] == r["osp"]["expectedSha256"]
          for key in ("svctl","supervisor"):
              b=r["binary"][key]
              assert b["elf"]["machineName"] == "MIPS",(key,b["elf"])
              assert b["bytes"] > 0
              assert len(b["sha256"]) == 64
          s=r["safety"]
          for key in (
              "rawFirmwarePublished","rootfsPublished","binaryPayloadPublished",
              "rawDisassemblyPublished","arbitraryBinaryStringsPublished",
              "rawOspArchivePublished","sourcePayloadPublished","sourceSnippetsPublished",
              "wirePayloadPublished","physicalRouterContact","routerMutationAuthorized"
          ):
              assert s.get(key) is False,(key,s.get(key))
          print(json.dumps({
              "classification":r["classification"],
              "svctl":r["binary"]["svctl"],
              "ospCoverage":r["osp"]["coverage"],
              "interpretationBoundary":r["interpretationBoundary"]
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fritz-e2-d10-protocol-static-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fritz-receipt/receipt.json
          if-no-files-found: error
          retention-days: 7
