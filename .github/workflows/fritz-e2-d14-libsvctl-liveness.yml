name: FRITZ E2 D14 libsvctl liveness edges

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fritz-e2-d14-libsvctl-liveness.yml'
      - 'scripts/fritz_qemu_e2_d14_libsvctl_liveness.py'
      - 'scripts/fritz_qemu_e2_d13_libsvctl_got.py'
      - 'scripts/fritz_qemu_e2_d12_libsvctl_functions.py'
      - 'tests/test_fritz_qemu_e2_d14_libsvctl_liveness.py'
      - 'docs/fritz-e2-d14-libsvctl-liveness.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest -v tests/test_fritz_qemu_e2_d14_libsvctl_liveness.py

  exact-d14:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils binutils-mips-linux-gnu curl squashfs-tools
      - name: Recover exact live PIC call edges
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fritz-d14" "${RUNNER_TEMP}/fritz-receipt"
          python3 scripts/fritz_qemu_e2_d14_libsvctl_liveness.py \
            --firmware-url 'https://download.avm.de/fritzbox/fritzbox-7590/deutschland/fritz.os/FRITZ.Box_7590-08.25.image' \
            --expected-size 42393600 \
            --expected-sha256 267ef427337d2141736ad6ed5d9389722a6a1234dd590bb7d4ebf11a00616c0d \
            --work-dir "${RUNNER_TEMP}/fritz-d14" \
            --receipt "${RUNNER_TEMP}/fritz-receipt/receipt.json"
      - name: Enforce liveness-only evidence
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          r = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "fritz-receipt" / "receipt.json").read_text())
          assert r.get("oracleSatisfied") is True, r
          assert r["interpretationBoundary"]["sameBasicBlockRequired"] is True
          assert r["interpretationBoundary"]["t9MustRemainLiveToJalr"] is True
          assert r["interpretationBoundary"]["arbitraryInstructionWindowUsed"] is False
          for e in r["library"]["newlyAcceptedCallEdges"]:
              assert e["source"] in {"_svctl_init", "_svctl_read"}, e
          for k, v in r["safety"].items():
              assert v is False, (k, v)
          print(json.dumps({
              "classification": r["classification"],
              "targetFunctionLivenessSummaries": r["library"]["targetFunctionLivenessSummaries"],
              "newlyAcceptedCallEdges": r["library"]["newlyAcceptedCallEdges"],
              "derived": r["library"]["derived"],
              "interpretationBoundary": r["interpretationBoundary"],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fritz-e2-d14-libsvctl-liveness-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fritz-receipt/receipt.json
          if-no-files-found: error
          retention-days: 7
