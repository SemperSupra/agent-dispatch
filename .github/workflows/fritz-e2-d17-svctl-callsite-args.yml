name: FRITZ E2 D17 svctl callsite args

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fritz-e2-d17-svctl-callsite-args.yml'
      - 'scripts/fritz_qemu_e2_d17_svctl_callsite_args.py'
      - 'scripts/fritz_qemu_e2_d13_libsvctl_got.py'
      - 'scripts/fritz_qemu_e2_d14_libsvctl_liveness.py'
      - 'tests/test_fritz_qemu_e2_d17_svctl_callsite_args.py'
      - 'docs/fritz-e2-d17-svctl-callsite-args.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest -v tests/test_fritz_qemu_e2_d17_svctl_callsite_args.py

  exact-d17:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils binutils-mips-linux-gnu curl squashfs-tools
      - name: Recover exact svctl callsite argument classes
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fritz-d17" "${RUNNER_TEMP}/fritz-receipt"
          python3 scripts/fritz_qemu_e2_d17_svctl_callsite_args.py \
            --firmware-url 'https://download.avm.de/fritzbox/fritzbox-7590/deutschland/fritz.os/FRITZ.Box_7590-08.25.image' \
            --expected-size 42393600 \
            --expected-sha256 267ef427337d2141736ad6ed5d9389722a6a1234dd590bb7d4ebf11a00616c0d \
            --work-dir "${RUNNER_TEMP}/fritz-d17" \
            --receipt "${RUNNER_TEMP}/fritz-receipt/receipt.json"
      - name: Enforce argument-class-only evidence
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"fritz-receipt"/"receipt.json").read_text())
          assert r.get("oracleSatisfied") is True, r
          b=r["interpretationBoundary"]
          assert b["argumentValuesPublished"] is False
          assert b["argumentSetupClassesOnly"] is True
          assert b["verbToCallsiteAssociationAccepted"] is False
          assert b["protocolEnumValuesAccepted"] is False
          assert b["packetFieldLayoutAccepted"] is False
          assert b["instructionAddressesPublished"] is False
          assert b["rawDisassemblyPublished"] is False
          for target in r["binary"]["callsiteSlice"]["targets"]:
              for sig in target["argumentSignatures"]:
                  assert set(sig) == {"a0","a1","a2","a3"}, sig
          for k,v in r["safety"].items():
              assert v is False,(k,v)
          print(json.dumps({
              "classification":r["classification"],
              "fixedVerbCounts":r["binary"]["fixedVerbCounts"],
              "callsiteSlice":r["binary"]["callsiteSlice"],
              "derived":r["derived"],
              "interpretationBoundary":b,
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fritz-e2-d17-svctl-callsite-args-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fritz-receipt/receipt.json
          if-no-files-found: error
          retention-days: 7
