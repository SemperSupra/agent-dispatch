name: FRITZ E2 D18 runtime callsite observe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fritz-e2-d18-runtime-callsite-observe.yml'
      - 'scripts/fritz_qemu_e2_d18_runtime_callsite_observe.py'
      - 'scripts/fritz_qemu_e2_d17_svctl_callsite_args.py'
      - 'scripts/fritz_qemu_e2_wire_digest.py'
      - 'scripts/fritz_qemu_e2_svctl_start_ctlmgr.py'
      - 'tests/test_fritz_qemu_e2_d18_runtime_callsite_observe.py'
      - 'docs/fritz-e2-d18-runtime-callsite-observe.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest -v tests/test_fritz_qemu_e2_d18_runtime_callsite_observe.py

  exact-d18-attach-control:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils binutils-mips-linux-gnu curl gdb-multiarch iproute2 qemu-user-static squashfs-tools util-linux
      - name: Run exact no-strace attach control
        id: probe
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fritz-d18" "${RUNNER_TEMP}/fritz-receipt"
          python3 scripts/fritz_qemu_e2_d18_runtime_callsite_observe.py \
            --attach-only-control \
            --firmware-url 'https://download.avm.de/fritzbox/fritzbox-7590/deutschland/fritz.os/FRITZ.Box_7590-08.25.image' \
            --expected-size 42393600 \
            --expected-sha256 267ef427337d2141736ad6ed5d9389722a6a1234dd590bb7d4ebf11a00616c0d \
            --work-dir "${RUNNER_TEMP}/fritz-d18" \
            --receipt "${RUNNER_TEMP}/fritz-receipt/receipt.json"
      - name: Enforce attach-control evidence boundary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"fritz-receipt"/"receipt.json").read_text())
          assert r.get("oracleSatisfied") is True, r
          allowed={
              "E2_D18_ATTACH_CONTROL_SUCCEEDED_NO_STRACE",
              "E2_D18_ATTACH_CONTROL_RSP_STALL_NO_STRACE",
              "E2_D18_ATTACH_CONTROL_FAILED_NO_STRACE",
          }
          assert r["classification"] in allowed,r["classification"]
          a=r["attachControl"]
          assert a["gdbListenerSeen"] is True,a
          assert a["gdbAttempted"] is True,a
          assert "pre_target" in a["gdbStages"],a
          assert a["hostStraceUsed"] is False
          assert a["breakpointsConfigured"] is False
          assert a["explicitContinueIssued"] is False
          assert a["wireCaptureAttempted"] is False
          b=r["interpretationBoundary"]
          assert b["exactShippedSvctlUsed"] is True
          assert b["sameQemuCpuProfileUsed"] is True
          assert b["isolatedLoopbackOnlyNamespaceUsed"] is True
          assert b["hostStraceExcluded"] is True
          assert b["breakpointSetupExcluded"] is True
          assert b["guestContinueExcluded"] is True
          assert b["wireCaptureExcluded"] is True
          s=r["safety"]
          for key in (
              "rawFirmwarePublished","rootfsPublished","rawTargetOutputPublished",
              "rawHostStracePublished","rawDebuggerOutputPublished",
              "rawRegisterValuesPublished","rawPointedMemoryPublished",
              "wirePayloadPublished","physicalRouterContact","routerMutationAuthorized",
              "externalNetworkAvailableToTarget","targetSpecificShimAdded",
              "shippedFilesModified","serviceStartRequested","explicitGuestContinueIssued"
          ):
              assert s[key] is False,(key,s[key])
          print(json.dumps({
              "classification":r["classification"],
              "attachControl":a,
              "interpretationBoundary":b,
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fritz-e2-d18-attach-control-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fritz-receipt/receipt.json
          if-no-files-found: error
          retention-days: 7
