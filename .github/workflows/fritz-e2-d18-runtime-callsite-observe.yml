name: FRITZ E2 D18 runtime callsite observe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fritz-e2-d18-runtime-callsite-observe.yml'
      - 'scripts/fritz_qemu_e2_d18_runtime_callsite_observe.py'
      - 'scripts/fritz_qemu_e2_d17_svctl_callsite_args.py'
      - 'scripts/fritz_qemu_e2_wire_digest.py'
      - 'scripts/fritz_qemu_e2_svctl_start_ctlmgr.py'
      - 'tests/test_fritz_qemu_e2_d18_runtime_callsite_observe.py'
      - 'docs/fritz-e2-d18-runtime-callsite-observe.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest -v tests/test_fritz_qemu_e2_d18_runtime_callsite_observe.py

  exact-d18e-downstream-send:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils binutils-mips-linux-gnu curl gdb-multiarch iproute2 qemu-user-static squashfs-tools util-linux
      - name: Run exact downstream-send debugger transaction
        id: probe
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fritz-d18" "${RUNNER_TEMP}/fritz-receipt"
          python3 scripts/fritz_qemu_e2_d18_runtime_callsite_observe.py \
            --downstream-send-transaction \
            --firmware-url 'https://download.avm.de/fritzbox/fritzbox-7590/deutschland/fritz.os/FRITZ.Box_7590-08.25.image' \
            --expected-size 42393600 \
            --expected-sha256 267ef427337d2141736ad6ed5d9389722a6a1234dd590bb7d4ebf11a00616c0d \
            --work-dir "${RUNNER_TEMP}/fritz-d18" \
            --receipt "${RUNNER_TEMP}/fritz-receipt/receipt.json"
      - name: Enforce D18e evidence boundary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"fritz-receipt"/"receipt.json").read_text())
          assert r.get("oracleSatisfied") is True,r
          allowed={
              "E2_D18E_DOWNSTREAM_SEND_STABLE_DISCRIMINATOR_FOUND",
              "E2_D18E_DOWNSTREAM_SEND_UNSTABLE_STATUS_NO_DISCRIMINATOR",
              "E2_D18E_DOWNSTREAM_SEND_NO_RUNTIME_DISCRIMINATOR",
          }
          assert r["classification"] in allowed,r["classification"]
          assert r["transaction"]["apply"] == ["svctl","start","ctlmgr"]
          assert r["transaction"]["applyCount"] <= 1
          w=r["wireOracle"]
          assert w["sameRunCaptureAttempted"] is False
          assert w["sameRunCaptureRequired"] is False
          assert w["independentAcceptedR9EvidencePreserved"] is True
          p=r["staticPrecondition"]
          assert p["d18dDownstreamRoleReproduced"] is True,p
          assert p["initToSend"] is True,p
          assert p["sendPktToSend"] is True,p
          assert p["sendToLibcSend"] is True,p
          i=r["instrumentation"]
          assert i["allCallsInstrumentationReady"] is True,i
          assert i["allExpectedTargetHits"] is True,i
          assert isinstance(i["stableDimensionDiscriminatorCount"],int)
          assert isinstance(i["unstableStatusDimensionCount"],int)
          assert [t["target"] for t in i["perTarget"]] == ["_svctl_send"]
          for call in i["callDiagnostics"].values():
              assert call["hostStraceUsed"] is False,call
              assert call["gdbListenerSeen"] is True,call
              assert call["gdbAttempted"] is True,call
              assert "post_target" in call["gdbStages"],call
          for target in i["perTarget"]:
              for comp in target["argumentDimensionComparisons"].values():
                  assert comp["digestValuesPublished"] is False,comp
                  for rel in comp["memoryDigestRelations"].values():
                      assert set(rel) == {
                          "prePresent","startPresent","postPresent",
                          "statusPresenceStable","statusDigestStable",
                          "startDiffersFromStableStatus",
                      },rel
          b=r["interpretationBoundary"]
          assert b["d18dDownstreamRoleRequired"] is True
          assert b["observedRole"] == "_svctl_send_entry"
          assert b["sharedSymbolBindingOnly"] is True
          assert b["d17CallerCallsitesNotReusedAsFunctionEntries"] is True
          assert b["argumentScalarClassesAndMemoryDigestsOnly"] is True
          assert b["hostStraceExcludedFromSvctlCalls"] is True
          assert b["sameRunWireCaptureExcluded"] is True
          assert b["independentR9WireOracleNotReinterpreted"] is True
          assert b["dimensionLevelStatusControlRequired"] is True
          assert b["digestValuesPublished"] is False
          assert b["protocolEnumValuesAccepted"] is False
          assert b["packetFieldLayoutAccepted"] is False
          s=r["safety"]
          for key in (
              "rawFirmwarePublished","rootfsPublished","rawControlPayloadPublished",
              "controlPayloadPersisted","rawHostStracePublished",
              "rawDebuggerOutputPublished","rawRegisterValuesPublished",
              "rawPointedMemoryPublished","callsiteAddressesPublished",
              "physicalRouterContact","routerMutationAuthorized",
              "externalNetworkAvailableToTarget","targetSpecificShimAdded",
              "shippedFilesModified","sameRunWireCaptureAttempted"
          ):
              assert s[key] is False,(key,s[key])
          print(json.dumps({
              "classification":r["classification"],
              "stableDimensionDiscriminatorCount":i["stableDimensionDiscriminatorCount"],
              "unstableStatusDimensionCount":i["unstableStatusDimensionCount"],
              "perTarget":i["perTarget"],
              "runtimeSummary":r["runtimeSummary"],
              "wireOracle":w,
              "interpretationBoundary":b,
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fritz-e2-d18e-downstream-send-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fritz-receipt/receipt.json
          if-no-files-found: error
          retention-days: 7
