name: FRITZ E2 D18 runtime callsite observe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fritz-e2-d18-runtime-callsite-observe.yml'
      - 'scripts/fritz_qemu_e2_d18_runtime_callsite_observe.py'
      - 'scripts/fritz_qemu_e2_d17_svctl_callsite_args.py'
      - 'scripts/fritz_qemu_e2_wire_digest.py'
      - 'scripts/fritz_qemu_e2_svctl_start_ctlmgr.py'
      - 'tests/test_fritz_qemu_e2_d18_runtime_callsite_observe.py'
      - 'docs/fritz-e2-d18-runtime-callsite-observe.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest -v tests/test_fritz_qemu_e2_d18_runtime_callsite_observe.py

  exact-d18:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils binutils-mips-linux-gnu curl gdb-multiarch iproute2 qemu-user-static squashfs-tools strace util-linux
      - name: Run exact instrumented R9 transaction
        id: probe
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fritz-d18" "${RUNNER_TEMP}/fritz-receipt"
          python3 scripts/fritz_qemu_e2_d18_runtime_callsite_observe.py \
            --firmware-url 'https://download.avm.de/fritzbox/fritzbox-7590/deutschland/fritz.os/FRITZ.Box_7590-08.25.image' \
            --expected-size 42393600 \
            --expected-sha256 267ef427337d2141736ad6ed5d9389722a6a1234dd590bb7d4ebf11a00616c0d \
            --work-dir "${RUNNER_TEMP}/fritz-d18" \
            --receipt "${RUNNER_TEMP}/fritz-receipt/receipt.json"
      - name: Enforce instrumentation evidence boundary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"fritz-receipt"/"receipt.json").read_text())
          assert r.get("oracleSatisfied") is True, r
          assert r["transaction"]["apply"] == ["svctl","start","ctlmgr"]
          assert r["wire"]["captureComplete"] is True
          i=r["instrumentation"]
          assert i["allCallsInstrumentationReady"] is True, i
          assert i["prePostStatusEqual"] is True, i
          b=r["interpretationBoundary"]
          assert b["exactStaticCallsitesFromD17UsedEphemerally"] is True
          assert b["callsiteBreakpointsDoNotModifyShippedFiles"] is True
          assert b["argumentScalarClassesAndMemoryDigestsOnly"] is True
          assert b["prePostStatusStabilityRequired"] is True
          assert b["protocolEnumValuesAccepted"] is False
          assert b["packetFieldLayoutAccepted"] is False
          s=r["safety"]
          for key in (
              "rawControlPayloadPublished","controlPayloadPersisted","rawHostStracePublished",
              "rawDebuggerOutputPublished","rawRegisterValuesPublished","rawPointedMemoryPublished",
              "callsiteAddressesPublished","physicalRouterContact","routerMutationAuthorized",
              "externalNetworkAvailableToTarget","targetSpecificShimAdded","shippedFilesModified"
          ):
              assert s[key] is False,(key,s[key])
          print(json.dumps({
              "classification":r["classification"],
              "wireComparisons":r["wire"]["comparisons"],
              "instrumentation":i,
              "runtimeSummary":r["runtimeSummary"],
              "interpretationBoundary":b,
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fritz-e2-d18-runtime-callsite-observe-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fritz-receipt/receipt.json
          if-no-files-found: error
          retention-days: 7
