name: FRITZ E2 D19f branch relation runtime
on:
  pull_request:
    paths:
      - ".github/workflows/fritz-e2-d19f-branch-relation-runtime.yml"
      - "scripts/fritz_qemu_e2_d19f_branch_relation_runtime.py"
      - "tests/test_fritz_qemu_e2_d19f_branch_relation_runtime.py"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: python3 -m unittest -v tests/test_fritz_qemu_e2_d19f_branch_relation_runtime.py
  exact-d19f:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends binutils binutils-mips-linux-gnu curl gdb-multiarch iproute2 qemu-user-static squashfs-tools util-linux
      - run: |
          mkdir -p "${RUNNER_TEMP}/d19f" "${RUNNER_TEMP}/receipt"
          python3 scripts/fritz_qemu_e2_d19f_branch_relation_runtime.py \
            --firmware-url 'https://download.avm.de/fritzbox/fritzbox-7590/deutschland/fritz.os/FRITZ.Box_7590-08.25.image' \
            --expected-size 42393600 \
            --expected-sha256 267ef427337d2141736ad6ed5d9389722a6a1234dd590bb7d4ebf11a00616c0d \
            --work-dir "${RUNNER_TEMP}/d19f" --receipt "${RUNNER_TEMP}/receipt/receipt.json"
      - name: Enforce boundary
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"receipt"/"receipt.json").read_text())
          assert r["oracleSatisfied"] is True,r
          assert r["classification"] in {"E2_D19F_BRANCH_RELATION_DISCRIMINATOR_FOUND","E2_D19F_BRANCH_RELATION_NO_DISCRIMINATOR","E2_D19F_BRANCH_RELATION_STATUS_UNSTABLE"},r
          i=r["instrumentation"];assert i["allCallsInstrumentationReady"] is True,i;assert i["allExpectedHits"] is True,i
          assert i["rawValuesPublished"] is False;assert i["peerRegisterNamePublished"] is False
          b=r["interpretationBoundary"]
          for k in ("rawRegisterValuesPublished","peerRegisterNamePublished","numericValuesPublished","branchOutcomePublished",
                    "responsePayloadPublished","responseFieldLayoutAccepted","protocolEnumValuesAccepted","payloadOffsetsAccepted",
                    "libcReadOwnershipInferred","physicalRouterContact","modifiedHilAuthorized"):
            assert b[k] is False,(k,b[k])
          print(json.dumps({"classification":r["classification"],"staticPrecondition":r["staticPrecondition"],"instrumentation":i,"runtimeSummary":r["runtimeSummary"]},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fritz-e2-d19f-branch-relation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipt/receipt.json
          retention-days: 7
