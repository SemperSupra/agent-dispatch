name: FRITZ E2 supervisor status

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fritz-e2-supervisor-status.yml'
      - 'scripts/fritz_qemu_e2_supervisor_status.py'
      - 'scripts/fritz_qemu_e2_ctlmgr_service_runtime.py'
      - 'scripts/fritz_qemu_e2_supervisor_runtime.py'
      - 'scripts/fritz_qemu_user_probe.py'
      - 'tests/test_fritz_qemu_e2_supervisor_status.py'
      - 'docs/fritz-e2-supervisor-status.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate supervisor status contract
        run: python3 -m unittest -v tests/test_fritz_qemu_e2_supervisor_status.py

  exact-firmware-e2-supervisor-status:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install bounded emulation/isolation tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils curl iproute2 qemu-user-static squashfs-tools util-linux
          sudo -n true
      - name: Observe supervisor control socket and ctlmgr status
        id: probe
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fritz-e2-r3" "${RUNNER_TEMP}/fritz-receipt"
          python3 scripts/fritz_qemu_e2_supervisor_status.py \
            --firmware-url 'https://download.avm.de/fritzbox/fritzbox-7590/deutschland/fritz.os/FRITZ.Box_7590-08.25.image' \
            --expected-size 42393600 \
            --expected-sha256 267ef427337d2141736ad6ed5d9389722a6a1234dd590bb7d4ebf11a00616c0d \
            --work-dir "${RUNNER_TEMP}/fritz-e2-r3" \
            --receipt "${RUNNER_TEMP}/fritz-receipt/receipt.json"
      - name: Enforce safety and typed result
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "fritz-receipt" / "receipt.json"
          r = json.loads(p.read_text())
          s = r.get("safety", {})
          for key in (
              "rawFirmwarePublished","rootfsPublished","binaryPayloadPublished",
              "rawTargetStdoutPublished","rawTargetStderrPublished",
              "rawStracePublished","rawHttpBodyPublished",
              "physicalRouterContact","routerMutationAuthorized",
              "externalNetworkAvailableToTarget","targetSpecificShimAdded",
              "psupportDataFabricated","avmipcdStateFabricated",
              "serviceStartAuthorized","targetWideningAuthorized",
          ):
              assert s.get(key) is False, (key, s.get(key))
          assert r.get("oracleSatisfied") is True, r
          rt = r.get("runtime", {})
          assert rt.get("interfaces") == ["lo"]
          assert rt.get("defaultRoutePresent") is False
          assert rt.get("launcherObservedRunning") is True
          assert rt.get("svctlStatusAttempted") is True, rt
          treatment = r.get("exactTreatment", {})
          assert treatment.get("supervisorArguments") == ["/lib/systemd/system","ctlmgr.service"]
          assert treatment.get("svctlArguments") == ["status","ctlmgr"]
          assert treatment.get("serviceStartAuthorized") is False
          assert treatment.get("targetWideningAuthorized") is False
          print(json.dumps({
              "classification":r.get("classification"),
              "target":r.get("target"),
              "exactTreatment":treatment,
              "runtime":rt,
          }, sort_keys=True))
          PY
      - name: Upload sanitized receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fritz-e2-supervisor-status-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fritz-receipt/receipt.json
          if-no-files-found: error
          retention-days: 7
