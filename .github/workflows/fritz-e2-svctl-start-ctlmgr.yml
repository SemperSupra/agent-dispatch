name: FRITZ E2 svctl start ctlmgr

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fritz-e2-svctl-start-ctlmgr.yml'
      - 'scripts/fritz_qemu_e2_svctl_start_ctlmgr.py'
      - 'scripts/fritz_qemu_e2_prodtest_network_runtime.py'
      - 'scripts/fritz_qemu_e2_var_tmp_runtime.py'
      - 'scripts/fritz_qemu_e2_svctl_status_runtime.py'
      - 'scripts/fritz_qemu_user_probe.py'
      - 'tests/test_fritz_qemu_e2_svctl_start_ctlmgr.py'
      - 'docs/fritz-e2-svctl-start-ctlmgr.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate R6 transaction contract
        run: python3 -m unittest -v tests/test_fritz_qemu_e2_svctl_start_ctlmgr.py

  exact-firmware-r6:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install bounded emulation/isolation tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils curl iproute2 qemu-user-static squashfs-tools util-linux
          sudo -n true
      - name: Inspect, start ctlmgr once, verify, dispose
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fritz-r6" "${RUNNER_TEMP}/fritz-receipt"
          python3 scripts/fritz_qemu_e2_svctl_start_ctlmgr.py \
            --firmware-url 'https://download.avm.de/fritzbox/fritzbox-7590/deutschland/fritz.os/FRITZ.Box_7590-08.25.image' \
            --expected-size 42393600 \
            --expected-sha256 267ef427337d2141736ad6ed5d9389722a6a1234dd590bb7d4ebf11a00616c0d \
            --work-dir "${RUNNER_TEMP}/fritz-r6" \
            --receipt "${RUNNER_TEMP}/fritz-receipt/receipt.json"
      - name: Enforce one-shot isolated actuator boundary
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "fritz-receipt" / "receipt.json"
          r = json.loads(p.read_text())
          assert r.get("oracleSatisfied") is True, r
          tx = r.get("transaction", {})
          assert tx.get("apply") == ["svctl","start","ctlmgr"]
          assert tx.get("applyCount") in (0,1)
          assert tx.get("disposalIsRollback") is True
          rt = r.get("runtime", {})
          assert rt.get("interfaces") == ["lo"]
          assert rt.get("defaultRoutePresent") is False
          s = r.get("safety", {})
          assert s.get("serviceStartCountMaximum") == 1
          assert s.get("disposableEmulatorMutationOnly") is True
          for key in (
              "rawFirmwarePublished","rootfsPublished","rawTargetStdoutPublished",
              "rawTargetStderrPublished","rawStracePublished","rawSvctlOutputPublished",
              "rawHttpBodyPublished","physicalRouterContact","routerMutationAuthorized",
              "externalNetworkAvailableToTarget","targetSpecificShimAdded",
              "psupportDataFabricated","avmipcdStateFabricated","varRunCreated",
              "devShmCreated",
          ):
              assert s.get(key) is False, (key,s.get(key))
          print(json.dumps({
              "classification":r.get("classification"),
              "transaction":tx,
              "runtime":rt,
              "interpretationBoundary":r.get("interpretationBoundary"),
          }, sort_keys=True))
          PY
      - name: Upload sanitized receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fritz-e2-svctl-start-ctlmgr-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fritz-receipt/receipt.json
          if-no-files-found: error
          retention-days: 7
