name: FRITZ E2 Web/Auth discovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fritz-e2-web-auth-discovery.yml'
      - 'scripts/fritz_qemu_e2_discovery.py'
      - 'scripts/fritz_qemu_user_probe.py'
      - 'tests/test_fritz_qemu_e2_discovery.py'
      - 'docs/fritz-e2-web-auth-discovery.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate sanitized discovery semantics
        run: python3 -m unittest -v tests/test_fritz_qemu_e2_discovery.py

  exact-firmware-e2-discovery:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install bounded analysis tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils curl squashfs-tools
      - name: Discover exact FRITZ!OS 8.25 Web/auth candidates
        id: probe
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fritz-e2" "${RUNNER_TEMP}/fritz-receipt"
          python3 scripts/fritz_qemu_e2_discovery.py \
            --firmware-url 'https://download.avm.de/fritzbox/fritzbox-7590/deutschland/fritz.os/FRITZ.Box_7590-08.25.image' \
            --expected-size 42393600 \
            --expected-sha256 267ef427337d2141736ad6ed5d9389722a6a1234dd590bb7d4ebf11a00616c0d \
            --work-dir "${RUNNER_TEMP}/fritz-e2" \
            --receipt "${RUNNER_TEMP}/fritz-receipt/receipt.json"
      - name: Enforce receipt safety and completion
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "fritz-receipt" / "receipt.json"
          r = json.loads(p.read_text())
          s = r.get("safety", {})
          for key in (
              "rawFirmwarePublished",
              "rootfsPublished",
              "binaryPayloadPublished",
              "rawSourceContentPublished",
              "arbitraryExtractedStringsPublished",
              "physicalRouterContact",
              "routerMutationAuthorized",
          ):
              assert s.get(key) is False, (key, s.get(key))

          d = r.get("discovery", {})
          summary = {
              "classification": r.get("classification"),
              "oracleSatisfied": r.get("oracleSatisfied"),
              "target": r.get("target"),
              "extraction": r.get("extraction"),
              "regularFilesScanned": d.get("regularFilesScanned"),
              "interestingFileCount": d.get("interestingFileCount"),
              "markerBearingFiles": d.get("markerBearingFiles"),
              "initReferenceEdges": d.get("initReferenceEdges"),
              "rankedElfCandidates": d.get("rankedElfCandidates"),
          }
          print(json.dumps(summary, sort_keys=True))
          sys.exit(0 if r.get("oracleSatisfied") is True else 1)
          PY
      - name: Upload sanitized receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fritz-e2-web-auth-discovery-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fritz-receipt/receipt.json
          if-no-files-found: error
          retention-days: 7
