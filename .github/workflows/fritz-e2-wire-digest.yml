name: FRITZ E2 wire digest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fritz-e2-wire-digest.yml'
      - 'scripts/fritz_qemu_e2_wire_digest.py'
      - 'scripts/fritz_qemu_e2_svctl_start_ctlmgr.py'
      - 'tests/test_fritz_qemu_e2_wire_digest.py'
      - 'tests/test_fritz_qemu_e2_svctl_start_ctlmgr.py'
      - 'docs/fritz-e2-wire-digest.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest -v tests/test_fritz_qemu_e2_svctl_start_ctlmgr.py tests/test_fritz_qemu_e2_wire_digest.py

  exact-firmware-r9:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils curl iproute2 qemu-user-static squashfs-tools strace util-linux
      - name: Run exact R9 treatment
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fritz-r9" "${RUNNER_TEMP}/fritz-receipt"
          python3 scripts/fritz_qemu_e2_wire_digest.py \
            --firmware-url 'https://download.avm.de/fritzbox/fritzbox-7590/deutschland/fritz.os/FRITZ.Box_7590-08.25.image' \
            --expected-size 42393600 \
            --expected-sha256 267ef427337d2141736ad6ed5d9389722a6a1234dd590bb7d4ebf11a00616c0d \
            --work-dir "${RUNNER_TEMP}/fritz-r9" \
            --receipt "${RUNNER_TEMP}/fritz-receipt/receipt.json"
      - name: Enforce wire-only evidence boundary
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"fritz-receipt"/"receipt.json").read_text())
          assert r.get("oracleSatisfied") is True,r
          assert r["transaction"]["apply"]==["svctl","start","ctlmgr"]
          assert r["transaction"]["applyCount"] in (0,1)
          assert r["wire"]["captureComplete"] is True
          for key in ("preStatus","start","postStatus"):
              w=r["wire"][key]
              assert w["captureComplete"] is True,(key,w)
              assert w["request"]["totalBytes"]>0,(key,w)
              assert w["response"]["totalBytes"]>0,(key,w)
              assert w["payloadPublished"] is False
              assert w["rawTracePublished"] is False
          s=r["safety"]
          assert s["rawControlPayloadPublished"] is False
          assert s["controlPayloadPersisted"] is False
          assert s["rawHostStracePublished"] is False
          assert s["physicalRouterContact"] is False
          assert s["routerMutationAuthorized"] is False
          print(json.dumps({
              "classification":r["classification"],
              "comparisons":r["wire"]["comparisons"],
              "wire":{
                  k:{
                      "request":r["wire"][k]["request"],
                      "response":r["wire"][k]["response"],
                      "eventSequence":r["wire"][k]["eventSequence"]
                  } for k in ("preStatus","start","postStatus")
              },
              "runtime":{
                  "statusChanged":r["runtime"].get("statusChanged"),
                  "ctlmgrProcessObserved":r["runtime"].get("ctlmgrProcessObserved")
              }
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fritz-e2-wire-digest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fritz-receipt/receipt.json
          retention-days: 7
