name: FRITZ H0 D1e selector table schema

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fritz-h0-d1e-selector-tables.yml'
      - 'scripts/fritz_h0_d1e_selector_tables.py'
      - 'tests/test_fritz_h0_d1e_selector_tables.py'
      - 'docs/fritz-h0-d1e-selector-tables.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest -v tests/test_fritz_h0_d1e_selector_tables.py

  exact-osp-h0-d1e:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Recover selector table schema
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fritz-h0-d1e" "${RUNNER_TEMP}/fritz-receipt"
          python3 scripts/fritz_h0_d1e_selector_tables.py \
            --osp-url 'https://osp.avm.de/fritzbox/fritzbox-7590/source-files-FRITZ.Box_7590-grx5-08.25.tar.gz' \
            --expected-size 633140613 \
            --expected-sha256 61e0969cf2c5e4fc3942eeb8da765115f1612fdf11c563428f54f2cfe45bf9dc \
            --work-dir "${RUNNER_TEMP}/fritz-h0-d1e" \
            --receipt "${RUNNER_TEMP}/fritz-receipt/receipt.json"
      - name: Enforce metadata-only schema
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"fritz-receipt"/"receipt.json").read_text())
          assert r.get("oracleSatisfied") is True, r
          for k,v in r["safety"].items():
              assert v is False,(k,v)
          b=r["interpretationBoundary"]
          assert b["numericValuesPublished"] is False
          assert b["stringValuesPublished"] is False
          assert b["exactValueToSlotMappingAccepted"] is False
          if r["classification"] == "H0_D1E_SELECTOR_TABLE_SCHEMA_RECOVERED":
              assert b["tableOwnershipRecovered"] is True
              assert b["tableRelationshipsRecovered"] is True
              assert r["schema"]["derived"]["resolvedOwnerCount"] > 0
              assert r["schema"]["derived"]["resolvedOccurrenceCount"] > 0
          else:
              assert r["classification"] in (
                  "H0_D1E_NO_TABLE_OWNER_RECOVERED",
                  "H0_D1E_TABLE_OWNER_PARTIAL",
              ), r["classification"]
          print(json.dumps({"classification":r["classification"],"schema":r["schema"],"interpretationBoundary":b},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fritz-h0-d1e-selector-table-schema-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fritz-receipt/receipt.json
          retention-days: 7
