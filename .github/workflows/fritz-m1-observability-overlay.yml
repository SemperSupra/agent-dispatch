name: FRITZ M1 observability overlay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fritz-m1-observability-overlay.yml'
      - 'scripts/fritz_qemu_overlay.py'
      - 'scripts/fritz_qemu_user_probe.py'
      - 'fixtures/fritz-overlays/observability-v1/**'
      - 'tests/test_fritz_qemu_overlay.py'
      - 'docs/fritz-m1-observability-overlay.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate overlay safety contract
        run: python3 -m unittest -v tests/test_fritz_qemu_overlay.py

  exact-firmware-m1:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install bounded emulation/extraction tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils curl qemu-user-static squashfs-tools
          sudo -n true
      - name: Apply and execute observability-only overlay
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fritz-m1" "${RUNNER_TEMP}/fritz-receipt"
          python3 scripts/fritz_qemu_overlay.py \
            --firmware-url 'https://download.avm.de/fritzbox/fritzbox-7590/deutschland/fritz.os/FRITZ.Box_7590-08.25.image' \
            --expected-size 42393600 \
            --expected-sha256 267ef427337d2141736ad6ed5d9389722a6a1234dd590bb7d4ebf11a00616c0d \
            --manifest fixtures/fritz-overlays/observability-v1/manifest.json \
            --work-dir "${RUNNER_TEMP}/fritz-m1" \
            --receipt "${RUNNER_TEMP}/fritz-receipt/receipt.json"
      - name: Enforce stock-oracle separation
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "fritz-receipt" / "receipt.json"
          r = json.loads(p.read_text())
          assert r.get("oracleSatisfied") is True, r
          o = r.get("overlay", {})
          assert o.get("stockFilesReplaced") is False
          assert o.get("allDestinationsAbsentInStock") is True
          assert o.get("stockSemanticsExpectedToChange") is False
          assert o.get("changedPaths") == ["/opt/supra/bin/observe-supervisor"]
          e = r.get("execution", {})
          assert e.get("safeResultValidated") is True
          s = r.get("safety", {})
          for key in (
              "rawFirmwarePublished","rootfsPublished","modifiedRootfsPublished",
              "proprietaryBinaryModified","stockFileReplaced",
              "physicalRouterContact","routerMutationAuthorized",
              "externalNetworkRequiredForGuestExecution",
          ):
              assert s.get(key) is False, (key, s.get(key))
          print(json.dumps({
              "classification": r.get("classification"),
              "stockTarget": r.get("stockTarget"),
              "overlay": o,
              "execution": e,
              "disposal": r.get("disposal"),
          }, sort_keys=True))
          PY
      - name: Upload sanitized receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fritz-m1-observability-overlay-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fritz-receipt/receipt.json
          if-no-files-found: error
          retention-days: 7
