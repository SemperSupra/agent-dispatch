name: FRITZ QEMU userspace E0-E1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fritz-qemu-user-probe.yml'
      - 'scripts/fritz_qemu_user_probe.py'
      - 'tests/test_fritz_qemu_user_probe.py'
      - 'docs/fritz-qemu-user-probe.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate public-safe probe semantics
        run: python3 -m unittest -v tests/test_fritz_qemu_user_probe.py

  exact-firmware-e0-e1:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install bounded foreign-ABI tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils curl qemu-user-static squashfs-tools
      - name: Exercise exact FRITZ!OS 8.25 userspace
        id: probe
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fritz-qemu" "${RUNNER_TEMP}/fritz-receipt"
          python3 scripts/fritz_qemu_user_probe.py \
            --firmware-url 'https://download.avm.de/fritzbox/fritzbox-7590/deutschland/fritz.os/FRITZ.Box_7590-08.25.image' \
            --expected-size 42393600 \
            --expected-sha256 267ef427337d2141736ad6ed5d9389722a6a1234dd590bb7d4ebf11a00616c0d \
            --work-dir "${RUNNER_TEMP}/fritz-qemu" \
            --receipt "${RUNNER_TEMP}/fritz-receipt/receipt.json"
      - name: Enforce receipt safety and oracle
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          p = (
              pathlib.Path(os.environ["RUNNER_TEMP"])
              / "fritz-receipt"
              / "receipt.json"
          )
          r = json.loads(p.read_text())
          s = r.get("safety", {})
          assert s.get("rawFirmwarePublished") is False
          assert s.get("rootfsPublished") is False
          assert s.get("binaryPayloadPublished") is False
          print(
              json.dumps(
                  {
                      "classification": r.get("classification"),
                      "oracleSatisfied": r.get("oracleSatisfied"),
                      "e0": r.get("e0"),
                      "e1": r.get("e1"),
                  },
                  sort_keys=True,
              )
          )
          sys.exit(0 if r.get("oracleSatisfied") is True else 1)
          PY
      - name: Upload sanitized receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fritz-qemu-user-e0-e1-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fritz-receipt/receipt.json
          if-no-files-found: error
          retention-days: 7
