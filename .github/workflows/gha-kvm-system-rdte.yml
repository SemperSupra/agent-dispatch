name: Real-system KVM RDTE

on:
  push:
    branches:
      - experiment/gha-kvm-system-rdte
  workflow_dispatch:
    inputs:
      target:
        description: "Heavy target to exercise"
        required: true
        default: both
        type: choice
        options:
          - both
          - proxmox
          - truenas
      truenas_version:
        description: "Exact TrueNAS target version"
        required: true
        default: "26.0.0-BETA.3"
        type: choice
        options:
          - "26.0.0-BETA.3"
          - "25.10.7"
          - "25.04.2.6"
          - "25.04.1"
      truenas_rung:
        description: "TrueNAS system qualification rung"
        required: true
        default: t6
        type: choice
        options:
          - t0
          - t1
          - t2
          - t3
          - t4
          - t5
          - t6
      truenas_t6_product:
        description: "Exact T6 Foundry consumer"
        required: true
        default: litellm
        type: choice
        options:
          - litellm
          - wow-sidecar
          - garm
          - garm-controller-f0f5
          - garm-provider-g2
          - garm-provider-g3
          - garm-provider-g4
          - garm-provider-g5
          - garm-provider-container-pre-b4
          - official-catalog
          - foliorelay
          - minecraft-paper
          - collage-native-paper
          - minecraft-vanilla-263
      proxmox_compute_fixture:
        description: "Optional native PVE REST compute fixture"
        required: true
        default: none
        type: choice
        options:
          - none
          - container-c0
          - vm-v0
      truenas_compute_fixture:
        description: "Optional compute fixture layered on the selected system rung"
        required: true
        default: none
        type: choice
        options:
          - none
          - container-c0
          - vm-v0
          - vm-v1

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      proxmox: ${{ steps.scope.outputs.proxmox }}
      truenas: ${{ steps.scope.outputs.truenas }}
      qemu_topology: ${{ steps.scope.outputs.qemu_topology }}
      truenas_version: ${{ steps.scope.outputs.truenas_version }}
      truenas_rung: ${{ steps.scope.outputs.truenas_rung }}
      truenas_t6_product: ${{ steps.scope.outputs.truenas_t6_product }}
      truenas_collage_readback: ${{ steps.scope.outputs.truenas_collage_readback }}
      truenas_compute_fixture: ${{ steps.scope.outputs.truenas_compute_fixture }}
      proxmox_compute_fixture: ${{ steps.scope.outputs.proxmox_compute_fixture }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TARGET: ${{ inputs.target }}
          DISPATCH_TRUENAS_VERSION: ${{ inputs.truenas_version }}
          DISPATCH_TRUENAS_RUNG: ${{ inputs.truenas_rung }}
          DISPATCH_TRUENAS_T6_PRODUCT: ${{ inputs.truenas_t6_product }}
          DISPATCH_TRUENAS_COMPUTE_FIXTURE: ${{ inputs.truenas_compute_fixture }}
          DISPATCH_PROXMOX_COMPUTE_FIXTURE: ${{ inputs.proxmox_compute_fixture }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          RUN_REQUEST_PATH: config/truenas-rdte-run-request.json
          PROXMOX_RUN_REQUEST_PATH: config/proxmox-rdte-run-request.json
        run: |
          set -euo pipefail
          proxmox=false
          truenas=false
          qemu_topology=false
          truenas_version="${DISPATCH_TRUENAS_VERSION:-26.0.0-BETA.3}"
          truenas_rung="${DISPATCH_TRUENAS_RUNG:-t6}"
          truenas_t6_product="${DISPATCH_TRUENAS_T6_PRODUCT:-litellm}"
          truenas_collage_readback=false
          truenas_compute_fixture="${DISPATCH_TRUENAS_COMPUTE_FIXTURE:-none}"
          proxmox_compute_fixture="${DISPATCH_PROXMOX_COMPUTE_FIXTURE:-none}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$DISPATCH_TARGET" in
              proxmox) proxmox=true ;;
              truenas) truenas=true ;;
              both) proxmox=true; truenas=true; qemu_topology=true ;;
              *) echo "unsupported dispatch target: $DISPATCH_TARGET" >&2; exit 2 ;;
            esac
          elif [[ -n "$BEFORE_SHA" && -n "$AFTER_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            while IFS= read -r path; do
              case "$path" in
                config/truenas-rdte-run-request.json)
                  # Heavy TrueNAS work is request-edge driven. Harness/probe/workflow
                  # changes alone must never replay the previously committed request.
                  truenas=true
                  ;;
                config/proxmox-rdte-run-request.json)
                  # Heavy Proxmox work is request-edge driven. Harness/probe/workflow
                  # changes alone must never launch or replay a heavyweight PVE rep.
                  proxmox=true
                  ;;
                scripts/gha_qemu_t3_topology_probe.py|.github/workflows/gha-kvm-system-rdte.yml)
                  qemu_topology=true
                  ;;
              esac
            done < <(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          else
            proxmox=true
            truenas=true
            qemu_topology=true
          fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" && "$proxmox" == "true" ]]; then
            [[ -f "$PROXMOX_RUN_REQUEST_PATH" ]] || { echo "missing Proxmox run request" >&2; exit 2; }
            jq -e '.schema == "gha-kvm-proxmox-run-request/v1"' "$PROXMOX_RUN_REQUEST_PATH" >/dev/null
            current_proxmox_request_id="$(jq -er '.request_id | select(type == "string" and length > 0)' "$PROXMOX_RUN_REQUEST_PATH")"
            previous_proxmox_request_id=""
            if git cat-file -e "$BEFORE_SHA:$PROXMOX_RUN_REQUEST_PATH" 2>/dev/null; then
              previous_proxmox_request_id="$(git show "$BEFORE_SHA:$PROXMOX_RUN_REQUEST_PATH" | jq -er '.request_id | select(type == "string" and length > 0)')"
            fi
            if [[ -n "$previous_proxmox_request_id" && "$current_proxmox_request_id" == "$previous_proxmox_request_id" ]]; then
              echo "refusing stale Proxmox request replay: request_id did not change ($current_proxmox_request_id)" >&2
              exit 2
            fi
            proxmox_version="$(jq -er '.version | select(type == "string" and length > 0)' "$PROXMOX_RUN_REQUEST_PATH")"
            proxmox_target_json="$(python3 scripts/proxmox_rdte_target.py --registry config/proxmox-rdte-targets.json --version "$proxmox_version" --require-runtime-admitted)"
            proxmox_target_authority="$(jq -er '.authority_issue' <<<"$proxmox_target_json")"
            proxmox_request_authority="$(jq -er '.authority_issue' "$PROXMOX_RUN_REQUEST_PATH")"
            [[ "$proxmox_request_authority" == "$proxmox_target_authority" ]] || {
              echo "Proxmox request authority does not match exact target profile" >&2
              exit 2
            }
            proxmox_compute_fixture="$(jq -er '(.compute_fixture // "none") | select(. == "none" or . == "container-c0" or . == "vm-v0")' "$PROXMOX_RUN_REQUEST_PATH")"
            printf 'fresh Proxmox request edge: previous=%s current=%s\n' "${previous_proxmox_request_id:-<none>}" "$current_proxmox_request_id"
          fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" && "$truenas" == "true" ]]; then
            jq -e '.schema == "gha-kvm-truenas-run-request/v1"' "$RUN_REQUEST_PATH" >/dev/null
            current_request_id="$(jq -er '.request_id | select(type == "string" and length > 0)' "$RUN_REQUEST_PATH")"
            previous_request_id=""
            if git cat-file -e "$BEFORE_SHA:$RUN_REQUEST_PATH" 2>/dev/null; then
              previous_request_id="$(git show "$BEFORE_SHA:$RUN_REQUEST_PATH" | jq -er '.request_id | select(type == "string" and length > 0)')"
            fi
            if [[ -n "$previous_request_id" && "$current_request_id" == "$previous_request_id" ]]; then
              echo "refusing stale TrueNAS request replay: request_id did not change ($current_request_id)" >&2
              exit 2
            fi
            truenas_version="$(jq -er '.version | select(type == "string" and length > 0)' "$RUN_REQUEST_PATH")"
            truenas_rung="$(jq -er '.rung | select(. == "t0" or . == "t1" or . == "t2" or . == "t3" or . == "t4" or . == "t5" or . == "t6")' "$RUN_REQUEST_PATH")"
            truenas_t6_product="$(jq -er '(.product // "litellm") | select(. == "litellm" or . == "wow-sidecar" or . == "garm" or . == "garm-controller-f0f5" or . == "garm-provider-g2" or . == "garm-provider-g3" or . == "garm-provider-g4" or . == "garm-provider-g5" or . == "garm-provider-container-pre-b4" or . == "official-catalog" or . == "foliorelay" or . == "minecraft-paper" or . == "collage-native-paper" or . == "minecraft-vanilla-263")' "$RUN_REQUEST_PATH")"
            truenas_compute_fixture="$(jq -er '(.compute_fixture // "none") | select(. == "none" or . == "container-c0" or . == "vm-v0" or . == "vm-v1")' "$RUN_REQUEST_PATH")"
            truenas_collage_readback="$(jq -er '(.collage_readback // false) | select(. == true or . == false)' "$RUN_REQUEST_PATH")"
            if [[ "$truenas_collage_readback" == "true" ]]; then
              [[ "$truenas_t6_product" == "minecraft-vanilla-263" && "$truenas_version" == "25.04.2.6" && "$truenas_rung" == "t6" ]] || {
                echo "read-only COLLAGE observer requires exact native vanilla263/25.04.2.6/T6" >&2; exit 2;
              }
            fi
            python3 scripts/truenas_rdte_target.py \
              --registry config/truenas-rdte-targets.json \
              --version "$truenas_version" >/dev/null
            printf 'fresh TrueNAS request edge: previous=%s current=%s\n' "${previous_request_id:-<none>}" "$current_request_id"
          fi
          if [[ "$truenas_compute_fixture" != "none" && "$truenas_rung" != "t3" ]]; then
            echo "compute fixture $truenas_compute_fixture requires truenas rung t3" >&2
            exit 2
          fi
          echo "proxmox=$proxmox" >>"$GITHUB_OUTPUT"
          echo "truenas=$truenas" >>"$GITHUB_OUTPUT"
          echo "qemu_topology=$qemu_topology" >>"$GITHUB_OUTPUT"
          echo "truenas_version=$truenas_version" >>"$GITHUB_OUTPUT"
          echo "truenas_rung=$truenas_rung" >>"$GITHUB_OUTPUT"
          echo "truenas_t6_product=$truenas_t6_product" >>"$GITHUB_OUTPUT"
          echo "truenas_collage_readback=$truenas_collage_readback" >>"$GITHUB_OUTPUT"
          echo "truenas_compute_fixture=$truenas_compute_fixture" >>"$GITHUB_OUTPUT"
          echo "proxmox_compute_fixture=$proxmox_compute_fixture" >>"$GITHUB_OUTPUT"
          printf 'target scope: proxmox=%s proxmox_compute_fixture=%s truenas=%s qemu_topology=%s truenas_version=%s truenas_rung=%s t6_product=%s truenas_compute_fixture=%s\n' "$proxmox" "$proxmox_compute_fixture" "$truenas" "$qemu_topology" "$truenas_version" "$truenas_rung" "$truenas_t6_product" "$truenas_compute_fixture"

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate public-safe contract
        run: python3 -m unittest -v tests/test_gha_kvm_system_rdte.py tests/test_truenas_future_protocols.py tests/test_truenas_t6_litellm_control.py tests/test_truenas_t6_wow_sidecar_control.py tests/test_truenas_t6_garm_control.py tests/test_truenas_garm_provider_g2.py tests/test_truenas_garm_provider_g3.py tests/test_truenas_garm_provider_g4.py tests/test_truenas_garm_provider_g5.py tests/test_truenas_garm_container_pre_b4.py tests/test_truenas_garm_controller_f0_f5.py tests/test_truenas_t6_official_catalog_control.py tests/test_truenas_t6_foliorelay_control.py tests/test_truenas_rdte_target.py tests/test_truenas_session_runner.py tests/test_minecraft_t6_receipt_gate.py

  foundry-t6-control:
    needs: [changes, contract]
    if: needs.contract.result == 'success' && needs.changes.outputs.truenas == 'true' && needs.changes.outputs.truenas_rung == 't6' && needs.changes.outputs.truenas_t6_product == 'litellm'
    uses: SemperSupra/truenas-app-foundry/.github/workflows/export-litellm-t6-control.yml@4ba12f4a870f9af8a667056f1e2cc32f80f8e2ba
    with:
      foundry_ref: 4ba12f4a870f9af8a667056f1e2cc32f80f8e2ba
    permissions:
      contents: read

  foundry-wow-t6-control:
    needs: [changes, contract]
    if: needs.contract.result == 'success' && needs.changes.outputs.truenas == 'true' && needs.changes.outputs.truenas_rung == 't6' && needs.changes.outputs.truenas_t6_product == 'wow-sidecar'
    uses: SemperSupra/truenas-app-foundry/.github/workflows/export-wow-sidecar-t6-control.yml@9ac2eef97581caff5b0de740560c55a778fa3f1c
    with:
      foundry_ref: 9ac2eef97581caff5b0de740560c55a778fa3f1c
    permissions:
      contents: read

  foundry-garm-t6-control:
    needs: [changes, contract]
    if: needs.contract.result == 'success' && needs.changes.outputs.truenas == 'true' && needs.changes.outputs.truenas_rung == 't6' && needs.changes.outputs.truenas_t6_product == 'garm'
    uses: SemperSupra/truenas-app-foundry/.github/workflows/export-garm-t6-control.yml@7fd0d2474248b61cf8e290fc80f40b761cea5e98
    with:
      foundry_ref: 7fd0d2474248b61cf8e290fc80f40b761cea5e98
    permissions:
      contents: read

  foundry-garm-f0-f5-control:
    needs: [changes, contract]
    if: needs.contract.result == 'success' && needs.changes.outputs.truenas == 'true' && needs.changes.outputs.truenas_rung == 't6' && needs.changes.outputs.truenas_t6_product == 'garm-controller-f0f5'
    uses: SemperSupra/truenas-app-foundry/.github/workflows/export-garm-f0-f5-control.yml@bfbf2158c3f679c3422e6035bdb67e7874a5c07a
    with:
      foundry_ref: bfbf2158c3f679c3422e6035bdb67e7874a5c07a
      target_version: ${{ needs.changes.outputs.truenas_version }}
    permissions:
      contents: read

  foundry-official-catalog-t6-control:
    needs: [changes, contract]
    if: needs.contract.result == 'success' && needs.changes.outputs.truenas == 'true' && needs.changes.outputs.truenas_rung == 't6' && needs.changes.outputs.truenas_t6_product == 'official-catalog'
    uses: SemperSupra/truenas-app-foundry/.github/workflows/export-official-catalog-t6-control.yml@60d56cc1752bc825cb232d72b397ff17fe6d47c4
    with:
      foundry_ref: 60d56cc1752bc825cb232d72b397ff17fe6d47c4
      control_id: ntfy
    permissions:
      contents: read

  foundry-foliorelay-t6-control:
    needs: [changes, contract]
    if: needs.contract.result == 'success' && needs.changes.outputs.truenas == 'true' && needs.changes.outputs.truenas_rung == 't6' && needs.changes.outputs.truenas_t6_product == 'foliorelay'
    uses: SemperSupra/truenas-app-foundry/.github/workflows/export-foliorelay-t6-control.yml@81deb97185760975fd8d3162df42056c77b3c0fd
    with:
      foundry_ref: 81deb97185760975fd8d3162df42056c77b3c0fd
      target_version: ${{ needs.changes.outputs.truenas_version }}
    permissions:
      contents: read

  foundry-minecraft-paper-t6-control:
    needs: [changes, contract]
    if: needs.contract.result == 'success' && needs.changes.outputs.truenas == 'true' && needs.changes.outputs.truenas_rung == 't6' && needs.changes.outputs.truenas_t6_product == 'minecraft-paper'
    uses: SemperSupra/truenas-app-foundry/.github/workflows/export-minecraft-paper-t6-control.yml@2cc7e1fe3772f8c532e933b3d7832e6cf985db4e
    with:
      foundry_ref: 2cc7e1fe3772f8c532e933b3d7832e6cf985db4e
      target_version: "25.04.1"
    permissions:
      contents: read

  foundry-minecraft-vanilla263-t6-control:
    needs: [changes, contract]
    if: needs.contract.result == 'success' && needs.changes.outputs.truenas == 'true' && needs.changes.outputs.truenas_rung == 't6' && needs.changes.outputs.truenas_t6_product == 'minecraft-vanilla-263' && needs.changes.outputs.truenas_version == '25.04.2.6'
    uses: SemperSupra/truenas-app-foundry/.github/workflows/export-minecraft-vanilla-263-t6-control.yml@29ec6cba7df51e316b0329926aa85807805dd07b
    with:
      foundry_ref: 29ec6cba7df51e316b0329926aa85807805dd07b
      target_version: "25.04.2.6"
    permissions:
      contents: read

  foundry-collage-paper-11530-t6-control:
    needs: [changes, contract]
    if: needs.contract.result == 'success' && needs.changes.outputs.truenas == 'true' && needs.changes.outputs.truenas_rung == 't6' && needs.changes.outputs.truenas_t6_product == 'collage-native-paper'
    uses: SemperSupra/truenas-app-foundry/.github/workflows/export-minecraft-paper-11530-t6-control.yml@403321031b6d4e66aa64a8299fd7621eee290b0d
    with:
      foundry_ref: 403321031b6d4e66aa64a8299fd7621eee290b0d
      target_version: "25.04.1"
    permissions:
      contents: read

  provider-g2-fixtures:
    needs: [changes, contract]
    if: needs.contract.result == 'success' && needs.changes.outputs.truenas == 'true' && needs.changes.outputs.truenas_rung == 't6' && needs.changes.outputs.truenas_t6_product == 'garm-provider-g2'
    uses: SemperSupra/garm-provider-truenas/.github/workflows/export-g2-nested-fixtures.yml@1667aa73e514c278e221082ac33f2f10a4141eef
    with:
      provider_ref: 1667aa73e514c278e221082ac33f2f10a4141eef
    permissions:
      contents: read

  provider-g3-fixture:
    needs: [changes, contract]
    if: needs.contract.result == 'success' && needs.changes.outputs.truenas == 'true' && needs.changes.outputs.truenas_rung == 't6' && needs.changes.outputs.truenas_t6_product == 'garm-provider-g3'
    uses: SemperSupra/garm-provider-truenas/.github/workflows/export-g3-nested-fixture.yml@e92d4024e6e60c0e2f8bcf5301c11fccb14eaaab
    with:
      provider_ref: e92d4024e6e60c0e2f8bcf5301c11fccb14eaaab
    permissions:
      contents: read

  provider-g4-fixture:
    needs: [changes, contract]
    if: needs.contract.result == 'success' && needs.changes.outputs.truenas == 'true' && needs.changes.outputs.truenas_rung == 't6' && needs.changes.outputs.truenas_t6_product == 'garm-provider-g4'
    uses: SemperSupra/garm-provider-truenas/.github/workflows/export-g4-nested-fixture.yml@e5fc7c50780de54f7579f64990c87b2e16482613
    with:
      provider_ref: e5fc7c50780de54f7579f64990c87b2e16482613
    permissions:
      contents: read

  provider-g5-runner-fixture:
    needs: [changes, contract]
    if: needs.contract.result == 'success' && needs.changes.outputs.truenas == 'true' && needs.changes.outputs.truenas_rung == 't6' && needs.changes.outputs.truenas_t6_product == 'garm-provider-g5'
    uses: SemperSupra/garm-provider-truenas/.github/workflows/export-g3-nested-fixture.yml@e92d4024e6e60c0e2f8bcf5301c11fccb14eaaab
    with:
      provider_ref: e92d4024e6e60c0e2f8bcf5301c11fccb14eaaab
    permissions:
      contents: read

  provider-g5-version-matrix:
    needs: [changes, contract]
    if: needs.contract.result == 'success' && needs.changes.outputs.truenas == 'true' && needs.changes.outputs.truenas_rung == 't6' && needs.changes.outputs.truenas_t6_product == 'garm-provider-g5'
    uses: SemperSupra/garm-provider-truenas/.github/workflows/export-g5-version-matrix.yml@f83a712e095c6962741f93cf86bea69479ce4d4a
    with:
      provider_ref: f83a712e095c6962741f93cf86bea69479ce4d4a
    permissions:
      contents: read

  provider-container-pre-b4-fixture:
    needs: [changes, contract]
    if: needs.contract.result == 'success' && needs.changes.outputs.truenas == 'true' && needs.changes.outputs.truenas_rung == 't6' && needs.changes.outputs.truenas_t6_product == 'garm-provider-container-pre-b4'
    uses: SemperSupra/garm-provider-truenas/.github/workflows/export-container-b0-b5-fixture.yml@9f3c86169320b6a2330bbb345d25a41c736c73c2
    with:
      provider_ref: 9f3c86169320b6a2330bbb345d25a41c736c73c2
    permissions:
      contents: read

  qemu-t3-topology:
    needs: [changes, contract]
    if: needs.contract.result == 'success' && needs.changes.outputs.qemu_topology == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install QEMU topology prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils
      - name: Exercise actual hosted-runner QEMU topology
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gha-kvm-system-rdte"
          python3 scripts/gha_qemu_t3_topology_probe.py \
            --out "$RUNNER_TEMP/gha-kvm-system-rdte/qemu-t3-topology.json"
      - name: Upload QEMU topology evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gha-qemu-t3-topology-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gha-kvm-system-rdte/qemu-t3-topology.json
          if-no-files-found: error
          retention-days: 7

  proxmox-9-2:
    concurrency:
      group: agent-dispatch-heavyweight-rdte
      queue: max
      cancel-in-progress: false
    needs: [changes, contract]
    if: needs.contract.result == 'success' && needs.changes.outputs.proxmox == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Ensure bounded QEMU/KVM prerequisites
