name: Agent Dispatch typed public CPU executor
run-name: Typed CPU ${{ inputs.assignment_id || inputs.request || 'contract reps' }}

on:
  workflow_dispatch:
    inputs:
      request:
        description: Legacy reviewed committed CPU workload manifest
        required: false
        type: string
      assignment_id:
        description: Public synthetic DLE assignment identity for native correlation
        required: false
        type: string
      assignment:
        description: Bounded public-synthetic DLE assignment JSON; no secrets
        required: false
        type: string
  workflow_call:
    inputs:
      request:
        description: Legacy reviewed committed CPU workload manifest
        required: false
        type: string
      assignment_id:
        description: Public synthetic DLE assignment identity for native correlation
        required: false
        type: string
      assignment:
        description: Bounded public-synthetic DLE assignment JSON; no secrets
        required: false
        type: string
  pull_request:
    paths:
      - 'scripts/gha_workload_request.py'
      - 'scripts/gha_assignment_contract.py'
      - 'scripts/gha_assignment_execute.py'
      - 'scripts/verify_gha_assignment_receipt.py'
      - 'tests/test_gha_assignment_execution.py'
      - 'scripts/public_nlp_cpu_reference.py'
      - 'tests/test_public_nlp_cpu_reference.py'
      - 'tests/test_gha_workload_request.py'
      - 'scripts/provider_packet_contract.py'
      - 'tests/test_provider_packet_contract.py'
      - 'scripts/microsoft_devproxy_contract.py'
      - 'scripts/verify_microsoft_devproxy_receipt.py'
      - 'scripts/qualify_microsoft_devproxy.sh'
      - 'tests/test_microsoft_devproxy_contract.py'
      - 'tests/test_microsoft_dispatch_profile.py'
      - 'scripts/azurite_blob_etag.js'
      - 'scripts/qualify_azurite_transport.sh'
      - 'scripts/verify_azurite_transport.py'
      - 'tests/test_azurite_transport.py'
      - 'tests/test_azurite_dispatch_profile.py'
      - 'fixtures/microsoft/**'
      - 'tests/test_verify_gha_typed_receipt.py'
      - 'scripts/verify_gha_typed_receipt.py'
      - 'requests/gha/**'
      - '.github/workflows/gha-typed-public-cpu.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate public request and authority contracts
        run: |
          python3 -m unittest -v tests/test_gha_workload_request.py
          python3 -m unittest -v tests/test_provider_packet_contract.py
          python3 -m unittest -v tests/test_microsoft_devproxy_contract.py
          python3 -m unittest -v tests/test_microsoft_dispatch_profile.py
          python3 -m unittest -v tests/test_azurite_transport.py
          python3 -m unittest -v tests/test_azurite_dispatch_profile.py
          python3 tests/test_verify_gha_typed_receipt.py -v
          python3 tests/test_gha_assignment_execution.py -v

  devproxy-mock-only:
    if: github.event_name == 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Admit reviewed Microsoft mock-only work request
        id: fixed
        shell: bash
        env:
          REQUEST: requests/gha/microsoft-devproxy-mock-v1.json
        run: python3 scripts/gha_workload_request.py --action plan --request "$REQUEST" --github-output "$GITHUB_OUTPUT"
      - name: Execute bounded Microsoft mock using the typed Agent Dispatch executor
        shell: bash
        env:
          REQUEST: requests/gha/microsoft-devproxy-mock-v1.json
          DIGEST: ${{ steps.fixed.outputs.request_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/gha_workload_request.py --action run \
            --request "$REQUEST" --digest "$DIGEST" \
            --receipt "$RUNNER_TEMP/microsoft-mock/typed.json"
      - name: Independently verify native typed and Dev Proxy mock receipts
        shell: bash
        env:
          REQUEST: requests/gha/microsoft-devproxy-mock-v1.json
        run: |
          set -euo pipefail
          sha=$(sha256sum "$RUNNER_TEMP/microsoft-mock/typed.json" | cut -d' ' -f1)
          python3 scripts/verify_gha_typed_receipt.py --request "$REQUEST" \
            --receipt "$RUNNER_TEMP/microsoft-mock/typed.json" \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --runner ubuntu-24.04 --sha256 "$sha" \
            --out "$RUNNER_TEMP/microsoft-mock/typed-verified.json"
      - name: Upload public synthetic mock receipts
        if: always() && hashFiles('scripts/microsoft_devproxy_contract.py') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microsoft-mock-${{ github.run_attempt }}
          path: ${{ runner.temp }}/microsoft-mock/*.json
          if-no-files-found: ignore
          retention-days: 3

  azurite-blob-transport:
    if: github.event_name == 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Admit reviewed Azurite storage transport request
        shell: bash
        id: fixed
        env:
          REQUEST: requests/gha/azurite-blob-transport-v1.json
        run: python3 scripts/gha_workload_request.py --action plan --request "$REQUEST" --github-output "$GITHUB_OUTPUT"
      - name: Execute bounded Azurite workcell through typed executor
        shell: bash
        env:
          REQUEST: requests/gha/azurite-blob-transport-v1.json
          DIGEST: ${{ steps.fixed.outputs.request_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/gha_workload_request.py --action run \
            --request "$REQUEST" --digest "$DIGEST" \
            --receipt "$RUNNER_TEMP/azurite-blob/typed.json"
      - name: Independently verify Azurite native typed receipt
        shell: bash
        env:
          REQUEST: requests/gha/azurite-blob-transport-v1.json
        run: |
          set -euo pipefail
          sha=$(sha256sum "$RUNNER_TEMP/azurite-blob/typed.json" | cut -d' ' -f1)
          python3 scripts/verify_gha_typed_receipt.py --request "$REQUEST" \
            --receipt "$RUNNER_TEMP/azurite-blob/typed.json" \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --runner ubuntu-24.04 --sha256 "$sha" \
            --out "$RUNNER_TEMP/azurite-blob/typed-verified.json"
      - name: Upload bounded public-synthetic transport evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: azurite-blob-${{ github.run_attempt }}
          path: ${{ runner.temp }}/azurite-blob/*.json
          if-no-files-found: ignore
          retention-days: 3

  cpu-native-proofs:
    if: github.event_name == 'pull_request'
    needs: contract
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: ubuntu-24.04
            request: requests/gha/cpu-x64-arithmetic-v1.json
          - runner: ubuntu-24.04-arm
            request: requests/gha/cpu-arm64-contract-v1.json
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify immutable request and admitted CPU shape
        id: planned
        env:
          REQUEST: ${{ matrix.request }}
        run: python3 scripts/gha_workload_request.py --action plan --request "$REQUEST" --github-output "$GITHUB_OUTPUT"
      - name: Execute typed CPU workload with independent verdict
        env:
          REQUEST: ${{ matrix.request }}
          DIGEST: ${{ steps.planned.outputs.request_sha256 }}
        run: |
          python3 scripts/gha_workload_request.py --action run --request "$REQUEST" \
            --digest "$DIGEST" --receipt ".gha-typed/receipt.json"
      - name: Independently verify provider-bound CPU receipt
        env:
          REQUEST: ${{ matrix.request }}
          RUNNER_LABEL: ${{ matrix.runner }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(sha256sum .gha-typed/receipt.json | cut -d' ' -f1)
          python3 scripts/verify_gha_typed_receipt.py --request "$REQUEST" \
            --receipt .gha-typed/receipt.json --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --runner "$RUNNER_LABEL" \
            --sha256 "$sha" --out .gha-typed/verified.json
      - name: Upload public-safe typed receipt
        if: always() && hashFiles('.gha-typed/receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gha-typed-${{ matrix.runner }}-${{ github.run_attempt }}
          path: |
            .gha-typed/receipt.json
            .gha-typed/verified.json
          if-no-files-found: error
          retention-days: 7

  plan:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.plan.outputs.runner }}
      request_sha256: ${{ steps.plan.outputs.request_sha256 }}
      assignment_sha256: ${{ steps.plan.outputs.assignment_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Admit exactly one reviewed static profile and optional DLE assignment
        id: plan
        env:
          REQUEST: ${{ inputs.request }}
          ASSIGNMENT: ${{ inputs.assignment }}
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ASSIGNMENT" ]; then
            test -z "$REQUEST"
            test -n "$ASSIGNMENT_ID"
            python3 scripts/gha_assignment_execute.py --action plan \
              --assignment "$ASSIGNMENT" --correlation-id "$ASSIGNMENT_ID" \
              --source-sha "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
          else
            test -z "$ASSIGNMENT_ID"
            test -n "$REQUEST"
            python3 scripts/gha_workload_request.py --action plan --request "$REQUEST" --github-output "$GITHUB_OUTPUT"
          fi

  execute:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Execute one previously admitted fixed CPU workload
        env:
          REQUEST: ${{ inputs.request }}
          ASSIGNMENT: ${{ inputs.assignment }}
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          PROFILE_DIGEST: ${{ needs.plan.outputs.request_sha256 }}
          ASSIGNMENT_DIGEST: ${{ needs.plan.outputs.assignment_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ASSIGNMENT" ]; then
            python3 scripts/gha_assignment_execute.py --action run \
              --assignment "$ASSIGNMENT" --correlation-id "$ASSIGNMENT_ID" \
              --source-sha "$GITHUB_SHA" --digest "$ASSIGNMENT_DIGEST" \
              --receipt ".gha-typed/receipt.json"
          else
            python3 scripts/gha_workload_request.py --action run --request "$REQUEST" \
              --digest "$PROFILE_DIGEST" --receipt ".gha-typed/receipt.json"
          fi
      - name: Independently verify provider-bound CPU receipt
        env:
          REQUEST: ${{ inputs.request }}
          ASSIGNMENT: ${{ inputs.assignment }}
          RUNNER_LABEL: ${{ needs.plan.outputs.runner }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(sha256sum .gha-typed/receipt.json | cut -d' ' -f1)
          if [ -n "$ASSIGNMENT" ]; then
            python3 scripts/verify_gha_assignment_receipt.py --assignment-json "$ASSIGNMENT" \
              --receipt .gha-typed/receipt.json --source-sha "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID" --runner "$RUNNER_LABEL" \
              --sha256 "$sha" --out .gha-typed/verified.json
          else
            python3 scripts/verify_gha_typed_receipt.py --request "$REQUEST" \
              --receipt .gha-typed/receipt.json --source-sha "$GITHUB_SHA" \
              --run-id "$GITHUB_RUN_ID" --runner "$RUNNER_LABEL" \
              --sha256 "$sha" --out .gha-typed/verified.json
          fi
      - name: Retain independently checked receipt
        if: always() && hashFiles('.gha-typed/receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gha-typed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .gha-typed/receipt.json
            .gha-typed/verified.json
          if-no-files-found: error
          retention-days: 7

  public-nlp-reference:
    # Public-only fixed synthetic dependency/offset oracle. Never accepts external corpus, URL or code.
    if: github.event_name == 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install spaCy in disposable CPU-only venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/public-nlp-venv"
          "$RUNNER_TEMP/public-nlp-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-cache-dir 'spacy==3.8.11' 'click==8.1.8'
      - name: Run standalone synthetic fixture and independent offset oracle
        shell: bash
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/public-nlp-venv/bin/python"
          "$PY" -m unittest -v tests/test_public_nlp_cpu_reference.py
          mkdir -p "$RUNNER_TEMP/public-nlp-reference"
          "$PY" scripts/public_nlp_cpu_reference.py --out "$RUNNER_TEMP/public-nlp-reference/receipt.json"
          "$PY" scripts/public_nlp_cpu_reference.py --out "$RUNNER_TEMP/public-nlp-reference/repeat.json"
          cmp "$RUNNER_TEMP/public-nlp-reference/receipt.json" "$RUNNER_TEMP/public-nlp-reference/repeat.json"
          sha256sum "$RUNNER_TEMP/public-nlp-reference/receipt.json"
      - name: Retain public synthetic receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-nlp-reference-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-nlp-reference/*.json
          if-no-files-found: ignore
          retention-days: 7
