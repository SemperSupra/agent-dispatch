name: GitHub Runner Android Setup Inventory

on:
  push:
    branches:
      - experiment/github-runner-capability-census
    paths:
      - 'scripts/github_runner_android_setup.py'
      - 'tests/test_github_runner_android_setup.py'
      - '.github/workflows/github-runner-android-setup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest -v tests/test_github_runner_android_setup.py

  inventory:
    needs: contract
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inventory preinstalled Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/android-setup"
          python3 scripts/github_runner_android_setup.py             --label "${{ matrix.runner }}"             --out "${RUNNER_TEMP}/android-setup/receipt.json"
      - name: Upload public-safe setup receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-android-setup-${{ matrix.runner }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-setup/receipt.json
          if-no-files-found: error
          retention-days: 7
