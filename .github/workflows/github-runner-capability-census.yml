name: GitHub Runner Capability Census

on:
  workflow_dispatch:
    inputs:
      include_windows_arm:
        description: "Include passive Windows ARM census"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test passive census contract
        run: python3 -m unittest -v tests/test_github_runner_census.py

  passive:
    needs: contract
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-slim
          - macos-26
          - macos-26-intel
          - xcode-27
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run passive census
        env:
          CENSUS_REQUESTED_LABEL: ${{ matrix.runner }}
          CENSUS_REPOSITORY_VISIBILITY: public
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/runner-census"
          python3 scripts/github_runner_census.py --label "${{ matrix.runner }}" --out "${RUNNER_TEMP}/runner-census/receipt.json"
      - name: Upload public-safe receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-census-${{ matrix.runner }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-census/receipt.json
          if-no-files-found: error
          retention-days: 7

  windows-arm:
    if: inputs.include_windows_arm
    needs: contract
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run passive Windows ARM census
        shell: pwsh
        env:
          CENSUS_REQUESTED_LABEL: windows-11-arm
          CENSUS_REPOSITORY_VISIBILITY: public
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/runner-census" | Out-Null
          python scripts/github_runner_census.py --label windows-11-arm --out "$env:RUNNER_TEMP/runner-census/receipt.json"
      - name: Upload public-safe Windows ARM receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-census-windows-11-arm-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-census/receipt.json
          if-no-files-found: error
          retention-days: 7
