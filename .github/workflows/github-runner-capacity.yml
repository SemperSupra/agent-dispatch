name: GitHub Runner Capacity Characterization

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test capacity guardrails
        run: python3 -m unittest -v tests/test_github_runner_capacity.py

  capacity:
    needs: contract
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-slim
          - macos-26
          - macos-26-intel
          - xcode-27
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run bounded capacity characterization
        env:
          CENSUS_REQUESTED_LABEL: ${{ matrix.runner }}
          CENSUS_REPOSITORY_VISIBILITY: public
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/runner-capacity"
          python3 scripts/github_runner_capacity.py --label "${{ matrix.runner }}" --out "${RUNNER_TEMP}/runner-capacity/receipt.json"
      - name: Upload public-safe capacity receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-capacity-${{ matrix.runner }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-capacity/receipt.json
          if-no-files-found: error
          retention-days: 7
