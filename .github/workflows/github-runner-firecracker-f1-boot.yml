name: Firecracker GHA RDTE F1 Boot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test F1 boot contract
        run: python3 -m unittest -v tests/test_github_runner_firecracker_f1_boot.py

  boot:
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run minimal pinned Firecracker guest boot oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firecracker-f1-boot"
          python3 scripts/github_runner_firecracker_f1_boot.py \
            --label "ubuntu-26.04" \
            --out "${RUNNER_TEMP}/firecracker-f1-boot/receipt.json"
      - name: Upload public-safe F1 boot receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-f1-boot-ubuntu-26.04-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-f1-boot/receipt.json
          if-no-files-found: error
          retention-days: 7
