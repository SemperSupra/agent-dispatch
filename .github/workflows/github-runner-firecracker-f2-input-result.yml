name: Firecracker GHA RDTE F2 Input Result

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test F2 input-result contract
        run: python3 -m unittest -v tests/test_github_runner_firecracker_f2_input_result.py

  execute:
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run bounded Firecracker F2 input-result oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firecracker-f2"
          python3 scripts/github_runner_firecracker_f2_input_result.py \
            --label "ubuntu-26.04" \
            --input experiments/firecracker/guest/f2-input.txt \
            --out "${RUNNER_TEMP}/firecracker-f2/receipt.json"
      - name: Upload public-safe F2 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-f2-input-result-ubuntu-26.04-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-f2/receipt.json
          if-no-files-found: error
          retention-days: 7
