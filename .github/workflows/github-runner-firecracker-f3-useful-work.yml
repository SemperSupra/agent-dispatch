name: Firecracker GHA RDTE F3 Useful Work

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test lifecycle timing and F3 contract
        run: |
          python3 -m unittest -v \
            tests/test_firecracker_lifecycle_timing.py \
            tests/test_github_runner_firecracker_f3_useful_work.py

  execute:
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run timed fixed Firecracker F3 workload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firecracker-f3"
          python3 scripts/github_runner_firecracker_f3_useful_work.py \
            --label "ubuntu-26.04" \
            --input experiments/firecracker/guest/f3-input.txt \
            --out "${RUNNER_TEMP}/firecracker-f3/receipt.json"
      - name: Upload F3 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-f3-useful-work-ubuntu-26.04-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-f3/receipt.json
          if-no-files-found: error
          retention-days: 7
