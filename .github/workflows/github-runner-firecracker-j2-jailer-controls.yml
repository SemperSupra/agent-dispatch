name: Firecracker J2 Jailer Controls

on:
  pull_request:
    branches:
      - experiment/firecracker-microvm-f0
    paths:
      - "scripts/github_runner_firecracker_j2_jailer_controls.py"
      - "tests/test_github_runner_firecracker_j2_jailer_controls.py"
      - ".github/workflows/github-runner-firecracker-j2-jailer-controls.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest -v tests/test_github_runner_firecracker_j2_jailer_controls.py

  controls:
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run bounded jailer controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firecracker-j2"
          python3 scripts/github_runner_firecracker_j2_jailer_controls.py \
            --label ubuntu-26.04 \
            --out "${RUNNER_TEMP}/firecracker-j2/receipt.json"
      - name: Upload J2 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-j2-jailer-controls-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-j2/receipt.json
          if-no-files-found: error
          retention-days: 7
