name: Firecracker P1 Boundary Confirmation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test P1 concurrency contract
        run: python3 -m unittest -v tests/test_github_runner_firecracker_p1_concurrency.py

  boundary:
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm N=4 and probe bounded N=6 oversubscription
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firecracker-p1-boundary"
          python3 scripts/github_runner_firecracker_p1_concurrency.py \
            --label "ubuntu-26.04-boundary" \
            --points "1,4,4,6" \
            --out "${RUNNER_TEMP}/firecracker-p1-boundary/receipt.json"
      - name: Upload P1 boundary receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-p1-boundary-ubuntu-26.04-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-p1-boundary/receipt.json
          if-no-files-found: error
          retention-days: 7
