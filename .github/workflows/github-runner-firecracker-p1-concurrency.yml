name: Firecracker P1 Same-Host Concurrency

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/github_runner_firecracker_p1_concurrency.py"
      - "tests/test_github_runner_firecracker_p1_concurrency.py"
      - ".github/workflows/github-runner-firecracker-p1-concurrency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test P1 concurrency contract
        run: python3 -m unittest -v tests/test_github_runner_firecracker_p1_concurrency.py

  frontier:
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run P1 N=1,2,4 concurrency frontier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firecracker-p1"
          python3 scripts/github_runner_firecracker_p1_concurrency.py \
            --label "ubuntu-26.04" \
            --out "${RUNNER_TEMP}/firecracker-p1/receipt.json"
      - name: Upload P1 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-p1-concurrency-ubuntu-26.04-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-p1/receipt.json
          if-no-files-found: error
          retention-days: 7
