name: Firecracker P2 Coexistence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test P2 coexistence contract
        run: python3 -m unittest -v tests/test_github_runner_firecracker_p2_coexistence.py

  coexistence:
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run bounded P2 coexistence experiment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firecracker-p2"
          python3 scripts/github_runner_firecracker_p2_coexistence.py \
            --label "ubuntu-26.04" \
            --out "${RUNNER_TEMP}/firecracker-p2/receipt.json"
      - name: Upload P2 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-p2-coexistence-ubuntu-26.04-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-p2/receipt.json
          if-no-files-found: error
          retention-days: 7
