name: Firecracker P3 Same-Host Handoff

on:
  pull_request:
    branches:
      - main
    paths:
      - "experiments/firecracker/p3/**"
      - "scripts/github_runner_firecracker_p3_same_host_handoff.py"
      - "tests/test_github_runner_firecracker_p3_same_host_handoff.py"
      - ".github/workflows/github-runner-firecracker-p3-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test P3 handoff contract
        run: python3 -m unittest -v tests/test_github_runner_firecracker_p3_same_host_handoff.py

  handoff:
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run same-host snapshot handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firecracker-p3"
          python3 scripts/github_runner_firecracker_p3_same_host_handoff.py \
            --label "ubuntu-26.04" \
            --out "${RUNNER_TEMP}/firecracker-p3/receipt.json"
      - name: Upload P3 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-p3-handoff-ubuntu-26.04-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-p3/receipt.json
          if-no-files-found: error
          retention-days: 7
