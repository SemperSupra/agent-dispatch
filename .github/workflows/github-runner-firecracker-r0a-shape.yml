name: Firecracker R0a Guest Shape Envelope

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest -v tests/test_github_runner_firecracker_r0a_shape_envelope.py

  envelope:
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run bounded vCPU/RAM shape envelope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firecracker-r0a"
          python3 scripts/github_runner_firecracker_r0a_shape_envelope.py \
            --label ubuntu-26.04 \
            --out "${RUNNER_TEMP}/firecracker-r0a/receipt.json"
      - name: Upload R0a receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-r0a-shape-envelope-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-r0a/receipt.json
          if-no-files-found: error
          retention-days: 7
