name: Firecracker R0b Active Resource Envelope

on:
  pull_request:
    branches:
      - experiment/firecracker-microvm-f0
    paths:
      - "experiments/firecracker/guest/r0b-resource-probe-x86_64.c"
      - "scripts/github_runner_firecracker_r0b_active_resources.py"
      - "tests/test_github_runner_firecracker_r0b_active_resources.py"
      - ".github/workflows/github-runner-firecracker-r0b-active.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest -v tests/test_github_runner_firecracker_r0b_active_resources.py

  active:
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run active CPU/RAM envelope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firecracker-r0b"
          python3 scripts/github_runner_firecracker_r0b_active_resources.py \
            --label ubuntu-26.04 \
            --out "${RUNNER_TEMP}/firecracker-r0b/receipt.json"
      - name: Upload R0b receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-r0b-active-envelope-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-r0b/receipt.json
          if-no-files-found: error
          retention-days: 7
