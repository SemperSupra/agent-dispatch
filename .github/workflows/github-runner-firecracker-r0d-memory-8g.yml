name: Firecracker R0d Active 8GiB Memory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest -v tests/test_github_runner_firecracker_r0d_memory_8g.py

  memory:
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run final bounded 8 GiB active-memory point
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firecracker-r0d"
          python3 scripts/github_runner_firecracker_r0d_memory_8g.py \
            --label ubuntu-26.04 \
            --out "${RUNNER_TEMP}/firecracker-r0d/receipt.json"
      - name: Upload R0d receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-r0d-memory-8g-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-r0d/receipt.json
          if-no-files-found: error
          retention-days: 7
