name: Firecracker R1b Block Rate Limit

on:
  pull_request:
    branches:
      - experiment/firecracker-microvm-f0
    paths:
      - "scripts/github_runner_firecracker_r1b_rate_limit.py"
      - "tests/test_github_runner_firecracker_r1b_rate_limit.py"
      - ".github/workflows/github-runner-firecracker-r1b-rate-limit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest -v tests/test_github_runner_firecracker_r1b_rate_limit.py

  rate-limit:
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run matched baseline and throttled storage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firecracker-r1b"
          python3 scripts/github_runner_firecracker_r1b_rate_limit.py \
            --label ubuntu-26.04 \
            --out "${RUNNER_TEMP}/firecracker-r1b/receipt.json"
      - name: Upload R1b receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-r1b-rate-limit-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-r1b/receipt.json
          if-no-files-found: error
          retention-days: 7
