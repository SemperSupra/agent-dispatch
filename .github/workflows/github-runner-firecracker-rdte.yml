name: GitHub Runner Firecracker RDTE

on:
  pull_request:
    paths:
      - ".github/workflows/github-runner-firecracker-rdte.yml"
      - "scripts/github_runner_firecracker_rdte.py"
      - "tests/test_github_runner_firecracker_rdte.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate Firecracker RDTE contract
        run: python3 -m unittest -v tests/test_github_runner_firecracker_rdte.py

  f0:
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Execute bounded Firecracker F0 probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firecracker-rdte-f0"
          python3 scripts/github_runner_firecracker_rdte.py \
            --rung f0 \
            --out "${RUNNER_TEMP}/firecracker-rdte-f0/receipt.json"
          python3 -m json.tool "${RUNNER_TEMP}/firecracker-rdte-f0/receipt.json"
      - name: Upload public-safe F0 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-rdte-f0-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-rdte-f0/receipt.json
          if-no-files-found: error
          retention-days: 7

  f1:
    needs: f0
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Boot pinned Firecracker kernel + deterministic initrd
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firecracker-rdte-f1"
          python3 scripts/github_runner_firecracker_rdte.py \
            --rung f1 \
            --out "${RUNNER_TEMP}/firecracker-rdte-f1/receipt.json"
          python3 -m json.tool "${RUNNER_TEMP}/firecracker-rdte-f1/receipt.json"
      - name: Upload public-safe F1 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-rdte-f1-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-rdte-f1/receipt.json
          if-no-files-found: error
          retention-days: 7


  f2:
    needs: f1
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prove portable read-only input and writable result blocks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firecracker-rdte-f2"
          rc=0
          python3 scripts/github_runner_firecracker_rdte.py \
            --rung f2 \
            --out "${RUNNER_TEMP}/firecracker-rdte-f2/receipt.json" || rc=$?
          python3 -m json.tool "${RUNNER_TEMP}/firecracker-rdte-f2/receipt.json"
          exit "$rc"
      - name: Upload public-safe F2 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-rdte-f2-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-rdte-f2/receipt.json
          if-no-files-found: error
          retention-days: 7
