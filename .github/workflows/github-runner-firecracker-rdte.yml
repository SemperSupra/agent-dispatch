name: GitHub Runner Firecracker RDTE

on:
  pull_request:
    paths:
      - ".github/workflows/github-runner-firecracker-rdte.yml"
      - "scripts/github_runner_firecracker_rdte.py"
      - "tests/test_github_runner_firecracker_rdte.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate Firecracker RDTE contract
        run: python3 -m unittest -v tests/test_github_runner_firecracker_rdte.py

  f5:
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact public GARM provider workload
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SemperSupra/garm-provider-truenas
          ref: 6a28ea5c614dce67efb16ca004271ff01e9bff61
          path: workload-src
          persist-credentials: false
      - name: Build bounded self-contained workload artifact
        shell: bash
        run: |
          set -euo pipefail
          go version
          cd workload-src
          CGO_ENABLED=0 go test -c \
            -o "${RUNNER_TEMP}/garm-provider-truenas-tests" \
            ./internal/truenasstore
          chmod 0755 "${RUNNER_TEMP}/garm-provider-truenas-tests"
          file "${RUNNER_TEMP}/garm-provider-truenas-tests"
          sha256sum "${RUNNER_TEMP}/garm-provider-truenas-tests"
      - name: Execute real workload through Firecracker envelope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firecracker-rdte-f5"
          rc=0
          python3 scripts/github_runner_firecracker_rdte.py \
            --rung f5 \
            --workload "${RUNNER_TEMP}/garm-provider-truenas-tests" \
            --out "${RUNNER_TEMP}/firecracker-rdte-f5/receipt.json" || rc=$?
          python3 -m json.tool "${RUNNER_TEMP}/firecracker-rdte-f5/receipt.json"
          exit "$rc"
      - name: Upload public-safe F5 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-rdte-f5-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-rdte-f5/receipt.json
          if-no-files-found: error
          retention-days: 7
