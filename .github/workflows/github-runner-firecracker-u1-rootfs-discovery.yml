name: Firecracker U1 Rootfs Discovery

on:
  pull_request:
    branches:
      - experiment/firecracker-microvm-f0
    paths:
      - "scripts/github_runner_firecracker_u1_rootfs_discovery.py"
      - "tests/test_github_runner_firecracker_u1_rootfs_discovery.py"
      - ".github/workflows/github-runner-firecracker-u1-rootfs-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest -v tests/test_github_runner_firecracker_u1_rootfs_discovery.py

  discover:
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Discover and hash pinned-prefix Ubuntu userspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firecracker-u1"
          python3 scripts/github_runner_firecracker_u1_rootfs_discovery.py \
            --download-dir "${RUNNER_TEMP}/firecracker-u1" \
            --out "${RUNNER_TEMP}/firecracker-u1/receipt.json"
      - name: Upload discovery receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-u1-rootfs-discovery-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-u1/receipt.json
          if-no-files-found: error
          retention-days: 7
