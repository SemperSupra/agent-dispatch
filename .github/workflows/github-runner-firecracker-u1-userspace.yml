name: Firecracker U1 Normal Userspace

on:
  pull_request:
    branches:
      - experiment/firecracker-microvm-f0
    paths:
      - "experiments/firecracker/guest-userspace-ubuntu-24.04-x86_64.json"
      - "experiments/firecracker/guest/u1-bridge-init-x86_64.c"
      - "experiments/firecracker/guest/u1-userspace-probe.py"
      - "scripts/github_runner_firecracker_u1_userspace.py"
      - "tests/test_github_runner_firecracker_u1_userspace.py"
      - ".github/workflows/github-runner-firecracker-u1-userspace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest -v tests/test_github_runner_firecracker_u1_userspace.py

  userspace:
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run pinned Ubuntu userspace probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/firecracker-u1"
          python3 scripts/github_runner_firecracker_u1_userspace.py \
            --label ubuntu-26.04 \
            --out "${RUNNER_TEMP}/firecracker-u1/receipt.json"
      - name: Upload U1 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-u1-userspace-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-u1/receipt.json
          if-no-files-found: error
          retention-days: 7
