name: Firecracker W2 Snapshot Clone State

on:
  pull_request:
    branches:
      - experiment/firecracker-microvm-f0
    paths:
      - "experiments/firecracker/guest/w2-bridge-init-x86_64.c"
      - "experiments/firecracker/guest/w2-clone-state.py"
      - "scripts/github_runner_firecracker_w2_clone_state.py"
      - "tests/test_github_runner_firecracker_w2_clone_state.py"
      - ".github/workflows/github-runner-firecracker-w2-clone-state.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest -v tests/test_github_runner_firecracker_w2_clone_state.py

  clone-state:
    needs: contract
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Restore one warm snapshot twice sequentially
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firecracker-w2"
          python3 scripts/github_runner_firecracker_w2_clone_state.py \
            --label ubuntu-26.04 \
            --out "$RUNNER_TEMP/firecracker-w2/receipt.json"
      - name: Upload W2 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firecracker-w2-clone-state-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firecracker-w2/receipt.json
          if-no-files-found: error
          retention-days: 7
