name: GitHub Runner Frontier Oracles

on:
  pull_request:
    paths:
      - '.github/workflows/github-runner-frontier.yml'
      - 'scripts/reversing_evidence_correlate.py'
      - 'scripts/reversing_native_elf_probe.py'
      - 'tests/test_reversing_evidence_correlate.py'
      - 'fixtures/reversing-correlation-synthetic-v1.json'
      - 'docs/reversing-correlation-experiment.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test frontier oracle semantics
        run: python3 -m unittest -v tests/test_github_runner_frontier.py
      - name: Test reversing correlation and adversarial oracle semantics
        run: python3 -m unittest -v tests/test_reversing_evidence_correlate.py
      - name: Exercise synthetic correlated report
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reversing_evidence_correlate.py \
            --input fixtures/reversing-correlation-synthetic-v1.json \
            --output "${RUNNER_TEMP}/reversing-evidence.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          r = json.loads((Path(os.environ["RUNNER_TEMP"]) / "reversing-evidence.json").read_text())
          assert r["schema"] == "reversing-correlation-result/v1"
          assert len(r["matched_instructions"]) == 1
          assert len(r["causal_links"]) == 1
          assert len(r["unresolved_observations"]) == 1
          assert len(r["static_functions_not_observed"]) == 1
          assert r["mode"] == "synthetic"
          print("SYNTHETIC_CONTRACT_PASS")
          PY

      - name: Check qualified native GNU debugger availability
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gdb >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends gdb
          fi
          command -v gcc nm readelf gdb
      - name: Correlate generated native ELF with GDB execution
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reversing_native_elf_probe.py --output "${RUNNER_TEMP}/reversing-native-elf.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          r = json.loads((Path(os.environ["RUNNER_TEMP"]) / "reversing-native-elf.json").read_text())
          assert r["qualification"] == "NATIVE_SYNTHETIC_ELF_RUNTIME_PASS"
          assert r["matched_instruction_count"] == 1
          assert r["unresolved_instruction_count"] == 0
          assert r["static_symbol_rva"] <= r["runtime_observed_rva"] < r["static_symbol_rva"] + r["static_symbol_size"]
          print("NATIVE_ELF_GDB_ORACLE_PASS")
          PY
