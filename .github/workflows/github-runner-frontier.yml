name: GitHub Runner Frontier Oracles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test frontier oracle semantics
        run: python3 -m unittest -v tests/test_github_runner_frontier.py
