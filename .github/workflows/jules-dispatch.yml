name: Jules Dispatch
run-name: Jules Dispatch by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Approved opaque target ID"
        required: true
        default: "phase0"
        type: string
      task:
        description: "Approved task ID"
        required: true
        default: "phase0-private-repo-smoke-test"
        type: string
      correlation:
        description: "Opaque private-contract locator; only used by private-contract-v1"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    if: github.actor == 'mark-e-deyoung'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: jules-dispatch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Dispatch approved task to Jules
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_TARGETS_JSON: ${{ secrets.JULES_TARGETS_JSON }}
          TARGET_ID: ${{ inputs.target }}
          TASK_ID: ${{ inputs.task }}
          CORRELATION_ID: ${{ inputs.correlation }}
        run: |
          args=(dispatch --target "$TARGET_ID" --task "$TASK_ID")
          if [ -n "$CORRELATION_ID" ]; then
            args+=(--correlation "$CORRELATION_ID")
          fi
          python3 scripts/jules.py "${args[@]}"
