name: Jules Dispatch

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Authorized Jules target (owner/repo)"
        required: true
        type: string
      branch:
        description: "Starting branch"
        required: true
        default: "main"
        type: string
      task_file:
        description: "Task file in this dispatcher repo"
        required: true
        default: "tasks/phase0-private-repo-smoke-test.md"
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch to Jules
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_BRANCH: ${{ inputs.branch }}
          TASK_FILE: ${{ inputs.task_file }}
        run: |
          test -f "$TASK_FILE" || { echo "Task file not found: $TASK_FILE"; exit 2; }
          TASK_PROMPT="$(cat "$TASK_FILE")"
          python3 scripts/jules.py dispatch \
            --repository "$TARGET_REPOSITORY" \
            --branch "$TARGET_BRANCH" \
            --prompt "$TASK_PROMPT"
