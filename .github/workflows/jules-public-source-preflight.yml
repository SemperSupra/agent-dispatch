name: Jules Public Source Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    if: github.actor == 'mark-e-deyoung'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: jules-dispatch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the exact public Foundry Source
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          python3 scripts/jules.py preflight-public-source \
            --repository SemperSupra/truenas-app-foundry \
            --branch main
