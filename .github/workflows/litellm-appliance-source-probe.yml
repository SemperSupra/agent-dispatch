name: LiteLLM appliance source probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/litellm-appliance-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE_TAG: ghcr.io/berriai/litellm:v1.102.1
      UPSTREAM_TAG_COMMIT: d09bbae1c6df463e425558f60d460437193635da
      UPSTREAM_COSIGN_KEY: https://raw.githubusercontent.com/BerriAI/litellm/0112e53046018d726492c814b3644b7d376029d0/cosign.pub
    steps:
      - name: Checkout public execution surface
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.1.3

      - name: Resolve immutable image identity
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE_TAG"
          repo_digest="$(docker image inspect "$IMAGE_TAG" --format '{{index .RepoDigests 0}}')"
          digest="${repo_digest##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'repo_digest=%s\n' "$repo_digest" >> "$GITHUB_OUTPUT"

      - name: Verify upstream image signature
        shell: bash
        run: |
          set -euo pipefail
          cosign verify --key "$UPSTREAM_COSIGN_KEY" "${{ steps.resolve.outputs.repo_digest }}" > /tmp/cosign.json
          jq -e 'length >= 1' /tmp/cosign.json >/dev/null

      - name: Inspect upstream runtime
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.resolve.outputs.repo_digest }}"
          inspect="$(docker image inspect "$image")"
          architecture="$(jq -r '.[0].Architecture' <<<"$inspect")"
          os="$(jq -r '.[0].Os' <<<"$inspect")"
          user="$(jq -r '.[0].Config.User // ""' <<<"$inspect")"
          entrypoint="$(jq -c '.[0].Config.Entrypoint // []' <<<"$inspect")"
          cmd="$(jq -c '.[0].Config.Cmd // []' <<<"$inspect")"
          [[ "$architecture" == "amd64" ]]
          [[ "$os" == "linux" ]]
          {
            printf 'architecture=%s\n' "$architecture"
            printf 'os=%s\n' "$os"
            printf 'user=%s\n' "$user"
            printf 'entrypoint=%s\n' "$entrypoint"
            printf 'cmd=%s\n' "$cmd"
          } >> "$GITHUB_OUTPUT"

      - name: Emit sanitized source receipt
        shell: bash
        env:
          RESOLVED_DIGEST: ${{ steps.resolve.outputs.digest }}
          RESOLVED_OS: ${{ steps.inspect.outputs.os }}
          RESOLVED_ARCH: ${{ steps.inspect.outputs.architecture }}
          RESOLVED_USER: ${{ steps.inspect.outputs.user }}
          RESOLVED_ENTRYPOINT: ${{ steps.inspect.outputs.entrypoint }}
          RESOLVED_CMD: ${{ steps.inspect.outputs.cmd }}
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/litellm-source-receipt.json
          import json, os
          receipt = {
              "schema": "semper-supra.litellm-appliance-source/1",
              "status": "PASS",
              "upstream": {
                  "repository": "BerriAI/litellm",
                  "tag": "v1.102.1",
                  "tag_commit": "d09bbae1c6df463e425558f60d460437193635da",
                  "image": "ghcr.io/berriai/litellm:v1.102.1",
                  "image_digest": os.environ["RESOLVED_DIGEST"],
                  "cosign_key_commit": "0112e53046018d726492c814b3644b7d376029d0",
                  "signature_verified": True,
              },
              "runtime": {
                  "os": os.environ["RESOLVED_OS"],
                  "architecture": os.environ["RESOLVED_ARCH"],
                  "user": os.environ["RESOLVED_USER"],
                  "entrypoint": json.loads(os.environ["RESOLVED_ENTRYPOINT"]),
                  "cmd": json.loads(os.environ["RESOLVED_CMD"]),
              },
              "secrets_captured": False,
              "money_spent_usd": 0,
          }
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
          {
            echo '### LiteLLM appliance upstream source receipt'
            echo
            cat /tmp/litellm-source-receipt.json
          } >> "$GITHUB_STEP_SUMMARY"
