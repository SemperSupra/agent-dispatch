name: M1 R22 off-runner synthetic state rehydration with real gateway
on:
  push:
    branches: [rdte/m1-r22-cross-runner-20261112]
    paths:
      - .github/workflows/m1-r22-cross-runner.yml
      - experiments/supratoolbelt-r22-cross-runner/**
permissions:
  contents: read
jobs:
  source-ephemeral-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ea198e844e6989fc1a9bea77ab6367725d34ac9a
          path: jwt-harness
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 32790dbe1a64a4d0ca8e0394447f1803383f0a34
          path: gitops
      - name: Execute signed Tool Belts and real gateway, archive only synthetic state
        run: bash experiments/supratoolbelt-r22-cross-runner/run-cell.sh source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m1-r22-external-synthetic-state
          path: external-state/
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m1-r22-source-receipt
          path: runtime-receipts/old-e2e-receipt.json
          retention-days: 2
  restore-new-ephemeral-runners:
    needs: source-ephemeral-runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ea198e844e6989fc1a9bea77ab6367725d34ac9a
          path: jwt-harness
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 32790dbe1a64a4d0ca8e0394447f1803383f0a34
          path: gitops
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m1-r22-external-synthetic-state
          path: external-state/
      - name: Verify different fresh VM and live gateway reconstruction from prior state
        run: bash experiments/supratoolbelt-r22-cross-runner/run-cell.sh restore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m1-r22-restored-${{ matrix.arch }}-receipt
          path: |
            runtime-receipts/old-e2e-receipt.json
            runtime-receipts/rehydration-receipt.json
          retention-days: 2
