name: macOS GPU Surrogate Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-gpu-interviews:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner:
          - macos-26
          - xcode-27
          - macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run Mac GPU transfer interviews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/mac-gpu-qualification"
          python3 scripts/macos_gpu_surrogate_qualification.py             --label "${{ matrix.runner }}"             --out "${RUNNER_TEMP}/mac-gpu-qualification/receipt.json"
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-gpu-qualification-${{ matrix.runner }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mac-gpu-qualification/receipt.json
          if-no-files-found: error
          retention-days: 7
