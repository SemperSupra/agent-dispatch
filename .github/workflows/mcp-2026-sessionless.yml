name: M1 real MCP 2026 sessionless per-belt protocol qualification
on:
  push:
    branches: [rdte/mcp-2026-sessionless-20261111]
    paths:
      - experiments/mcp-jwt-authz/modern_mcp.py
      - .github/workflows/mcp-2026-sessionless.yml
  pull_request:
    paths:
      - experiments/mcp-jwt-authz/modern_mcp.py
      - .github/workflows/mcp-2026-sessionless.yml
permissions:
  contents: read
jobs:
  sessionless-2026:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Start legacy synthetic upstreams with one ephemeral signed issuer
        run: |
          python3 experiments/mcp-jwt-authz/make_issuer.py
          chmod 600 private.pem token-*.txt
          python3 experiments/mcp-jwt-authz/fixture.py --serve --label alpha --port 39101 &
          python3 experiments/mcp-jwt-authz/fixture.py --serve --label beta --port 39102 &
          for port in 39101 39102; do
            for i in $(seq 1 25); do
              curl -fsS "http://127.0.0.1:$port/health" && break || sleep 1
            done
          done
      - name: Define strict JWT authorization and signed profile target conditions
        run: |
          cat > config.yaml <<'YAML'
          binds:
          - port: 39200
            listeners:
            - routes:
              - matches:
                - path:
                    exact: /mcp
                policies:
                  mcpAuthentication:
                    mode: strict
                    issuer: https://issuer.invalid/m1
                    audiences: [m1-synthetic-client]
                    jwks:
                      file: /keys/jwks.json
                    resourceMetadata:
                      resource: http://127.0.0.1:39200/mcp
                      scopesSupported: [read:all]
                      bearerMethodsSupported: [header]
                  mcpAuthorization:
                    rules:
                    - 'jwt.sub == "alpha" && mcp.tool.name == "echo"'
                backends:
                - mcp:
                    targets:
                    - name: alpha
                      condition: 'jwt.belt == "research"'
                      mcp:
                        host: http://127.0.0.1:39101/mcp
                    - name: beta
                      condition: 'jwt.belt == "engineering"'
                      mcp:
                        host: http://127.0.0.1:39102/mcp
          YAML
      - name: Start pinned actual gateway on disposable free runner
        run: |
          docker pull cr.agentgateway.dev/agentgateway@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
          docker run -d --name m1-modern --network host --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=bind,source=$PWD/config.yaml,target=/config.yaml,readonly" \
            --mount "type=bind,source=$PWD/jwks.json,target=/keys/jwks.json,readonly" \
            cr.agentgateway.dev/agentgateway@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b -f /config.yaml
          for i in $(seq 1 30); do
            code=$(curl --silent --max-time 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:39200/mcp || true)
            if [ "$code" = 401 ] || [ "$code" = 403 ] || [ "$code" = 405 ];then exit 0;fi
            if ! docker ps --filter name=m1-modern --format '{{.Names}}' | grep -qx m1-modern;then docker logs --tail 30 m1-modern;exit 1;fi
            sleep 1
          done
          exit 1
      - name: Verify stateless 2026 MCP requests without initialize or session headers
        run: python3 experiments/mcp-jwt-authz/modern_mcp.py
      - name: Destroy ephemeral test runtime and issuer
        if: always()
        run: |
          docker rm -f m1-modern >/dev/null 2>&1 || true
          rm -f private.pem token-*.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m1-modern-sessionless-2026
          path: |
            modern-receipt.json
            issuer-evidence.json
            config.yaml
