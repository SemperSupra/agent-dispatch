name: Public Mullvad-Linux synthetic RDTE

# Public synthetic-only tests: no secrets, private checkouts, provider mutations,
# arbitrary inputs, privileged network operations or operational traffic.
on:
  pull_request:
    paths:
      - 'experiments/mullvad-hyperv-public-rdte/**'
      - '.github/workflows/mullvad-hyperv-public-rdte.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-policy:
    name: Policy/epoch red-blue model
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Execute policy mutation/negative-control tests
        run: python3 -m unittest discover -s experiments/mullvad-hyperv-public-rdte/tests -p 'test_policy.py' -v

  provider-mock:
    name: Geography/device/telemetry mock
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Execute provider negative controls
        run: python3 -m unittest discover -s experiments/mullvad-hyperv-public-rdte/tests -p 'test_provider.py' -v

  linklocal-dns:
    name: DHCP/NDP/DNS role and egress red-blue model
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Execute gateway role-scope and DNS confinement negatives
        run: python3 -m unittest discover -s experiments/mullvad-hyperv-public-rdte/tests -p 'test_linklocal.py' -v

  linux-census:
    name: Read-only Linux feature census
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Verify NetVSC channel/readback parser negatives
        run: python3 -m unittest discover -s experiments/mullvad-hyperv-public-rdte/tests -p 'test_capabilities.py' -v
      - name: Read-only feature survey (not a nested Alpine guest proof)
        run: python3 experiments/mullvad-hyperv-public-rdte/tools/capabilities.py

  windows-hyperv-census:
    name: Windows 2025 Hyper-V read-only census
    runs-on: windows-2025
    timeout-minutes: 7
    steps:
      - name: Read-only Windows feature probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $cmd = Get-Command Get-VM -ErrorAction SilentlyContinue
          $feature = Get-WindowsOptionalFeature -Online -FeatureName 'Microsoft-Hyper-V-Hypervisor' -ErrorAction SilentlyContinue
          $vmHost = Get-VMHost -ErrorAction SilentlyContinue
          # Command *presence* only, no VM/switch enumeration or mutation.
          $candidateCommands = @(
            'New-VM', 'New-VMSwitch', 'Get-VMSwitch',
            'Set-VMNetworkAdapter', 'Set-VMNetworkAdapterVlan',
            'Add-VMNetworkAdapterExtendedAcl', 'Get-VMNetworkAdapterExtendedAcl',
            'Add-VMNetworkAdapterAcl', 'Set-VMNetworkAdapterIsolation',
            'Set-VMProcessor', 'Set-VMMemory', 'Set-VMFirmware',
            'Get-VMHostSupportedVersion'
          )
          $commandInventory = [ordered]@{}
          foreach ($candidate in $candidateCommands) {
            $commandInventory[$candidate] = [bool](Get-Command $candidate -ErrorAction SilentlyContinue)
          }
          $capacity = Get-CimInstance -ClassName Win32_ComputerSystem -ErrorAction SilentlyContinue
          [pscustomobject]@{
            EvidenceClass = 'PUBLIC_WINDOWS_READONLY'
            HyperVCmdletsPresent = [bool]$cmd
            HypervisorFeatureState = if ($feature) { [string]$feature.State } else { 'UNAVAILABLE' }
            HyperVHostQuerySucceeded = [bool]$vmHost
            AvailableCommands = $commandInventory
            LogicalProcessors = if ($capacity) { [int]$capacity.NumberOfLogicalProcessors } else { 0 }
            TotalRAMMiB = if ($capacity) { [int][math]::Floor($capacity.TotalPhysicalMemory / 1MB) } else { 0 }
            GuestBoot = 'NOT_RUN'
            VSwitchPacketPath = 'NOT_RUN'
            ProductSafety = 'NOT_RUN'
          } | ConvertTo-Json -Depth 5 -Compress | Write-Output
