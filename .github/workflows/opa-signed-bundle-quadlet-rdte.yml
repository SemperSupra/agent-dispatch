name: OPA 1.22.3 signed-bundle Quadlet public safety RDTE
run-name: opa-signed-${{ github.sha }}
on:
  push:
    branches: [rdte/opa-signed-bundle-quadlet-20261111]
    paths:
      - '.github/workflows/opa-signed-bundle-quadlet-rdte.yml'
      - 'experiments/opa-signed-bundle/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-bundle-quadlet:
    name: "native-${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Confirm synthetic public-source branch and native runner
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository }}" = "SemperSupra/agent-dispatch"
          test "${{ github.ref }}" = "refs/heads/rdte/opa-signed-bundle-quadlet-20261111"
          case "${{ matrix.arch }}:$(uname -m)" in amd64:x86_64|arm64:aarch64) ;; *) exit 1 ;; esac
      - name: Native systemd Podman OPA 1.22.3 signed-bundle security lifecycle
        shell: bash
        run: |
          set -euo pipefail
          bash experiments/opa-signed-bundle/run.sh
      - name: Retain sanitized proof and first failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opa-signed-quadlet-${{ matrix.arch }}-${{ github.run_id }}
          path: opa-signed-bundle-evidence/
          if-no-files-found: warn
          retention-days: 7
