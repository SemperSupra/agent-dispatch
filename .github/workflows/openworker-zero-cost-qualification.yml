name: OpenWorker Zero-Cost Qualification

on:
  pull_request:
    paths:
      - 'experiments/openworker-qualification/**'
      - '.github/workflows/openworker-zero-cost-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openworker-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    # Standard GitHub-hosted runners are free for public repositories. Do not change
    # this experiment to a larger/paid runner without a new qualification decision.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENWORKER_UPSTREAM_SHA: 5bc10d928e0b64aae74313349a3b17bd19643ae2
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Clone immutable OpenWorker source
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/openworker"
          git clone --quiet --no-checkout https://github.com/andrewyng/openworker.git "$upstream"
          git -C "$upstream" checkout --quiet --detach "$OPENWORKER_UPSTREAM_SHA"
          test "$(git -C "$upstream" rev-parse HEAD)" = "$OPENWORKER_UPSTREAM_SHA"

      - name: Install OpenWorker in isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/openworker-venv"
          source "$RUNNER_TEMP/openworker-venv/bin/activate"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e "$RUNNER_TEMP/openworker[dev]"

      - name: Run independent consumer qualification
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/openworker-venv/bin/activate"
          python experiments/openworker-qualification/qualify.py

      - name: Run upstream regression witnesses
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/openworker-venv/bin/activate"
          cd "$RUNNER_TEMP/openworker"
          python -m pytest -q \
            tests/test_durable_resume.py \
            tests/test_automation.py \
            tests/test_approval_integrity.py

  local-model-canary:
    # Ablation: keep the bounded shell/workcell envelope but move deterministic parsing,
    # arithmetic, and formatting into the single allowlisted shell actuator. The actor
    # only copies the actuator's exact stdout into RESULT.txt via the governed file tool.
    name: projected-shell-deterministic-transform-canary
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENWORKER_UPSTREAM_SHA: 5bc10d928e0b64aae74313349a3b17bd19643ae2
      OPENWORKER_LOCAL_MODEL: ollama:qwen3:1.7b
      OLLAMA_VERSION: 0.34.1
      OLLAMA_ARCHIVE_SHA256: f361dc3992ec07e4ad429f4bb2d10d4663ba2c295f9a9a688c7d52f4ba650034
      OLLAMA_MODEL_TAG: qwen3:1.7b
      OLLAMA_MODEL_DIGEST_PREFIX: 8f68893c685c
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: /tmp/openworker-ollama-models
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Clone immutable OpenWorker source
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/openworker"
          git clone --quiet --no-checkout https://github.com/andrewyng/openworker.git "$upstream"
          git -C "$upstream" checkout --quiet --detach "$OPENWORKER_UPSTREAM_SHA"
          test "$(git -C "$upstream" rev-parse HEAD)" = "$OPENWORKER_UPSTREAM_SHA"

      - name: Install OpenWorker
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/openworker-venv"
          source "$RUNNER_TEMP/openworker-venv/bin/activate"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e "$RUNNER_TEMP/openworker"

      - name: Install pinned Ollama ephemerally
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          runtime="$RUNNER_TEMP/ollama-runtime"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" \
            --output "$archive"
          echo "$OLLAMA_ARCHIVE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$runtime"
          zstd -d --stdout "$archive" | tar -xf - -C "$runtime"
          test -x "$runtime/bin/ollama"
          echo "$runtime/bin" >> "$GITHUB_PATH"
          installed="$("$runtime/bin/ollama" --version 2>&1)"
          echo "$installed"
          grep -F "$OLLAMA_VERSION" <<<"$installed"

      - name: Start isolated Ollama and hydrate pinned model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OLLAMA_MODELS"
          nohup env \
            OLLAMA_HOST="$OLLAMA_HOST" \
            OLLAMA_MODELS="$OLLAMA_MODELS" \
            OLLAMA_NUM_PARALLEL="$OLLAMA_NUM_PARALLEL" \
            OLLAMA_MAX_LOADED_MODELS="$OLLAMA_MAX_LOADED_MODELS" \
            ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://${OLLAMA_HOST}/api/tags" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://${OLLAMA_HOST}/api/tags" >/dev/null
          ollama pull "$OLLAMA_MODEL_TAG"
          python3 - <<'PY'
          import json, os, urllib.request
          with urllib.request.urlopen(f"http://{os.environ['OLLAMA_HOST']}/api/tags", timeout=10) as r:
              data = json.load(r)
          wanted = os.environ['OLLAMA_MODEL_TAG']
          row = next((m for m in data.get('models', []) if m.get('name') == wanted), None)
          if row is None:
              raise SystemExit(f"pulled model not present in /api/tags: {wanted}")
          digest = str(row.get('digest') or '').removeprefix('sha256:')
          expected = os.environ['OLLAMA_MODEL_DIGEST_PREFIX']
          if not digest.startswith(expected):
              raise SystemExit(f"model digest drift: expected prefix {expected}, got {digest}")
          print(json.dumps({'model': wanted, 'digest': row.get('digest'), 'size': row.get('size')}, sort_keys=True))
          PY

      - name: Run deterministic-transform shell/workcell canary
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/openworker-venv/bin/activate"
          python experiments/openworker-qualification/projected_shell_deterministic_transform_canary.py

      - name: Show bounded Ollama diagnostics on failure
        if: failure()
        shell: bash
        run: |
          tail -n 200 "$RUNNER_TEMP/ollama.log" || true
