name: USB Fabric R18 same-run test-only Go broker gate on real 3-kernel USBIP handoff
on:
  push:
    branches: [test/issue-459-broker-real-usbip-gate]
    paths:
      - '.github/workflows/pi-usb-fabric-r18-host-broker-gate.yml'
      - 'experiments/pi-usb-fabric-r18/broker-gate/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pi-usb-fabric-r18-host-broker-gate.yml'
      - 'experiments/pi-usb-fabric-r18/broker-gate/**'
permissions:
  contents: read
jobs:
  three-kernel-existing-go-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact qualified existing Go Manager and journal source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SemperSupra/agent-dispatch
          ref: 2e580a0162452a6f59a449f769f9bfc5153e0aa3
          path: .r18-existing-go
          persist-credentials: false
      - name: Run existing Go lease journal gate against three QEMU Linux USBIP clients
        shell: bash
        run: bash experiments/pi-usb-fabric-r18/broker-gate/verify.sh
      - name: Preserve first-hand guest serial, Go broker and kernel evdev evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pi-r18-broker-real-usbip-serial
          path: ${{ runner.temp }}/r18-broker-gate.log
          retention-days: 7
          if-no-files-found: warn
