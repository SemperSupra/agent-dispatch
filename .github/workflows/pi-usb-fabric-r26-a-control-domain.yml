name: USB Fabric R26-A real QMP PCI provenance versus kernel USBIP VHCI
on:
  push:
    branches: [test/issue-517-r26-qmp-vhci-control-domain]
    paths:
      - '.github/workflows/pi-usb-fabric-r26-a-control-domain.yml'
      - 'experiments/pi-usb-fabric-r26/qmp-vhci-domain/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pi-usb-fabric-r26-a-control-domain.yml'
      - 'experiments/pi-usb-fabric-r26/qmp-vhci-domain/**'
permissions:
  contents: read
jobs:
  real-qmp-pci-plus-linux-vhci:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin original real R26 Manager and HELD source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SemperSupra/agent-dispatch
          ref: 2e580a0162452a6f59a449f769f9bfc5153e0aa3
          path: .r25-existing-go
          persist-credentials: false
      - name: Pin original test guest signed Ed25519 observer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SemperSupra/agent-dispatch
          ref: dc96c80b78540bc5b05ad70179c7afff647c3cbc
          path: .r25-guest-signer
          persist-credentials: false
      - name: Qualify QEMU VM PCI provenance + Linux kernel VHCI USBIP same-run, without false release authority
        shell: bash
        run: |
          set -Eeuo pipefail
          bash experiments/pi-usb-fabric-r26/qmp-vhci-domain/verify.sh
      - name: Preserve complete three kernel actual USBIP/QMP witness logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r26-a-qmp-pci-linux-usbip-domain
          path: ${{ runner.temp }}/r26-a-qmp-vhci-real-guest.log
          retention-days: 7
          if-no-files-found: warn
