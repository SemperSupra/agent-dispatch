name: USB Fabric R27-A actual kernel UDC admission fence versus raw B import
on:
  push:
    branches: [test/issue-527-r27-kernel-udc-raw-b-fence]
    paths:
      - '.github/workflows/pi-usb-fabric-r27-a-raw-import-fence.yml'
      - 'experiments/pi-usb-fabric-r27/udc-admission/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pi-usb-fabric-r27-a-raw-import-fence.yml'
      - 'experiments/pi-usb-fabric-r27/udc-admission/**'
permissions:
  contents: read
jobs:
  real-kernel-udc-fencing-and-unauthorized-b-raw-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin original real R26 Manager and HELD source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SemperSupra/agent-dispatch
          ref: 2e580a0162452a6f59a449f769f9bfc5153e0aa3
          path: .r25-existing-go
          persist-credentials: false
      - name: Pin original test guest signed Ed25519 observer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SemperSupra/agent-dispatch
          ref: dc96c80b78540bc5b05ad70179c7afff647c3cbc
          path: .r25-guest-signer
          persist-credentials: false
      - name: Require real ConfigFS UDC pre-unbind, unauthorized B import refusal, grant-gated rebind and evdev
        shell: bash
        run: |
          set -Eeuo pipefail
          bash experiments/pi-usb-fabric-r27/udc-admission/verify.sh
      - name: Preserve complete three kernel actual USBIP/QMP witness logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r27-a-real-udc-fence-usbip-raw-b
          path: ${{ runner.temp }}/r27-a-real-kernel-udc-raw-b-fence.log
          retention-days: 7
          if-no-files-found: warn
