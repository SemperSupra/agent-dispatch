name: USB Fabric R27-C original Go heldledger typed kernel isolation and guest release
on:
  push:
    branches: [test/issue-531-r27-kernel-isolation-ledger]
    paths:
      - '.github/workflows/pi-usb-fabric-r27-c-kernel-release-ledger.yml'
      - 'experiments/usb-fabric-r26/integrated/heldledger/**'
      - 'experiments/usb-fabric-r26/integrated/blue/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pi-usb-fabric-r27-c-kernel-release-ledger.yml'
      - 'experiments/usb-fabric-r26/integrated/heldledger/**'
      - 'experiments/usb-fabric-r26/integrated/blue/**'
permissions:
  contents: read
jobs:
  original-manager-kernel-stage-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require original Go manager exact receipt domain separation and crash-consistent kernel stage
        working-directory: experiments/usb-fabric-r26/integrated
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
        run: |
          set -Eeuo pipefail
          go test -race -count=1 -timeout 100s -v ./... | tee "$RUNNER_TEMP/r27-c-real-ledger-policy.log"
          go vet ./...
          for marker in \
            R27_C_NO_UNVERIFIED_KERNEL_ISOLATION_HELD_MUTATION=PASS \
            R27_C_QMP_ACK_CANNOT_AUTHORIZE_LINUX_VHCI_RELEASE=PASS \
            R27_C_LINUX_KERNEL_PHASE_CANNOT_AUTHORIZE_QMP_NATIVE=PASS \
            R27_C_CROSS_EVENT_SEQUENCE_SPLICE_REFUSED=PASS \
            R27_C_REAL_SCOPE_KERNEL_AND_SIGNED_EVENT_CONTRACT_FSYNC_REPLAY_FENCE=PASS \
            R27_C_ORIGINAL_MANAGER_KERNEL_WRONG_GUEST_HELD_AND_B_FENCED=PASS \
            R27_C_EXISTING_MANAGER_KERNEL_GUEST_ONE_TIME_FSYNCED_RELEASE=PASS; do
            grep -Fq "$marker" "$RUNNER_TEMP/r27-c-real-ledger-policy.log"
          done
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=all)"
          echo R27_C_REUSED_ORIGINAL_MANAGER_GO_RACE_VET_NO_TAINT=PASS
      - name: Preserve full original Manager typed kernel stage negative-positive logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r27-c-original-heldledger-kernel-isolation
          path: ${{ runner.temp }}/r27-c-real-ledger-policy.log
          retention-days: 7
          if-no-files-found: warn
