name: USB Fabric R27-D current guest key-down cross-event splice RED BLUE
on:
  push:
    branches: [test/issue-549-r27d-down-event-splice]
    paths:
      - '.github/workflows/pi-usb-fabric-r27-d-down-splice.yml'
      - 'experiments/usb-fabric-r26/integrated/heldledger/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pi-usb-fabric-r27-d-down-splice.yml'
      - 'experiments/usb-fabric-r26/integrated/heldledger/**'
permissions:
  contents: read
jobs:
  wrong-down-guest-release-critic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact original Go heldledger, cross-DOWN splice and baseline manager
        working-directory: experiments/usb-fabric-r26/integrated
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOSUMDB: "off"
        run: |
          set -Eeuo pipefail
          go test -race -count=1 -timeout 100s -v ./... | tee "$RUNNER_TEMP/r27-d-down-splice.log"
          go vet ./...
          grep -Fq "R27_D_CURRENT_DOWN_REQUIRED_FOR_SIGNED_UP=PASS" "$RUNNER_TEMP/r27-d-down-splice.log"
          grep -Fq "R27_D_MATCHED_SIGNED_DOWN_UP_FSYNC_AND_RELEASE=PASS" "$RUNNER_TEMP/r27-d-down-splice.log"
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=all)"
          echo R27_D_ORIGINAL_GO_LEDGER_CROSS_DOWN_RACE_VET_NO_TAINT=PASS
      - name: Preserve RED/BLUE held journal event-sequence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r27-d-cross-down-event-splice
          path: ${{ runner.temp }}/r27-d-down-splice.log
          retention-days: 7
          if-no-files-found: warn
