name: Pi USB Fabric R27-P dual recovered manager admission adversarial RED
on:
  push:
    branches: [test/issue-615-r27p-dual-recovered-manager-red]
  pull_request:
    branches: [test/issue-612-r27o-recovered-manager-startup]
    paths:
      - 'experiments/usb-fabric-r26/integrated/blue/r27p_dual_manager_red_test.go'
      - '.github/workflows/pi-usb-fabric-r27-p-dual-manager-red.yml'
permissions:
  contents: read
jobs:
  dual-recovered-manager-critics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preserve the expected independent-manager RED and positive recovered-constructor tests
        working-directory: experiments/usb-fabric-r26/integrated
        shell: bash
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: "local"
        run: |
          set -euo pipefail
          set +e
          go test -race -count=1 -timeout 90s -run '^TestR27PDualManagerSameRecoveredCleanJournalMustFenceSecond$' -v ./blue >"$RUNNER_TEMP/r27-p-dual-manager-red.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/r27-p-dual-manager-red.log"
          if [ "$rc" -ne 0 ] && grep -Fq 'R27_P_DUAL_RECOVERED_MANAGER_SAME_PORT_ADMISSION=RED:' "$RUNNER_TEMP/r27-p-dual-manager-red.log"; then
            echo R27_P_DUAL_MANAGER_RED_CONFIRMED=PASS
          elif [ "$rc" -eq 0 ] && grep -Fq 'R27_P_SECOND_RECOVERED_OWNER_DENIED=PASS' "$RUNNER_TEMP/r27-p-dual-manager-red.log"; then
            echo R27_P_DOUBLE_ADMISSION_FENCED=PASS
          else
            echo R27_P_INCONCLUSIVE_BUILD_OR_TEST=RED
            exit 22
          fi
          go test -race -count=1 -timeout 90s -run '^TestR27ORecoveredStartup' -v ./blue | tee "$RUNNER_TEMP/r27-p-parent-positive.log"
          go vet ./blue
          echo R27_P_ACTUAL_TWO_PID_HOST_OWNER_FENCE=NOT_TESTED
          echo R27_P_R26_L10_OWNER_PRIMITIVE_COMPOSED=NOT_TESTED
      - name: Preserve expected RED negative and positive qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r27-p-dual-recovered-manager-negative
          path: ${{ runner.temp }}/r27-p-*.log
          retention-days: 7
          if-no-files-found: warn
