name: Pi USB Fabric R27-Q recovered host-local Linux owner and durable HELD composition
on:
  push:
    branches: [test/issue-616-r27q-linux-owner-recovery]
  pull_request:
    branches: [test/issue-612-r27o-recovered-manager-startup]
    paths:
      - 'experiments/usb-fabric-r26/integrated/blue/owner_recovery_linux.go'
      - 'experiments/usb-fabric-r26/integrated/blue/r27q_owner_recovery_linux_test.go'
      - '.github/workflows/pi-usb-fabric-r27-q-linux-owner-recovery.yml'
permissions:
  contents: read
jobs:
  existing-original-go-with-linux-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Qualify both same process and REAL two Linux PID host owner on exact original R27-O Go source
        working-directory: experiments/usb-fabric-r26/integrated
        shell: bash
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: "local"
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout 100s -v ./... | tee "$RUNNER_TEMP/r27-q-host-local-owner-full-suite.log"
          go vet ./...
          for marker in             R27_Q_SAME_PORT_SECOND_OWNER_DENIED=PASS             R27_Q_ACTIVE_LEASE_OWNER_CANNOT_CLOSE=PASS             R27_Q_CLEAN_OS_OWNER_RELEASE_AND_NEW_EPOCH=PASS             R27_Q_TRUE_TWO_PID_SAME_USBIP_PORT_FENCED=PASS             R27_Q_MISSING_HELD_SYMLINK_DURABLE_JOURNAL_DENIED=PASS             R27_Q_UNPROTECTED_HOST_JOURNAL_DIRECTORY_DENIED=PASS             R27_O_RESTART_DURABLE_HELD_DENIES_B=PASS             R27_D_CURRENT_DOWN_REQUIRED_FOR_SIGNED_UP=PASS; do
            grep -Fq "$marker" "$RUNNER_TEMP/r27-q-host-local-owner-full-suite.log"
          done
          echo R27_Q_PRODUCTION_CANONICAL_USBIP_KERNEL_IDENTITY=NOT_TESTED
          echo R27_Q_LIVE_QEMU_BROKER_MIGRATION=NOT_TESTED
          echo R27_Q_CROSS_NAMESPACE_AND_PRIVILEGED_ACTOR_FENCE=NOT_TESTED
      - name: Preserve free public original Go Linux owner RED-BLUE evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r27-q-original-go-2pid-abstract-flock
          path: ${{ runner.temp }}/r27-q-host-local-owner-full-suite.log
          retention-days: 7
          if-no-files-found: warn
