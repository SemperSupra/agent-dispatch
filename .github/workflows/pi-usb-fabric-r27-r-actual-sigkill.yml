name: Pi USB Fabric R27-R original Go owner SIGKILL mid-attach recovery negative
on:
  push:
    branches: [test/issue-618-r27r-sigkill-midlease-red]
  pull_request:
    branches: [test/issue-616-r27q-linux-owner-recovery]
permissions:
  contents: read
jobs:
  actual-two-pid-sigkill-original-go-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require actual SIGKILL attached-owner recovery security negative or proof of denial
        shell: bash
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: "local"
        working-directory: experiments/usb-fabric-r26/integrated
        run: |
          set -Eeuo pipefail
          set +e
          go test -race -count=1 -timeout 90s -v ./blue -run '^TestR27RActualSIGKILLAfterAttachMustNotAdmitFreshB$' >"$RUNNER_TEMP/r27-r-sigkill-negative.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/r27-r-sigkill-negative.log"
          if [ "$rc" -ne 0 ] && grep -Fq 'R27_R_SIGKILL_WITH_ATTACHED_LEASE_ADMITTED_B=RED:' "$RUNNER_TEMP/r27-r-sigkill-negative.log"; then
            echo R27_R_ACTUAL_OS_SIGKILL_UNJOURNALED_ATTACHED_LEASE_BYPASS=RED_CONFIRMED
          elif [ "$rc" -eq 0 ] && grep -Fq 'R27_R_SIGKILL_ATTACHED_RESTART_QUARANTINED=PASS' "$RUNNER_TEMP/r27-r-sigkill-negative.log"; then
            echo R27_R_ACTUAL_OS_SIGKILL_ATTACHED_RECOVERY_FENCED=PASS
          else
            echo R27_R_ADVERSARIAL_NEGATIVE_INCONCLUSIVE=RED
            exit 21
          fi
          go test -race -count=1 -timeout 90s -run '^TestR27Q' -v ./blue >"$RUNNER_TEMP/r27-r-parent-owner-positive.log" 2>&1
          cat "$RUNNER_TEMP/r27-r-parent-owner-positive.log"
          grep -Fq 'R27_Q_TRUE_TWO_PID_SAME_USBIP_PORT_FENCED=PASS' "$RUNNER_TEMP/r27-r-parent-owner-positive.log"
          go vet ./blue
          echo R27_R_REAL_QEMU_USBIP_VHCI_PHYSICAL_ATTACH=NOT_TESTED
      - name: Preserve true Linux SIGKILL negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r27-r-actual-sigkill-original-go-mid-attach
          path: ${{ runner.temp }}/r27-r-*.log
          retention-days: 7
          if-no-files-found: warn
