name: Pi USB Fabric R27-S original durable admission intent SIGKILL recovery
on:
  push:
    branches: [test/issue-620-r27s-durable-admission-intent]
  pull_request:
    branches: [test/issue-616-r27q-linux-owner-recovery]
permissions:
  contents: read
jobs:
  original-go-two-pid-sigkill-admission-fsync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require Linux SIGKILL restart denial, atomic admission/key-down ledger, and original Go full regression
        shell: bash
        working-directory: experiments/usb-fabric-r26/integrated
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: "local"
        run: |
          set -Eeuo pipefail
          go test -race -count=1 -timeout 110s -v ./... | tee "$RUNNER_TEMP/r27-s-durable-admission-original-go.log"
          go vet ./...
          for marker in             R27_S_SIGKILL_ATTACHED_RESTART_QUARANTINED=PASS             R27_S_WRITE_AHEAD_ADMISSION_INTENT_FSYNC_RESTART=PASS             R27_S_DUPLICATE_ADMISSION_BYTE_IDENTICAL=PASS             R27_S_KEY_DOWN_ATOMIC_REPLACES_ADMISSION_WITH_HELD=PASS             R27_Q_TRUE_TWO_PID_SAME_USBIP_PORT_FENCED=PASS             R27_O_RESTART_DURABLE_HELD_DENIES_B=PASS             R27_D_CURRENT_DOWN_REQUIRED_FOR_SIGNED_UP=PASS; do
            grep -Fq "$marker" "$RUNNER_TEMP/r27-s-durable-admission-original-go.log"
          done
          echo R27_S_LEGACY_GO_MANAGER_CALLER_MIGRATION=NOT_TESTED
          echo R27_S_ACTUAL_LINUX_VHCI_QEMU_USBIP_KILL_RECOVERY=NOT_TESTED
          echo R27_S_PROTECTED_CANONICAL_DEVICE_IDENTITY=NOT_TESTED
      - name: Preserve security regression and Linux SIGKILL receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r27-s-original-ledger-admission-sigkill
          path: ${{ runner.temp }}/r27-s-durable-admission-original-go.log
          retention-days: 7
          if-no-files-found: warn
