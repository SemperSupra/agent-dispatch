name: Pi USB Fabric R27-U original Go bounded crash-cut recovery trace qualification
on:
  push:
    branches: [test/issue-624-r27u-bounded-crashcut-traces]
  pull_request:
    branches: [test/issue-620-r27s-durable-admission-intent]
permissions:
  contents: read
jobs:
  original-ledger-crashcut-bounded:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run actual original Go heldledger and Manager bounded crash-cut traces
        shell: bash
        working-directory: experiments/usb-fabric-r26/integrated
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: "local"
        run: |
          set -Eeuo pipefail
          go test -race -count=1 -timeout 110s -v ./... | tee "$RUNNER_TEMP/r27-u-original-go-crashcuts.log"
          go vet ./...
          for marker in             R27_U_CRASH_AFTER_ADMISSION_FSYNC_DENIED=PASS             R27_U_ADMISSION_REPLAY_BYTE_IDENTICAL=PASS             R27_U_CRASH_AFTER_KEYDOWN_DENIED=PASS             R27_U_CRASH_AFTER_RELEASE_INTENT_DENIED=PASS             R27_U_CRASH_AFTER_KERNEL_ISOLATION_WITHOUT_GUEST_UP_DENIED=PASS             R27_U_UNAUTHENTICATED_GUEST_UP_DENIED_BYTE_IDENTICAL=PASS             R27_U_MALFORMED_ADMISSION_PHASE_FAIL_CLOSED=PASS             R27_S_SIGKILL_ATTACHED_RESTART_QUARANTINED=PASS             R27_Q_TRUE_TWO_PID_SAME_USBIP_PORT_FENCED=PASS             R27_D_CURRENT_DOWN_REQUIRED_FOR_SIGNED_UP=PASS; do
            grep -Fq "$marker" "$RUNNER_TEMP/r27-u-original-go-crashcuts.log"
          done
          echo R27_U_TLA_PLUS_FORMAL_MODEL_CHECKING=NOT_TESTED
          echo R27_U_REAL_QEMU_KERNEL_CRASH_CUTS=NOT_TESTED
      - name: Preserve source-specific trace and adversarial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r27-u-original-go-bounded-crashcuts
          path: ${{ runner.temp }}/r27-u-original-go-crashcuts.log
          retention-days: 7
          if-no-files-found: warn
