name: FolioRelay minimal observer runtime

on:
  pull_request:
    branches:
      - experiment/gha-kvm-system-rdte
    paths:
      - ".github/workflows/prep-foliorelay-minimal-observer.yml"
      - "scripts/truenas_middleware_foliorelay_t6_probe.py"

permissions:
  contents: read

jobs:
  exact-minimal-observer:
    runs-on: ubuntu-26.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prove exact minimal observer runtime
        shell: bash
        run: |
          set -euo pipefail
          image='docker.io/library/python@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a'
          work="$RUNNER_TEMP/foliorelay-observer-minimal-exact"
          rm -rf "$work"
          mkdir -p "$work"
          python3 - "$work/mdns_observer.py" <<'PY'
          import importlib.util, pathlib, sys
          scripts=pathlib.Path("scripts").resolve()
          sys.path.insert(0,str(scripts))
          script=scripts/"truenas_middleware_foliorelay_t6_probe.py"
          spec=importlib.util.spec_from_file_location("foliorelay_probe",script)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          pathlib.Path(sys.argv[1]).write_text(mod.OBSERVER,encoding="utf-8")
          PY
          docker pull "$image" >/dev/null
          test "$(docker image inspect "$image" --format '{{.Id}}')" != ""
          echo "candidate_repo_digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          echo "candidate_size_bytes=$(docker image inspect "$image" --format '{{.Size}}')"
          docker run --rm --entrypoint sh "$image" -lc 'python3 --version; cat /etc/os-release; du -sh / 2>/dev/null || true'
          port="$(python3 - <<'PY'
          import socket
          s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()
          PY
          )"
          docker rm -f foliorelay-observer-minimal-exact >/dev/null 2>&1 || true
          trap 'docker rm -f foliorelay-observer-minimal-exact >/dev/null 2>&1 || true' EXIT
          docker run -d --name foliorelay-observer-minimal-exact             --network host             --read-only             --cap-drop ALL             --security-opt no-new-privileges:true             --mount "type=bind,src=$work,dst=/observer,readonly"             --entrypoint python3             "$image" /observer/mdns_observer.py             --uuid urn:uuid:01234567-89ab-4def-8123-456789abcdef             --expected-host intentionally-absent.local             --expected-ipp-port 8634             --port "$port"             --seconds 1 >/dev/null
          python3 - "$port" <<'PY'
          import json, sys, time, urllib.request
          url=f"http://127.0.0.1:{sys.argv[1]}/"
          deadline=time.monotonic()+15
          last=None
          while time.monotonic()<deadline:
              try:
                  with urllib.request.urlopen(url,timeout=2) as r:
                      last=json.load(r)
                  if last.get("status")=="error":
                      break
              except Exception:
                  pass
              time.sleep(.5)
          if not isinstance(last,dict) or last.get("status")!="error":
              raise SystemExit(f"observer did not expose bounded error result: {last!r}")
          if "no qualifying _universal FolioRelay mDNS response" not in last.get("error",""):
              raise SystemExit(f"unexpected observer error: {last!r}")
          PY
          test "$(docker inspect -f '{{.State.Running}}' foliorelay-observer-minimal-exact)" = true
