name: FolioRelay T6 consumer prep

on:
  pull_request:
    branches:
      - experiment/gha-kvm-system-rdte
    paths:
      - ".github/workflows/prep-foliorelay-t6-consumer.yml"
      - ".github/workflows/gha-kvm-system-rdte.yml"
      - "scripts/gha_kvm_truenas_rdte.sh"
      - "scripts/truenas_middleware_foliorelay_t6_probe.py"
      - "tests/test_truenas_t6_foliorelay_control.py"
  push:
    branches:
      - "prep/truenas-t6-foliorelay-v1"
    paths:
      - ".github/workflows/prep-foliorelay-t6-consumer.yml"
      - ".github/workflows/gha-kvm-system-rdte.yml"
      - "scripts/gha_kvm_truenas_rdte.sh"
      - "scripts/truenas_middleware_foliorelay_t6_probe.py"
      - "tests/test_truenas_t6_foliorelay_control.py"

permissions:
  contents: read

jobs:
  foundry-control:
    uses: SemperSupra/truenas-app-foundry/.github/workflows/export-foliorelay-t6-control.yml@fb41afd3d112f361b8c490aeb5915a978b956b20
    with:
      foundry_ref: fb41afd3d112f361b8c490aeb5915a978b956b20
    permissions:
      contents: read

  consumer-contract:
    needs: foundry-control
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download exact Foundry FolioRelay control
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: foliorelay-t6-beta3-control
          path: ${{ runner.temp }}/foliorelay-control
      - name: Verify producer-consumer binding
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/foliorelay-control"
          test -s "$root/control.json"
          test -s "$root/compose.json"
          jq -e '
            .schema == "semper-supra.foliorelay-truenas-t6-control/1" and
            .foundry_ref == "fb41afd3d112f361b8c490aeb5915a978b956b20" and
            .candidate.truenas_version == "26.0.0-BETA.3" and
            .candidate.control_image == "ghcr.io/sempersupra/foliorelay-control@sha256:0ffabcc1ced0325c41c54d860c6fe248e4fc8afeea3994dcebb999d6a14ee1ce" and
            .candidate.cups_image == "ghcr.io/sempersupra/foliorelay-cups@sha256:b644b4b1e064a1d10c18fbbb9f9aa09a2835e7e9a48ccda5a67d44cbda006b4f" and
            .secrets_captured == false
          ' "$root/control.json" >/dev/null
          jq -e '
            (.services | keys | sort) == ["control","cups","discovery"] and
            .services.discovery.network_mode == "host"
          ' "$root/compose.json" >/dev/null
          python3 -m unittest -v tests/test_truenas_t6_foliorelay_control.py
          bash -n scripts/gha_kvm_truenas_rdte.sh
          python3 -m py_compile scripts/truenas_middleware_foliorelay_t6_probe.py
