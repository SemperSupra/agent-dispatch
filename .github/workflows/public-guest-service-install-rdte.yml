              if ($vhdMounted) { Dismount-VHD -Path $vhd -ErrorAction Stop | Out-Null }
              if (Test-Path -LiteralPath $work) {
                Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction Stop
              }
              $receipt.cleanup_complete=(-not (Test-Path -LiteralPath $work) -and
                -not (Get-VM -Name $vmName -ErrorAction SilentlyContinue))
            } catch {
              $receipt.cleanup_error=$_.Exception.Message
              $receipt.cleanup_complete=$false
            }
            $receipt | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath firstlogon-receipt.json -Encoding utf8
            $receipt | ConvertTo-Json -Depth 5
          }
          if (-not $receipt.windows_heartbeat_observed -or -not $receipt.first_logon_marker_observed -or
              -not $receipt.powershell_direct_observed -or -not $receipt.cleanup_complete) {
            throw "GUEST_BOOT_NOT_QUALIFIED: $($receipt.first_failure); cleanup=$($receipt.cleanup_error)"
          }
      - name: Preserve bounded guest boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winbot-firstlogon-psdirect
          path: firstlogon-receipt.json
          if-no-files-found: error
          retention-days: 2
  linux-independent-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.25.13'
          cache: false
      - name: Run independent proof race/vet and Windows Go cross-build
        working-directory: experiments/public-guest-service-rdte
        shell: bash
        run: |
          go mod verify
          go test -race -count=1 ./internal/proof
          go vet ./internal/proof ./cmd/verify
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-buildid=" -o /tmp/public-rdte-service.exe ./cmd/service
          sha256sum /tmp/public-rdte-service.exe

  windows-ps51-contract:
    runs-on: windows-2025
