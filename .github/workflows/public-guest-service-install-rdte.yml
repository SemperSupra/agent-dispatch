          go vet ./...
          go build -trimpath -buildvcs=false '-ldflags=-buildid=' -o "$env:RUNNER_TEMP/public-rdte-service.exe" ./cmd/service
          if ($LASTEXITCODE -ne 0) { throw 'Native service build failed' }
          $tokens=$null; $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) 'scripts/Invoke-GuestServiceProof.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count -ne 0) { throw 'PowerShell guest proof parser rejected source' }
          Write-Host 'PASS: Native Go Windows service build and guest proof parser'

  independent-evidence-gate:
