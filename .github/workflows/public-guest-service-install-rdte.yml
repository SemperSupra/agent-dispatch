            $receipt.oobe_unattend_staged=$true
            Dismount-DiskImage -ImagePath $iso -ErrorAction Stop | Out-Null
            $isoMounted=$false
            Dismount-VHD -Path $vhd -ErrorAction Stop | Out-Null
            $vhdMounted=$false
            if (-not (Test-VHD -Path $vhd -ErrorAction Stop)) { throw 'TEST_VHD_REJECTED' }
            New-VM -Name $vmName -Generation 2 -MemoryStartupBytes 4GB -NoVHD -Path $work -ErrorAction Stop | Out-Null
            $vmCreated=$true
            Add-VMHardDiskDrive -VMName $vmName -Path $vhd -ErrorAction Stop
            $drive=Get-VMHardDiskDrive -VMName $vmName -ErrorAction Stop | Where-Object Path -eq $vhd
            if (@($drive).Count -ne 1) { throw 'GUEST_DISK_NOT_EXACTLY_OWNED' }
            Set-VMFirmware -VMName $vmName -EnableSecureBoot On -SecureBootTemplate MicrosoftWindows -FirstBootDevice $drive -ErrorAction Stop
            Set-VMKeyProtector -VMName $vmName -NewLocalKeyProtector -ErrorAction Stop
            Enable-VMTPM -VMName $vmName -ErrorAction Stop
            $receipt.owned_vm_registered=$true
            $receipt.guest_network_attached=@(Get-VMNetworkAdapter -VMName $vmName -ErrorAction Stop | Where-Object SwitchName).Count -gt 0
            if ($receipt.guest_network_attached) { throw 'ISOLATION_VIOLATION_NETWORK_ATTACHED' }
            Start-VM -Name $vmName -ErrorAction Stop
            $receipt.guest_vm_started=$true
            for ($i=0; $i -lt 90; $i++) {
              $hb=Get-VMIntegrationService -VMName $vmName -Name 'Heartbeat' -ErrorAction SilentlyContinue
              if ($hb -and $hb.PrimaryStatusDescription -eq 'OK') {
                $receipt.windows_heartbeat_observed=$true
                break
              }
              Start-Sleep -Seconds 10
