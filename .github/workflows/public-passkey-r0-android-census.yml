name: Passkey Lab R0 - free runner Android emulator KVM census
on:
  push:
    branches: [experiment/passkey-r0-android-emulator-census]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passkey-r0-android-census
  cancel-in-progress: false
jobs:
  capability-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Observe Android SDK, emulator system images and KVM access without mutation
        shell: bash
        run: bash experiments/passkey-lab/issue-417/census.sh
