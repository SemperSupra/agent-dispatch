name: Passkey Lab R1 - CTAPHID transport model and fuzz negatives
on:
  push:
    branches: [experiment/passkey-r1-ctaphid-model]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passkey-r1-ctaphid-model
  cancel-in-progress: false
jobs:
  fido-hid-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: CTAP 64-byte HID initial and continuation report framing plus race/vet
        shell: bash
        run: |
          set -Eeuo pipefail
          before="$(git status --porcelain --untracked-files=all)"
          [[ -z "$before" ]] || exit 11
          docker pull golang:1.23-bookworm >/dev/null
          base="$(docker image inspect --format '{{index .RepoDigests 0}}' golang:1.23-bookworm)"
          [[ "$base" == *@sha256:* ]] || exit 12
          echo "PASSKEY_R1_BASE=$base"
          tar -C experiments/passkey-lab/issue-420 -cf - . | \
            docker run --rm -i --network none --read-only --user 65532:65532 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 2048m --memory-swap 2048m --cpus 2 --pids-limit 128 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1536m,mode=1777 \
            -e HOME=/tmp -e GOCACHE=/tmp/cache -e GOPATH=/tmp/gopath \
            -e GOPROXY=off -e GOSUMDB=off -e GOTOOLCHAIN=local \
            "$base" sh -ec 'mkdir -p /tmp/work; cd /tmp/work; tar -xf -; go test -race -count=1 -v ./...; go vet ./...'
          [[ "$(git status --porcelain --untracked-files=all)" == "$before" ]] || exit 13
          echo PASSKEY_R1_SYNTHETIC_CTAPHID_FRAMING_MODEL=PASS
          echo PASSKEY_R1_ACTUAL_USB_HID_FIDO2_AUTHENTICATOR=NOT_TESTED
