name: Public R50 Android actual APK lifecycle on proven KVM emulator
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [experiment/public-r49-android-companion-emulator]
    paths:
      - 'scripts/r49_android_companion_smoke.py'
      - 'scripts/r50_android_apk_lifecycle.py'
      - 'tests/test_r50_android_apk_lifecycle.py'
      - 'tools/r50-android-app/**'
      - '.github/workflows/public-r50-android-apk-lifecycle.yml'
permissions:
  contents: read
concurrency:
  group: public-r50-android-apk-lifecycle
  cancel-in-progress: false
jobs:
  offline-contract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'experiment/public-r50-android-app-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile harness and test no false app-lifecycle qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/r49_android_companion_smoke.py scripts/r50_android_apk_lifecycle.py
          python3 scripts/r50_android_apk_lifecycle.py --help >/dev/null
          python3 -m unittest -v tests/test_r49_android_companion_smoke.py tests/test_r50_android_apk_lifecycle.py
          test "$(grep -Ec 'uses-permission|INTERNET|READ_CONTACTS|READ_SMS' tools/r50-android-app/AndroidManifest.xml || :)" = 0
          echo R50_ANDROID_APK_OFFLINE_CONTRACT=PASS
  real-android-apk:
    needs: offline-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build original signed test APK and qualify actual AVD app launch
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/r50-android"
          python3 scripts/r50_android_apk_lifecycle.py --out "$RUNNER_TEMP/r50-android/receipt.json"
          python3 - "$RUNNER_TEMP/r50-android/receipt.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["classification"]=="SUPPORTED",d["reason"]
          e=d["evidence"]
          assert e["observed_api"]=="35" and e["observed_abi"]=="x86_64"
          assert e["r50_signing"]=="DISPOSABLE_TEST_CERT_APKSIGNER_VERIFIED"
          assert e["r50_activity_resumed"]=="PASS"
          assert e["r50_private_sandbox_oracle"]=="PERSISTED"
          assert e["r50_force_stop_exit"]==0 and e["r50_uninstall_exit"]==0
          assert d["android_app_background_or_device_owner"]=="NOT_TESTED"
          print("R50_ANDROID_NATIVE_APP_INSTALL_LAUNCH_SANDBOX_STOP_UNINSTALL=PASS")
          print("R50_REAL_ANDROID_PHONE_APP=NOT_TESTED")
          PY
      - name: Preserve public-safe JSON receipt, not APK or signing key
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r50-android-apk-lifecycle-receipt
          path: ${{ runner.temp }}/r50-android/receipt.json
          if-no-files-found: warn
          retention-days: 7
