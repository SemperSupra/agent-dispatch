name: USB Fabric R26 Integrated - Go fence to QEMU real guest
on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-usbfabric-r26-integration
  cancel-in-progress: false
jobs:
  integrated-fenced-hid:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Qualify synthetic Go lease broker to real Linux USB evdev, capture and no-taint
        shell: bash
        run: bash experiments/usb-fabric-r26/integrated/verify.sh
