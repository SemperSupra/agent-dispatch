name: USB Fabric R26-L5 - stale guest journal-loss fail-closed negative oracle
on:
  push:
    branches: [test/issue-428-missing-journal-red-blue]
    paths:
      - '.github/workflows/public-usbfabric-r26-l5-journal-loss.yml'
      - 'experiments/usb-fabric-r26/integrated/l5_missing_journal*'
      - 'experiments/usb-fabric-r26/integrated/Dockerfile'
      - 'experiments/usb-fabric-r26/integrated/cmd/actuator/**'
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-usbfabric-r26-l5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  missing-journal-real-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Require denial after real guest key down, actuator SIGKILL and journal loss
        shell: bash
        run: bash experiments/usb-fabric-r26/integrated/l5_missing_journal_verify.sh
