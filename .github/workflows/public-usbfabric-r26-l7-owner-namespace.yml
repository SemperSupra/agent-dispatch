name: USB Fabric R26-L7 - alternate journal QMP owner negative oracle
on:
  push:
    branches: [test/issue-382-l7-alternate-journal-owner]
    paths:
      - '.github/workflows/public-usbfabric-r26-l7-owner-namespace.yml'
      - 'experiments/usb-fabric-r26/integrated/l7_alternate_journal*'
      - 'experiments/usb-fabric-r26/integrated/Dockerfile'
      - 'experiments/usb-fabric-r26/integrated/cmd/actuator/**'
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-usbfabric-r26-l7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  alternate-journal-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Prove distinct journal namespace cannot claim same QEMU VM
        shell: bash
        run: bash experiments/usb-fabric-r26/integrated/l7_alternate_journal_verify.sh
