name: USB Fabric R26-L9A - fsynced guest release journal policy
on:
  push:
    branches: [test/issue-429-l9-durable-proof-ledger]
    paths:
      - '.github/workflows/public-usbfabric-r26-l9-ledger-proof.yml'
      - 'experiments/usb-fabric-r26/integrated/heldledger/**'
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-usbfabric-r26-l9-journal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  scoped-guest-proof-journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify fail-closed, crash-durable guest-proof transition and source hygiene
        shell: bash
        run: |
          set -Eeuo pipefail
          before="$(git status --porcelain --untracked-files=all)"
          [[ -z "$before" ]] || { echo R26_L9_SOURCE_DIRTY=RED;exit 11; }
          docker pull golang:1.23-bookworm >/dev/null
          base="$(docker image inspect --format '{{index .RepoDigests 0}}' golang:1.23-bookworm)"
          [[ "$base" == *@sha256:* ]] || exit 12
          echo "R26_L9_GO_BASE=$base"
          tar -C experiments/usb-fabric-r26/integrated -cf - . | \
          docker run --rm -i --network none --read-only --user 65532:65532 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 2048m --memory-swap 2048m --cpus 2 --pids-limit 128 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1536m,mode=1777 \
            -e HOME=/tmp -e GOCACHE=/tmp/cache -e GOPATH=/tmp/gopath \
            -e GOPROXY=off -e GOSUMDB=off -e GOTOOLCHAIN=local \
            "$base" sh -ec 'mkdir -p /tmp/work; cd /tmp/work; tar -xf -; go test -race -count=1 -v ./...; go vet ./...'
          [[ "$(git status --porcelain --untracked-files=all)" == "$before" ]] || { echo R26_L9_SOURCE_TAINT=RED;exit 13; }
          echo R26_L9_GUEST_VERIFIED_JOURNAL_FSYNC_POLICY=PASS
          echo R26_L9_ACTUAL_QEMU_GUEST_RELEASE_INTEGRATION=NOT_TESTED
          echo R26_L9_PRODUCTION_ATTESTED_GUEST_IDENTITY=NOT_TESTED
