name: USB Fabric R26-L9B - real guest verified journal and next lease
on:
  push:
    branches: [test/issue-429-l9b-live-guest-readmission]
    paths:
      - '.github/workflows/public-usbfabric-r26-l9b-real-guest-readmission.yml'
      - 'experiments/usb-fabric-r26/integrated/**'
      - 'experiments/usb-fabric-r26/releasegate/**'
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-usbfabric-r26-l9b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  actual-guest-release-and-fresh-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Real Linux evdev receipt + QMP ACK + fsynced release + second lease
        shell: bash
        run: bash experiments/usb-fabric-r26/integrated/l9b_guest_readmission_verify.sh
