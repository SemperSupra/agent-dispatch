name: USB Fabric R26-L9C - two scoped guest releases and QMP USB detach
on:
  push:
    branches: [test/issue-429-l9c-scoped-lease-detach]
    paths:
      - '.github/workflows/public-usbfabric-r26-l9c-scoped-detach.yml'
      - 'experiments/usb-fabric-r26/integrated/**'
      - 'experiments/usb-fabric-r26/releasegate/**'
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-usbfabric-r26-l9c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  two-scoped-releases-and-detach:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Prove two real guest releases, stale proof denial, QMP DEVICE_DELETED and sysfs absence
        shell: bash
        run: bash experiments/usb-fabric-r26/integrated/l9c_scoped_release_detach_verify.sh
