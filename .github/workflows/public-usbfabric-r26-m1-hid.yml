name: USB Fabric R26-M1 - real guest virtual mouse tablet HID
on:
  push:
    branches: [test/issue-387-usb-hid-matrix]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r26-m1-hid-matrix
  cancel-in-progress: false
jobs:
  real-guest-pointer-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Qualify USB mouse and tablet evdev pointer motion and button on Linux guest
        shell: bash
        run: bash experiments/usb-fabric-r26/matrix-387/verify.sh
