name: USB Fabric R26-P1b - actual PCSC synthetic card PIN signing
on:
  push:
    branches: [test/issue-410-pcsc-pin-card]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r26-p1b-pcsc-synthetic-pin
  cancel-in-progress: false
jobs:
  pcsc-synthetic-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Real PCSC virtual test card PIN retry/lockout and PIN-gated P256 challenge/UPDATE
        shell: bash
        run: bash experiments/usb-fabric-r26/issue-410/verify.sh
