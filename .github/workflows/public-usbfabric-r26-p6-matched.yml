name: USB Fabric R26-P6 - matched xHCI quiet vs contention benchmark
on:
  push:
    branches: [test/issue-411-usb-congestion-ab]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r26-p6-matched-contention
  cancel-in-progress: false
jobs:
  matched-guest-io-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Repeated guest USB xHCI matched TFTP SHA quiet versus concurrent disk/audio
        shell: bash
        run: bash experiments/usb-fabric-r26/issue-411/verify.sh
