name: USB Fabric R26-P7 BLUE - bounded shutdown settlement and admission fencing
on:
  push:
    branches: [test/issue-412-close-blue]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r26-p7-blue-shutdown
  cancel-in-progress: false
jobs:
  expected-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Confirm queued accepted Submit receipts settle on Close and no post-close actuation
        shell: bash
        run: |
          set -Eeuo pipefail
          before="$(git status --porcelain --untracked-files=all)"
          [[ -z "$before" ]] || exit 11
          docker pull golang:1.23-bookworm >/dev/null
          base="$(docker image inspect --format '{{index .RepoDigests 0}}' golang:1.23-bookworm)"
          [[ "$base" == *@sha256:* ]] || exit 12
          echo "R26_P7_BLUE_BASE=$base"
          tar -C experiments/usb-fabric-r26/issue-407 -cf - . | \
            docker run --rm -i --network none --read-only --user 65532:65532 \
              --cap-drop ALL --security-opt no-new-privileges \
              --memory 2048m --memory-swap 2048m --cpus 2 --pids-limit 128 \
              --tmpfs /tmp:rw,exec,nosuid,nodev,size=1536m,mode=1777 \
              -e HOME=/tmp -e GOCACHE=/tmp/cache -e GOPATH=/tmp/gopath \
              -e GOPROXY=off -e GOSUMDB=off -e GOTOOLCHAIN=local \
              "$base" sh -ec 'mkdir -p /tmp/work; cd /tmp/work; tar -xf -; go test -race -count=1 -v ./...; go vet ./...'
          [[ "$(git status --porcelain --untracked-files=all)" == "$before" ]] || exit 13
          echo R26_P7_CLOSE_FENCING_ALL_ACCEPTED_RECEIPTS=PASS
          echo R26_P7_HUNG_EXECUTE_GUEST_QMP_FORCE_RELEASE=NOT_TESTED
