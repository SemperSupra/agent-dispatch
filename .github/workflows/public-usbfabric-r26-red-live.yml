name: USB Fabric R26-H - reproduce missed HID release on broker SIGKILL
on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-usbfabric-r26-h-crash
  cancel-in-progress: false
jobs:
  crash-and-real-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Actual Linux guest release oracle on hard-killed Go broker (expected RED)
        shell: bash
        run: bash experiments/usb-fabric-r26/red-live/verify.sh
