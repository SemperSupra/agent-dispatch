name: USB Fabric R26-L4 - trusted guest release gate model
on:
  push:
    branches: [experiment/public-usbfabric-r26-release-gate]
    paths:
      - '.github/workflows/public-usbfabric-r26-release-gate.yml'
      - 'experiments/usb-fabric-r26/releasegate/**'
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-usbfabric-r26-release-gate
  cancel-in-progress: false
jobs:
  receipt-state-machine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Prove QMP ACK never implies guest release; deny stale/forged receipts
        shell: bash
        run: |
          set -Eeuo pipefail
          before="$(git status --porcelain --untracked-files=all)"
          [[ -z "$before" ]] || { echo R26_L4_DIRTY=RED;exit 11; }
          docker pull golang:1.23-bookworm >/dev/null
          base="$(docker image inspect --format '{{index .RepoDigests 0}}' golang:1.23-bookworm)"
          [[ "$base" == *@sha256:* ]] || exit 12
          echo "R26_L4_GO_BASE=$base"
          tar -C experiments/usb-fabric-r26/releasegate -cf - . | \
          docker run --rm -i --network none --read-only --user 65532:65532 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 2048m --memory-swap 2048m --cpus 2 --pids-limit 128 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1536m,mode=1777 \
            -e HOME=/tmp -e GOCACHE=/tmp/cache -e GOPATH=/tmp/gopath \
            -e GOPROXY=off -e GOSUMDB=off -e GOTOOLCHAIN=local \
            "$base" sh -ec 'mkdir -p /tmp/work; cd /tmp/work; tar -xf -; go test -race -count=1 -v ./...; go vet ./...'
          [[ "$(git status --porcelain --untracked-files=all)" == "$before" ]] || { echo R26_L4_SOURCE_TAINT=RED;exit 13; }
          echo R26_L4_QMP_ACK_NOT_GUEST_RECEIPT_MODEL=PASS
          echo R26_L4_REAL_GUEST_ATTESTATION=NOT_TESTED
