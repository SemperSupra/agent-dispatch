name: USB Fabric R27 - host-pinned Ed25519 guest receipt challenge
on:
  push:
    branches: [test/issue-429-r27-runtime-guest-evidence]
    paths:
      - '.github/workflows/public-usbfabric-r27-runtime-proof.yml'
      - 'experiments/usb-fabric-r26/releasegate/**'
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-usbfabric-r27-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  runtime-evidence-crypto:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Offline real Ed25519 signatures, per-lease fresh challenges and adversarial verification
        shell: bash
        run: |
          set -Eeuo pipefail
          before="$(git status --porcelain --untracked-files=all)"
          [[ -z "$before" ]] || { echo R27_RUNTIME_SOURCE_DIRTY=RED;exit 11; }
          docker pull golang:1.23-bookworm >/dev/null
          base="$(docker image inspect --format '{{index .RepoDigests 0}}' golang:1.23-bookworm)"
          [[ "$base" == *@sha256:* ]] || exit 12
          echo "R27_RUNTIME_GO_BASE=$base"
          tar -C experiments/usb-fabric-r26/releasegate -cf - . | \
          docker run --rm -i --network none --read-only --user 65532:65532 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 2048m --memory-swap 2048m --cpus 2 --pids-limit 128 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1536m,mode=1777 \
            -e HOME=/tmp -e GOCACHE=/tmp/cache -e GOPATH=/tmp/gopath \
            -e GOPROXY=off -e GOSUMDB=off -e GOTOOLCHAIN=local \
            "$base" sh -ec 'mkdir -p /tmp/work;cd /tmp/work;tar -xf -;go test -race -count=1 -v ./...;go vet ./...'
          [[ "$(git status --porcelain --untracked-files=all)" == "$before" ]] || { echo R27_RUNTIME_SOURCE_TAINT=RED;exit 13; }
          echo R27_RUNTIME_ED25519_POLICY=PASS
          echo R27_RUNTIME_ACTUAL_GUEST_KEY_PROVISIONING=NOT_TESTED
          echo R27_RUNTIME_PRODUCTION_GUEST_ATTESTATION=NOT_TESTED
