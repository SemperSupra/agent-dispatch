name: USB Fabric R27 trust custody - fail closed test-vs-production evidence
on:
  push:
    branches: [test/issue-443-r27-id-custody-gate]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trust-claims-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject falsely promoted extractable Ed25519 identity and unverified TPM quotes
        run: |
          GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off go test -v experiments/usb-fabric-r26/trust/custody.go experiments/usb-fabric-r26/trust/custody_test.go
          echo R27_TRUST_SYNTHETIC_KEY_CUSTODY=TEST_ONLY
          echo R27_TRUST_PRODUCTION_ATTESTATION=NOT_TESTED
