name: USB Fabric R27-C - host-pinned Ed25519 actual Linux guest evdev release
on:
  push:
    branches: [test/issue-443-r27c-host-provisioned-live-guest]
    paths:
      - '.github/workflows/public-usbfabric-r27c-host-image-signed-guest.yml'
      - 'experiments/usb-fabric-r26/integrated/**'
      - 'experiments/usb-fabric-r26/releasegate/**'
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-usbfabric-r27c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  real-linux-guest-host-builder-pinned-ed25519:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Independently pin image-build public key then verify two actual guest Ed25519 releases and USB detach
        shell: bash
        run: bash experiments/usb-fabric-r26/integrated/r27c_signed_guest_verify.sh
