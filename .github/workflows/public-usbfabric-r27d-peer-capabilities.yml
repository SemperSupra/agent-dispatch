name: USB Fabric R27-D - real QEMU peer capability enforcement
on:
  push:
    branches: [test/issue-443-r27d-controller-capabilities]
    paths:
      - '.github/workflows/public-usbfabric-r27d-peer-capabilities.yml'
      - 'experiments/usb-fabric-r26/integrated/**'
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-usbfabric-r27d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  real-qemu-read-only-peer:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Test real Unix SO_PEERCRED principal denies reserve, forged input, detach, no journal taint
        shell: bash
        run: bash experiments/usb-fabric-r26/integrated/r27d_readonly_verify.sh
