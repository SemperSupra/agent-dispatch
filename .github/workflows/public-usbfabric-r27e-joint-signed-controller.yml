name: USB Fabric R27-E - ONE real guest signed release and peer-authorized CLI acceptance
on:
  push:
    branches: [test/issue-443-r27e-joint-crypto-capabilities]
    paths:
      - '.github/workflows/public-usbfabric-r27e-joint-signed-controller.yml'
      - 'experiments/usb-fabric-r26/integrated/**'
      - 'experiments/usb-fabric-r26/releasegate/**'
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-usbfabric-r27e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  actual-linux-guest-signed-lease-and-capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: One QEMU VM, two real signed guest releases, peer capability gated r26ctl, QMP and sysfs detach
        shell: bash
        run: bash experiments/usb-fabric-r26/integrated/r27e_joint_signed_cli_verify.sh
