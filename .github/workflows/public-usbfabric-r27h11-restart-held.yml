name: USB Fabric R27-H11 - restart must fail closed with sealed QMP and held journal
on:
  push:
    branches: [test/issue-470-r27h11-restart-denied-while-held]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restart-held-sealed-qmp:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: SIGKILL real held signed-input actuator, attempt fresh restart without QMP
        run: bash experiments/usb-fabric-r26/integrated/r27h11_restart_denied_sealed_qmp_verify.sh
