name: USB Fabric R27-H8 - unlink QMP pathname following controller admission
on:
  push:
    branches: [test/issue-470-r27h8-unlinked-qmp-lifecycle]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unlinked-qmp-socket-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm same-UID new QMP access denied after path unlink, broker remains healthy
        run: bash experiments/usb-fabric-r26/integrated/r27h8_unlinked_qmp_verify.sh
