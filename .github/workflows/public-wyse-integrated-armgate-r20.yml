name: Public Wyse R20 integrated immutable-plan signed-permit qualification
on:
  push:
    branches: [experiment/public-wyse-integrated-armgate-r20]
    paths:
      - 'tools/wyse-armgate/**'
      - '.github/workflows/public-wyse-integrated-armgate-r20.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-wyse-integrated-armgate-r20
  cancel-in-progress: false
jobs:
  exact-source-join:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: integration-src
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4a512995ba912ad83c6d6b960e09593346dca605
          path: policy-src
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f8a6cf8fb76124ea5c319e2fc1def249463053e1
          path: permit-src
          persist-credentials: false
      - name: Verify exact independent source heads and exercise join
        shell: bash
        working-directory: integration-src/tools/wyse-armgate
        run: |
          set -Eeuo pipefail
          test "$(git -C ../../../policy-src rev-parse HEAD)" = 4a512995ba912ad83c6d6b960e09593346dca605
          test "$(git -C ../../../permit-src rev-parse HEAD)" = f8a6cf8fb76124ea5c319e2fc1def249463053e1
          go test -race -count=1 -v ./...
          go vet ./...
          CGO_ENABLED=0 go test -count=1 ./...
          echo 'R20_EXACT_SOURCE_POLICY_PERMIT_JOIN=PASS'
          echo 'DEVICE_ISSUER_AND_ZFS_INTEGRATION=NOT_TESTED'
          echo 'LIVE_ACTUATOR=ABSENT'
