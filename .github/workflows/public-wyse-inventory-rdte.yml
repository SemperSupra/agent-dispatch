name: Public synthetic Wyse read-only inventory and watchdog qualification
on:
  push:
    branches: [experiment/public-wyse-inventory-r18]
    paths:
      - tools/wyse-inventory-probe/**
      - .github/workflows/public-wyse-inventory-rdte.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sysfs-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and test read-only sysfs BIOS/eMMC/watchdog probe
        working-directory: tools/wyse-inventory-probe
        run: |
          set -Eeuo pipefail
          gofmt -w .
          go test -race -count=1 -v ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/wyse-probe" .
          mkdir -p "$RUNNER_TEMP/empty-sys"
          "$RUNNER_TEMP/wyse-probe" -sysroot "$RUNNER_TEMP/empty-sys" > "$RUNNER_TEMP/empty.json"
          python3 - "$RUNNER_TEMP/empty.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['physical_mutation'] is False
          assert r['watchdogs']==[] and r['emmc']==[]
          assert r['ownership_tag']=="OEM_SPECIFIC_NOT_IN_GENERIC_SYSFS"
          print("READONLY_WATCHDOG_DMI_EMMC_INVENTORY=PASS")
          PY
          echo 'NO_REAL_WYSE_PROBED=TRUE'
