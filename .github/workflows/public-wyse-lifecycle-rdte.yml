name: Public Wyse enrollment and lifecycle lab — three audiences
on:
  push:
    branches: [experiment/public-wyse-lifecycle-r01]
    paths:
      - .github/workflows/public-wyse-lifecycle-rdte.yml
      - tools/wyse-lifecycle-lab/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-wyse-lifecycle-r01
  cancel-in-progress: true
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run real lifecycle Go tests, race detector and vet
        working-directory: tools/wyse-lifecycle-lab
        run: |
          set -Eeuo pipefail
          go version
          go test -race -count=1 -v ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/wyse-lifecycle-lab" .
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/wysectl" ./clients/wysectl
          sha256sum "$RUNNER_TEMP/wyse-lifecycle-lab" "$RUNNER_TEMP/wysectl"
      - name: Start isolated enrollment service and inspect all audiences
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          token_file="$RUNNER_TEMP/wyse-lab-token"
          python3 -c 'import secrets,sys;open(sys.argv[1],"w").write(secrets.token_hex(32))' "$token_file"
          chmod 0600 "$token_file"
          state="$RUNNER_TEMP/wyse-lab-synthetic-state.json"
          "$RUNNER_TEMP/wyse-lifecycle-lab" -bind 127.0.0.1:18085 -state "$state" -token-file "$token_file" > evidence/service.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -f "$token_file" "$state"' EXIT
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:18085/healthz >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:18085/ > evidence/human.html
          curl -fsS http://127.0.0.1:18085/app.js > evidence/human-app.js
          curl -fsS http://127.0.0.1:18085/api/v1/lab/schema > evidence/agent-schema.json
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18085/api/v1/lab/nodes)
          test "$code" = 401
          token=$(cat "$token_file")
          curl -fsS -H "Authorization: Bearer $token" -H 'X-Actor: automation' http://127.0.0.1:18085/api/v1/lab/nodes > evidence/automation-inventory.json
          python3 - <<'PY'
          import json
          schema=json.load(open('evidence/agent-schema.json'))
          assert schema["hardware_verified"] is False
          assert schema["real_garm_admission"] is False
          assert schema["physical_mutation"] is False
          assert set(schema["audiences"])=={"human","automation","agent"}
          assert "PUBLIC_SYNTHETIC_ONLY" == schema["scope"]
          html=open('evidence/human.html').read()
          assert '<script src="/app.js">' in html
          assert 'Wyse fleet lifecycle lab' in html
          print("HUMAN_UI_ASSETS=PASS")
          print("AUTOMATION_BEARER_AND_UNAUTHORIZED_DENY=PASS")
          print("AGENT_SCHEMA_AND_HARDWARE_HOLD=PASS")
          PY
          echo 'LAB_SERVER_STARTED=PASS' > evidence/receipt.txt
          echo 'HUMAN_UI_ASSETS=PASS' >> evidence/receipt.txt
          echo 'AUTOMATION_UNAUTHORIZED_DENIED=PASS' >> evidence/receipt.txt
          echo 'AGENT_CONTRACT=PASS' >> evidence/receipt.txt
          echo 'HARDWARE_TRUENAS_GARM_DEPLOYMENT=NOT_TESTED' >> evidence/receipt.txt
          "$RUNNER_TEMP/wysectl" -token-file "$token_file" -actor automation -id synthetic-automation-01 > evidence/automation-receipt.txt
          "$RUNNER_TEMP/wysectl" -token-file "$token_file" -actor agent -id synthetic-agent-01 > evidence/agent-receipt.txt
          cat evidence/automation-receipt.txt evidence/agent-receipt.txt >> evidence/receipt.txt
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          (cd tools/wyse-lifecycle-lab && npm install --no-save --ignore-scripts puppeteer-core@24.31.0 >/dev/null)
          CHROME_BIN="$CHROME_BIN" WYSE_SYNTHETIC_LAB_TOKEN="$token" node tools/wyse-lifecycle-lab/browser-smoke.mjs > evidence/browser-receipt.txt
          cat evidence/browser-receipt.txt >> evidence/receipt.txt
          cp "$state" "$RUNNER_TEMP/wyse-lab-snapshot-backup.json"
          test "$(stat -c %a "$RUNNER_TEMP/wyse-lab-snapshot-backup.json")" = 600
          sha256sum "$state" "$RUNNER_TEMP/wyse-lab-snapshot-backup.json" > "$RUNNER_TEMP/snapshot-hashes"
          cmp "$state" "$RUNNER_TEMP/wyse-lab-snapshot-backup.json"
          echo 'OFFHOST_STYLE_SNAPSHOT_BACKUP_READBACK=PASS' >> evidence/receipt.txt
          kill "$pid" 2>/dev/null || true
          wait "$pid" || true
          "$RUNNER_TEMP/wyse-lifecycle-lab" -bind 127.0.0.1:18085 -state "$state" -token-file "$token_file" > "$RUNNER_TEMP/restart.log" 2>&1 &
          pid=$!
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:18085/healthz >/dev/null && break; sleep 1; done
          curl -fsS -H "Authorization: Bearer $token" -H 'X-Actor: agent' http://127.0.0.1:18085/api/v1/lab/nodes > "$RUNNER_TEMP/restarted-nodes.json"
          python3 - "$RUNNER_TEMP/restarted-nodes.json" <<'PY'
          import json,sys
          devices=json.load(open(sys.argv[1]))['nodes']
          target={'synthetic-automation-01','synthetic-agent-01','synthetic-browser-01'}
          assert {n['id'] for n in devices}==target, devices
          assert all(n['state']=='RETIRED' and n['hardware_verified'] is False for n in devices)
          print('RESTART_DURABLE_THREE_AUDIENCES=PASS')
          PY
          echo 'RESTART_DURABLE_THREE_AUDIENCES=PASS' >> evidence/receipt.txt
          cp "$state" "$RUNNER_TEMP/corrupt-state.json"
          printf 'CORRUPTED_STATE_SHOULD_FAIL_CLOSED' > "$RUNNER_TEMP/corrupt-state.json"
          if "$RUNNER_TEMP/wyse-lifecycle-lab" -bind 127.0.0.1:18086 -state "$RUNNER_TEMP/corrupt-state.json" -token-file "$token_file" > "$RUNNER_TEMP/corruption-log" 2>&1; then
            echo 'CORRUPTED_STATE_REFUSED=FAIL_OPEN' >> evidence/receipt.txt
            exit 1
          fi
          echo 'CORRUPTED_STATE_REFUSED=PASS' >> evidence/receipt.txt
          rm -f evidence/human-app.js
      - name: Upload allowlisted synthetic receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-wyse-enrollment-lifecycle
          path: |
            evidence/receipt.txt
            evidence/agent-schema.json
            evidence/automation-inventory.json
          if-no-files-found: warn
          retention-days: 7
