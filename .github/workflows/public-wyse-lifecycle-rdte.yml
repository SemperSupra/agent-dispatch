name: Public Wyse enrollment and lifecycle lab — three audiences
on:
  push:
    branches: [experiment/public-wyse-lifecycle-r01]
    paths:
      - .github/workflows/public-wyse-lifecycle-rdte.yml
      - tools/wyse-lifecycle-lab/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-wyse-lifecycle-r01
  cancel-in-progress: true
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run real lifecycle Go tests, race detector and vet
        working-directory: tools/wyse-lifecycle-lab
        run: |
          set -Eeuo pipefail
          go version
          go test -race -count=1 -v ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/wyse-lifecycle-lab" .
          sha256sum "$RUNNER_TEMP/wyse-lifecycle-lab"
      - name: Start isolated enrollment service and inspect all audiences
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          token_file="$RUNNER_TEMP/wyse-lab-token"
          python3 -c 'import secrets,sys;open(sys.argv[1],"w").write(secrets.token_hex(32))' "$token_file"
          chmod 0600 "$token_file"
          state="$RUNNER_TEMP/wyse-lab-synthetic-state.json"
          "$RUNNER_TEMP/wyse-lifecycle-lab" -bind 127.0.0.1:18085 -state "$state" -token-file "$token_file" > evidence/service.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -f "$token_file" "$state"' EXIT
          for i in $(seq 1 25); do curl -fsS http://127.0.0.1:18085/healthz >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:18085/ > evidence/human.html
          curl -fsS http://127.0.0.1:18085/app.js > evidence/human-app.js
          curl -fsS http://127.0.0.1:18085/api/v1/lab/schema > evidence/agent-schema.json
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18085/api/v1/lab/nodes)
          test "$code" = 401
          token=$(cat "$token_file")
          curl -fsS -H "Authorization: Bearer $token" -H 'X-Actor: automation' http://127.0.0.1:18085/api/v1/lab/nodes > evidence/automation-inventory.json
          python3 - <<'PY'
          import json
          schema=json.load(open('evidence/agent-schema.json'))
          assert schema["hardware_verified"] is False
          assert schema["real_garm_admission"] is False
          assert schema["physical_mutation"] is False
          assert set(schema["audiences"])=={"human","automation","agent"}
          assert "PUBLIC_SYNTHETIC_ONLY" == schema["scope"]
          html=open('evidence/human.html').read()
          assert '<script src="/app.js">' in html
          assert 'Wyse fleet lifecycle lab' in html
          print("HUMAN_UI_ASSETS=PASS")
          print("AUTOMATION_BEARER_AND_UNAUTHORIZED_DENY=PASS")
          print("AGENT_SCHEMA_AND_HARDWARE_HOLD=PASS")
          PY
          echo 'LAB_SERVER_STARTED=PASS' > evidence/receipt.txt
          echo 'HUMAN_UI_ASSETS=PASS' >> evidence/receipt.txt
          echo 'AUTOMATION_UNAUTHORIZED_DENIED=PASS' >> evidence/receipt.txt
          echo 'AGENT_CONTRACT=PASS' >> evidence/receipt.txt
          echo 'HARDWARE_TRUENAS_GARM_DEPLOYMENT=NOT_TESTED' >> evidence/receipt.txt
          rm -f evidence/human-app.js
      - name: Upload allowlisted synthetic receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-wyse-enrollment-lifecycle
          path: |
            evidence/receipt.txt
            evidence/agent-schema.json
            evidence/automation-inventory.json
          if-no-files-found: warn
          retention-days: 7
