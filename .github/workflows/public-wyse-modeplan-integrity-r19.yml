name: Public Wyse R19 plan-integrity red/green qualification
on:
  push:
    branches: [experiment/public-wyse-modeplan-integrity-r19]
    paths:
      - 'tools/wyse-modeplan/**'
      - '.github/workflows/public-wyse-modeplan-integrity-r19.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-wyse-modeplan-integrity-r19
  cancel-in-progress: false
jobs:
  pure-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Race, static and CGO-less negative policy tests
        working-directory: tools/wyse-modeplan
        shell: bash
        run: |
          set -Eeuo pipefail
          go test -race -count=1 -v ./...
          go vet ./...
          CGO_ENABLED=0 go test -count=1 ./...
          echo 'R19_PLAN_INTENT_INTEGRITY=PASS'
          echo 'PHYSICAL_ACTUATOR=ABSENT'
