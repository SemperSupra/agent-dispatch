name: Public Wyse R19 signed one-time plan permit qualification
on:
  push:
    branches: [experiment/public-wyse-planpermit-r19]
    paths:
      - 'tools/wyse-planpermit/**'
      - '.github/workflows/public-wyse-planpermit-r19.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-wyse-planpermit-r19
  cancel-in-progress: false
jobs:
  crypto-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Ed25519 signatures, fail-closed mutations, race/replay, no actuator
        working-directory: tools/wyse-planpermit
        shell: bash
        run: |
          set -Eeuo pipefail
          go test -race -count=1 -v ./...
          go vet ./...
          CGO_ENABLED=0 go test -count=1 ./...
          echo 'R19_SIGNED_PLAN_PERMIT_POLICY=PASS'
          echo 'PRODUCTION_SIGNING_KEYS=ABSENT'
          echo 'DURABLE_NONCE_STORE=NOT_TESTED'
          echo 'PHYSICAL_ACTUATOR=ABSENT'
