name: Public Wyse R30 F1 no-SATA recovery signed OVMF fault RDTE
on:
  push:
    branches: [experiment/public-wyse-r30-f1-no-sata]
    paths:
      - '.github/workflows/public-wyse-r30-f1-no-sata.yml'
      - 'scripts/public_wyse_r25_buildroot_uki_ssh.sh'
      - 'scripts/public_wyse_r28_owned_kernel.sh'
      - 'tools/wyse-buildroot/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-wyse-r30-f1-no-sata
  cancel-in-progress: false
jobs:
  signed-recovery-with-no-sata:
    runs-on: ubuntu-26.04
    timeout-minutes: 49
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install disposable public Linux build and OVMF tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y \
            build-essential bc bison flex file libncurses-dev libssl-dev libelf-dev \
            rsync unzip xz-utils wget curl cpio zstd perl \
            qemu-system-x86 ovmf grub-efi-amd64-bin grub-common grub-pc-bin \
            busybox-static dropbear-bin openssh-client dosfstools gdisk \
            util-linux kmod sbsigntool openssl python3-virt-firmware \
            systemd-ukify systemd-boot-efi
          echo R30_PUBLIC_DISPOSABLE_DEPENDENCIES=PASS
      - name: Build official SHA-pinned Linux kernel and Buildroot userland afresh
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/public_wyse_r28_owned_kernel.sh
          bash -n scripts/public_wyse_r25_buildroot_uki_ssh.sh
          bash scripts/public_wyse_r28_owned_kernel.sh
          test -s "$RUNNER_TEMP/wyse-r28-owned-kernel/out/images/bzImage"
          test -s "$RUNNER_TEMP/wyse-r28-owned-kernel/out/images/rootfs.cpio"
          echo R30_SOURCE_OWNED_LINUX_AND_ROOTFS_BUILD=PASS
      - name: Prove recovery SSH still boots with no SATA disk; preserve unsigned-firmware denial
        shell: bash
        env:
          WYSE_R23_SIGNED_EFI: '1'
          WYSE_R23_ENFORCE_SB: '1'
          WYSE_R23_UKI: '1'
          WYSE_R23_FIRMWARE_UNSIGNED_NEGATIVE: '1'
          WYSE_R30_NO_SATA: '1'
        run: |
          set -Eeuo pipefail
          export WYSE_R29_OWNED_KERNEL_BZIMAGE="$RUNNER_TEMP/wyse-r28-owned-kernel/out/images/bzImage"
          export WYSE_R25_BUILDROOT_CPIO="$RUNNER_TEMP/wyse-r28-owned-kernel/out/images/rootfs.cpio"
          bash scripts/public_wyse_r25_buildroot_uki_ssh.sh
          for marker in \
            R29_SOURCE_OWNED_KERNEL_SELECTED=PASS \
            R29_NO_UBUNTU_TEST_MODULES=PASS \
            R29_KERNEL_MODULE_LIST_EMPTY_BY_DESIGN=PASS \
            R30_FAULT_NO_SATA_QEMU_DEVICE_OMITTED=PASS \
            R30_NO_SATA_RECOVERY_BOOT_AND_AUTH_SSH=PASS \
            R23_UKI_SIGNED_ENROLLED_OVMF_LINUX_SSH=PASS \
            R23_UNSIGNED_UKI_WELL_FORMED_AND_FIRMWARE_DENIED=PASS \
            R23_UNSIGNED_UKI_LINUX_INIT_NOT_REACHED=PASS \
            UNAUTHORIZED_SSH_KEY_DENIAL=PASS \
            EMMC_SOURCE_PRESERVED=PASS; do
            grep -Fxq "$marker" evidence/public/receipt.txt
          done
          for marker in \
            WYSE_R25_BUILDROOT_USERLAND_INIT=PASS \
            R29_BUILTIN_DRIVER_INIT=PASS \
            WYSE_R25_BUILDROOT_DROPBEAR_STARTED=PASS \
            RECOVERY_NETWORK_READY=PASS \
            EMMC_ENUMERATION=PASS; do
            grep -Fq "$marker" evidence/public/guest-serial.txt
          done
          if grep -Fq 'SATA_ENUMERATION=PASS' evidence/public/guest-serial.txt; then
            echo R30_SATA_DEVICE_ABSENT=FAIL_OPEN
            exit 1
          fi
          for marker in KEY_ONLY_SSH_LOGIN=PASS GUEST_EMMC=PASS R30_GUEST_SATA_ABSENT=PASS; do
            grep -Fxq "$marker" evidence/public/ssh-oracle.txt
          done
          echo R30_F1_NO_SATA_SIGNED_RECOVERY_AND_SSH=PASS
          echo R30_REAL_DELL_HARDWARE_CONTROLLER_OUTAGE_PRODUCTION_SIGNER=NOT_TESTED
      - name: Publish bounded public receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wyse-r30-f1-no-sata-public-receipts
          path: |
            evidence/public/receipt.txt
            evidence/public/guest-serial.txt
            evidence/public/negative-guest-serial.txt
            evidence/public/ssh-oracle.txt
            evidence/public/ukify-inspect.txt
            evidence/public/unsigned-uki-inspect.txt
            evidence/public/efi-signature-oracle.txt
          if-no-files-found: warn
          retention-days: 7
