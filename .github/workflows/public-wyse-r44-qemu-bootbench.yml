name: Public Wyse R44 QEMU BIOS microbench method (not Wyse perf)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/public-wyse-r44-qemu-bootbench.yml'
      - 'tools/wyse-qemu-bootbench/**'
permissions:
  contents: read
concurrency:
  group: public-wyse-r44-qemu-bootbench
  cancel-in-progress: false
jobs:
  guest-boot-microbench:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'experiment/public-wyse-r44-qemu-bootbench'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install QEMU and NASM only in ephemeral public host
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y qemu-system-x86 nasm
          command -v qemu-system-x86_64
          command -v nasm
          echo R44_TEST_TOOLS_PUBLIC_RUNNER_INSTALLED=PASS
      - name: Three-repeat real synthetic BIOS execution with ISA-exit oracle
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n tools/wyse-qemu-bootbench/run.sh
          bash tools/wyse-qemu-bootbench/run.sh
          test -s evidence/public/r44-qemu-bootbench.txt
          grep -Fxq 'R44_MODE_TCG_PC_IDE=PASS' evidence/public/r44-qemu-bootbench.txt
          grep -Fxq 'R44_MODE_TCG_Q35_AHCI=PASS' evidence/public/r44-qemu-bootbench.txt
          grep -Fxq 'R44_MODE_TCG_Q35_AHCI_2VCPU=PASS' evidence/public/r44-qemu-bootbench.txt
          grep -Fxq 'R44_PUBLIC_CLOUD_RUNNER_PERFORMANCE_NOT_WYSE=TRUE' evidence/public/r44-qemu-bootbench.txt
          echo R44_REAL_QEMU_GUEST_EXECUTION_CLOUD_METHOD_QUALIFIED=PASS
          cat evidence/public/r44-qemu-bootbench.txt
      - name: Preserve bounded public text measurements only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wyse-r44-public-synthetic-qemu-bootbench-text
          path: evidence/public/r44-qemu-bootbench.txt
          if-no-files-found: warn
          retention-days: 7
