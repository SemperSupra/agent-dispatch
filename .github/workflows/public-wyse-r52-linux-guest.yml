name: Public Wyse R52-C real disposable Linux guest task oracle
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [experiment/public-wyse-r44-qemu-bootbench]
    paths:
      - 'tools/wyse-qemu-bootbench/run-linux-guest.sh'
      - '.github/workflows/public-wyse-r52-linux-guest.yml'
permissions:
  contents: read
concurrency:
  group: public-wyse-r52-real-linux-guest
  cancel-in-progress: false
jobs:
  real-linux-guest-boot-and-task:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'experiment/public-wyse-r52-linux-guest'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fail-closed negative oracle and shell syntax preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n tools/wyse-qemu-bootbench/run-linux-guest.sh
          bash tools/wyse-qemu-bootbench/run-linux-guest.sh --self-test
          if grep -Ev '^[[:space:]]*#' tools/wyse-qemu-bootbench/run-linux-guest.sh | grep -En -- '-drive|-netdev|hostfwd|usb-host|vfio-pci|mount -o rw'; then
            echo R52_C_FORBIDDEN_GUEST_HOST_DEVICES=RED
            exit 42
          fi
          echo R52_C_NO_GUEST_HOST_DISK_NETWORK_OR_PCI=PASS
      - name: Install QEMU, static BusyBox and disposable test Linux kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 busybox-static cpio linux-image-virtual
          qemu-system-x86_64 --version | head -n1
          command -v busybox
          find /boot -maxdepth 1 -name 'vmlinuz-*' -print
      - name: Boot actual Linux guest, hash one bounded task and shut down
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tools/wyse-qemu-bootbench/run-linux-guest.sh --public-disposable
          grep -Fxq 'R52_C_GUEST_RESULT_AND_CLEAN_EXIT=PASS' evidence/public/r52-linux-guest.txt
          grep -Fxq 'R52_C_AGENT_DISPATCH_REAL_LEASE=NOT_TESTED' evidence/public/r52-linux-guest.txt
          grep -Fxq 'R52_C_WYSE_REAL_KVM_AND_EMMC=NOT_TESTED' evidence/public/r52-linux-guest.txt
      - name: Preserve only safe synthetic guest oracle markers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wyse-r52-real-linux-guest-public-only
          path: evidence/public/r52-linux-guest.txt
          if-no-files-found: warn
          retention-days: 7
