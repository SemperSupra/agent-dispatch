name: R58 public disposable Wyse USB UEFI and isolated QEMU PXE boot
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [experiment/public-wyse-r41-frozen-uki, experiment/public-wyse-r58-uefi-boot-rdte]
    paths:
      - '.github/workflows/public-wyse-r58-uefi-boot.yml'
      - 'scripts/public_wyse_r58_uefi_boot.sh'
      - 'scripts/public_wyse_r28_owned_kernel.sh'
      - 'tools/wyse-buildroot/**'
permissions:
  contents: read
concurrency:
  group: public-wyse-r58-uefi-boot
  cancel-in-progress: false
jobs:
  source-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'experiment/public-wyse-r58-uefi-boot-rdte' || github.head_ref == 'fix/issue-599-r58-boot-diagnostics')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate source-only contract and prohibits host-side boot writes
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/public_wyse_r58_uefi_boot.sh
          bash -n scripts/public_wyse_r28_owned_kernel.sh
          sh tools/wyse-buildroot/preflight-r19.sh
          test -f tools/wyse-buildroot/overlay/etc/init.d/S01wyse-volatile
          grep -Fq WYSE_CORE_TMPFS_NO_EMMC_WRITES=ACTIVE tools/wyse-buildroot/overlay/etc/init.d/S01wyse-volatile
          grep -Fq 'R58_REAL_HYPERV_USB_DHCP_SSH_CONTROLLER_PHYSICAL_WYSE=NOT_TESTED' scripts/public_wyse_r58_uefi_boot.sh
          echo R58_OFFLINE_SOURCE_AND_SCOPE_PREFLIGHT=PASS
      - name: Negative oracle - failed first stage leaves a RED receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          diagnostic_temp="$(mktemp -d "$RUNNER_TEMP/r58-diag-negative-XXXXXX")"
          trap 'rm -rf -- "$diagnostic_temp"; rm -f evidence/public/wyse-r58-boot.txt' EXIT
          set +e
          RUNNER_TEMP="$diagnostic_temp" bash scripts/public_wyse_r58_uefi_boot.sh > "$diagnostic_temp/output.log" 2>&1
          outcome=$?
          set -e
          test "$outcome" -ne 0
          grep -Fxq 'R58_BOOT_RESULT=RED' evidence/public/wyse-r58-boot.txt
          grep -Fxq 'R58_FAILURE_STAGE=kernel_images' evidence/public/wyse-r58-boot.txt
          grep -Fq 'R58_FAILURE_STAGE=kernel_images' "$diagnostic_temp/output.log"
          if grep -Fq 'R58_BOOT_RESULT=PASS' evidence/public/wyse-r58-boot.txt; then exit 1; fi
          echo R58_FAILURE_STAGE_RECEIPT_NEGATIVE=PASS
  real-ovmf-boot:
    needs: [source-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install tools in disposable public runner ONLY
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y             build-essential bc bison flex file libncurses-dev libssl-dev libelf-dev             rsync unzip xz-utils wget curl cpio zstd perl             sbsigntool openssl systemd-ukify faketime libfaketime             qemu-system-x86 ovmf mtools dosfstools systemd-boot-efi
          test -s /usr/lib/systemd/boot/efi/linuxx64.efi.stub || { echo R58_LINUX_X64_EFI_STUB_MISSING=RED; exit 19; }
          echo R58_SYSTEMD_UKI_EFI_STUB=PASS
          echo R58_EPHEMERAL_TOOLS=PASS
      - name: Build source-owned pinned Linux 6.12.113 and Buildroot rootfs
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/public_wyse_r28_owned_kernel.sh
          echo R58_SOURCE_OWNED_KERNEL_AND_ROOTFS=PASS
      - name: Actual OVMF USB-like ESP boot then in-QEMU isolated PXE UEFI boot
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/public_wyse_r58_uefi_boot.sh
          echo R58_REAL_QEMU_FIRMWARE_BOOT_ORACLES=PASS
      - name: Publish only sanitized public textual receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r58-public-text-receipts
          path: evidence/public/wyse-r58-boot.txt
          if-no-files-found: warn
          retention-days: 7
