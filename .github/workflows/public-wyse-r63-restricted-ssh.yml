name: Public Wyse R63 restricted recovery SSH source and injection negatives
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [experiment/public-wyse-r58-uefi-boot-rdte]
    paths:
      - 'tools/wyse-buildroot/overlay/etc/init.d/S50dropbear'
      - 'tools/wyse-buildroot/overlay/usr/libexec/wyse-ssh-readonly'
      - 'scripts/public_wyse_r63_restricted_ssh.sh'
      - '.github/workflows/public-wyse-r63-restricted-ssh.yml'
permissions:
  contents: read
concurrency:
  group: public-wyse-r63-restricted-ssh
  cancel-in-progress: false
jobs:
  restricted-ssh-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify original Buildroot source and no mutation policy
        shell: bash
        run: |
          set -Eeuo pipefail
          sh tools/wyse-buildroot/preflight-r19.sh
          test ! -e evidence/public/wyse-r63-key.txt
          bash -n scripts/public_wyse_r63_restricted_ssh.sh
          sh -n tools/wyse-buildroot/overlay/etc/init.d/S50dropbear
          sh -n tools/wyse-buildroot/overlay/usr/libexec/wyse-ssh-readonly
          echo R63_BUILDROOT_SOURCE_AND_SYNTAX=PASS
      - name: Execute actual read-only CLI positive and injection negative cases
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/public_wyse_r63_restricted_ssh.sh
          echo R63_READONLY_FORCED_CLI_TEST=PASS
