name: QEMU upstream qtest baseline
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/qemu-qtest-baseline.yml'
permissions: {}
jobs:
  source-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect pinned public source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qtest-source"
          cd "$RUNNER_TEMP/qtest-source"
          git init -q
          git fetch --depth=1 https://github.com/qemu/qemu.git 698104725efad4b29079d857dfdebbd804e34c99
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 698104725efad4b29079d857dfdebbd804e34c99
          git show -s --format='%H %s'
          for p in system/qtest.c tests/qtest/libqtest.c tests/qtest/libqos/qgraph.c tests/qtest/usb-hcd-xhci-test.c tests/qtest/meson.build; do
            test -s "$p"
            sha256sum "$p"
          done
          grep -nE 'clock_step|irq_intercept|qtest_process_command' system/qtest.c
          grep -nE 'usb-hcd|qos-test|virtio-' tests/qtest/meson.build
          find tests/qtest/fuzz scripts/oss-fuzz -maxdepth 2 -type f | sort
      - name: Remove disposable source
        if: always()
        run: rm -rf "$RUNNER_TEMP/qtest-source"
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install public build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends build-essential ninja-build pkg-config python3-venv libglib2.0-dev libpixman-1-dev libfdt-dev libslirp-dev zlib1g-dev
      - name: Fetch and build pinned QEMU
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qtest-build" "$RUNNER_TEMP/qtest-evidence"
          cd "$RUNNER_TEMP/qtest-build"
          git init -q
          git fetch --depth=1 https://github.com/qemu/qemu.git 698104725efad4b29079d857dfdebbd804e34c99
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 698104725efad4b29079d857dfdebbd804e34c99
          git show -s --format='%H %s' | tee "$RUNNER_TEMP/qtest-evidence/source.txt"
          mkdir build
          cd build
          ../configure --target-list=x86_64-softmmu --disable-docs --disable-werror --disable-gtk --disable-sdl --disable-vnc --enable-slirp 2>&1 | tee "$RUNNER_TEMP/qtest-evidence/configure.log"
          /usr/bin/time -v ninja -j 3 qemu-system-x86_64 tests/qtest/usb-hcd-xhci-test tests/qtest/usb-hcd-ehci-test tests/qtest/usb-hcd-uhci-test tests/qtest/qos-test 2>&1 | tee "$RUNNER_TEMP/qtest-evidence/build.log"
          ./qemu-system-x86_64 --version | tee "$RUNNER_TEMP/qtest-evidence/version.txt"
      - name: Execute actual upstream suites with explicit selection
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/qtest-build/build"
          e="$RUNNER_TEMP/qtest-evidence"
          m=./pyvenv/bin/meson
          "$m" test --list --suite qtest-x86_64 | tee "$e/suites.txt"
          for name in usb-hcd-xhci-test usb-hcd-ehci-test usb-hcd-uhci-test qos-test; do
            grep -F "qtest-x86_64/$name" "$e/suites.txt"
          done
          # Negative selection must not be mistaken for an executed test.
          if grep -F 'qtest-x86_64/intentionally-nonexistent-test' "$e/suites.txt"; then
            echo 'unexpected negative-control match'; exit 1
          fi
          set +e
          /usr/bin/time -v "$m" test --print-errorlogs --num-processes 2 --logbase qtest-focused qtest-x86_64/usb-hcd-xhci-test qtest-x86_64/usb-hcd-ehci-test qtest-x86_64/usb-hcd-uhci-test qtest-x86_64/qos-test 2>&1 | tee "$e/test-console.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$e/test-exit.txt"
          cp meson-logs/qtest-focused* "$e/"
          exit "$rc"
      - name: Hash receipts
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/qtest-evidence"
          cd "$RUNNER_TEMP/qtest-evidence"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Preserve bounded public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qtest-baseline
          path: ${{ runner.temp }}/qtest-evidence/
          retention-days: 7
      - name: Remove disposable source and build
        if: always()
        run: rm -rf "$RUNNER_TEMP/qtest-build" "$RUNNER_TEMP/qtest-evidence"
