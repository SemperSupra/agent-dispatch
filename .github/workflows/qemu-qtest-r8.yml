name: QEMU VHE bounded interleavings and cohort checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/qemu-qtest-r8.yml'
      - 'experiments/qtest-model-r8/**'
      - 'experiments/qtest-cohort/**'
permissions:
  contents: read
env:
  GO111MODULE: 'off'
  GOPROXY: 'off'
  GOTOOLCHAIN: local
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        cell: [qtest-model-r8, qtest-cohort]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Native source-only qualification
        working-directory: experiments/${{ matrix.cell }}
        run: |
          set -euo pipefail
          go version
          go vet .
          go test -race -count=2 -v .
