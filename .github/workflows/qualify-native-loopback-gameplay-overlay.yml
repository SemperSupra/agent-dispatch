name: Native vanilla263 synthetic player loopback source qualification
on:
  pull_request:
    paths:
      - 'scripts/qualify_native_vanilla263_loopback_player_overlay.py'
      - 'tests/test_native_vanilla263_loopback_player_overlay.py'
      - 'scripts/qualify_native_vanilla263_mineflayer_causal.py'
      - 'scripts/qualify_native_vanilla263_mineflayer_causal.js'
      - 'tests/test_native_vanilla263_mineflayer_causal.py'
      - 'scripts/qualify_native_vanilla263_anvil_blocks.py'
      - 'tests/test_native_vanilla263_anvil_blocks.py'
      - 'scripts/qualify_native_vanilla263_anvil_guest_readback.py'
      - 'tests/test_native_vanilla263_anvil_guest_readback.py'
      - 'tests/test_native_vanilla263_backend_three_checkpoint_receipt.py'
      - 'scripts/truenas_middleware_minecraft_t6_probe.py'
      - 'scripts/assert_vanilla263_native_t6_receipt.py'
      - 'scripts/gha_kvm_truenas_rdte.sh'
      - '.github/workflows/gha-kvm-system-rdte.yml'
      - '.github/workflows/qualify-native-loopback-gameplay-overlay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explicit-offline-rdte-contract:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and adversarially test the source-only loopback variant
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/qualify_native_vanilla263_loopback_player_overlay.py \
            scripts/qualify_native_vanilla263_mineflayer_causal.py \
            tests/test_native_vanilla263_loopback_player_overlay.py \
            tests/test_native_vanilla263_mineflayer_causal.py \
            scripts/qualify_native_vanilla263_anvil_blocks.py \
            tests/test_native_vanilla263_anvil_blocks.py \
            scripts/qualify_native_vanilla263_anvil_guest_readback.py \
            tests/test_native_vanilla263_anvil_guest_readback.py \
            tests/test_native_vanilla263_backend_three_checkpoint_receipt.py \
            scripts/truenas_middleware_minecraft_t6_probe.py \
            scripts/assert_vanilla263_native_t6_receipt.py
          python3 -m unittest -v tests.test_native_vanilla263_loopback_player_overlay
          python3 -m unittest -v tests.test_native_vanilla263_mineflayer_causal
          python3 -m unittest -v tests.test_native_vanilla263_anvil_blocks
          python3 -m unittest -v tests.test_native_vanilla263_anvil_guest_readback
          python3 -m unittest -v tests.test_native_vanilla263_backend_three_checkpoint_receipt
          node --check scripts/qualify_native_vanilla263_mineflayer_causal.js
          bash -n scripts/gha_kvm_truenas_rdte.sh
      - name: Preserve operational auth and physical TrueNAS hold
        run: echo 'Source-only variant; immutable operational online_mode=true, RCON disabled; no QEMU guest, player, world mutation, or physical TrueNAS APPLY.' >> "$GITHUB_STEP_SUMMARY"
