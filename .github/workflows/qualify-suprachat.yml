name: Qualify SupraChat Windows MVP

on:
  pull_request:
    paths:
      - 'prototype/suprachat/**'
      - '.github/workflows/qualify-suprachat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            artifact: suprachat-windows-x64
            codex_asset: codex-x86_64-pc-windows-msvc.exe
            codex_sha256: 57e1bdab42c0559a74558ca17e85d5c7893caa5f1e582f67e9ddd6d97fa705a7
            codex_archive: false
          - os: ubuntu-24.04
            rid: linux-x64
            artifact: suprachat-linux-x64
            codex_asset: codex-x86_64-unknown-linux-musl.tar.gz
            codex_sha256: b48ca1b2d6b1bf42b944e02c3d937c898e24651916684cdc35fdedf31b291bcb
            codex_archive: true
          - os: macos-26
            rid: osx-arm64
            artifact: suprachat-macos-arm64
            codex_asset: codex-aarch64-apple-darwin.tar.gz
            codex_sha256: 51de50a39ea592b5b0a64ae0474548c282181cb6b96d9bd08965a682ae12774c
            codex_archive: true

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CODEX_TAG: rust-v0.159.3
      CODEX_VERSION: 0.159.3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build application
        run: dotnet build prototype/suprachat/SupraChat/SupraChat.csproj -c Release

      - name: Run contract checks
        run: dotnet run --project prototype/suprachat/SupraChat.ContractTests/SupraChat.ContractTests.csproj -c Release

      - name: Build automation and agent shell
        run: dotnet build prototype/suprachat/SupraChat.Automation/SupraChat.Automation.csproj -c Release

      - name: Smoke automation JSON surface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $json = dotnet run --project prototype/suprachat/SupraChat.Automation/SupraChat.Automation.csproj -c Release -- capabilities
          if ($LASTEXITCODE -ne 0) { throw 'SupraChat.Automation capabilities failed.' }
          $doc = $json | ConvertFrom-Json
          if (-not $doc.ok) { throw 'Automation capabilities response was not ok.' }
          if (-not $doc.value.audiences.automation.supported) { throw 'Automation audience not advertised.' }
          if (-not $doc.value.audiences.agent.supported) { throw 'Agent audience not advertised.' }

      - name: Smoke agent JSON-RPC stdio surface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $request = '{"jsonrpc":"2.0","id":1,"method":"capabilities/read"}'
          $lines = $request | dotnet run --project prototype/suprachat/SupraChat.Automation/SupraChat.Automation.csproj -c Release -- stdio 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'SupraChat.Automation stdio failed.' }
          $response = ($lines | Select-Object -Last 1) | ConvertFrom-Json
          if ($response.jsonrpc -ne '2.0') { throw 'JSON-RPC version mismatch.' }
          if ($response.id -ne 1) { throw 'JSON-RPC id mismatch.' }
          if (-not $response.result.audiences.agent.supported) { throw 'Agent JSON-RPC capability missing.' }

      - name: Publish self-contained application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'out/${{ matrix.rid }}'
          dotnet publish prototype/suprachat/SupraChat/SupraChat.csproj -c Release -r '${{ matrix.rid }}' --self-contained true -o $out
          dotnet publish prototype/suprachat/SupraChat.Automation/SupraChat.Automation.csproj -c Release -r '${{ matrix.rid }}' --self-contained true -o $out

      - name: Bundle pinned open-source Codex runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = '${{ matrix.codex_asset }}'
          $expected = '${{ matrix.codex_sha256 }}'
          $url = "https://github.com/openai/codex/releases/download/$env:CODEX_TAG/$asset"
          $tmp = Join-Path $env:RUNNER_TEMP $asset
          $runtime = Join-Path $PWD 'out/${{ matrix.rid }}/runtime/codex'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null

          Invoke-WebRequest -Uri $url -OutFile $tmp
          $actual = (Get-FileHash -Algorithm SHA256 -Path $tmp).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Codex asset digest mismatch: expected=$expected actual=$actual"
          }

          if ('${{ matrix.codex_archive }}' -eq 'true') {
            $extract = Join-Path $env:RUNNER_TEMP "codex-extract-${{ matrix.rid }}"
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            tar -xzf $tmp -C $extract
            if ($LASTEXITCODE -ne 0) { throw 'Failed to extract Codex runtime archive.' }

            $candidate = Get-ChildItem $extract -Recurse -File |
              Where-Object { $_.Name -eq 'codex' -or $_.Name -like 'codex-*' } |
              Sort-Object Length -Descending |
              Select-Object -First 1
            if (-not $candidate) { throw 'Codex executable was not found in archive.' }
            Copy-Item $candidate.FullName (Join-Path $runtime 'codex')
            if ($IsLinux -or $IsMacOS) { chmod +x (Join-Path $runtime 'codex') }
          } else {
            Copy-Item $tmp (Join-Path $runtime 'codex.exe')
          }

          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/openai/codex/$env:CODEX_TAG/LICENSE" -OutFile (Join-Path $runtime 'LICENSE.openai-codex')

          @{
            schema = 'suprachat-bundled-codex/v1'
            version = $env:CODEX_VERSION
            tag = $env:CODEX_TAG
            source_asset = $asset
            source_sha256 = $actual
            license = 'Apache-2.0'
          } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $runtime 'runtime.json')

      - name: Verify bundled Codex runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $PWD 'out/${{ matrix.rid }}/runtime/codex'
          $exe = if ($IsWindows) { Join-Path $runtime 'codex.exe' } else { Join-Path $runtime 'codex' }
          if (!(Test-Path $exe)) { throw "Bundled Codex executable missing: $exe" }
          if (!(Test-Path (Join-Path $runtime 'LICENSE.openai-codex'))) { throw 'Codex license missing.' }
          if (!(Test-Path (Join-Path $runtime 'runtime.json'))) { throw 'Codex runtime receipt missing.' }

          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Codex --version failed with $LASTEXITCODE" }

      - name: Smoke packaged automation and agent shells
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'out/${{ matrix.rid }}'
          $cli = if ($IsWindows) { Join-Path $root 'SupraChat.Automation.exe' } else { Join-Path $root 'SupraChat.Automation' }
          if (!(Test-Path $cli)) { throw "Packaged automation shell missing: $cli" }

          $cap = & $cli capabilities
          if ($LASTEXITCODE -ne 0) { throw 'Packaged automation capabilities failed.' }
          $capDoc = $cap | ConvertFrom-Json
          if (-not $capDoc.ok -or -not $capDoc.value.audiences.automation.supported) {
            throw 'Packaged automation capability contract failed.'
          }

          $request = '{"jsonrpc":"2.0","id":"ci","method":"doctor/read"}'
          $rpc = $request | & $cli stdio 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged agent stdio failed.' }
          $rpcDoc = ($rpc | Select-Object -Last 1) | ConvertFrom-Json
          if ($rpcDoc.id -ne 'ci' -or -not $rpcDoc.result.schema) {
            throw 'Packaged agent JSON-RPC contract failed.'
          }

      - name: Stage and smoke Linux per-user install
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cp prototype/suprachat/packaging/linux/install.sh out/linux-x64/install.sh
          chmod +x out/linux-x64/install.sh

          test_home="$RUNNER_TEMP/suprachat-linux-home"
          mkdir -p "$test_home"
          HOME="$test_home" bash out/linux-x64/install.sh

          test -x "$test_home/.local/opt/suprachat/SupraChat"
          test -x "$test_home/.local/opt/suprachat/SupraChat.Automation"
          test -x "$test_home/.local/bin/suprachat-cli"
          test -L "$test_home/.local/bin/suprachat"
          test -f "$test_home/.local/share/applications/suprachat.desktop"
          grep -q 'x-scheme-handler/suprachat' "$test_home/.local/share/applications/suprachat.desktop"

          cli_json="$(HOME="$test_home" "$test_home/.local/bin/suprachat-cli" capabilities)"
          python3 - "$cli_json" <<'PY'
          import json,sys
          doc=json.loads(sys.argv[1])
          assert doc["ok"] is True
          assert doc["value"]["audiences"]["automation"]["supported"] is True
          assert doc["value"]["audiences"]["agent"]["supported"] is True
          PY

          HOME="$test_home" bash "$test_home/.local/opt/suprachat/uninstall.sh"
          test ! -e "$test_home/.local/opt/suprachat"
          test ! -e "$test_home/.local/bin/suprachat-cli"
          echo 'Linux installed-state human/automation/agent smoke PASS.'

      - name: Stage macOS application bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x prototype/suprachat/packaging/macos/package.sh
          stage="$PWD/out/macos-package"
          prototype/suprachat/packaging/macos/package.sh "$PWD/out/osx-arm64" "$stage"
          cp prototype/suprachat/packaging/macos/install.sh "$stage/install.sh"
          chmod +x "$stage/install.sh"

          test -x "$stage/SupraChat.app/Contents/MacOS/SupraChat"
          test -x "$stage/SupraChat.app/Contents/MacOS/SupraChat.Automation"
          test -x "$stage/SupraChat.app/Contents/MacOS/runtime/codex/codex"
          plutil -extract CFBundleIdentifier raw "$stage/SupraChat.app/Contents/Info.plist" | grep -qx 'com.sempersupra.suprachat'
          plutil -p "$stage/SupraChat.app/Contents/Info.plist" | grep -q 'suprachat'
          codesign --verify --deep --strict "$stage/SupraChat.app"

          cli_json="$("$stage/SupraChat.app/Contents/MacOS/SupraChat.Automation" capabilities)"
          python3 - "$cli_json" <<'PY'
          import json,sys
          doc=json.loads(sys.argv[1])
          assert doc["ok"] is True
          assert doc["value"]["platform"] == "macos"
          assert doc["value"]["audiences"]["agent"]["supported"] is True
          PY

      - name: Smoke macOS per-user install
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          stage="$PWD/out/macos-package"
          test_home="$RUNNER_TEMP/suprachat-macos-home"
          mkdir -p "$test_home"

          HOME="$test_home" bash "$stage/install.sh"
          test -d "$test_home/Applications/SupraChat.app"
          test -x "$test_home/.local/bin/suprachat-cli"
          test -L "$test_home/.local/bin/suprachat-gui"

          cli_json="$(HOME="$test_home" "$test_home/.local/bin/suprachat-cli" doctor)"
          python3 - "$cli_json" <<'PY'
          import json,sys
          doc=json.loads(sys.argv[1])
          assert doc["ok"] is True
          assert doc["value"]["platform"] == "macos"
          PY

          HOME="$test_home" bash "$test_home/Applications/SupraChat.app/Contents/Resources-uninstall.sh"
          test ! -e "$test_home/Applications/SupraChat.app"
          test ! -e "$test_home/.local/bin/suprachat-cli"

          rm -rf "$PWD/out/osx-arm64"
          mv "$stage" "$PWD/out/osx-arm64"
          echo 'macOS installed-state human/automation/agent smoke PASS.'

      - name: Stage Windows per-user installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item prototype/suprachat/packaging/windows/install.ps1 out/win-x64/install.ps1
          Copy-Item prototype/suprachat/packaging/windows/Install-SupraChat.cmd out/win-x64/Install-SupraChat.cmd

      - name: Windows installer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $PWD 'out/win-x64'
          & (Join-Path $source 'install.ps1') -NoLaunch

          $installed = Join-Path $env:LOCALAPPDATA 'Programs/SupraChat'
          $installedExe = Join-Path $installed 'SupraChat.exe'
          $installedCodex = Join-Path $installed 'runtime/codex/codex.exe'
          $arp = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\SupraChat'
          $protocol = 'HKCU:\Software\Classes\suprachat'
          $appKey = 'HKCU:\Software\Classes\Applications\SupraChat.exe'
          $protocolCommand = Join-Path $protocol 'shell\open\command'
          $appCommand = Join-Path $appKey 'shell\open\command'
          $supportedTypes = Join-Path $appKey 'SupportedTypes'

          if (!(Test-Path $installedExe)) { throw 'Installed SupraChat.exe missing.' }
          if (!(Test-Path $installedCodex)) { throw 'Installed bundled Codex runtime missing.' }
          if (!(Test-Path (Join-Path $installed 'SupraChat.Automation.exe'))) { throw 'Installed automation/agent shell missing.' }
          if (!(Test-Path $arp)) { throw 'Add/Remove Programs registration missing.' }
          if (!(Test-Path $protocolCommand)) { throw 'suprachat:// protocol registration missing.' }
          if (!(Test-Path $appCommand)) { throw 'Open With command registration missing.' }
          if (!(Test-Path $supportedTypes)) { throw 'Open With supported-types registration missing.' }
          if (-not (Get-ItemProperty -Path $supportedTypes).PSObject.Properties.Name.Contains('.pdf')) {
            throw 'Expected .pdf Open With registration missing.'
          }

          $registeredProtocol = (Get-Item -Path $protocolCommand).GetValue('')
          $registeredOpenWith = (Get-Item -Path $appCommand).GetValue('')
          if ($registeredProtocol -notlike '*SupraChat.exe*"%1"*') { throw 'Protocol command is malformed.' }
          if ($registeredOpenWith -notlike '*SupraChat.exe*"%1"*') { throw 'Open With command is malformed.' }

          Remove-Item (Join-Path $env:APPDATA 'Microsoft/Windows/Start Menu/Programs/SupraChat.lnk') -Force -ErrorAction SilentlyContinue
          Remove-Item $arp -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $protocol -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $appKey -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $installed -Recurse -Force -ErrorAction SilentlyContinue
          'Per-user installer + protocol/Open-With smoke PASS.'

      - name: Windows GUI launch smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'out/win-x64/SupraChat.exe'
          $startupLog = Join-Path $env:RUNNER_TEMP 'suprachat-startup.log'
          $stdoutLog = Join-Path $env:RUNNER_TEMP 'suprachat-stdout.log'
          $stderrLog = Join-Path $env:RUNNER_TEMP 'suprachat-stderr.log'
          if (!(Test-Path $exe)) { throw "SupraChat.exe missing" }

          $env:SUPRACHAT_STARTUP_LOG = $startupLog
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
          Start-Sleep -Seconds 8

          if ($p.HasExited) {
            Write-Host "SupraChat exited during launch smoke with code $($p.ExitCode)"
            if (Test-Path $startupLog) { Get-Content $startupLog }
            if (Test-Path $stdoutLog) { Get-Content $stdoutLog }
            if (Test-Path $stderrLog) { Get-Content $stderrLog }
            throw "SupraChat self-contained launch failed with code $($p.ExitCode)"
          }

          Stop-Process -Id $p.Id -Force
          "SupraChat remained alive through an 8-second self-contained Windows launch smoke."

      - name: Upload self-contained application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 7


  linux-desktop-oracle-census:
    name: Linux ChatGPT desktop runtime deep census
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recover and decompose official Linux desktop packages
        shell: bash
        run: bash prototype/suprachat/tools/census_linux_desktop.sh
      - name: Upload Linux clean-room evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-linux-deep-runtime-census
          path: out/desktop-oracle/linux/
          if-no-files-found: error
          retention-days: 7

  macos-desktop-oracle-census:
    name: macOS ChatGPT desktop runtime deep census
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recover and decompose official macOS desktop applications
        shell: bash
        run: bash prototype/suprachat/tools/census_macos_desktop.sh
      - name: Upload macOS clean-room evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-macos-deep-runtime-census
          path: out/desktop-oracle/macos/
          if-no-files-found: error
          retention-days: 7
