name: RDMA Verbs Closure

on:
  workflow_dispatch:
  pull_request:
    branches:
      - exp/runner-latent-hardware-surfaces
    paths:
      - scripts/github_runner_rdma_closure.py
      - .github/workflows/rdma-verbs-closure.yml

permissions:
  contents: read

jobs:
  verbs-closure:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner:
          - ubuntu-26.04
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Close RDMA verbs primitive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/rdma-closure"
          python3 scripts/github_runner_rdma_closure.py             --label "${{ matrix.runner }}"             --out "${RUNNER_TEMP}/rdma-closure/receipt.json"
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rdma-closure-${{ matrix.runner }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rdma-closure/receipt.json
          if-no-files-found: error
          retention-days: 7
