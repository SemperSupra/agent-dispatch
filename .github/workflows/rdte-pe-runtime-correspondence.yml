name: Native PE64 runtime correspondence
on:
  pull_request:
    paths:
      - '.github/workflows/rdte-pe-runtime-correspondence.yml'
permissions:
  contents: read
jobs:
  pe:
    name: Windows native PE64 (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [default, debug]
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      MODE: ${{ matrix.mode }}
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOWORK: 'off'
      CGO_ENABLED: '0'
    steps:
      - name: Compile and execute disposable native application
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, html, json, os, re, struct, subprocess, tempfile
          from pathlib import Path
          out=Path("evidence").resolve()
          out.mkdir(exist_ok=False)
          src=r'''
          package main
          import (
              "encoding/json"
              "fmt"
              "os"
              "runtime"
              "strconv"
              "syscall"
              "unsafe"
          )
          type State struct { Active bool; Credits int }
          type Entry struct { PC uintptr; Entry uintptr; Name string }
          //go:noinline
          func apply(s *State,cost int) Entry {
              s.Credits-=cost
              pc,_,_,ok:=runtime.Caller(0)
              if !ok { panic("caller") }
              f:=runtime.FuncForPC(pc)
              return Entry{pc,f.Entry(),f.Name()}
          }
          //go:noinline
          func deny(s *State,cost int) Entry {
              pc,_,_,ok:=runtime.Caller(0)
              if !ok { panic("caller") }
              f:=runtime.FuncForPC(pc)
              return Entry{pc,f.Entry(),f.Name()}
          }
          var k=syscall.NewLazyDLL("kernel32.dll")
          func modulePath(base uintptr) string {
              buf:=make([]uint16,32768)
              n,_,_:=k.NewProc("GetModuleFileNameW").Call(base,uintptr(unsafe.Pointer(&buf[0])),uintptr(len(buf)))
              if n==0 || n>=uintptr(len(buf)) { panic("module filename") }
              return syscall.UTF16ToString(buf[:n])
          }
          func main(){
              if len(os.Args)!=3 { os.Exit(2) }
              p:=os.Args[1]; cost,e:=strconv.Atoi(os.Args[2])
              if e!=nil || cost<=0 { os.Exit(2) }
              b,e:=os.ReadFile(p); if e!=nil { panic(e) }
              var s State; if json.Unmarshal(b,&s)!=nil || s.Credits<0 { os.Exit(3) }
              var entry Entry
              if s.Active && s.Credits>=cost {
                  entry=apply(&s,cost)
                  b,e=json.Marshal(s); if e!=nil { panic(e) }
                  if os.WriteFile(p,b,0600)!=nil { panic("write") }
              } else { entry=deny(&s,cost) }
              base,_,_:=k.NewProc("GetModuleHandleW").Call(0)
              if base==0 { panic("app base") }
              proc:=k.NewProc("GetCurrentProcessId")
              if e=proc.Find(); e!=nil { panic(e) }
              addr:=proc.Addr()
              pid,_,_:=proc.Call()
              var owner uintptr
              ok,_,_:=k.NewProc("GetModuleHandleExW").Call(6,addr,uintptr(unsafe.Pointer(&owner)))
              if ok==0 || owner==0 || int(pid)!=os.Getpid() { panic("library owner") }
              result:=map[string]any{"app":entry,"app_base":base,"app_path":modulePath(base),"library_entry":addr,"library_base":owner,"library_path":modulePath(owner),"pid":pid}
              b,e=json.Marshal(result); if e!=nil { panic(e) }; fmt.Println(string(b))
          }
          '''
          def req(ok,msg):
              if not ok: raise ValueError(msg)
          def sha(b): return hashlib.sha256(b).hexdigest()
          def write(p,o): p.write_text(json.dumps(o,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          def pe(data):
              req(len(data)>=64 and data[:2]==b"MZ","DOS signature")
              offset=struct.unpack_from("<I",data,60)[0]
              req(offset+24<=len(data) and data[offset:offset+4]==b"PE\x00\x00","PE signature")
              machine,count,_,_,_,size,_=struct.unpack_from("<HHIIIHH",data,offset+4)
              start=offset+24
              req(machine==0x8664 and 0<count<=96 and size>=112 and start+size+40*count<=len(data),"PE64 bounds")
              req(struct.unpack_from("<H",data,start)[0]==0x20b,"PE32+ magic")
              base=struct.unpack_from("<Q",data,start+24)[0]
              image_size=struct.unpack_from("<I",data,start+56)[0]
              sections=[]
              for i in range(count):
                  at=start+size+40*i
                  name=data[at:at+8].split(b"\0")[0].decode("ascii",errors="replace")
                  virtual,rva,raw,ptr=struct.unpack_from("<IIII",data,at+8)
                  flags=struct.unpack_from("<I",data,at+36)[0]
                  req(ptr+raw<=len(data) and rva+max(raw,virtual)<=image_size,"section bounds")
                  sections.append(dict(name=name,rva=rva,virtual_size=virtual,raw_size=raw,raw_pointer=ptr,executable=bool(flags&0x20000000)))
              return dict(image_base=base,image_size=image_size,sections=sections,sha256=sha(data))
          def resolve(meta,base,address,pin):
              req(meta["sha256"]==pin,"wrong image pin")
              rva=address-base
              req(base>0 and 0<=rva<meta["image_size"],"outside loaded image")
              matches=[s for s in meta["sections"] if s["rva"]<=rva<s["rva"]+max(s["virtual_size"],s["raw_size"])]
              req(len(matches)==1,"not uniquely mapped")
              s=matches[0]; delta=rva-s["rva"]
              req(s["executable"] and delta<s["raw_size"],"not file-backed executable")
              return dict(rva=rva,preferred_va=meta["image_base"]+rva,file_offset=s["raw_pointer"]+delta,section=s["name"])
          mode=os.environ["MODE"]
          req(mode in ("default","debug"),"mode")
          (out/"fixture.go").write_text(src,encoding="utf-8")
          rows=[]; controls=[]; modules={}
          with tempfile.TemporaryDirectory(prefix="pe64-fixture-") as td:
              work=Path(td); code=work/"main.go"; code.write_text(src,encoding="utf-8"); exe=work/"fixture.exe"
              args=["go","build","-trimpath","-buildvcs=false"]
              if mode=="debug": args.append("-gcflags=-N -l")
              subprocess.run(args+["-o",str(exe),str(code)],check=True,timeout=480,cwd=work)
              data=exe.read_bytes(); app=pe(data); (out/"fixture.exe").write_bytes(data)
              nm=subprocess.check_output(["go","tool","nm","-size",str(exe)],text=True,timeout=60)
              symbols={}
              for line in nm.splitlines():
                  p=line.split()
                  if len(p)==4 and p[-1] in ("main.apply","main.deny"):
                      symbols[p[-1]]=(int(p[0],16),int(p[1]))
              req(set(symbols)=={"main.apply","main.deny"} and all(n>0 for _,n in symbols.values()),"missing native symbols")
              write(out/"app-pe.json",app); write(out/"app-symbols.json",symbols)
              for case,active,credit,cost,expected in [("apply",True,10,3,7),("inactive",False,10,3,10),("insufficient",True,2,3,2),("boundary",True,3,3,0)]:
                  state=work/(case+".json"); before=json.dumps(dict(Active=active,Credits=credit)).encode(); state.write_bytes(before)
                  p=subprocess.run([str(exe),str(state),str(cost)],capture_output=True,check=True,timeout=30)
                  capture=json.loads(p.stdout); after=state.read_bytes()
                  req(json.loads(after)==dict(Active=active,Credits=expected),"actual state mismatch")
                  req((before==after)==(expected==credit),"actual byte relation mismatch")
                  req(Path(capture["app_path"]).resolve()==exe.resolve(),"wrong application path")
                  a=capture["app"]; want="main.apply" if expected!=credit else "main.deny"
                  req(a["Name"]==want,"wrong observed runtime frame")
                  pc=resolve(app,capture["app_base"],a["PC"],app["sha256"])
                  entry=resolve(app,capture["app_base"],a["Entry"],app["sha256"])
                  sv,ss=symbols[want]
                  req(entry["preferred_va"]==sv and sv<=pc["preferred_va"]<sv+ss,"PC/symbol correspondence")
                  library=Path(capture["library_path"])
                  req(library.name.lower().endswith(".dll"),"not a DLL")
                  ld=library.read_bytes(); meta=pe(ld)
                  lp=resolve(meta,capture["library_base"],capture["library_entry"],meta["sha256"])
                  modules[meta["sha256"]]=dict(name=library.name,pe=meta)
                  # No system DLL is redistributed; only its metadata and a bounded mapped-byte witness.
                  row=dict(case=case,initial=credit,final=expected,active=active,cost=cost,app_frame=want,app_pc=pc,app_entry=entry,library_export="GetCurrentProcessId",library_owner=library.name,library_sha256=meta["sha256"],library_entry=lp,library_bytes=ld[lp["file_offset"]:lp["file_offset"]+8].hex(),before_sha256=sha(before),after_sha256=sha(after),capture=capture,claim="in-process caller PC and export entry correspondence; no external debugger stop or causal proof")
                  (out/(case+"-before.json")).write_bytes(before); (out/(case+"-after.json")).write_bytes(after); write(out/(case+"-capture.json"),capture)
                  rows.append(row)
                  bad=[("wrong-pin",capture["app_base"],a["PC"],"0"*64),("below-base",capture["app_base"],capture["app_base"]-1,app["sha256"]),("outside-image",capture["app_base"],capture["app_base"]+app["image_size"],app["sha256"])]
                  nonexec=next(s for s in app["sections"] if not s["executable"] and s["raw_size"]>0)
                  bad.append(("non-executable",capture["app_base"],capture["app_base"]+nonexec["rva"],app["sha256"]))
                  for label,base,addr,pin in bad:
                      try: resolve(app,base,addr,pin)
                      except ValueError: controls.append(dict(case=case,control=label,status="REFUSED"))
                      else: raise RuntimeError("negative control accepted: "+label)
              write(out/"library-metadata.json",modules)
          claim="source-known native Windows PE64 app, in-process caller PC and actual library export invocation/ownership; no external observer, authenticated producer, general causality or model qualification"
          receipt=dict(schema="public-pe-runtime-correspondence-v1",run_id=os.environ["GITHUB_RUN_ID"],commit=os.environ["GITHUB_SHA"],mode=mode,go=subprocess.check_output(["go","version"],text=True).strip(),claim=claim,app_sha256=app["sha256"],rows=rows,controls=controls)
          write(out/"receipt.json",receipt)
          esc=lambda x:html.escape(str(x))
          lines="".join("<tr>"+"".join("<td>"+esc(v)+"</td>" for v in [r["case"],r["initial"],r["final"],r["app_frame"],hex(r["app_pc"]["rva"]),r["library_owner"],hex(r["library_entry"]["rva"])])+"</tr>" for r in rows)
          (out/"report.html").write_text('<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>PE64 runtime correspondence</title><style>body{font:16px system-ui;max-width:1100px;margin:24px auto;padding:12px}td,th{padding:12px;border-bottom:1px solid #b6c2d2;text-align:left}table{border-collapse:collapse;width:100%}</style><h1>PE64 runtime correspondence</h1><p>'+esc(mode)+' · '+esc(claim)+'</p><p>4 native cases · 16 refusal controls</p><table><thead><tr><th>Case</th><th>Before</th><th>After</th><th>Application frame</th><th>PC RVA</th><th>DLL owner</th><th>Export RVA</th></tr></thead><tbody>'+lines+'</tbody></table></html>',encoding="utf-8")
          (out/"SHA256SUMS").write_text("".join(sha(p.read_bytes())+"  "+p.name+"\n" for p in sorted(out.iterdir()) if p.is_file()),encoding="utf-8")
          print(json.dumps(dict(mode=mode,cases=len(rows),controls=len(controls),app_sha256=app["sha256"])))
          PY
      - name: Retain PE64 native execution products
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pe-runtime-${{ matrix.mode }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
