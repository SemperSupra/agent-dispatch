name: Sealed Public Execution Windows
run-name: Sealed Windows execution ${{ inputs.assignment_id }}

on:
  workflow_dispatch:
    inputs:
      assignment_id:
        description: "Opaque assignment correlation ID"
        required: true
        type: string
      capsule_b64:
        description: "Base64 gzip-tar capsule; public-safe projection only"
        required: true
        type: string
      capsule_sha256:
        description: "Lowercase SHA-256 of decoded capsule bytes"
        required: true
        type: string
      recipient:
        description: "Ephemeral age X25519 public recipient (age1...)"
        required: true
        type: string
      timeout_seconds:
        description: "Task timeout, max 7200 seconds"
        required: false
        default: "3600"
        type: string

permissions:
  contents: read

jobs:
  execute:
    runs-on: windows-2025
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install public result sealer
        shell: pwsh
        run: |
          go version
          go install filippo.io/age/cmd/age@v1.2.1
          $bin = Join-Path (go env GOPATH) "bin"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin

      - name: Execute public-safe PowerShell capsule and seal evidence
        id: execute
        shell: pwsh
        env:
          ASSIGNMENT_ID: ${{ inputs.assignment_id }}
          CAPSULE_B64: ${{ inputs.capsule_b64 }}
          CAPSULE_SHA256: ${{ inputs.capsule_sha256 }}
          AGE_RECIPIENT: ${{ inputs.recipient }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: |
          $ErrorActionPreference = 'Continue'
          python scripts/sealed_public_execution.py --platform windows `
            --assignment-id "$env:ASSIGNMENT_ID" `
            --capsule-b64 "$env:CAPSULE_B64" `
            --capsule-sha256 "$env:CAPSULE_SHA256" `
            --recipient "$env:AGE_RECIPIENT" `
            --timeout-seconds "$env:TIMEOUT_SECONDS" `
            --out-dir .sealed
          $taskRC = $LASTEXITCODE
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "task_rc=$taskRC"
          exit 0

      - name: Upload sealed result mailbox
        if: always() && hashFiles('.sealed/result.age', '.sealed/receipt.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-${{ inputs.assignment_id }}
          path: |
            .sealed/result.age
            .sealed/receipt.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Preserve task verdict
        if: always()
        shell: pwsh
        env:
          TASK_RC: ${{ steps.execute.outputs.task_rc }}
        run: |
          if (-not $env:TASK_RC) { exit 1 }
          exit [int]$env:TASK_RC
