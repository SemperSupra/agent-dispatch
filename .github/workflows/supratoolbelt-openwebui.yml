name: SupraToolbelt Open WebUI disposable state externalization RDTE
on:
  push:
    branches: [rdte/supratoolbelt-openwebui-20261111]
    paths: [.github/workflows/supratoolbelt-openwebui.yml]
  pull_request:
    paths: [.github/workflows/supratoolbelt-openwebui.yml]
permissions:
  contents: read
jobs:
  webui-disposable:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Pull official slim image and record immutable image provenance
        run: |
          set -euo pipefail
          docker pull ghcr.io/open-webui/open-webui:slim
          docker image inspect --format '{{index .RepoDigests 0}}' \
            ghcr.io/open-webui/open-webui:slim > webui-image-ref.txt
          docker image inspect --format '{{.Architecture}} {{.Os}} {{.Size}} {{.Config.User}}' \
            ghcr.io/open-webui/open-webui:slim > webui-image-meta.txt
      - name: Generate disposable secret and external state volume
        run: |
          set -euo pipefail
          docker volume create supra-openwebui-rdte
          umask 077
          printf 'WEBUI_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" > webui.env
          cat >> webui.env <<'ENV'
          WEBUI_AUTH=true
          ENABLE_SIGNUP=false
          ENABLE_OLLAMA_API=false
          ENABLE_OPENAI_API=false
          ENABLE_PERSISTENT_CONFIG=false
          ENABLE_TOOL_SERVERS=true
          ENV
      - name: Define reusable versioned-runtime start procedure
        run: |
          cat > start-webui.sh <<'SH'
          #!/bin/sh
          set -eu
          docker run -d --name supra-openwebui-rdte \
            --publish 127.0.0.1:33080:8080 \
            --mount type=volume,source=supra-openwebui-rdte,target=/app/backend/data \
            --env-file webui.env \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 2g --cpus 2 \
            ghcr.io/open-webui/open-webui:slim
          for attempt in $(seq 1 95); do
            status=$(curl -sS -o webui-health-body.txt -w '%{http_code}' --max-time 2 \
              http://127.0.0.1:33080/health || true)
            if [ "$status" = 200 ]; then echo "$status" > webui-health-status.txt; exit 0;fi
            if [ "$(docker inspect --format '{{.State.Running}}' supra-openwebui-rdte)" != true ];then
              docker logs --tail 30 supra-openwebui-rdte 2>&1 | tail -25
              exit 1
            fi
            sleep 2
          done
          docker logs --tail 30 supra-openwebui-rdte 2>&1 | tail -25
          exit 1
          SH
          chmod +x start-webui.sh
      - name: Start actual web service with ephemeral app and externalized volume
        run: ./start-webui.sh
      - name: Assert state location and security boundaries before recreation
        run: |
          set -euo pipefail
          test "$(cat webui-health-status.txt)" = 200
          docker exec supra-openwebui-rdte test -s /app/backend/data/webui.db
          docker run --rm --mount type=volume,source=supra-openwebui-rdte,target=/data \
            busybox:1.36 sh -c 'printf "rdte-check\n" > /data/.rdte-sentinel'
          docker inspect --format '{{range .Mounts}}{{.Destination}} {{end}}' supra-openwebui-rdte |
            grep -q /app/backend/data
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' supra-openwebui-rdte)" = default
          test "$(docker inspect --format '{{.HostConfig.Privileged}}' supra-openwebui-rdte)" = false
          test "$(docker inspect --format '{{.HostConfig.PortBindings}}' supra-openwebui-rdte)" != ""
      - name: Destroy and recreate runtime with SAME external state and secret
        run: |
          set -euo pipefail
          docker rm -f supra-openwebui-rdte
          ./start-webui.sh
          docker exec supra-openwebui-rdte test -s /app/backend/data/webui.db
          docker exec supra-openwebui-rdte test -f /app/backend/data/.rdte-sentinel
          test "$(cat webui-health-status.txt)" = 200
      - name: Record sanitized reproducible operational receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          image=pathlib.Path("webui-image-ref.txt").read_text().strip()
          def dock(*parts):
              return subprocess.check_output(["docker",*parts],text=True).strip()
          obj=json.loads(dock("inspect","supra-openwebui-rdte"))[0]
          host=obj["HostConfig"]
          receipt={"schema":"m1-openwebui-disposable-runtime-v1",
             "image":image,
             "webuiHealthHttp":int(pathlib.Path("webui-health-status.txt").read_text()),
             "containerPrivileged":host["Privileged"],
             "capDrop":host["CapDrop"],"noNewPrivileges":host["SecurityOpt"],
             "containerRecreated":True,"externalStateReused":True,
             "secretsOnlyInEphemeralEnvFile":True,"publicIngress":False,
             "passed":host["Privileged"] is False and "ALL" in host["CapDrop"],
             "limitations":["Docker-hosted rootful engine; NOT proven rootless Podman",
                "App runtime is disposable, but Open WebUI itself is stateful in a named volume",
                "No MCP admin registration or real model tool calling was exercised",
                "No persisted Open WebUI user credential or actual OAuth test",
                "No multi-user or browser-level agent context isolation test"]}
          pathlib.Path("openwebui-rdte-receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,indent=2,sort_keys=True))
          assert receipt["passed"]
          PY
      - name: Always destroy runtime, state and ephemeral secrets
        if: always()
        run: |
          docker rm -f supra-openwebui-rdte >/dev/null 2>&1 || true
          docker volume rm -f supra-openwebui-rdte >/dev/null 2>&1 || true
          rm -f webui.env start-webui.sh webui-health-body.txt
          test ! -e webui.env
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: supra-openwebui-disposable-${{ github.run_id }}
          path: |
            webui-image-ref.txt
            webui-image-meta.txt
            openwebui-rdte-receipt.json
