name: USB Fabric R10 stale keydown signed-claim ledger critic
on:
  push:
    branches: [test/issue-449-guest-event-monotonic]
    paths:
      - '.github/workflows/usb-fabric-r10-stale-down.yml'
      - 'experiments/usb-fabric-r26/integrated/heldledger/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/usb-fabric-r10-stale-down.yml'
      - 'experiments/usb-fabric-r26/integrated/heldledger/**'
permissions:
  contents: read
jobs:
  ledger-critic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Offline race checked actual existing heldledger and adversarial critic
        shell: bash
        working-directory: experiments/usb-fabric-r26/integrated
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: "local"
          GOSUMDB: "off"
        run: |
          set -Eeuo pipefail
          go version
          go test -race -count=1 -v ./heldledger
          go vet ./heldledger
          test -z "$(git status --porcelain --untracked-files=all)"
          echo R10_EXISTING_BROKER_HELDLEDGER_NO_TAINT=PASS
