name: USB Fabric R17 existing broker and durable journal gated two-lease handoff
on:
  push:
    branches: [test/issue-458-broker-ledger-handoff]
    paths:
      - '.github/workflows/usb-fabric-r17-broker-ledger-handoff.yml'
      - 'experiments/usb-fabric-r26/integrated/blue/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/usb-fabric-r17-broker-ledger-handoff.yml'
      - 'experiments/usb-fabric-r26/integrated/blue/**'
permissions:
  contents: read
jobs:
  broker-journal-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Existing Go manager plus journal proof and stale-lease critic, offline
        shell: bash
        working-directory: experiments/usb-fabric-r26/integrated
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: "local"
          GOSUMDB: "off"
        run: |
          set -Eeuo pipefail
          go version
          go test -race -count=1 -v ./blue ./heldledger
          go vet ./blue ./heldledger
          test -z "$(git status --porcelain --untracked-files=all)"
          echo R17_EXISTING_BROKER_LEDGER_JOURNAL_NO_TAINT=PASS
