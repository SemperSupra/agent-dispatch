name: USB Fabric R18 concurrent guest-proof/lease readmission critic
on:
  push:
    branches: [test/issue-460-broker-concurrency-critic]
    paths:
      - '.github/workflows/usb-fabric-r18-concurrent-reentry.yml'
      - 'experiments/usb-fabric-r26/integrated/blue/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/usb-fabric-r18-concurrent-reentry.yml'
      - 'experiments/usb-fabric-r26/integrated/blue/**'
permissions:
  contents: read
jobs:
  no-stale-leases:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Race actual existing Manager and fsynced Store during blocked verifier
        shell: bash
        working-directory: experiments/usb-fabric-r26/integrated
        env:
          GOPROXY: "off"
          GOTOOLCHAIN: "local"
          GOSUMDB: "off"
        run: |
          set -Eeuo pipefail
          go version
          go test -race -count=1 -timeout 80s -v ./blue ./heldledger
          go vet ./blue ./heldledger
          test -z "$(git status --porcelain --untracked-files=all)"
          echo R18_CONCURRENT_MANAGER_JOURNAL_NO_TAINT=PASS
