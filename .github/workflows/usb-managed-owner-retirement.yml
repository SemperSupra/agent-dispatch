name: USB managed original scoped HELD genesis qualification
on:
  push:
    branches: [qual/usb-managed-owner-retirement-20261126]
permissions:
  contents: read
concurrency:
  group: usb-managed-owner-retirement-20261126
  cancel-in-progress: false
jobs:
  original-go-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify original scoped journal and inherited owner suite
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOWORK: 'off'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 923f63c382fb82e16d5ab60881336313b763aa98
          go version
          cd experiments/usb-fabric-r26/integrated
          go test -race -count=3 -timeout=120s ./...
          go vet ./...
          go test -race -count=20 -timeout=90s -v ./heldledger -run '^TestScoped'
          go test -race -count=5 -timeout=90s -v ./blue -run '^Test(ClosedRecoveredOwnerCannotReuseManager|RecoveredOwnerCloseRacesReserve)$'
          echo SCOPED_HELD_GENESIS_NO_GRANT_NOT_G4_OR_HIL
