name: USB managed scoped first admission fence
on:
  push:
    branches: [qual/usb-managed-owner-retirement-20261126]
permissions:
  contents: read
concurrency:
  group: usb-managed-owner-retirement-20261126
  cancel-in-progress: false
jobs:
  original-go-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Original heldledger witness and durable intent qualification
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOWORK: 'off'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = c5984fd7f35ab6c5bef8c7001bf8210d80153da7
          go version
          cd experiments/usb-fabric-r26/integrated
          go test -race -count=3 -timeout=120s ./...
          go vet ./...
          go test -race -count=20 -timeout=90s -v ./heldledger -run '^TestScoped'
          go test -race -count=5 -timeout=90s -v ./blue -run '^Test(ClosedRecoveredOwnerCannotReuseManager|RecoveredOwnerCloseRacesReserve)$'
          echo V2_SIGNED_FIXTURE_INTENT_ONLY_NO_LIVE_WITNESS_OR_GRANT
