name: USB managed scoped resource owner and first admission fence
on:
  push:
    branches: [qual/usb-managed-owner-retirement-20261126]
permissions:
  contents: read
concurrency:
  group: usb-managed-owner-retirement-20261126
  cancel-in-progress: false
jobs:
  original-go-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Original package and stable resource conflict qualification
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOWORK: 'off'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 8e4d4c0b6ca9d16d3440d6d0d6d7163a3e613f2b
          go version
          cd experiments/usb-fabric-r26/integrated/
          go test -race -count=3 -timeout=120s ./...
          go vet ./...
          go test -race -count=10 -timeout=90s -v ./blue -run '^TestScopedOwner'
          go test -race -count=10 -timeout=90s -v ./heldledger -run '^TestScoped'
          echo SCOPED_OWNER_FIXTURE_WITNESSES_ONLY_NOT_REAL_USBIP_OR_GRANT
