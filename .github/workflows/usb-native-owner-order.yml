name: USB native protected service qualification
on:
  push:
    branches: [qual/usb-native-owner-before-qmp-20261126]
permissions:
  contents: read
concurrency:
  group: usb-native-owner-order-20261126
  cancel-in-progress: false
jobs:
  original-go-and-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Original package and separate frontend policy
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOWORK: 'off'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = d883f580ec3dbe55da636485d5f3bac7e7a74b3b
          go version
          cd experiments/usb-fabric-r26/integrated
          go test -race -count=3 -timeout=120s ./...
          go vet ./...
          go build -trimpath -o "$RUNNER_TEMP/native-actuator" ./cmd/actuator
          go test -race -count=10 -timeout=90s -v ./cmd/actuator -run '^TestProtectedFrontend'
      - name: Actual actuator process and QEMU with distinct frontend UID
        shell: bash
        env:
          USB_NATIVE_QEMU_LIVE: '1'
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          if ! command -v qemu-system-x86_64 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends qemu-system-x86
          fi
          qemu-system-x86_64 --version
          cd experiments/usb-fabric-r26/integrated
          go test -race -count=1 -timeout=90s -v ./cmd/actuator -run '^TestLive(QEMUOwnerBeforeNegotiation|ProtectedQMPDistinctUID)$'
          python3 -B cmd/actuator/protected_frontend_live.py "$RUNNER_TEMP/native-actuator"
          rm -f "$RUNNER_TEMP/native-actuator"
          echo NATIVE_SERVICE_READONLY_NO_GUEST_HID_OR_FD_TRANSFER_CLAIM
