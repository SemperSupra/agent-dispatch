name: USB native protected real signed guest HID
on:
  push:
    branches: [qual/usb-native-owner-before-qmp-20261126]
permissions:
  contents: read
concurrency:
  group: usb-native-owner-order-20261126
  cancel-in-progress: false
jobs:
  protected-guest-hid:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Source pin and original package checks
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOWORK: 'off'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = eb3e5a394097a5f3b45b5beaf566f46bd3f66ac7
          cd experiments/usb-fabric-r26/integrated/
          go test -race -count=1 -timeout=120s ./...
          go vet ./...
          python3 -B -c 'import ast; ast.parse(open("protected_signed_hid_oracle.py").read())'
      - name: Same-run protected service, Linux guest HID, release and detach
        run: bash experiments/usb-fabric-r26/integrated/protected_signed_hid_verify.sh
