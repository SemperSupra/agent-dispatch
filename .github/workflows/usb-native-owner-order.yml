name: USB native owner order bounded qualification
on:
  push:
    branches: [qual/usb-native-owner-before-qmp-20261126]
permissions:
  contents: read
concurrency:
  group: usb-native-owner-order-20261126
  cancel-in-progress: false
jobs:
  original-go-and-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact source and original package suite
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOWORK: 'off'
        run: |
          set -euo pipefail
          git rev-parse HEAD
          go version
          test "$(git rev-parse HEAD^)" = 15a3b7a1b18b7b5af3ed0ece65b33bf4941eb5d8
          cd experiments/usb-fabric-r26/integrated
          go test -race -count=3 -timeout=120s ./...
          go vet ./...
          go build -trimpath ./cmd/actuator
          rm -f actuator
      - name: Real QEMU TCG owner ordering (disposable runner)
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOWORK: 'off'
          USB_NATIVE_QEMU_LIVE: '1'
        run: |
          set -euo pipefail
          if ! command -v qemu-system-x86_64 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends qemu-system-x86
          fi
          qemu-system-x86_64 --version
          cd experiments/usb-fabric-r26/integrated
          go test -race -count=1 -timeout=60s -v ./cmd/actuator -run '^TestLiveQEMUOwnerBeforeNegotiation$'
          echo NATIVE_QMP_OWNER_ORDER_SCOPE_ONLY_NOT_GUEST_RELEASE_OR_HIL
