name: USB native protected QMP bounded qualification
on:
  push:
    branches: [qual/usb-native-owner-before-qmp-20261126]
permissions:
  contents: read
concurrency:
  group: usb-native-owner-order-20261126
  cancel-in-progress: false
jobs:
  original-go-and-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Original package and protected socket qualification
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOWORK: 'off'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = e638c28b0872ddaee8aa13b4006e1aa2af9ec21c
          go version
          cd experiments/usb-fabric-r26/integrated
          go test -race -count=3 -timeout=120s ./...
          go vet ./...
          go build -trimpath -o "$RUNNER_TEMP/native-actuator" ./cmd/actuator
          rm -f "$RUNNER_TEMP/native-actuator"
          go test -race -count=5 -timeout=90s -v ./cmd/actuator -run '^TestProtectedQMPPeerPinAndPath$'
      - name: Real QEMU TCG and distinct-UID pathname boundary
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOWORK: 'off'
          USB_NATIVE_QEMU_LIVE: '1'
        run: |
          set -euo pipefail
          if ! command -v qemu-system-x86_64 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends qemu-system-x86
          fi
          qemu-system-x86_64 --version
          cd experiments/usb-fabric-r26/integrated
          go test -race -count=1 -timeout=90s -v ./cmd/actuator -run '^TestLive(QEMUOwnerBeforeNegotiation|ProtectedQMPDistinctUID)$'
          echo PROTECTED_PATH_SCOPE_ONLY_NOT_TRANSFERRED_FD_OR_GUEST_RELEASE
