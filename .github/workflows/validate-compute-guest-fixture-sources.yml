name: Validate compute guest fixture sources
on:
  pull_request:
    paths:
      - "config/compute-guest-fixtures.json"
      - "scripts/compute_guest_fixture_contract.py"
      - "tests/test_compute_guest_fixture_contract.py"
      - ".github/workflows/validate-compute-guest-fixture-sources.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m unittest -v tests/test_compute_guest_fixture_contract.py
      - run: python3 scripts/compute_guest_fixture_contract.py
