name: Validate compute guest profile contract
on:
  pull_request:
    paths:
      - "config/compute-guest-profiles.json"
      - "scripts/compute_guest_profile_contract.py"
      - "scripts/compute_guest_seed.py"
      - "scripts/truenas_vm_console_probe.py"
      - "scripts/windows_w1_plan.py"
      - "tests/test_compute_guest_profile_contract.py"
      - "tests/test_compute_guest_seed.py"
      - "tests/test_truenas_vm_console_probe.py"
      - "tests/test_windows_w1_plan.py"
      - ".github/workflows/validate-compute-guest-profile-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 -m unittest -v tests/test_compute_guest_profile_contract.py tests/test_compute_guest_seed.py tests/test_truenas_vm_console_probe.py tests/test_truenas_v2_console_probe.py tests/test_truenas_compute_vm_v1_probe.py tests/test_windows_w1_plan.py
      - run: python3 scripts/compute_guest_profile_contract.py
      - run: |
          python3 scripts/windows_w1_plan.py --platform truenas --target-version 26.0.0-BETA.3
          python3 scripts/windows_w1_plan.py --platform proxmox --target-version 9.2-1 --vmid 9301
