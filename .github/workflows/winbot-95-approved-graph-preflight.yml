name: WinBot 9.5 Owner Approval Graph Cheap Preflight

on:
  push:
    branches:
      - exp/winbot-95-bounded-diagnostic-20261009
    paths:
      - scripts/winbot_95_approved_graph_preflight.py
      - .github/workflows/winbot-95-approved-graph-preflight.yml
  pull_request:
    branches:
      - exp/windows-sealed-public-execution
    paths:
      - scripts/winbot_95_approved_graph_preflight.py
      - .github/workflows/winbot-95-approved-graph-preflight.yml

permissions:
  contents: read

jobs:
  approved-graph-preflight-only:
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - name: Checkout exact preflight code without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reconstruct and verify approved 82-file source by bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/winbot_95_approved_graph_preflight.py
          if ($LASTEXITCODE -ne 0) { throw 'Immutable owner-approved graph does not qualify' }
      - name: Verify immutable approved stage and A-only control in PS7 and guest PS5.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:RUNNER_TEMP
          foreach ($file in @('winbot-a-only-exact-control.ps1','winbot-approved-exact-stage.ps1')) {
            $path = Join-Path $root $file
            if (-not (Test-Path -LiteralPath $path)) { throw 'Preflight did not materialize verified parser input' }
            & pwsh -NoProfile -Command { param($p)
              $t=$null; $e=$null
              [void][System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$t,[ref]$e)
              if ($e.Count -gt 0) { throw 'PowerShell 7 syntax failed' }
            } $path
            if ($LASTEXITCODE -ne 0) { throw 'PS7 parse failed' }
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command {
              param($p)
              $t=$null; $e=$null
              [void][System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$t,[ref]$e)
              if ($e.Count -gt 0) { throw 'Guest PS5.1 syntax failed' }
            } $path
            if ($LASTEXITCODE -ne 0) { throw 'Guest PowerShell 5.1 parse failed' }
          }
          Write-Host 'WINBOT_95_OWNER_APPROVED_GRAPH_PS7_PS51_PARSE_PASS'
      - name: Upload bounded graph evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winbot-95-approved-graph-${{ github.run_id }}
          path: ${{ runner.temp }}/winbot-95-approved-graph-preflight.json
          if-no-files-found: warn
          retention-days: 14
