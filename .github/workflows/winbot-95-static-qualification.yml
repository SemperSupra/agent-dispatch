name: WinBot 9.5 Bounded Diagnostic Cheap Qualification

on:
  push:
    branches:
      - exp/winbot-95-bounded-diagnostic-20261009
    paths:
      - scripts/winbot_95_readiness_patch.py
      - scripts/winbot_95_receipt_patch.py
      - tests/winbot_95_static_qualification.py
      - tests/winbot_95_marker_contract.ps1
      - .github/workflows/winbot-95-static-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cheap-contract:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout bounded candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact parent identities and deterministic transformations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/winbot_95_static_qualification.py
          if ($LASTEXITCODE -ne 0) { throw 'candidate parent/diff/whitelist tests failed' }
      - name: Parse candidate PowerShell with PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $control = Join-Path $env:RUNNER_TEMP 'winbot-95-static/candidate-control.ps1'
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($control,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw 'candidate PowerShell parser errors' }
      - name: Test guest marker contract in Windows PowerShell 5.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $control = Join-Path $env:RUNNER_TEMP 'winbot-95-static/candidate-control.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/winbot_95_marker_contract.ps1 -Control $control
          if ($LASTEXITCODE -ne 0) { throw 'guest PS5.1 marker contract failed' }
      - name: Publish secret-free cheap qualification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winbot-95-cheap-${{ github.run_id }}
          path: ${{ runner.temp }}/winbot-95-static/qualification.json
          if-no-files-found: warn
          retention-days: 14
