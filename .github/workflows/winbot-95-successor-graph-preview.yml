name: WinBot 9.5 Successor Graph Preview Only

on:
  push:
    branches:
      - exp/winbot-95-bounded-diagnostic-20261009
    paths:
      - scripts/winbot_95_successor_graph_preview.py
      - .github/workflows/winbot-95-successor-graph-preview.yml

  pull_request:
    branches:
      - exp/windows-sealed-public-execution
    paths:
      - scripts/winbot_95_successor_graph_preview.py
      - .github/workflows/winbot-95-successor-graph-preview.yml
permissions:
  contents: read
  statuses: write

jobs:
  cheap-readonly-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout precursor and candidate graph recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate pinned WinBot hashes and derive dormant successor without source access
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/winbot_95_successor_graph_preview.py
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${EXACT_HEAD}" \
            -f state=success -f context=winbot-95-successor-preview \
            -f description='hash-only success; execution NOT authorized' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
      - name: Publish hash-only, not-authorized preflight receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winbot-95-dormant-successor-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/winbot-95-successor-graph-preview.json
          if-no-files-found: warn
          retention-days: 14
