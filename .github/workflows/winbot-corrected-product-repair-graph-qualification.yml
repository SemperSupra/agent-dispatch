name: WinBot Corrected Product Repair Graph Qualification

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-corrected-product-repair-graph-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MASTER_MANIFEST_SHA: '567683eda5477bc5eeae91bca5e5aadc1aa536b6'
      EXPECTED_SOURCE_REVISION: 'ba3be1cea9bd8b258e51c65431a09fbff27c6dcf'
      EXPECTED_PROJECTION_IDENTITY: '799ff4372456f6b51a424e9217a2aeab488c03975e5a6a5536c984d967f67fb0'
      EXPECTED_CONTROL_MANIFEST_SHA: '8fc1b83fd3c00b74bed5c0eaa7f6a96f6a1dcf9d'
      EXPECTED_CONTROL_BLOB: '48c3106607c97602c7da9046cd1f08feafda67f2'
      EXPECTED_PRODUCT_REPAIR_BLOB: 'c34b8e891220ba4ceab9f4e08c415f26d1490741'
      EXPECTED_POLICY_BLOB: '4fbe42dcb7de039ecb3b4842e3506b7dd9b8af61'
    steps:
      - name: Qualify exact corrected source/control graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request

          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          def blob(sha):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={
                      "Authorization":f"Bearer {token}",
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                  },
              )
              with urllib.request.urlopen(req,timeout=60) as r:
                  obj=json.load(r)
              if obj.get("sha")!=sha or obj.get("encoding")!="base64":
                  raise SystemExit(f"blob identity/encoding mismatch: {sha}")
              raw=base64.b64decode(obj["content"])
              if len(raw)!=int(obj["size"]):
                  raise SystemExit(f"blob size mismatch: {sha}")
              if hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()!=sha:
                  raise SystemExit(f"Git object digest mismatch: {sha}")
              return raw

          master=json.loads(blob(os.environ["MASTER_MANIFEST_SHA"]))
          if master["source_revision"]!=os.environ["EXPECTED_SOURCE_REVISION"]:
              raise SystemExit("source revision mismatch")
          if master["projection_identity_sha256"]!=os.environ["EXPECTED_PROJECTION_IDENTITY"]:
              raise SystemExit("projection identity mismatch")
          if master["control_manifest_sha"]!=os.environ["EXPECTED_CONTROL_MANIFEST_SHA"]:
              raise SystemExit("control manifest mismatch")
          if int(master["projected_file_count"])!=82 or int(master["projected_bytes"])!=1044757:
              raise SystemExit("corrected projection cardinality/bytes mismatch")

          entries=[]
          for batch_sha in master["source_batch_manifests"]:
              batch=json.loads(blob(batch_sha))
              if batch["source_revision"]!=master["source_revision"]:
                  raise SystemExit(f"batch revision mismatch: {batch_sha}")
              entries.extend(batch["entries"])
          if len(entries)!=82 or len({e["path"] for e in entries})!=82:
              raise SystemExit("projection entry mismatch")

          projected=[]
          for e in sorted(entries,key=lambda x:x["path"]):
              raw=blob(e["git_blob_sha"])
              if len(raw)!=int(e["size"]):
                  raise SystemExit(f"source size mismatch: {e['path']}")
              projected.append({"path":e["path"],"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()})
          identity=hashlib.sha256(
              json.dumps({"source_revision":master["source_revision"],"projected_files":projected},sort_keys=True,separators=(",",":")).encode()
          ).hexdigest()
          if identity!=master["projection_identity_sha256"]:
              raise SystemExit(f"recomputed projection identity mismatch: {identity}")

          bypath={e["path"]:e for e in entries}
          required={
              "guest/tools/configuration.winget",
              "guest/api/static/index.html",
              "guest/api/main.py",
              "guest/tools/stage-provision.ps1",
              "guest/tools/fix-api-service.ps1",
              "host/WinBot.psm1",
          }
          if not required.issubset(bypath):
              raise SystemExit(f"required paths missing: {sorted(required-set(bypath))}")
          if bypath["guest/tools/fix-api-service.ps1"]["git_blob_sha"]!=os.environ["EXPECTED_PRODUCT_REPAIR_BLOB"]:
              raise SystemExit("product repair primitive identity mismatch")
          if any(p.startswith("guest/winpe/") for p in bypath):
              raise SystemExit("excluded WinPE path present")

          controls=json.loads(blob(master["control_manifest_sha"]))
          ctl={e["path"]:e["git_blob_sha"] for e in controls["entries"]}
          if ctl["rdte/gha/full-rdte.ps1"]!=os.environ["EXPECTED_CONTROL_BLOB"]:
              raise SystemExit("diagnostic control mismatch")
          if ctl["rdte/gha/projection-policy.json"]!=os.environ["EXPECTED_POLICY_BLOB"]:
              raise SystemExit("projection policy blob mismatch")
          policy=json.loads(blob(ctl["rdte/gha/projection-policy.json"]))
          auth=policy.get("authorization",{})
          if not (
              policy.get("state")=="authorized"
              and auth.get("approved_revision")==master["source_revision"]
              and auth.get("approved_manifest_sha256")==master["projection_identity_sha256"]
          ):
              raise SystemExit("corrected projection not exactly authorized")

          print(json.dumps({
              "classification":"SUPPORTED",
              "source_revision":master["source_revision"],
              "projection_identity_sha256":identity,
              "projected_file_count":len(projected),
              "projected_bytes":sum(x["bytes"] for x in projected),
              "configuration_winget":bypath["guest/tools/configuration.winget"]["git_blob_sha"],
              "static_index_html":bypath["guest/api/static/index.html"]["git_blob_sha"],
              "product_repair_blob":bypath["guest/tools/fix-api-service.ps1"]["git_blob_sha"],
              "policy_authorized":True,
              "private_repo_checkout":False,
          },sort_keys=True))
          PY
