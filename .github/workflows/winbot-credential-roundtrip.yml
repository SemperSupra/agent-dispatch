name: WinBot Credential Roundtrip Qualification

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-credential-roundtrip.yml'

permissions:
  contents: read

jobs:
  credential:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      SOURCE_REVISION: '0283e44337705aab350ea506758dcb312c43aef7'
      MODULE_BLOB_SHA: '3cc498696e006dcb8dafd28045999ddaf6e1460f'

    steps:
      - name: Qualify exact WinBot Credential Manager roundtrip
        id: qual
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'winbot-credential-roundtrip'
          $project=Join-Path $root 'WinBot'
          $hostDir=Join-Path $project 'host'
          $receiptPath=Join-Path $root 'receipt.json'
          New-Item -ItemType Directory -Force -Path $root,$project,$hostDir | Out-Null

          $receipt=[ordered]@{
            schema_version=1
            authority='mark-e-deyoung/WinBot#70'
            experiment_authority='SemperSupra/agent-dispatch-private#406'
            source_revision=$env:SOURCE_REVISION
            module_blob_sha=$env:MODULE_BLOB_SHA
            phases=[ordered]@{}
            cleanup=[ordered]@{}
            classification='HARNESS_FAILURE'
            failure_domain=$null
          }

          function Fail([string]$domain,[System.Management.Automation.ErrorRecord]$e) {
            $receipt.classification='BOUNDARY_OBSERVED'
            $receipt.failure_domain=$domain
            $receipt.error_type=$e.Exception.GetType().FullName
            $receipt.error_message=$e.Exception.Message
            $receipt.command_name=[string]$e.InvocationInfo.MyCommand.Name
            $receipt.script_line=[int]$e.InvocationInfo.ScriptLineNumber
          }

          $name='vm-password'
          try {
            $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
            $blob=Invoke-RestMethod -Headers $headers -Uri ("https://api.github.com/repos/SemperSupra/agent-dispatch/git/blobs/"+$env:MODULE_BLOB_SHA)
            if([string]$blob.sha -ne $env:MODULE_BLOB_SHA -or [string]$blob.encoding -ne 'base64'){throw 'module blob identity mismatch'}
            $raw=[Convert]::FromBase64String(([string]$blob.content -replace '\s',''))
            [IO.File]::WriteAllBytes((Join-Path $hostDir 'WinBot.psm1'),$raw)

            [ordered]@{
              api=[ordered]@{port=8000;token=''}
              master=[ordered]@{vhdxPath='';vhdxHash=''}
              credentials=[ordered]@{vmUsername='winbot'}
            } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $project 'config.json') -Encoding utf8

            Import-Module (Join-Path $hostDir 'WinBot.psm1') -Force -DisableNameChecking -ErrorAction Stop
            foreach($cmd in @('Register-WinBotCredential','Get-WinBotCredential','Get-WinBotCredentialPresence','Unregister-WinBotCredential')){
              if(-not(Get-Command $cmd -ErrorAction SilentlyContinue)){throw "required command missing: $cmd"}
            }

            Unregister-WinBotCredential -Name $name -ErrorAction SilentlyContinue | Out-Null
            $before=Get-WinBotCredentialPresence -Name $name
            $receipt.phases.before=[ordered]@{state=[string]$before.State;source=[string]$before.Source}

            $bytes=New-Object byte[] 24
            [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
            $secret='Wb!' + [Convert]::ToHexString($bytes)
            $secretSha=(New-Object Security.Cryptography.SHA256Managed).ComputeHash([Text.Encoding]::UTF8.GetBytes($secret))
            $secretFingerprint=([BitConverter]::ToString($secretSha)-replace '-','').ToLowerInvariant()

            Register-WinBotCredential -Name $name -Username 'winbot' -Password $secret -Force
            $presence=Get-WinBotCredentialPresence -Name $name
            $observed=Get-WinBotCredential -Name $name -Username 'winbot' -AsPlaintext -NoPrompt
            $receipt.phases.roundtrip=[ordered]@{
              presence_state=[string]$presence.State
              presence_source=[string]$presence.Source
              retrieved=[bool](-not [string]::IsNullOrEmpty([string]$observed))
              exact_value_match=[bool]([string]$observed -ceq [string]$secret)
              observed_fingerprint=if($observed){
                $h=(New-Object Security.Cryptography.SHA256Managed).ComputeHash([Text.Encoding]::UTF8.GetBytes([string]$observed))
                ([BitConverter]::ToString($h)-replace '-','').ToLowerInvariant()
              }else{$null}
              expected_fingerprint=$secretFingerprint
            }
            if($receipt.phases.roundtrip.presence_state -ne 'True' -or
               -not $receipt.phases.roundtrip.retrieved -or
               -not $receipt.phases.roundtrip.exact_value_match -or
               $receipt.phases.roundtrip.observed_fingerprint -ne $secretFingerprint){
              throw 'Credential Manager roundtrip oracle failed'
            }

            Unregister-WinBotCredential -Name $name
            $after=Get-WinBotCredentialPresence -Name $name
            $afterValue=Get-WinBotCredential -Name $name -Username 'winbot' -AsPlaintext -NoPrompt
            $receipt.phases.after=[ordered]@{
              state=[string]$after.State
              source=[string]$after.Source
              retrieval_absent=[bool]([string]::IsNullOrEmpty([string]$afterValue))
            }
            if($receipt.phases.after.state -ne 'False' -or -not $receipt.phases.after.retrieval_absent){
              throw 'credential cleanup oracle failed'
            }
            $receipt.classification='SUPPORTED'
          } catch {
            Fail 'credential-manager-roundtrip' $_
          } finally {
            try { Unregister-WinBotCredential -Name $name -ErrorAction SilentlyContinue | Out-Null } catch {}
            $finalPresence=try { Get-WinBotCredentialPresence -Name $name } catch { $null }
            $receipt.cleanup.credential_absent=if($finalPresence){[string]$finalPresence.State -eq 'False'}else{$false}
            try { if(Test-Path -LiteralPath $project){Remove-Item -LiteralPath $project -Recurse -Force -ErrorAction Stop} } catch {}
            $receipt.cleanup.project_absent=-not(Test-Path -LiteralPath $project)
            $receipt.cleanup.oracle_satisfied=[bool]($receipt.cleanup.credential_absent -and $receipt.cleanup.project_absent)
            if(-not $receipt.cleanup.oracle_satisfied){
              $receipt.classification='ORACLE_FAILURE'
              $receipt.failure_domain='cleanup'
            }
            $receipt | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $receiptPath -Encoding utf8
          }
          "classification=$($receipt.classification)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload credential receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winbot-credential-roundtrip-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/winbot-credential-roundtrip/receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce credential oracle
        if: always()
        shell: pwsh
        run: |
          $p=Join-Path $env:RUNNER_TEMP 'winbot-credential-roundtrip\receipt.json'
          if(-not(Test-Path -LiteralPath $p)){throw 'credential receipt missing'}
          $r=Get-Content -LiteralPath $p -Raw | ConvertFrom-Json
          Write-Host "classification=$($r.classification)"
          Write-Host "presence=$($r.phases.roundtrip.presence_state)"
          Write-Host "retrieved=$($r.phases.roundtrip.retrieved)"
          Write-Host "exact_value_match=$($r.phases.roundtrip.exact_value_match)"
          Write-Host "cleanup=$($r.cleanup.oracle_satisfied)"
          if($r.classification -ne 'SUPPORTED'){throw "credential roundtrip failed: $($r.failure_domain)"}
