name: WinBot Deterministic NAT Prepared Successor Workflow Qualification

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-deterministic-nat-prepared-successor-workflows.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEED_WORKFLOW_BLOB: '70526a84c2c0d5dc6320cd4f44de48639adc76e9'
      TERMINAL_WORKFLOW_BLOB: 'e03dcace6b14970a825123f54aeff7e675b22ead'
    steps:
      - name: Qualify prepared deterministic-NAT successor wrappers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GH_TOKEN"]
          def blob(sha):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},
              )
              with urllib.request.urlopen(req,timeout=60) as r: obj=json.load(r)
              raw=base64.b64decode(obj["content"])
              if obj.get("sha")!=sha or hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()!=sha:
                  raise SystemExit(f"blob identity mismatch: {sha}")
              return raw.decode("utf-8-sig")

          seed=blob(os.environ["SEED_WORKFLOW_BLOB"])
          terminal=blob(os.environ["TERMINAL_WORKFLOW_BLOB"])

          seed_required=[
              "name: WinBot Seed Finalization Deterministic NAT",
              "winbot-seed-finalization-deterministic-nat.yml",
              "MASTER_MANIFEST_SHA: 'f1ba78698efc60331e82d16f0a7d97ecd958665b'",
              "EXPECTED_CONTROL_MANIFEST_SHA: 'cdfe43b7317714ada3441d20e832d85aabad6748'",
              "EXPECTED_SEED_CONTROL_BLOB: '309228e4fcfea213ee0fd0068c69fe64333d5a43'",
              "network_provider=[string]$r.build.network_provider",
              "deterministic_nat_created=[bool]$r.build.deterministic_nat_created",
              "authority_readiness_path=[string]$s.authority_readiness_path",
              "deterministic_nat_absent=[bool]$r.cleanup.deterministic_nat_absent",
              "New-NetNat -Name $ownedNatName",
          ]
          terminal_required=[
              "name: WinBot Terminal FullRDTE Deterministic NAT Acceptance",
              "winbot-terminal-fullrdte-deterministic-nat.yml",
              "MASTER_MANIFEST_SHA: '7ef1c3f5a5e674a84b908208dad2716a911bbf1c'",
              "EXPECTED_CONTROL_MANIFEST_SHA: 'a5a2694d7cd152382215e93dc70ea9d5e81d2174'",
              "EXPECTED_TERMINAL_CONTROL_BLOB: '3cd4c317e10839d7e9382c504ebc916daff63f92'",
              "seed_finalization.authority_readiness_path",
              "work_cells.$cellName.authority_repair_script_identity",
              "work_cells.$cellName.authority_readiness_path",
              "'deterministic_nat_absent','oracle_satisfied'",
              "deterministic_nat_absent=[bool]$r.cleanup.deterministic_nat_absent",
              "New-NetNat -Name $ownedNatName",
          ]
          for marker in seed_required:
              if marker not in seed: raise SystemExit(f"seed wrapper invariant missing: {marker}")
          for marker in terminal_required:
              if marker not in terminal: raise SystemExit(f"terminal wrapper invariant missing: {marker}")

          stale=[
              "MASTER_MANIFEST_SHA: '2fcd7f1bc90e5770bcfe7334546b1016f3cfa0e1'",
              "MASTER_MANIFEST_SHA: 'fd1b4816602d871db11be20056af7b3b9f62f268'",
              "EXPECTED_SEED_CONTROL_BLOB: '291d61f1522dff4a6a9ee66597e90316cbbb08c7'",
              "EXPECTED_TERMINAL_CONTROL_BLOB: '8eaf889dc19cea30ec9dbdd4127a83ab759db13a'",
          ]
          for marker in stale:
              if marker in seed or marker in terminal: raise SystemExit(f"stale successor wrapper identity remains: {marker}")

          print(json.dumps({
              "classification":"SUPPORTED",
              "seed_workflow_blob":os.environ["SEED_WORKFLOW_BLOB"],
              "terminal_workflow_blob":os.environ["TERMINAL_WORKFLOW_BLOB"],
              "deterministic_nat_primitive_run":37528085559,
              "deterministic_nat_a_only_graph_run":37528467171,
              "deterministic_nat_successor_graph_run":37529118562,
          },sort_keys=True))
          PY
