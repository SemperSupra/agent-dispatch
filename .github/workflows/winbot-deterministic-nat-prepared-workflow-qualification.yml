name: WinBot Deterministic NAT Prepared Workflow Qualification

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-deterministic-nat-prepared-workflow-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKFLOW_BLOB: '1bf196f73dab772e08579b10304193f2142008b3'
    steps:
      - name: Qualify prepared deterministic-NAT execution wrapper
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GH_TOKEN"]; sha=os.environ["WORKFLOW_BLOB"]
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
              headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},
          )
          with urllib.request.urlopen(req,timeout=60) as r: obj=json.load(r)
          raw=base64.b64decode(obj["content"])
          if obj.get("sha")!=sha or hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()!=sha:
              raise SystemExit("prepared workflow blob identity mismatch")
          text=raw.decode("utf-8-sig")
          required=[
              "name: WinBot Deterministic NAT Authority A-Only",
              "winbot-deterministic-nat-authority-a-only.yml",
              "MASTER_MANIFEST_SHA: 'a5002ecb5e6f4bdf7c4d82310cadcb582a7a0ad4'",
              "EXPECTED_SOURCE_REVISION: '8c1738806d44c082f43a5363531837d6a6216ab7'",
              "EXPECTED_PROJECTION_IDENTITY: '5b0ed1ae4f6b6d9b7fd7d68ccb5e5f735c7ca9be20fa1ca99eedf339c2c31b32'",
              "EXPECTED_CONTROL_MANIFEST_SHA: '84219c1c9a5c5cf5e3e8907eb9fa80548bb31328'",
              "EXPECTED_A_ONLY_CONTROL_BLOB: 'd4c3e8a44ca710a15d181369444d4c2e45c6b3d9'",
              "network_provider = [string]$r.build.network_provider",
              "deterministic_nat_created = [bool]$r.build.deterministic_nat_created",
              "deterministic_nat_absent = [bool]$r.cleanup.deterministic_nat_absent",
              "New-NetNat -Name $ownedNatName",
              "network_provider = 'deterministic-netnat'",
          ]
          for marker in required:
              if marker not in text: raise SystemExit(f"prepared wrapper invariant missing: {marker}")
          stale=[
              "MASTER_MANIFEST_SHA: '582ae90ecb0923821da7e870e25d410cbd49e78d'",
              "EXPECTED_A_ONLY_CONTROL_BLOB: '0731aa765b3cc3f0de560223bf146e729bd721c7'",
              "name: WinBot Hosted-NAT Timed Authority A-Only",
          ]
          for marker in stale:
              if marker in text: raise SystemExit(f"stale wrapper identity remains: {marker}")
          print(json.dumps({
              "classification":"SUPPORTED",
              "workflow_blob":sha,
              "master_manifest":"a5002ecb5e6f4bdf7c4d82310cadcb582a7a0ad4",
              "control":"d4c3e8a44ca710a15d181369444d4c2e45c6b3d9",
              "deterministic_nat_primitive_run":37528085559,
              "deterministic_nat_graph_run":37528467171,
          },sort_keys=True))
          PY
