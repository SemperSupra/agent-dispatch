name: WinBot Exact NAT Successor Qualification

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-exact-nat-successor-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      SOURCE: '90d5d8a7244b781c28d438d9ba01155735c765b7'
      PROJECTION: 'd4120a901d7855a9e0d7bc5f805d5e4b0dad8380abf52322c90f9981094d8b45'
      POLICY: '225dcb07e9d6c322098f629592f86244c8d372d5'
      STAGE: '0efa30b3c585a7a5fbee2271040cb8046d7ec262'
      CONFIG: 'aaebafd43b350886171f16828fd3b74b420c95fc'
      SEED_MANIFEST: '66d09a8991b681dd9ff195597e70ab8477f11f65'
      SEED_MASTER: '5c6970fee8d751f2466c208798af203c44318164'
      SEED_WRAPPER: 'a1e950e07e07d7cb8deedcb6d7ee841c82d28f56'
      TERMINAL_MANIFEST: '4a439f3ecb96c1f3a313926272d6b0bd1e4a9fd6'
      TERMINAL_MASTER: 'e01db1c63a66ad4b50dbc4f174de048c78731de7'
      TERMINAL_WRAPPER: '62a9da5510227d5ce8bcf1cb266f980346f10b79'
    steps:
      - name: Qualify exact downstream graphs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GH_TOKEN"]
          def blob(sha):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},
              )
              with urllib.request.urlopen(req,timeout=60) as r: o=json.load(r)
              raw=base64.b64decode(o["content"])
              if o.get("sha")!=sha or hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()!=sha:
                  raise SystemExit(f"blob identity mismatch: {sha}")
              return raw

          source=os.environ["SOURCE"]; projection=os.environ["PROJECTION"]
          policy=json.loads(blob(os.environ["POLICY"]))
          auth=policy["authorization"]
          if policy.get("state")!="authorized" or auth.get("approved_revision")!=source or auth.get("approved_manifest_sha256")!=projection:
              raise SystemExit("policy authorization mismatch")

          phases=[
              ("seed",os.environ["SEED_MANIFEST"],os.environ["SEED_MASTER"],os.environ["SEED_WRAPPER"],"427847b37ecacaf2f5d084907e99d82ec6ec731c","seed_control"),
              ("terminal",os.environ["TERMINAL_MANIFEST"],os.environ["TERMINAL_MASTER"],os.environ["TERMINAL_WRAPPER"],"676d3b54c999021e5834dcc4e34b751a62fa8707","terminal_control"),
          ]
          result={}
          for name,manifest_sha,master_sha,wrapper_sha,control_sha,control_key in phases:
              cm=json.loads(blob(manifest_sha))
              master=json.loads(blob(master_sha))
              wrapper=blob(wrapper_sha).decode("utf-8-sig")
              if cm["source_revision"]!=source or cm["projection_identity_sha256"]!=projection:
                  raise SystemExit(f"{name}: manifest source/projection mismatch")
              if master["source_revision"]!=source or master["projection_identity_sha256"]!=projection:
                  raise SystemExit(f"{name}: master source/projection mismatch")
              if master["control_manifest_sha"]!=manifest_sha:
                  raise SystemExit(f"{name}: manifest linkage mismatch")
              if master["projected_file_count"]!=82 or master["projected_bytes"]!=1053198:
                  raise SystemExit(f"{name}: projection cardinality mismatch")
              if master["construction"]["stage_provision_blob"]!=os.environ["STAGE"]:
                  raise SystemExit(f"{name}: stage blob mismatch")
              if master["construction"]["configuration_winget_blob"]!=os.environ["CONFIG"]:
                  raise SystemExit(f"{name}: config blob mismatch")
              if master["construction"]["provisioning_qualification_run"]!=37686681209:
                  raise SystemExit(f"{name}: provisioning evidence mismatch")
              if master["construction"]["projection_review_run"]!=37687397525:
                  raise SystemExit(f"{name}: projection review evidence mismatch")
              if master["construction"][control_key]!=control_sha:
                  raise SystemExit(f"{name}: control linkage mismatch")
              controls={e["path"]:e["git_blob_sha"] for e in cm["entries"]}
              if controls["rdte/gha/projection-policy.json"]!=os.environ["POLICY"]:
                  raise SystemExit(f"{name}: policy blob mismatch")
              if controls["rdte/gha/full-rdte.ps1"]!=control_sha:
                  raise SystemExit(f"{name}: control blob mismatch")

              entries=[]
              for bsha in master["source_batch_manifests"]:
                  batch=json.loads(blob(bsha))
                  if batch["source_revision"]!=source:
                      raise SystemExit(f"{name}: batch revision mismatch")
                  entries.extend(batch["entries"])
              by_path={e["path"]:e for e in entries}
              if by_path["guest/tools/configuration.winget"]["git_blob_sha"]!=os.environ["CONFIG"]:
                  raise SystemExit(f"{name}: projected config mismatch")
              if by_path["guest/tools/stage-provision.ps1"]["git_blob_sha"]!=os.environ["STAGE"]:
                  raise SystemExit(f"{name}: projected stage mismatch")

              markers=[
                  "group: agent-dispatch-heavyweight-rdte",
                  "queue: max",
                  f"EXPECTED_SOURCE_REVISION: '{source}'",
                  f"EXPECTED_PROJECTION_IDENTITY: '{projection}'",
              ]
              for m in markers:
                  if m not in wrapper: raise SystemExit(f"{name}: wrapper invariant missing: {m}")
              if master_sha not in wrapper or manifest_sha not in wrapper:
                  raise SystemExit(f"{name}: wrapper graph identity mismatch")
              control_text=blob(control_sha).decode("utf-8-sig")
              for marker in (
                  "Source = 'exact-run-owned-netnat'",
                  "Get-NetNat -Name $attachedSwitch",
                  "run-owned NAT gateway/prefix identity mismatch; HNS fallback prohibited",
                  "guest NAT correction did not converge to exact address/default gateway",
                  "DefaultGateways = @(",
                  "winnat-exclusivity",
              ):
                  if marker not in control_text: raise SystemExit(f"{name}: exact-NAT control missing: {marker}")
              p=pathlib.Path(os.environ["RUNNER_TEMP"]) / f"winbot-exact-nat-{name}.ps1"
              p.write_bytes(blob(control_sha))
              result[name]={"manifest":manifest_sha,"master":master_sha,"wrapper":wrapper_sha,"control":control_sha}

          print(json.dumps({"classification":"SUPPORTED","source_revision":source,"projection_identity_sha256":projection,"phases":result},sort_keys=True))
          PY

      - name: Parse both successor PowerShell controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($name in @('seed','terminal')){
            $path=Join-Path $env:RUNNER_TEMP "winbot-exact-nat-$name.ps1"
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
            if(@($errors).Count -gt 0){$errors|ForEach-Object{Write-Error $_.Message};throw "$name PowerShell parse failed"}
          }
          Write-Host 'Exact-NAT successor graph/control parse: PASS'
