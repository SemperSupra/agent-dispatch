name: WinBot First-Logon Entrypoint Qualification

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-firstlogon-entrypoint-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 8
    env:
      BUILD_BLOB_SHA: '6192aa8c8851a0b9740b99d420da5921e48629c2'
      SOURCE_REVISION: '6f436816518eb907d6cfe5309b922ecfce455fe6'
      HOST_BLOB_SHA: '3cc498696e006dcb8dafd28045999ddaf6e1460f'
    steps:
      - name: Qualify exact build-master entrypoint semantics
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/blobs/$env:BUILD_BLOB_SHA"
          $blob=Invoke-RestMethod -Headers $headers -Uri $uri
          if([string]$blob.sha -ne $env:BUILD_BLOB_SHA -or [string]$blob.encoding -ne 'base64'){throw 'build blob identity mismatch'}
          $raw=[Convert]::FromBase64String(([string]$blob.content -replace '\s',''))
          if($raw.Length -ne [int]$blob.size){throw 'build blob size mismatch'}
          $path=Join-Path $env:RUNNER_TEMP 'build-master.ps1'
          [IO.File]::WriteAllBytes($path,$raw)

          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){
            $errors | ForEach-Object { Write-Error ("{0}:{1}: {2}" -f $path,$_.Extent.StartLineNumber,$_.Message) }
            throw 'build-master parse failed'
          }

          $buildText=[IO.File]::ReadAllText($path)
          if($buildText -match 'SetupComplete starting' -or $buildText -match 'SetupComplete finished'){
            throw 'SetupComplete provisioning logging remains'
          }
          if($buildText -match 'setupcomplete\.log'){
            throw 'SetupComplete provisioner invocation remains'
          }
          if(-not $buildText.Contains('First-boot provisioning entrypoint: FirstLogonCommands only.')){
            throw 'first-logon-only invariant marker missing'
          }
          if(-not $buildText.Contains("SetupComplete.cmd")){
            throw 'stale SetupComplete cleanup path missing'
          }

          $hostUri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/blobs/$env:HOST_BLOB_SHA"
          $hostBlob=Invoke-RestMethod -Headers $headers -Uri $hostUri
          if([string]$hostBlob.sha -ne $env:HOST_BLOB_SHA -or [string]$hostBlob.encoding -ne 'base64'){throw 'host blob identity mismatch'}
          $hostRaw=[Convert]::FromBase64String(([string]$hostBlob.content -replace '\s',''))
          if($hostRaw.Length -ne [int]$hostBlob.size){throw 'host blob size mismatch'}
          $hostPath=Join-Path $env:RUNNER_TEMP 'WinBot.psm1'
          [IO.File]::WriteAllBytes($hostPath,$hostRaw)
          $hostTokens=$null;$hostErrors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($hostPath,[ref]$hostTokens,[ref]$hostErrors)
          if($hostErrors.Count -gt 0){throw 'host module parse failed'}

          $hostText=[IO.File]::ReadAllText($hostPath)
          $firstLogonCount=([regex]::Matches($hostText,'<CommandLine>powershell -ExecutionPolicy Bypass -File C:\\WinBot\\provision\.ps1</CommandLine>')).Count
          if($firstLogonCount -ne 1){throw "expected exactly one FirstLogon provision entrypoint in host module; observed $firstLogonCount"}

          Write-Host "classification=SUPPORTED"
          Write-Host "source_revision=$env:SOURCE_REVISION"
          Write-Host "build_blob=$env:BUILD_BLOB_SHA"
          Write-Host "host_blob=$env:HOST_BLOB_SHA"
          Write-Host "first_logon_entrypoint_count=$firstLogonCount"
          Write-Host "setupcomplete_provisioning=false"
