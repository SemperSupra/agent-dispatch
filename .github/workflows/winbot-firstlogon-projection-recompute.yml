name: WinBot First-Logon Projection Recompute

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-firstlogon-projection-recompute.yml'

permissions:
  contents: read

jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_MASTER_MANIFEST_SHA: '6222edf649a2ffe9c9b4c4fa72b3a560f5157e02'
      NEW_SOURCE_REVISION: '6f436816518eb907d6cfe5309b922ecfce455fe6'
      NEW_BUILD_BLOB_SHA: '6192aa8c8851a0b9740b99d420da5921e48629c2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Recompute exact projection identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, urllib.request

          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          master_sha=os.environ["CANDIDATE_MASTER_MANIFEST_SHA"]
          new_rev=os.environ["NEW_SOURCE_REVISION"]
          new_build=os.environ["NEW_BUILD_BLOB_SHA"]

          def blob(sha):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={
                      "Authorization":f"Bearer {token}",
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                  },
              )
              with urllib.request.urlopen(req,timeout=60) as r:
                  obj=json.load(r)
              if obj.get("sha")!=sha or obj.get("encoding")!="base64":
                  raise SystemExit(f"blob identity mismatch {sha}")
              raw=base64.b64decode(obj["content"])
              if len(raw)!=int(obj["size"]):
                  raise SystemExit(f"blob size mismatch {sha}")
              actual=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
              if actual!=sha:
                  raise SystemExit(f"git object digest mismatch {sha}")
              return raw

          master=json.loads(blob(master_sha))
          if master["source_revision"] != new_rev:
              raise SystemExit("candidate master source revision mismatch")
          entries=[]
          for bsha in master["source_batch_manifests"]:
              batch=json.loads(blob(bsha))
              if batch["source_revision"] != new_rev:
                  raise SystemExit(f"batch revision mismatch: {bsha}")
              entries.extend(batch["entries"])

          if len(entries)!=int(master["projected_file_count"]):
              raise SystemExit("projected file count mismatch")
          if len({e["path"] for e in entries})!=len(entries):
              raise SystemExit("duplicate projected paths")
          build=[e for e in entries if e["path"]=="guest/build-master.ps1"]
          if len(build)!=1 or build[0]["git_blob_sha"]!=new_build:
              raise SystemExit("new build-master identity not present exactly once")

          sensitive={
              "private_key":re.compile(rb"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              "github_token":re.compile(rb"gh[pousr]_[A-Za-z0-9]{20,}"),
              "aws_access_key":re.compile(rb"AKIA[0-9A-Z]{16}"),
              "openai_style_key":re.compile(rb"sk-[A-Za-z0-9_-]{20,}"),
          }
          projected=[]
          total=0
          for e in sorted(entries,key=lambda x:x["path"]):
              raw=blob(e["git_blob_sha"])
              if len(raw)!=int(e["size"]):
                  raise SystemExit(f"entry size mismatch: {e['path']}")
              if len(raw)>512*1024:
                  raise SystemExit(f"per-file bound exceeded: {e['path']}")
              for name,pat in sensitive.items():
                  if pat.search(raw):
                      raise SystemExit(f"sensitive marker {name}: {e['path']}")
              total+=len(raw)
              projected.append({
                  "path":e["path"],
                  "bytes":len(raw),
                  "sha256":hashlib.sha256(raw).hexdigest(),
              })
          if total!=int(master["projected_bytes"]):
              raise SystemExit(f"projected byte mismatch: {total}")
          if total>8*1024*1024:
              raise SystemExit("projection byte bound exceeded")

          identity_obj={"source_revision":new_rev,"projected_files":projected}
          identity=hashlib.sha256(
              json.dumps(identity_obj,sort_keys=True,separators=(",",":")).encode()
          ).hexdigest()
          result={
              "schema_version":1,
              "source_revision":new_rev,
              "projection_identity_sha256":identity,
              "projected_file_count":len(projected),
              "projected_bytes":total,
              "new_build_blob_sha":new_build,
              "candidate_master_manifest_sha":master_sha,
              "sensitive_scan":"PASS",
              "projected_files":projected,
          }
          pathlib.Path("projection-review.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          print("source_revision="+new_rev)
          print("projection_identity_sha256="+identity)
          print("projected_file_count="+str(len(projected)))
          print("projected_bytes="+str(total))
          print("new_build_blob_sha="+new_build)
          print("sensitive_scan=PASS")
          PY

      - name: Upload projection review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winbot-firstlogon-projection-review-${{ github.run_id }}
          path: projection-review.json
          if-no-files-found: error
          retention-days: 14
