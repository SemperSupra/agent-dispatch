name: WinBot FullRDTE Diagnostic

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-fullrdte-diagnostic.yml'

permissions:
  contents: read

jobs:
  full-rdte:
    runs-on: windows-2025
    timeout-minutes: 125
    env:
      MASTER_MANIFEST_SHA: '1b866eadd4145719b2d03660265d4c3679472e83'
      EXPECTED_SOURCE_REVISION: '4220566a40afa90436b9ec82f2de9d608a40369b'
      EXPECTED_PROJECTION_IDENTITY: 'd264f3357c083d9cf68ef48e4d3751eb91e1c6590488f79892cd24b4a04ec0ad'
      BASE_CONTROL_BLOB_SHA: '247944c22707aaa600d6f6b0206cedecedf43395'
      EXPECTED_CONTROL_BLOB_SHA: 'aa467e93b07329caa21de64e8a49e2adb7f847f5'
      CONTROL_REVISION: '53e918ceab0010f1f6c9cd1a6d23ac7f40794a45'
      ASSIGNMENT_ID: 'winbot-fullrdte-diag-20261002-03'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Reconstruct and independently verify authorized FullRDTE capsule
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'winbot-fullrdte-staged'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $py = @'
          import base64, hashlib, io, json, os, pathlib, tarfile, urllib.request
          from datetime import datetime, timezone

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          master_sha = os.environ["MASTER_MANIFEST_SHA"]
          expected_rev = os.environ["EXPECTED_SOURCE_REVISION"]
          expected_identity = os.environ["EXPECTED_PROJECTION_IDENTITY"]
          base_control_blob = os.environ["BASE_CONTROL_BLOB_SHA"]
          expected_control_blob = os.environ["EXPECTED_CONTROL_BLOB_SHA"]
          control_revision = os.environ["CONTROL_REVISION"]
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "winbot-fullrdte-staged"
          staging = root / "capsule"
          projection = staging / "projection"
          projection.mkdir(parents=True, exist_ok=True)

          def get_blob(sha):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  obj = json.load(r)
              if obj.get("sha") != sha or obj.get("encoding") != "base64":
                  raise SystemExit(f"blob identity/encoding mismatch for {sha}")
              raw = base64.b64decode(obj["content"])
              if len(raw) != int(obj["size"]):
                  raise SystemExit(f"blob size mismatch for {sha}")
              git_sha = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
              if git_sha != sha:
                  raise SystemExit(f"Git object digest mismatch for {sha}")
              return raw

          master = json.loads(get_blob(master_sha))
          if master["source_revision"] != expected_rev:
              raise SystemExit("master source revision mismatch")
          if master["projection_identity_sha256"] != expected_identity:
              raise SystemExit("master projection identity mismatch")

          entries = []
          for batch_sha in master["source_batch_manifests"]:
              batch = json.loads(get_blob(batch_sha))
              if batch["source_revision"] != expected_rev:
                  raise SystemExit(f"batch source revision mismatch: {batch_sha}")
              entries.extend(batch["entries"])

          if len(entries) != int(master["projected_file_count"]):
              raise SystemExit(f"projected file count mismatch: {len(entries)}")
          if len({e["path"] for e in entries}) != len(entries):
              raise SystemExit("duplicate projected paths")

          projected = []
          for e in sorted(entries, key=lambda x: x["path"]):
              raw = get_blob(e["git_blob_sha"])
              if len(raw) != int(e["size"]):
                  raise SystemExit(f"source size mismatch: {e['path']}")
              dest = projection / pathlib.PurePosixPath(e["path"])
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(raw)
              projected.append({
                  "path": e["path"],
                  "bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              })

          identity_obj = {"source_revision": expected_rev, "projected_files": projected}
          identity = hashlib.sha256(
              json.dumps(identity_obj, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          if identity != expected_identity:
              raise SystemExit(f"projection identity mismatch: {identity}")
          total = sum(x["bytes"] for x in projected)
          if total != int(master["projected_bytes"]):
              raise SystemExit(f"projected byte count mismatch: {total}")

          controls = json.loads(get_blob(master["control_manifest_sha"]))
          control = {}
          for e in controls["entries"]:
              control[e["path"]] = get_blob(e["git_blob_sha"])

          required = {
              "rdte/gha/media/windows-enterprise-eval-x64.json",
              "rdte/gha/qualification.json",
              "rdte/gha/projection-policy.json",
              "rdte/gha/full-rdte.ps1",
          }
          if set(control) != required:
              raise SystemExit("control object set mismatch")

          # The latest FullRDTE control is a control-only change in private WinBot.
          # Reconstruct it deterministically from the already-staged predecessor,
          # then require exact Git-object identity before any expensive execution.
          control_path = "rdte/gha/full-rdte.ps1"
          base_raw = control[control_path]
          observed_base = hashlib.sha1(f"blob {len(base_raw)}\0".encode() + base_raw).hexdigest()
          if observed_base != base_control_blob:
              raise SystemExit(f"base control blob mismatch: {observed_base}")

          text = base_raw.decode("utf-8")
          replacements_b64 = [
              ("ZnVuY3Rpb24gU2V0LUZhaWx1cmUgewogICAgcGFyYW0oW3N0cmluZ10kQ2xhc3NpZmljYXRpb24sIFtzdHJpbmddJERvbWFpbiwgW3N0cmluZ10kTWVzc2FnZSkKICAgICRyZWNvcmQuY2xhc3NpZmljYXRpb24gPSAkQ2xhc3NpZmljYXRpb24KICAgICRyZWNvcmQuZmFpbHVyZV9kb21haW4gPSAkRG9tYWluCiAgICAkcmVjb3JkLmVycm9yX21lc3NhZ2UgPSAkTWVzc2FnZQp9Cg==", ""),
              ("", ""),
              ("fSBjYXRjaCB7CiAgICBpZiAoLW5vdCAkcmVjb3JkLmVycm9yX3R5cGUpIHsgJHJlY29yZC5lcnJvcl90eXBlID0gJF8uRXhjZXB0aW9uLkdldFR5cGUoKS5GdWxsTmFtZSB9Cg==", "fSBjYXRjaCB7CiAgICBpZiAoLW5vdCAkcmVjb3JkLmZhaWx1cmVfY29udGV4dCAtb3IgJHJlY29yZC5mYWlsdXJlX2NvbnRleHQuQ291bnQgLWVxIDApIHsgU2V0LUZhaWx1cmVDb250ZXh0ICRfIH0KICAgIGlmICgtbm90ICRyZWNvcmQuZXJyb3JfdHlwZSkgeyAkcmVjb3JkLmVycm9yX3R5cGUgPSAkXy5FeGNlcHRpb24uR2V0VHlwZSgpLkZ1bGxOYW1lIH0K"),
          ]
          for old_b64, new_b64 in replacements_b64:
              old = base64.b64decode(old_b64).decode("utf-8")
              new = base64.b64decode(new_b64).decode("utf-8")
              if text.count(old) != 1:
                  raise SystemExit("latest-control derivation marker cardinality mismatch")
              text = text.replace(old, new, 1)

          derived_raw = text.encode("utf-8")
          derived_control_sha = hashlib.sha1(
              f"blob {len(derived_raw)}\\0".encode() + derived_raw
          ).hexdigest()
          if derived_control_sha != expected_control_blob:
              raise SystemExit(
                  f"derived latest control identity mismatch: {derived_control_sha}"
              )
          control[control_path] = derived_raw

          policy = json.loads(control["rdte/gha/projection-policy.json"])
          auth = policy.get("authorization", {})
          if not (
              policy.get("state") == "authorized"
              and auth.get("approved_revision") == expected_rev
              and auth.get("approved_manifest_sha256") == expected_identity
          ):
              raise SystemExit("projection policy no longer authorizes exact source identity")

          (staging / "media.json").write_bytes(control["rdte/gha/media/windows-enterprise-eval-x64.json"])
          (staging / "qualification.json").write_bytes(control["rdte/gha/qualification.json"])
          (staging / "projection-policy.json").write_bytes(control["rdte/gha/projection-policy.json"])
          run_text = control["rdte/gha/full-rdte.ps1"].decode("utf-8-sig").strip() + "\n"
          (staging / "run.ps1").write_text(run_text, encoding="utf-8")

          manifest = {
              "schema_version": 1,
              "authority": "mark-e-deyoung/WinBot#70",
              "profile": "FullRDTE",
              "source_revision": expected_rev,
              "generated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "projection_identity_sha256": identity,
              "projected_files": projected,
              "projected_file_count": len(projected),
              "projected_bytes": total,
              "constraints": {
                  "private_repo_checkout_on_public_runner": False,
                  "local_vhdx": False,
                  "local_iso": False,
                  "local_credentials": False,
                  "local_api_token": False,
                  "capsule_public_safe_required": True,
              },
          }
          (staging / "projection-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )

          capsule = root / "capsule.tar.gz"
          with tarfile.open(capsule, "w:gz") as tf:
              for item in sorted(staging.rglob("*")):
                  if item.is_file():
                      tf.add(item, arcname=item.relative_to(staging))

          raw = capsule.read_bytes()
          capsule_sha = hashlib.sha256(raw).hexdigest()
          if len(raw) > 8 * 1024 * 1024:
              raise SystemExit(f"capsule exceeds 8 MiB: {len(raw)}")
          b64 = root / "capsule.b64"
          b64.write_text(base64.b64encode(raw).decode("ascii"), encoding="ascii")

          receipt = {
              "schema_version": 1,
              "authority": master["authority"],
              "experiment_authority": master["experiment_authority"],
              "master_manifest_sha": master_sha,
              "source_revision": expected_rev,
              "projection_identity_sha256": identity,
              "projected_file_count": len(projected),
              "projected_bytes": total,
              "capsule_bytes": len(raw),
              "capsule_sha256": capsule_sha,
              "private_repo_checkout": False,
              "staged_public_git_objects_only": True,
              "base_control_blob_sha": observed_base,
              "derived_control_blob_sha": derived_control_sha,
              "control_revision": control_revision,
              "control_derivation": "deterministic predecessor transform with exact Git-object oracle",
          }
          (root / "reconstruction.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, sort_keys=True))
          '@
          $py | python -
          if ($LASTEXITCODE -ne 0) { throw 'authorized projection reconstruction failed' }

          $receipt = Get-Content -LiteralPath (Join-Path $root 'reconstruction.json') -Raw | ConvertFrom-Json
          "CAPSULE_SHA256=$($receipt.capsule_sha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CAPSULE_B64_FILE=$(Join-Path $root 'capsule.b64')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Parse reconstructed WinBot control surface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'winbot-fullrdte-staged\capsule'
          $module = Join-Path $root 'projection\host\WinBot.psm1'
          $entry = Join-Path $root 'run.ps1'
          foreach ($path in @($module,$entry)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "required reconstructed script missing: $path" }
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}:{1}: {2}" -f $path,$_.Extent.StartLineNumber,$_.Message) }
              throw "PowerShell parse preflight failed: $path"
            }
          }
          $moduleText = [IO.File]::ReadAllText($module)
          if (($moduleText -split 'function New-WinBotWorkCell').Count -ne 2) { throw 'expected exactly one New-WinBotWorkCell definition' }
          if (($moduleText -split 'function Remove-WinBotWorkCell').Count -ne 2) { throw 'expected exactly one Remove-WinBotWorkCell definition' }

      - name: Install pinned result sealer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-windows-amd64.zip'
          $expected = 'f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7'
          $zip = Join-Path $env:RUNNER_TEMP 'age-v1.3.2-windows-amd64.zip'
          Invoke-WebRequest -Uri $uri -OutFile $zip -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "age archive SHA-256 mismatch" }
          $ageRoot = Join-Path $env:RUNNER_TEMP 'age-v1.3.2'
          Expand-Archive -LiteralPath $zip -DestinationPath $ageRoot -Force
          $age = Get-ChildItem -LiteralPath $ageRoot -Recurse -Filter age.exe | Select-Object -First 1
          if (-not $age) { throw 'age.exe missing' }
          $age.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate ephemeral diagnostic result key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = Join-Path $env:RUNNER_TEMP 'winbot-diagnostic-age-identity.txt'
          age-keygen -o $identity 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'age-keygen failed' }
          $line = (Select-String -LiteralPath $identity -Pattern '^# public key: ' | Select-Object -First 1).Line
          if (-not $line) { throw 'age public recipient missing from generated identity' }
          $recipient = $line.Split()[-1]
          if ($recipient -notmatch '^age1[023456789acdefghjklmnpqrstuvwxyz]{58}$') { throw 'generated age recipient failed validation' }
          "AGE_RECIPIENT=$recipient" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DIAG_IDENTITY=$identity" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Execute sealed FullRDTE
        id: execute
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:SEALED_CAPSULE_TRANSPORT = 'staged_git_projection'
          python scripts/sealed_public_execution.py `
            --assignment-id "$env:ASSIGNMENT_ID" `
            --capsule-b64-file "$env:CAPSULE_B64_FILE" `
            --capsule-sha256 "$env:CAPSULE_SHA256" `
            --recipient "$env:AGE_RECIPIENT" `
            --timeout-seconds 7200 `
            --entrypoint run.ps1 `
            --out-dir .sealed
          $rc = $LASTEXITCODE
          "task_rc=$rc" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0

      - name: Derive redacted FullRDTE diagnostic receipt
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $diagPath = Join-Path $env:RUNNER_TEMP 'winbot-fullrdte-staged\diagnostic.json'
          $plain = Join-Path $env:RUNNER_TEMP 'winbot-fullrdte-diagnostic-result.tar.gz'
          try {
            if (-not (Test-Path -LiteralPath '.sealed\result.age')) { throw 'sealed diagnostic result missing' }
            if (-not $env:DIAG_IDENTITY -or -not (Test-Path -LiteralPath $env:DIAG_IDENTITY)) { throw 'ephemeral diagnostic identity missing' }
            age --decrypt --identity $env:DIAG_IDENTITY --output $plain '.sealed\result.age'
            if ($LASTEXITCODE -ne 0) { throw 'diagnostic result decryption failed' }
            python scripts/redact_winbot_fullrdte_diagnostic.py --result-tar $plain --output $diagPath
            if ($LASTEXITCODE -ne 0) { throw 'diagnostic receipt redaction failed' }
          } finally {
            Remove-Item -LiteralPath $plain -Force -ErrorAction SilentlyContinue
            if ($env:DIAG_IDENTITY) { Remove-Item -LiteralPath $env:DIAG_IDENTITY -Force -ErrorAction SilentlyContinue }
          }
      - name: Upload sealed FullRDTE evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winbot-fullrdte-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .sealed/receipt.json
            ${{ runner.temp }}/winbot-fullrdte-staged/reconstruction.json
            ${{ runner.temp }}/winbot-fullrdte-staged/diagnostic.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve FullRDTE verdict
        if: always()
        shell: pwsh
        env:
          TASK_RC: ${{ steps.execute.outputs.task_rc }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TASK_RC)) { exit 1 }
          exit [int]$env:TASK_RC
