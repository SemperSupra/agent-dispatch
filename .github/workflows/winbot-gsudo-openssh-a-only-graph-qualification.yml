name: WinBot gsudo + OpenSSH A-only Graph Qualification

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-gsudo-openssh-a-only-graph-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MASTER: '704c87c6d9e83d3cc1d36d294023e7d63586a0b2'
      CONTROL_MANIFEST: '887770559f7a780752807c4786ed3a18fbde03c9'
      WRAPPER: 'cbab178ed64c3ea6de2779b2d77265c68b293237'
      SOURCE: '90d5d8a7244b781c28d438d9ba01155735c765b7'
      PROJECTION: 'd4120a901d7855a9e0d7bc5f805d5e4b0dad8380abf52322c90f9981094d8b45'
      STAGE: '0efa30b3c585a7a5fbee2271040cb8046d7ec262'
      CONFIG: 'aaebafd43b350886171f16828fd3b74b420c95fc'
      POLICY: '225dcb07e9d6c322098f629592f86244c8d372d5'
    steps:
      - name: Qualify exact gsudo/OpenSSH A-only graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GH_TOKEN"]
          def blob(sha):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},
              )
              with urllib.request.urlopen(req,timeout=60) as r: o=json.load(r)
              raw=base64.b64decode(o["content"])
              if o.get("sha")!=sha or hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()!=sha:
                  raise SystemExit(f"blob identity mismatch: {sha}")
              return raw

          master=json.loads(blob(os.environ["MASTER"]))
          if master["source_revision"]!=os.environ["SOURCE"]: raise SystemExit("master source mismatch")
          if master["projection_identity_sha256"]!=os.environ["PROJECTION"]: raise SystemExit("master projection mismatch")
          if master["control_manifest_sha"]!=os.environ["CONTROL_MANIFEST"]: raise SystemExit("master control-manifest mismatch")
          if master["projected_file_count"]!=82 or master["projected_bytes"]!=1053198: raise SystemExit("projection cardinality mismatch")
          if master["construction"]["stage_provision_blob"]!=os.environ["STAGE"]: raise SystemExit("master stage blob mismatch")
          if master["construction"]["configuration_winget_blob"]!=os.environ["CONFIG"]: raise SystemExit("master config blob mismatch")
          if master["construction"]["provisioning_qualification_run"]!=37686681209: raise SystemExit("provisioning qualification evidence mismatch")
          if master["construction"]["projection_review_run"]!=37687397525: raise SystemExit("projection review evidence mismatch")

          cm=json.loads(blob(os.environ["CONTROL_MANIFEST"]))
          if cm["source_revision"]!=os.environ["SOURCE"] or cm["projection_identity_sha256"]!=os.environ["PROJECTION"]:
              raise SystemExit("control manifest source/projection mismatch")
          if cm["stage_provision_blob"]!=os.environ["STAGE"] or cm["configuration_winget_blob"]!=os.environ["CONFIG"]:
              raise SystemExit("control manifest provisioning blob mismatch")
          entries={e["path"]:e["git_blob_sha"] for e in cm["entries"]}
          if entries["rdte/gha/projection-policy.json"]!=os.environ["POLICY"]:
              raise SystemExit("control manifest policy mismatch")

          policy=json.loads(blob(os.environ["POLICY"]))
          auth=policy["authorization"]
          if policy.get("state")!="authorized" or auth.get("approved_revision")!=os.environ["SOURCE"] or auth.get("approved_manifest_sha256")!=os.environ["PROJECTION"]:
              raise SystemExit("exact projection authorization mismatch")

          wrapper=blob(os.environ["WRAPPER"]).decode("utf-8-sig")
          for marker in (
              "name: WinBot HNS-clean gsudo+OpenSSH Authority A-Only",
              "MASTER_MANIFEST_SHA: '704c87c6d9e83d3cc1d36d294023e7d63586a0b2'",
              "EXPECTED_SOURCE_REVISION: '90d5d8a7244b781c28d438d9ba01155735c765b7'",
              "EXPECTED_PROJECTION_IDENTITY: 'd4120a901d7855a9e0d7bc5f805d5e4b0dad8380abf52322c90f9981094d8b45'",
              "EXPECTED_CONTROL_MANIFEST_SHA: '887770559f7a780752807c4786ed3a18fbde03c9'",
              "group: agent-dispatch-heavyweight-rdte",
              "queue: max",
              "aaebafd43b350886171f16828fd3b74b420c95fc",
              "0efa30b3c585a7a5fbee2271040cb8046d7ec262",
              "id: gerardog.gsudo",
              "OpenSSH.Server~~~~0.0.1.0",
              "Set-Service -Name sshd -StartupType Automatic",
              "authenticated-health-200;gsudo-present;sshd-running",
          ):
              if marker not in wrapper: raise SystemExit(f"wrapper invariant missing: {marker}")

          print(json.dumps({
              "classification":"SUPPORTED",
              "master":os.environ["MASTER"],
              "control_manifest":os.environ["CONTROL_MANIFEST"],
              "wrapper":os.environ["WRAPPER"],
              "source_revision":os.environ["SOURCE"],
              "projection_identity_sha256":os.environ["PROJECTION"],
              "gsudo":"gerardog.gsudo",
              "openssh":"OpenSSH.Server~~~~0.0.1.0",
          },sort_keys=True))
          PY
