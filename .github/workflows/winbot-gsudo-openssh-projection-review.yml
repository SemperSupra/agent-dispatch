name: WinBot gsudo + OpenSSH Projection Review

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-gsudo-openssh-projection-review.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_REVISION: '90d5d8a7244b781c28d438d9ba01155735c765b7'
      BATCHES: '33c9bce72a6bcf325e695476e0b33ae7aa80bdfb d1bf5980317f61d6ea49475d8bde75c403dac5df b3add22fa08f13fac8560ff01f8529195a81a981 034fc973cf012846db15b9302ef03f42b78fa720 bb7528e2c552d1acdaa5769fb39d03e1e822aea7 a40c7d7a35105d8b8ed87814ac13c8c942dd0b3e 56f855678dd81c67ae0b6c6a5172e561eaa21cef 8e41a109933cb051ea81babb835a4720b1a90239 492ecbac643f64b589860aedff6a2902400d67ac'
    steps:
      - name: Recompute exact projection identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, re, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          source=os.environ["SOURCE_REVISION"]
          batches=os.environ["BATCHES"].split()

          def blob(sha):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={
                      "Authorization":f"Bearer {token}",
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                  },
              )
              with urllib.request.urlopen(req,timeout=60) as r:
                  obj=json.load(r)
              raw=base64.b64decode(obj["content"])
              observed=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
              if obj.get("sha")!=sha or observed!=sha:
                  raise SystemExit(f"Git blob mismatch: {sha}")
              return raw

          entries=[]
          for b in batches:
              m=json.loads(blob(b))
              if m.get("source_revision")!=source:
                  raise SystemExit(f"batch source mismatch: {b}")
              entries.extend(m.get("entries",[]))

          if len(entries)!=82:
              raise SystemExit(f"expected 82 projected files, found {len(entries)}")
          paths=[e["path"] for e in entries]
          if len(set(paths))!=82:
              raise SystemExit("duplicate projected paths")
          if any(p.startswith("guest/winpe/") for p in paths):
              raise SystemExit("excluded guest/winpe path entered projection")

          by_path={e["path"]:e for e in entries}
          expected_changed={
              "guest/tools/configuration.winget":("aaebafd43b350886171f16828fd3b74b420c95fc",3262),
              "guest/tools/stage-provision.ps1":("0efa30b3c585a7a5fbee2271040cb8046d7ec262",45578),
          }
          for path,(sha,size) in expected_changed.items():
              e=by_path.get(path)
              if not e or e.get("git_blob_sha")!=sha or int(e.get("size",-1))!=size:
                  raise SystemExit(f"changed source entry mismatch: {path}")

          projected=[]
          total=0
          suspicious=[]
          patterns=[
              re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(rb"gh[pousr]_[A-Za-z0-9_]{30,}"),
              re.compile(rb"github_pat_[A-Za-z0-9_]{30,}"),
          ]
          for e in sorted(entries,key=lambda x:x["path"]):
              raw=blob(e["git_blob_sha"])
              if len(raw)!=int(e["size"]):
                  raise SystemExit(f"size mismatch: {e['path']}")
              for pat in patterns:
                  if pat.search(raw):
                      suspicious.append(e["path"])
              total+=len(raw)
              projected.append({
                  "path":e["path"],
                  "bytes":len(raw),
                  "sha256":hashlib.sha256(raw).hexdigest(),
              })
          if suspicious:
              raise SystemExit("high-confidence sensitive material in projection: "+",".join(sorted(set(suspicious))))
          if total!=1053198:
              raise SystemExit(f"projected byte count mismatch: {total}")

          identity=hashlib.sha256(json.dumps(
              {"source_revision":source,"projected_files":projected},
              sort_keys=True,separators=(",",":")
          ).encode()).hexdigest()

          cfg=blob(expected_changed["guest/tools/configuration.winget"][0]).decode("utf-8-sig")
          stage=blob(expected_changed["guest/tools/stage-provision.ps1"][0]).decode("utf-8-sig")
          required_cfg=["gerardog.gsudo","id: gsudo"]
          required_stage=[
              "OpenSSH.Server~~~~0.0.1.0",
              'Set-Service -Name sshd -StartupType Automatic',
              'Start-Service -Name sshd',
              'OpenSSH-Server-In-TCP',
              '$criticalGsudo',
              '$criticalSshCapability',
              '$criticalSshService',
              '$criticalSshFirewall',
          ]
          for m in required_cfg:
              if m not in cfg: raise SystemExit(f"configuration marker missing: {m}")
          for m in required_stage:
              if m not in stage: raise SystemExit(f"stage marker missing: {m}")

          print(json.dumps({
              "classification":"SUPPORTED",
              "source_revision":source,
              "projection_identity_sha256":identity,
              "projected_file_count":len(projected),
              "projected_bytes":total,
              "configuration_blob":expected_changed["guest/tools/configuration.winget"][0],
              "stage_provision_blob":expected_changed["guest/tools/stage-provision.ps1"][0],
              "sensitive_scan":"PASS",
          },sort_keys=True))
          PY
