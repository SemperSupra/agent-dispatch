name: WinBot Hosted-NAT Timing Projection Review

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-hosted-nat-timing-projection-review.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_REVISION: '8c1738806d44c082f43a5363531837d6a6216ab7'
      BATCH_SHAS: 'e4eb08e82d7a19fc1b9d88ddbd9e6ac8707d6c26;13254f7afb76809370503d7b81d5c81a421e3f29;3ca2db5f7867290f4794ab4d95fefd4acdf4ed45;420f0fe2468d42c63b890b9d92c918a52976752b;396751fa7c9eeeca2da8ab2ae1c6e910d29cf824;a7bc31e9092d7fe9b46432ba4703d56b9ac86dbd;bbf1928feb1f58f5c2f107a523379541d5466906;4bf4e118bbb656842da66c3bd3f2035a6536e1ba;a0857bdfb086c2799efda0f650d68da4f1126db4'
      STAGE_BLOB: '99052b87800ee00b4177f8bc3626316b4ab999d6'
    steps:
      - name: Reconstruct and review exact projection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, re, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GH_TOKEN"]; revision=os.environ["SOURCE_REVISION"]
          batches=os.environ["BATCH_SHAS"].split(";")
          sensitive={
              "private_key": re.compile(rb"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              "github_token": re.compile(rb"gh[pousr]_[A-Za-z0-9]{20,}"),
              "aws_access_key": re.compile(rb"AKIA[0-9A-Z]{16}"),
              "openai_style_key": re.compile(rb"sk-[A-Za-z0-9_-]{20,}"),
          }
          def blob(sha):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},
              )
              with urllib.request.urlopen(req,timeout=60) as r: obj=json.load(r)
              raw=base64.b64decode(obj["content"])
              if obj.get("sha")!=sha or len(raw)!=int(obj["size"]) or hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()!=sha:
                  raise SystemExit(f"blob identity mismatch: {sha}")
              return raw
          entries=[]
          for b in batches:
              batch=json.loads(blob(b))
              if batch["source_revision"]!=revision: raise SystemExit(f"batch source mismatch: {b}")
              entries.extend(batch["entries"])
          if len(entries)!=82 or len({e["path"] for e in entries})!=82: raise SystemExit("projection cardinality mismatch")
          bypath={e["path"]:e for e in entries}
          if bypath["guest/tools/stage-provision.ps1"]["git_blob_sha"]!=os.environ["STAGE_BLOB"]: raise SystemExit("stage blob mismatch")
          if any(p.startswith("guest/winpe/") for p in bypath): raise SystemExit("excluded WinPE entered projection")
          projected=[]; total=0
          for e in sorted(entries,key=lambda x:x["path"]):
              raw=blob(e["git_blob_sha"])
              if len(raw)!=int(e["size"]): raise SystemExit(f"size mismatch: {e['path']}")
              for name,pattern in sensitive.items():
                  if pattern.search(raw): raise SystemExit(f"sensitive marker {name}: {e['path']}")
              total+=len(raw)
              projected.append({"path":e["path"],"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()})
          stage=blob(os.environ["STAGE_BLOB"]).decode("utf-8-sig")
          required=[
              "AddMinutes(10)",
              "outbound-route-unavailable",
              "dns-resolution-unavailable",
              "tls-host-connect-unavailable",
              "route-dns-tls-ready",
              "refusing to write .provisioned",
              "authenticated-health-200",
          ]
          for marker in required:
              if marker not in stage: raise SystemExit(f"stage invariant missing: {marker}")
          if stage.find("2.5/8-network") > stage.find("# ---- Step 3: Ensure WinGet"): raise SystemExit("network gate ordering regression")
          identity=hashlib.sha256(json.dumps({"source_revision":revision,"projected_files":projected},sort_keys=True,separators=(",",":")).encode()).hexdigest()
          print(json.dumps({
              "classification":"SUPPORTED",
              "source_revision":revision,
              "projection_identity_sha256":identity,
              "projected_file_count":len(projected),
              "projected_bytes":total,
              "stage_provision_blob":bypath["guest/tools/stage-provision.ps1"]["git_blob_sha"],
              "sensitive_scan":"PASS",
              "private_repo_checkout":False,
              "hosted_nat_wait_minutes":10,
              "failure_discriminators":["route","dns","tls-host"],
          },sort_keys=True))
          PY
