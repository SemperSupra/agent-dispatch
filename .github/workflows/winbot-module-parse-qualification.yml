name: WinBot Module Parse Qualification

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-module-parse-qualification.yml'

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Fetch exact corrected WinBot module blob
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE_BLOB_SHA: '012ef5bcaeb0329fd1f7ac1522c945546cff2d2d'
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          }
          $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/blobs/$env:MODULE_BLOB_SHA"
          $blob=Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
          if ([string]$blob.sha -ne $env:MODULE_BLOB_SHA -or [string]$blob.encoding -ne 'base64') { throw 'module blob identity mismatch' }
          $raw=[Convert]::FromBase64String(([string]$blob.content -replace '\s',''))
          $path=Join-Path $env:RUNNER_TEMP 'WinBot.psm1'
          [IO.File]::WriteAllBytes($path,$raw)
          $gitHeader=[Text.Encoding]::ASCII.GetBytes(("blob " + $raw.Length + [char]0))
          $sha1=[Security.Cryptography.SHA1]::Create()
          $combined=New-Object byte[] ($gitHeader.Length+$raw.Length)
          [Array]::Copy($gitHeader,0,$combined,0,$gitHeader.Length)
          [Array]::Copy($raw,0,$combined,$gitHeader.Length,$raw.Length)
          $observed=([BitConverter]::ToString($sha1.ComputeHash($combined))).Replace('-','').ToLowerInvariant()
          if ($observed -ne $env:MODULE_BLOB_SHA) { throw "recomputed Git blob identity mismatch: $observed" }
          "MODULE_PATH=$path" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Parse PowerShell module
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null
          $errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($env:MODULE_PATH,[ref]$tokens,[ref]$errors)
          Write-Host "tokens=$($tokens.Count)"
          Write-Host "parse_errors=$($errors.Count)"
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ("line {0}: {1}" -f $_.Extent.StartLineNumber,$_.Message) }
            throw "WinBot.psm1 parse failed"
          }
          $newFns=@($ast.FindAll({param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'New-WinBotWorkCell'},$true))
          $removeFns=@($ast.FindAll({param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Remove-WinBotWorkCell'},$true))
          if ($newFns.Count -ne 1 -or $removeFns.Count -ne 1) {
            throw "expected exactly one work-cell function pair; New=$($newFns.Count) Remove=$($removeFns.Count)"
          }
          Write-Host 'work_cell_function_pair=PASS'
