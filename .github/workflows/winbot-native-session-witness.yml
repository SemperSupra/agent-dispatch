name: WinBot native Windows session witness (read-only)
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/winbot-native-session-witness.yml]
permissions:
  contents: read
jobs:
  windows-witness:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Observe own process logon, active WTS state and input desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt=[ordered]@{
            schema='winbot-native-session-witness/v1'
            run_id=$env:GITHUB_RUN_ID
            classification='HOST_PROCESS_IDENTITY_WITNESS_ONLY'
            process_session_nonzero=$false
            token_authentication_luid_nonzero=$false
            wts_session_active=$false
            input_desktop_default=$false
            process_not_system=$false
            trusted_consent_issued=$false
            product_actuator_enabled=$false
            winbot_mvp_accepted=$false
            first_failure=$null
          }
          try {
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          namespace WinBotSyntheticWitness {
            public static class LocalProcess {
              [StructLayout(LayoutKind.Sequential)] private struct Luid {
                public uint LowPart;
                public int HighPart;
              }
              [StructLayout(LayoutKind.Sequential)] private struct TokenStatistics {
                public Luid TokenId;
                public Luid AuthenticationId;
                public long ExpirationTime;
                public int TokenType;
                public int ImpersonationLevel;
                public uint DynamicCharged;
                public uint DynamicAvailable;
                public uint GroupCount;
                public uint PrivilegeCount;
                public Luid ModifiedId;
              }
              [DllImport("kernel32.dll")] private static extern uint GetCurrentProcessId();
              [DllImport("kernel32.dll", SetLastError=true)]
              private static extern bool ProcessIdToSessionId(uint pid, out uint session);
              [DllImport("kernel32.dll")] private static extern IntPtr GetCurrentProcess();
              [DllImport("kernel32.dll", SetLastError=true)]
              private static extern bool CloseHandle(IntPtr handle);
              [DllImport("advapi32.dll", SetLastError=true)]
              private static extern bool OpenProcessToken(IntPtr process, uint access, out IntPtr token);
              [DllImport("advapi32.dll", SetLastError=true)]
              private static extern bool GetTokenInformation(IntPtr token, int info,
                IntPtr buffer, uint length, out uint actual);
              [DllImport("wtsapi32.dll", EntryPoint="WTSQuerySessionInformationW", SetLastError=true)]
              private static extern bool WtsQuery(IntPtr server, uint sid, int info,
                out IntPtr buffer, out uint length);
              [DllImport("wtsapi32.dll")] private static extern void WTSFreeMemory(IntPtr buffer);
              [DllImport("user32.dll", SetLastError=true)]
              private static extern IntPtr OpenInputDesktop(uint flags, bool inherit, uint access);
              [DllImport("user32.dll", SetLastError=true)]
              private static extern bool CloseDesktop(IntPtr handle);
              [DllImport("user32.dll", EntryPoint="GetUserObjectInformationW",
                CharSet=CharSet.Unicode, SetLastError=true)]
              private static extern bool GetObjectInfo(IntPtr handle, int index,
                StringBuilder buffer, uint length, out uint needed);

              // No SID, LUID, user name, desktop name, token or credential is returned.
              public static bool[] Observe() {
                uint session;
                if (!ProcessIdToSessionId(GetCurrentProcessId(), out session))
                  throw new InvalidOperationException("SESSION_QUERY_FAILED");
                bool bound = session > 0 && session != UInt32.MaxValue;
                IntPtr token = IntPtr.Zero;
                bool luid = false;
                if (!OpenProcessToken(GetCurrentProcess(), 0x0008, out token))
                  throw new InvalidOperationException("OWN_TOKEN_OPEN_FAILED");
                try {
                  uint size;
                  GetTokenInformation(token, 10, IntPtr.Zero, 0, out size);
                  if (size < (uint)Marshal.SizeOf(typeof(TokenStatistics)) || size > 1024)
                    throw new InvalidOperationException("TOKEN_STATISTICS_SIZE_INVALID");
                  IntPtr buffer = Marshal.AllocHGlobal((int)size);
                  try {
                    if (!GetTokenInformation(token, 10, buffer, size, out size))
                      throw new InvalidOperationException("TOKEN_STATISTICS_UNAVAILABLE");
                    TokenStatistics stats =
                      (TokenStatistics)Marshal.PtrToStructure(buffer, typeof(TokenStatistics));
                    luid = stats.AuthenticationId.LowPart != 0 || stats.AuthenticationId.HighPart != 0;
                  } finally { Marshal.FreeHGlobal(buffer); }
                } finally { CloseHandle(token); }

                IntPtr statePtr = IntPtr.Zero;
                uint stateLength = 0;
                bool active = false;
                if (!WtsQuery(IntPtr.Zero, session, 8, out statePtr, out stateLength))
                  throw new InvalidOperationException("WTS_CONNECT_STATE_UNAVAILABLE");
                try {
                  if (statePtr == IntPtr.Zero || stateLength != 4)
                    throw new InvalidOperationException("WTS_CONNECT_STATE_MALFORMED");
                  active = Marshal.ReadInt32(statePtr) == 0;
                } finally { if(statePtr != IntPtr.Zero) WTSFreeMemory(statePtr); }

                bool desktopDefault = false;
                IntPtr desktop = OpenInputDesktop(0, false, 0x0001);
                if (desktop == IntPtr.Zero)
                  throw new InvalidOperationException("INPUT_DESKTOP_UNAVAILABLE");
                try {
                  StringBuilder name = new StringBuilder(128);
                  uint needed;
                  if (!GetObjectInfo(desktop, 2, name, 256, out needed))
                    throw new InvalidOperationException("INPUT_DESKTOP_NAME_UNAVAILABLE");
                  desktopDefault = String.Equals(name.ToString(), "Default", StringComparison.Ordinal);
                } finally { CloseDesktop(desktop); }
                return new bool[] { bound, luid, active, desktopDefault };
              }
            }
          }
          '@ -ErrorAction Stop
            $evidence=[WinBotSyntheticWitness.LocalProcess]::Observe()
            if ($evidence.Count -ne 4) { throw 'INCOMPLETE_NATIVE_OBSERVATION' }
            $receipt.process_session_nonzero=[bool]$evidence[0]
            $receipt.token_authentication_luid_nonzero=[bool]$evidence[1]
            $receipt.wts_session_active=[bool]$evidence[2]
            $receipt.input_desktop_default=[bool]$evidence[3]
            $receipt.process_not_system=-not [Security.Principal.WindowsIdentity]::GetCurrent().IsSystem
            if (-not ($receipt.process_session_nonzero -and
                $receipt.token_authentication_luid_nonzero -and
                $receipt.wts_session_active -and
                $receipt.input_desktop_default -and
                $receipt.process_not_system)) {
              throw 'HOST_NATIVE_PROCESS_WITNESS_INCOMPLETE'
            }
          } catch {
            $receipt.first_failure=$_.Exception.Message
          } finally {
            $receipt | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath native-session-receipt.json -Encoding utf8
            $receipt | ConvertTo-Json -Depth 4
          }
          if ($receipt.first_failure) { throw "NATIVE_WITNESS_FIRST_FAILURE: $($receipt.first_failure)" }
      - name: Preserve bounded non-sensitive session receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winbot-native-session-${{ github.run_id }}
          path: native-session-receipt.json
          retention-days: 2
          if-no-files-found: error
  independent-oracle:
    runs-on: ubuntu-24.04
    needs: [windows-witness]
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: winbot-native-session-${{ github.run_id }}
          path: receipt
      - name: Require exact run identity and reject implied user authority
        shell: bash
        env:
          EXPECTED_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path("receipt/native-session-receipt.json")
          if not p.is_file():
              raise SystemExit("MISSING_NATIVE_WITNESS_RECEIPT")
          r=json.loads(p.read_text(encoding="utf-8-sig"))
          if (r.get("schema")!="winbot-native-session-witness/v1"
              or r.get("classification")!="HOST_PROCESS_IDENTITY_WITNESS_ONLY"
              or str(r.get("run_id"))!=os.environ["EXPECTED_RUN"]):
              raise SystemExit("INVALID_NATIVE_WITNESS_PROVENANCE")
          for k in ("process_session_nonzero", "token_authentication_luid_nonzero",
                    "wts_session_active", "input_desktop_default", "process_not_system"):
              if r.get(k) is not True:
                  raise SystemExit("UNQUALIFIED_NATIVE_WITNESS: "+k)
          for k in ("trusted_consent_issued","product_actuator_enabled","winbot_mvp_accepted"):
              if r.get(k) is not False:
                  raise SystemExit("FALSE_PRODUCT_AUTHORITY: "+k)
          if r.get("first_failure") is not None:
              raise SystemExit("NATIVE_WITNESS_FAILED")
          print("NATIVE_LOCAL_PROCESS_WITNESS_PASS; HUMAN_CONSENT_AND_WINBOT_NOT_ADMITTED")
          PY
