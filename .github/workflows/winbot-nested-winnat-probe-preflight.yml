name: WinBot Nested WinNAT Probe Preflight

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-nested-winnat-probe-preflight.yml'

permissions:
  contents: read

jobs:
  checksum:
    runs-on: windows-2025
    timeout-minutes: 5
    env:
      PREPARED_WORKFLOW_BLOB: 'db48d5489e79b90781d45093daac9f3401508e83'
      IMAGE_NAME: 'ubuntu-24.04-server-cloudimg-amd64-azure.vhd.tar.gz'
      BASE_URL: 'https://cloud-images.ubuntu.com/releases/noble/release-20260911'
    steps:
      - name: Qualify exact prepared blob and checksum parser
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          }
          $obj=Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/blobs/$env:PREPARED_WORKFLOW_BLOB" -Headers $headers
          $raw=[Convert]::FromBase64String(([string]$obj.content -replace '\s',''))
          $prefix=[Text.Encoding]::ASCII.GetBytes(('blob ' + $raw.Length + [char]0))
          $gitObject=New-Object byte[] ($prefix.Length+$raw.Length)
          [Array]::Copy($prefix,0,$gitObject,0,$prefix.Length)
          [Array]::Copy($raw,0,$gitObject,$prefix.Length,$raw.Length)
          $sha1=[Security.Cryptography.SHA1]::Create()
          try{$observed=([BitConverter]::ToString($sha1.ComputeHash($gitObject))).Replace('-','').ToLowerInvariant()}finally{$sha1.Dispose()}
          if($observed -ne $env:PREPARED_WORKFLOW_BLOB){throw 'prepared workflow Git identity mismatch'}
          $text=[Text.Encoding]::UTF8.GetString($raw)
          foreach($marker in @(
            'curl.exe -fsSL --retry 3 --retry-delay 2 -o $sumFile',
            'TrimEnd() -match',
            "-split '\s+'",
            'group: agent-dispatch-heavyweight-rdte'
          )){
            if(-not $text.Contains($marker)){throw "prepared workflow invariant missing: $marker"}
          }

          $sumFile=Join-Path $env:RUNNER_TEMP 'SHA256SUMS'
          & curl.exe -fsSL --retry 3 --retry-delay 2 -o $sumFile ($env:BASE_URL+'/SHA256SUMS')
          if($LASTEXITCODE -ne 0){throw 'official SHA256SUMS download failed'}
          $sumLine=Get-Content -LiteralPath $sumFile |
            Where-Object { ([string]$_).TrimEnd() -match ([regex]::Escape($env:IMAGE_NAME)+'$') } |
            Select-Object -First 1
          if(-not $sumLine){throw 'official SHA256SUMS did not contain pinned Azure VHD image'}
          $expected=(([string]$sumLine).Trim() -split '\s+')[0].ToLowerInvariant()
          if($expected -notmatch '^[0-9a-f]{64}$'){throw 'official SHA256SUMS entry did not contain a valid SHA-256 digest'}
          [ordered]@{
            classification='SUPPORTED'
            prepared_workflow_blob=$env:PREPARED_WORKFLOW_BLOB
            image=$env:IMAGE_NAME
            expected_sha256=$expected
          } | ConvertTo-Json -Compress
