name: WinBot Owned-NAT-Only Harness-Fix Runtime Qualification

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-owned-nat-only-harness-fix-runtime-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE: '8c1738806d44c082f43a5363531837d6a6216ab7'
      EXPECTED_PROJECTION: '5b0ed1ae4f6b6d9b7fd7d68ccb5e5f735c7ca9be20fa1ca99eedf339c2c31b32'
      EXPECTED_POLICY: '498182e3e7d463916393bb9358f5c536be65f55c'
      A_MASTER: '3019c045cf8d629b1c07b5f3fbe017a9e49ac698'
      A_MANIFEST: '1e0da02d491cfbd5ce8ad4217e41646fca494684'
      A_CONTROL: 'b7facb4429e870207cfd358b3e6c83d87e75d0a0'
      A_WRAPPER: '3973d3b7daafc390e4d52643b09f7de84d75bf63'
      SEED_MASTER: '58ea75becd2f3c1778507e43ae258a53735ba1f2'
      SEED_MANIFEST: '7d633465e197b4103fc7c024dfd25fb2e0b645a3'
      SEED_CONTROL: '6a3358f267ad42b36a3ee853dafed16d60300de6'
      SEED_WRAPPER: '404d2a4b8d828f83d0bcc6300706ba70964b3e54'
      TERMINAL_MASTER: '31ad4407a1bfaa4e824f587cdfa2499becfa2f07'
      TERMINAL_MANIFEST: '9cd5c363a0174ff9acada9085071565a088d7930'
      TERMINAL_CONTROL: 'f9d1af4d8610016903d6978cff0a2dc05a806eaa'
      TERMINAL_WRAPPER: '65b4dfe37c69ef901a18680b8bb84ea43b36d607'

    steps:
      - name: Qualify exact graphs and prepared wrappers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'winbot-harness-fix-v2'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $py=@'
          import base64, hashlib, json, os, pathlib, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GH_TOKEN"]
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"winbot-harness-fix-v2"
          def blob(sha):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},
              )
              with urllib.request.urlopen(req,timeout=60) as r: obj=json.load(r)
              raw=base64.b64decode(obj["content"])
              got=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
              if obj.get("sha")!=sha or got!=sha: raise SystemExit(f"blob identity mismatch: {sha}")
              return raw
          def qualify(label,master_sha,manifest_sha,control_sha,wrapper_sha,phase_markers,assignment):
              m=json.loads(blob(master_sha))
              if m["source_revision"]!=os.environ["EXPECTED_SOURCE"]: raise SystemExit(f"{label}: source mismatch")
              if m["projection_identity_sha256"]!=os.environ["EXPECTED_PROJECTION"]: raise SystemExit(f"{label}: projection mismatch")
              if m["projected_file_count"]!=82 or m["projected_bytes"]!=1050197: raise SystemExit(f"{label}: projection cardinality mismatch")
              if m["control_manifest_sha"]!=manifest_sha: raise SystemExit(f"{label}: manifest pointer mismatch")
              entries=[]
              for b in m["source_batch_manifests"]:
                  batch=json.loads(blob(b))
                  if batch["source_revision"]!=m["source_revision"]: raise SystemExit(f"{label}: batch source mismatch")
                  entries.extend(batch["entries"])
              projected=[]
              for e in sorted(entries,key=lambda x:x["path"]):
                  raw=blob(e["git_blob_sha"])
                  if len(raw)!=int(e["size"]): raise SystemExit(f"{label}: projected size mismatch")
                  projected.append({"path":e["path"],"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()})
              identity=hashlib.sha256(json.dumps({"source_revision":m["source_revision"],"projected_files":projected},sort_keys=True,separators=(",",":")).encode()).hexdigest()
              if identity!=os.environ["EXPECTED_PROJECTION"]: raise SystemExit(f"{label}: recomputed projection mismatch")
              cm=json.loads(blob(manifest_sha))
              ctl={e["path"]:e["git_blob_sha"] for e in cm["entries"]}
              if ctl["rdte/gha/full-rdte.ps1"]!=control_sha: raise SystemExit(f"{label}: control pointer mismatch")
              if ctl["rdte/gha/projection-policy.json"]!=os.environ["EXPECTED_POLICY"]: raise SystemExit(f"{label}: policy pointer mismatch")
              policy=json.loads(blob(os.environ["EXPECTED_POLICY"]))
              auth=policy.get("authorization",{})
              if policy.get("state")!="authorized" or auth.get("approved_revision")!=m["source_revision"] or auth.get("approved_manifest_sha256")!=identity:
                  raise SystemExit(f"{label}: exact authorization mismatch")
              control=blob(control_sha).decode("utf-8-sig")
              required=[
                  "Do not trust a pre-existing switch merely named 'nat'",
                  "New-VMSwitch -Name $ownedNatName -SwitchType Internal",
                  "New-NetNat -Name $ownedNatName -InternalIPInterfaceAddressPrefix $ownedNatPrefix",
                  "network_provider = 'deterministic-netnat'",
                  "deterministic_nat_absent",
                  "failure_context = [ordered]@{}",
                  "$ownedNatName = 'WinBot-RDTE-NAT-' + $assignmentId",
                  "$myCommand.PSObject.Properties['Name']",
                  "capture_failed = $true",
                  "capture_failed = $false",
              ]+phase_markers
              for marker in required:
                  if marker not in control: raise SystemExit(f"{label}: invariant missing: {marker}")
              forbidden=[
                  "$runTag",
                  "$ErrorRecord.InvocationInfo.MyCommand.Name",
                  "network_provider = 'preexisting-nat'",
                  "$candidateNat = Get-VMSwitch -Name 'nat'",
              ]
              for marker in forbidden:
                  if marker in control: raise SystemExit(f"{label}: stale/fragile invariant remains: {marker}")
              wrapper=blob(wrapper_sha).decode("utf-8-sig")
              for marker in (
                  f"MASTER_MANIFEST_SHA: '{master_sha}'",
                  f"'{manifest_sha}'",
                  f"'{control_sha}'",
                  "group: agent-dispatch-heavyweight-rdte",
                  "queue: max",
                  "cancel-in-progress: false",
                  f"ASSIGNMENT_ID: '{assignment}'",
              ):
                  if marker not in wrapper: raise SystemExit(f"{label}: wrapper invariant missing: {marker}")
              (root/f"{label}.ps1").write_text(control,encoding="utf-8")
              return {"master":master_sha,"manifest":manifest_sha,"control":control_sha,"wrapper":wrapper_sha}
          results={}
          results["a"]=qualify("a",os.environ["A_MASTER"],os.environ["A_MANIFEST"],os.environ["A_CONTROL"],os.environ["A_WRAPPER"],[
              "profile = 'AuthorityRepairDiagnosticV2'",
              "AuthorityRepairScriptIdentity",
              "C:\\WinBot\\tools\\fix-api-service.ps1",
          ],"winbot-owned-nat-only-authority-a-20261007-03")
          results["seed"]=qualify("seed",os.environ["SEED_MASTER"],os.environ["SEED_MANIFEST"],os.environ["SEED_CONTROL"],os.environ["SEED_WRAPPER"],[
              "function Invoke-SeedFinalization",
              "native-ready seed finalization/scrub/reseal oracle failed",
              "[string]$record.seed_finalization.authority_readiness_path -eq 'native-provision'",
          ],"winbot-seed-finalization-owned-nat-only-20261007-03")
          results["terminal"]=qualify("terminal",os.environ["TERMINAL_MASTER"],os.environ["TERMINAL_MANIFEST"],os.environ["TERMINAL_CONTROL"],os.environ["TERMINAL_WRAPPER"],[
              "New-WinBotWorkCell -CustomName $vmNameA",
              "New-WinBotWorkCell -CustomName $vmNameB",
              "canary_survived_rematerialization",
              "[string]$record.work_cells.a.authority_readiness_path -eq 'product-repair'",
              "[string]$record.work_cells.b.authority_readiness_path -eq 'product-repair'",
          ],"winbot-terminal-fullrdte-owned-nat-only-20261007-03")
          print(json.dumps({"classification":"SUPPORTED","source":os.environ["EXPECTED_SOURCE"],"projection":os.environ["EXPECTED_PROJECTION"],"graphs":results},sort_keys=True))
          '@
          $pyPath=Join-Path $root 'qualify.py'
          [IO.File]::WriteAllText($pyPath,$py,[Text.UTF8Encoding]::new($false))
          python $pyPath
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Parse controls and exercise exact failure-context functions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'winbot-harness-fix-v2'
          foreach($label in @('a','seed','terminal')){
            $path=Join-Path $root ($label+'.ps1')
            $tokens=$null;$errors=$null
            $ast=[Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if(@($errors).Count -ne 0){throw "$label control parse failed"}
            $fn=$ast.Find({
              param($node)
              $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Set-FailureContext'
            },$true)
            if(-not $fn){throw "$label Set-FailureContext missing"}
            $fnText=$fn.Extent.Text
            $test=@'
          Set-StrictMode -Version Latest
          $record=[ordered]@{
            classification='HARNESS_FAILURE'
            failure_domain=$null
            error_type=$null
            error_message=$null
            failure_context=[ordered]@{}
          }
          __FUNCTION__
          $captured=$null
          try {
            $ownedNatName='WinBot-RDTE-NAT-' + $runTag
          } catch {
            $captured=$_
          }
          if(-not $captured){throw 'undefined runTag discriminator did not produce ErrorRecord'}
          Set-FailureContext $captured
          if($record.failure_context.capture_failed){throw 'failure-context capture fell back'}
          if([string]::IsNullOrWhiteSpace([string]$record.failure_context.fully_qualified_error_id)){throw 'failure-context FQID missing'}
          if([string]::IsNullOrWhiteSpace([string]$record.failure_context.reason)){throw 'failure-context reason missing'}
          '@
            $test=$test.Replace('__FUNCTION__',$fnText)
            & ([scriptblock]::Create($test))
            if(-not $?){throw "$label exact failure-context runtime qualification failed"}
          }
          Write-Host 'owned-NAT harness-fix v2 exact-runtime qualification: PASS'
