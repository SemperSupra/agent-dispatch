name: WinBot Owned-NAT-Only Harness-Fix Runtime Qualification

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-owned-nat-only-harness-fix-runtime-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      ORIGINAL_CONTROL: '911b29904c972f66c07721ead14cd1e8305ad0b9'
      CORRECTED_CONTROL: '20b7a44fb729808b24d9dbe72c9818d33281721d'
    steps:
      - name: Prove exact two-line control correction
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $py=@'
          import base64, hashlib, json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GH_TOKEN"]
          def blob(sha):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},
              )
              with urllib.request.urlopen(req,timeout=60) as r: obj=json.load(r)
              raw=base64.b64decode(obj["content"])
              got=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
              if obj.get("sha")!=sha or got!=sha: raise SystemExit(f"blob identity mismatch: {sha}")
              return raw.decode("utf-8-sig")
          orig=blob(os.environ["ORIGINAL_CONTROL"]); corr=blob(os.environ["CORRECTED_CONTROL"])
          expected=orig.replace(
              "    error_message = $null\n",
              "    error_message = $null\n    failure_context = [ordered]@{}\n",
              1,
          ).replace(
              "$ownedNatName = 'WinBot-RDTE-NAT-' + $runTag",
              "$ownedNatName = 'WinBot-RDTE-NAT-' + $assignmentId",
              1,
          )
          if corr!=expected: raise SystemExit("corrected control differs from exact two-line repair")
          if orig.count("$runTag")!=1: raise SystemExit("original runTag discriminator changed")
          if "$runTag" in corr: raise SystemExit("corrected control still contains runTag")
          if "failure_context = [ordered]@{}" in orig: raise SystemExit("original unexpectedly initialized failure_context")
          if "failure_context = [ordered]@{}" not in corr: raise SystemExit("corrected failure_context initialization missing")
          print(json.dumps({"classification":"SUPPORTED","exact_two_line_repair":True,"original":os.environ["ORIGINAL_CONTROL"],"corrected":os.environ["CORRECTED_CONTROL"]},sort_keys=True))
          '@
          $py | python -
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Falsify original and exercise corrected failure path
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'

          # Original owned-NAT name expression must fail under StrictMode because runTag is undefined.
          $runTagFailure=$false
          Set-StrictMode -Version Latest
          try {
            $ownedNatName='WinBot-RDTE-NAT-' + $runTag
          } catch {
            $runTagFailure=$true
          }
          if(-not $runTagFailure){throw 'original undefined runTag did not fail under StrictMode'}

          # Original top-level catch access must be capable of masking the primary exception.
          $maskFailure=$false
          $orig=[ordered]@{
            classification='HARNESS_FAILURE'
            failure_domain=$null
            error_type=$null
            error_message=$null
          }
          try {
            throw [InvalidOperationException]::new('primary')
          } catch {
            try {
              if(-not $orig.failure_context -or $orig.failure_context.Count -eq 0){$null=$true}
            } catch {
              $maskFailure=$true
            }
          }
          if(-not $maskFailure){throw 'original missing failure_context did not reproduce catch masking under StrictMode'}

          # Corrected initialization/name binding and failure capture must execute without secondary failure.
          $assignmentId='winbot-owned-nat-only-authority-a-20261007-02'
          $ownedNatName='WinBot-RDTE-NAT-' + $assignmentId
          if($ownedNatName -ne 'WinBot-RDTE-NAT-winbot-owned-nat-only-authority-a-20261007-02'){throw 'assignment-bound NAT name mismatch'}

          $record=[ordered]@{
            classification='HARNESS_FAILURE'
            failure_domain=$null
            error_type=$null
            error_message=$null
            failure_context=[ordered]@{}
          }
          $rc=1
          try {
            throw [InvalidOperationException]::new('primary')
          } catch {
            if(-not $record.failure_context -or $record.failure_context.Count -eq 0){
              $record.failure_context=[ordered]@{ command_name=[string]$_.InvocationInfo.MyCommand.Name }
            }
            if(-not $record.error_type){$record.error_type=$_.Exception.GetType().FullName}
            if(-not $record.error_message){$record.error_message=$_.Exception.Message}
            if($record.classification -eq 'HARNESS_FAILURE'){$rc=3}
          }
          if($rc -ne 3){throw 'corrected catch did not preserve HARNESS_FAILURE rc'}
          if([string]::IsNullOrWhiteSpace([string]$record.error_type)){throw 'corrected catch did not retain error type'}
          if([string]$record.error_message -ne 'primary'){throw 'corrected catch did not retain primary message'}
          if($record.failure_context.Count -eq 0){throw 'corrected catch did not retain failure context'}
          Write-Host 'owned-NAT harness-fix runtime qualification: PASS'
