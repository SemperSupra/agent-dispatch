name: WinBot Owned-NAT Short-Name Qualification

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-owned-nat-short-name-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE: '8c1738806d44c082f43a5363531837d6a6216ab7'
      EXPECTED_PROJECTION: '5b0ed1ae4f6b6d9b7fd7d68ccb5e5f735c7ca9be20fa1ca99eedf339c2c31b32'
      A_MASTER: '158ac139db287bd6c7efcf5d2c7477e802b86796'
      A_MANIFEST: '35cf3d54ddca6eb56cf564837e4206295cc2079b'
      A_CONTROL: '357abe0886b36e93f818f5f17704ae11f6348199'
      A_WRAPPER: '4ced6c09df12e66d7da4cad4dd91ce8a05958fe6'
      SEED_MASTER: '690a5e61147249c554475b1dc3ecbac92b746d32'
      SEED_MANIFEST: 'ef599cd1feae56ad12862b87bb4a7ec9a6d41105'
      SEED_CONTROL: '0d31656db7ae4a8ca478bc621a3d60bb064c4430'
      SEED_WRAPPER: '263d219f3c2324300aa7625caf03f7933e4a163d'
      TERMINAL_MASTER: 'ebebb9280785ec77fd9ff7c00d941a3777cc44b4'
      TERMINAL_MANIFEST: 'dc52b21c8c8e1004883de1a58ab6684eb26cf625'
      TERMINAL_CONTROL: '33a9c68073e5b21251b02c36ae7f0937f825f6cc'
      TERMINAL_WRAPPER: 'a07600faf63bbc8ead3424ec11b90db9346016d5'

    steps:
      - name: Qualify exact graph and wrapper identities
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $py=@'
          import base64, hashlib, json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GH_TOKEN"]
          def blob(sha):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},
              )
              with urllib.request.urlopen(req,timeout=60) as r: obj=json.load(r)
              raw=base64.b64decode(obj["content"])
              got=hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
              if obj.get("sha")!=sha or got!=sha: raise SystemExit(f"blob identity mismatch: {sha}")
              return raw
          graphs=[
              ("a",os.environ["A_MASTER"],os.environ["A_MANIFEST"],os.environ["A_CONTROL"],os.environ["A_WRAPPER"]),
              ("seed",os.environ["SEED_MASTER"],os.environ["SEED_MANIFEST"],os.environ["SEED_CONTROL"],os.environ["SEED_WRAPPER"]),
              ("terminal",os.environ["TERMINAL_MASTER"],os.environ["TERMINAL_MANIFEST"],os.environ["TERMINAL_CONTROL"],os.environ["TERMINAL_WRAPPER"]),
          ]
          for label,master_sha,manifest_sha,control_sha,wrapper_sha in graphs:
              m=json.loads(blob(master_sha))
              if m["source_revision"]!=os.environ["EXPECTED_SOURCE"]: raise SystemExit(f"{label}: source mismatch")
              if m["projection_identity_sha256"]!=os.environ["EXPECTED_PROJECTION"]: raise SystemExit(f"{label}: projection mismatch")
              if m["control_manifest_sha"]!=manifest_sha: raise SystemExit(f"{label}: manifest pointer mismatch")
              cm=json.loads(blob(manifest_sha))
              ctl={e["path"]:e["git_blob_sha"] for e in cm["entries"]}
              if ctl["rdte/gha/full-rdte.ps1"]!=control_sha: raise SystemExit(f"{label}: control pointer mismatch")
              control=blob(control_sha).decode("utf-8-sig")
              required=[
                  "$ownedNatHasher = [Security.Cryptography.SHA256]::Create()",
                  "$ownedNatName = 'WbNat-' + $ownedNatHash.Substring(0,20)",
                  "New-VMSwitch -Name $ownedNatName -SwitchType Internal",
                  "New-NetNat -Name $ownedNatName -InternalIPInterfaceAddressPrefix $ownedNatPrefix",
                  "Do not trust a pre-existing switch merely named 'nat'",
                  "failure_context = [ordered]@{}",
              ]
              for marker in required:
                  if marker not in control: raise SystemExit(f"{label}: short-name invariant missing: {marker}")
              for marker in ("$ownedNatName = 'WinBot-RDTE-NAT-' + $assignmentId","network_provider = 'preexisting-nat'","$runTag"):
                  if marker in control: raise SystemExit(f"{label}: stale invariant remains: {marker}")
              wrapper=blob(wrapper_sha).decode("utf-8-sig")
              for marker in (master_sha,manifest_sha,control_sha,"group: agent-dispatch-heavyweight-rdte","queue: max","cancel-in-progress: false"):
                  if marker not in wrapper: raise SystemExit(f"{label}: wrapper invariant missing: {marker}")
              if "$ownedNatName = 'WbNat-' + $ownedNatHash.Substring(0,20)" not in wrapper:
                  raise SystemExit(f"{label}: corrected short-name wrapper guard missing")
              if "WinBot-RDTE-NAT-" in wrapper:
                  raise SystemExit(f"{label}: stale long-name wrapper guard remains")
          print(json.dumps({"classification":"SUPPORTED","source":os.environ["EXPECTED_SOURCE"],"projection":os.environ["EXPECTED_PROJECTION"]},sort_keys=True))
          '@
          $p=Join-Path $env:RUNNER_TEMP 'qualify.py'
          [IO.File]::WriteAllText($p,$py,[Text.UTF8Encoding]::new($false))
          python $p
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Parse exact controls
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          foreach($sha in @($env:A_CONTROL,$env:SEED_CONTROL,$env:TERMINAL_CONTROL)){
            $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
            $o=Invoke-RestMethod -Headers $h -Uri ("https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/blobs/"+$sha)
            $raw=[Convert]::FromBase64String(($o.content -replace '\\s',''))
            $path=Join-Path $env:RUNNER_TEMP ($sha+'.ps1')
            [IO.File]::WriteAllBytes($path,$raw)
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if(@($errors).Count -ne 0){throw "control parse failed: $sha"}
          }

      - name: Exercise exact short NetNat identity
        id: nat
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $assignmentId='winbot-owned-nat-only-authority-a-20261007-03'
          $hasher=[Security.Cryptography.SHA256]::Create()
          try {
            $hash=[BitConverter]::ToString($hasher.ComputeHash([Text.Encoding]::UTF8.GetBytes($assignmentId))).Replace('-','').ToLowerInvariant()
          } finally {
            $hasher.Dispose()
          }
          $name='WbNat-'+$hash.Substring(0,20)
          if($name.Length -ne 26){throw "unexpected NetNat name length: $($name.Length)"}
          $prefix='172.29.250.0/24';$gateway='172.29.250.1'
          $createdSwitch=$false;$createdIp=$false;$createdNat=$false
          $result=[ordered]@{schema_version=1;classification='SUPPORTED';name=$name;name_length=$name.Length;repetitions=@();cleanup_oracle=$false}
          try {
            for($i=1;$i -le 2;$i++){
              Get-NetNat -Name $name -ErrorAction SilentlyContinue | Remove-NetNat -Confirm:$false -ErrorAction SilentlyContinue
              Get-VMSwitch -Name $name -ErrorAction SilentlyContinue | Remove-VMSwitch -Force -ErrorAction SilentlyContinue
              New-VMSwitch -Name $name -SwitchType Internal -ErrorAction Stop | Out-Null;$createdSwitch=$true
              $alias='vEthernet ('+$name+')'
              $adapter=Get-NetAdapter -Name $alias -ErrorAction Stop
              New-NetIPAddress -InterfaceIndex $adapter.ifIndex -IPAddress $gateway -PrefixLength 24 -AddressFamily IPv4 -ErrorAction Stop | Out-Null;$createdIp=$true
              New-NetNat -Name $name -InternalIPInterfaceAddressPrefix $prefix -ErrorAction Stop | Out-Null;$createdNat=$true
              $result.repetitions+=@([ordered]@{rep=$i;success=$true})
              Get-NetNat -Name $name -ErrorAction Stop | Remove-NetNat -Confirm:$false -ErrorAction Stop;$createdNat=$false
              Get-NetIPAddress -InterfaceAlias $alias -AddressFamily IPv4 -IPAddress $gateway -ErrorAction SilentlyContinue | Remove-NetIPAddress -Confirm:$false -ErrorAction SilentlyContinue;$createdIp=$false
              Get-VMSwitch -Name $name -ErrorAction Stop | Remove-VMSwitch -Force -ErrorAction Stop;$createdSwitch=$false
            }
          } catch {
            $result.classification='ENVIRONMENT_FAILURE'
            $result.error_type=$_.Exception.GetType().FullName
            $result.fqid=[string]$_.FullyQualifiedErrorId
            throw
          } finally {
            if($createdNat){Get-NetNat -Name $name -ErrorAction SilentlyContinue | Remove-NetNat -Confirm:$false -ErrorAction SilentlyContinue}
            if($createdIp){Get-NetIPAddress -InterfaceAlias ('vEthernet ('+$name+')') -AddressFamily IPv4 -IPAddress $gateway -ErrorAction SilentlyContinue | Remove-NetIPAddress -Confirm:$false -ErrorAction SilentlyContinue}
            if($createdSwitch){Get-VMSwitch -Name $name -ErrorAction SilentlyContinue | Remove-VMSwitch -Force -ErrorAction SilentlyContinue}
            $result.cleanup_oracle=(-not [bool](Get-NetNat -Name $name -ErrorAction SilentlyContinue)) -and (-not [bool](Get-VMSwitch -Name $name -ErrorAction SilentlyContinue))
            $out=Join-Path $env:RUNNER_TEMP 'winbot-short-netnat.json'
            $result | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $out -Encoding utf8
          }
          if(-not $result.cleanup_oracle){throw 'short NetNat cleanup oracle failed'}

      - name: Upload bounded short-name evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winbot-short-netnat-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/winbot-short-netnat.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
