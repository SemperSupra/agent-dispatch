name: WinBot owned VHDX disk mapping (free Windows)
on:
  push:
    branches: [experiment/winbot-owned-vhd-guard-20261119]
    paths: [.github/workflows/winbot-owned-vhd-guard.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/winbot-owned-vhd-guard.yml]
permissions:
  contents: read
concurrency:
  group: winbot-owned-vhd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owned-vhd:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Prove new disposable VHDX maps to exact blank non-host disk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "wb-owned-vhd-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $path = Join-Path $root 'exact-owned.vhdx'
          $mounted = $false
          $receipt = [ordered]@{
            schema = 'winbot-owned-vhd-guard/v1'
            run_id = $env:GITHUB_RUN_ID
            classification = 'OWNED_VHD_MAPPING_READ_ONLY'
            exact_mapping_proven = $false
            blank_nonboot_disk_proven = $false
            disk_zero_refused = $true
            partitions_mutated = $false
            host_disk_mutated = $false
            cleanup_confirmed = $false
            first_failure = $null
          }
          try {
            if (Test-Path -LiteralPath $path) { throw 'OWNED_VHD_PREEXISTS' }
            New-VHD -Path $path -Dynamic -SizeBytes 256MB -ErrorAction Stop | Out-Null
            $mount = Mount-VHD -Path $path -Passthru -ErrorAction Stop
            $mounted = $true
            $vhd = Get-VHD -Path $path -ErrorAction Stop
            $observed = @($mount | Get-Disk -ErrorAction Stop)
            if (-not $vhd.Attached -or $vhd.Path -ine $path -or
                [int]$vhd.DiskNumber -le 0 -or
                $observed.Count -ne 1 -or
                [int]$observed[0].Number -ne [int]$vhd.DiskNumber) {
              throw 'EXACT_VHD_DISK_MAPPING_FAILED'
            }
            $receipt.exact_mapping_proven = $true
            $disk = Get-Disk -Number ([int]$vhd.DiskNumber) -ErrorAction Stop
            if ($disk.IsBoot -or $disk.IsSystem -or $disk.PartitionStyle -ne 'RAW' -or
                @($disk | Get-Partition -ErrorAction SilentlyContinue).Count -ne 0) {
              throw 'BLANK_NONBOOT_DISK_GUARD_FAILED'
            }
            $receipt.blank_nonboot_disk_proven = $true
            # Deliberate no-op: never initialize, clear, format or partition.
          } catch {
            $receipt.first_failure = $_.Exception.Message
          } finally {
            if ($mounted) {
              try { Dismount-VHD -Path $path -ErrorAction Stop } catch {
                $receipt.cleanup_failure = $_.Exception.Message
              }
            }
            if (Test-Path -LiteralPath $path) {
              try { Remove-Item -LiteralPath $path -Force -ErrorAction Stop } catch {
                $receipt.cleanup_failure = $_.Exception.Message
              }
            }
            $receipt.cleanup_confirmed = -not (Test-Path -LiteralPath $path)
            $receipt | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 owned-vhd.json
            $receipt | ConvertTo-Json -Depth 5
          }
          if (-not $receipt.exact_mapping_proven -or -not $receipt.blank_nonboot_disk_proven -or -not $receipt.cleanup_confirmed) {
            throw "VHD_GUARD_FAIL: $($receipt.first_failure); cleanup=$($receipt.cleanup_failure)"
          }
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winbot-owned-vhd-${{ github.run_id }}
          path: owned-vhd.json
          retention-days: 2
          if-no-files-found: error
