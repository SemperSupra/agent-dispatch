name: WinBot Phase-Separated Successor Qualification

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-phase-separated-successor-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEED_MASTER: '2fcd7f1bc90e5770bcfe7334546b1016f3cfa0e1'
      TERMINAL_MASTER: 'fd1b4816602d871db11be20056af7b3b9f62f268'
      EXPECTED_SOURCE: '8c1738806d44c082f43a5363531837d6a6216ab7'
      EXPECTED_PROJECTION: '5b0ed1ae4f6b6d9b7fd7d68ccb5e5f735c7ca9be20fa1ca99eedf339c2c31b32'
      EXPECTED_POLICY: '498182e3e7d463916393bb9358f5c536be65f55c'
      SEED_CONTROL: '291d61f1522dff4a6a9ee66597e90316cbbb08c7'
      TERMINAL_CONTROL: '8eaf889dc19cea30ec9dbdd4127a83ab759db13a'
    steps:
      - name: Qualify native-seed and repair-cell phase separation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request

          repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GH_TOKEN"]
          def blob(sha):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},
              )
              with urllib.request.urlopen(req,timeout=60) as r: obj=json.load(r)
              raw=base64.b64decode(obj["content"])
              if obj.get("sha")!=sha or hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()!=sha:
                  raise SystemExit(f"blob identity mismatch: {sha}")
              return raw

          def common(master_sha,control_sha,profile):
              m=json.loads(blob(master_sha))
              if m["source_revision"]!=os.environ["EXPECTED_SOURCE"]: raise SystemExit(f"{profile}: source mismatch")
              if m["projection_identity_sha256"]!=os.environ["EXPECTED_PROJECTION"]: raise SystemExit(f"{profile}: projection mismatch")
              if m["projected_file_count"]!=82 or m["projected_bytes"]!=1050197: raise SystemExit(f"{profile}: projection cardinality mismatch")
              entries=[]
              for b in m["source_batch_manifests"]:
                  batch=json.loads(blob(b))
                  if batch["source_revision"]!=m["source_revision"]: raise SystemExit(f"{profile}: batch source mismatch")
                  entries.extend(batch["entries"])
              projected=[]
              for e in sorted(entries,key=lambda x:x["path"]):
                  raw=blob(e["git_blob_sha"])
                  projected.append({"path":e["path"],"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest()})
              ident=hashlib.sha256(json.dumps({"source_revision":m["source_revision"],"projected_files":projected},sort_keys=True,separators=(",",":")).encode()).hexdigest()
              if ident!=m["projection_identity_sha256"]: raise SystemExit(f"{profile}: recomputed projection mismatch")
              cm=json.loads(blob(m["control_manifest_sha"]))
              ctl={e["path"]:e["git_blob_sha"] for e in cm["entries"]}
              if ctl["rdte/gha/full-rdte.ps1"]!=control_sha: raise SystemExit(f"{profile}: control mismatch")
              if ctl["rdte/gha/projection-policy.json"]!=os.environ["EXPECTED_POLICY"]: raise SystemExit(f"{profile}: policy mismatch")
              policy=json.loads(blob(ctl["rdte/gha/projection-policy.json"]))
              auth=policy["authorization"]
              if policy.get("state")!="authorized" or auth.get("approved_revision")!=m["source_revision"] or auth.get("approved_manifest_sha256")!=m["projection_identity_sha256"]:
                  raise SystemExit(f"{profile}: exact authorization mismatch")
              return m,blob(control_sha).decode("utf-8-sig")

          seed_m,seed=common(os.environ["SEED_MASTER"],os.environ["SEED_CONTROL"],"seed")
          for marker in (
              "authority_readiness_path = if ($ready.AuthorityRehydrationAttempted) { 'product-repair' } else { 'native-provision' }",
              "[string]$record.seed_finalization.authority_readiness_path -eq 'native-provision'",
              "-not $record.seed_finalization.authority_rehydration_attempted",
              "-not $record.seed_finalization.authority_rehydration_succeeded",
              "native-ready seed finalization/scrub/reseal oracle failed",
          ):
              if marker not in seed: raise SystemExit(f"seed phase invariant missing: {marker}")

          term_m,term=common(os.environ["TERMINAL_MASTER"],os.environ["TERMINAL_CONTROL"],"terminal")
          for marker in (
              "[string]$record.seed_finalization.authority_readiness_path -eq 'native-provision'",
              "work cell A did not establish per-cell authority through exact product repair",
              "work cell B did not establish per-cell authority through exact product repair",
              "$record.work_cells.a.authority_repair_script_identity",
              "$record.work_cells.b.authority_repair_script_identity",
              "[string]$record.work_cells.a.authority_readiness_path -eq 'product-repair'",
              "[string]$record.work_cells.b.authority_readiness_path -eq 'product-repair'",
          ):
              if marker not in term: raise SystemExit(f"terminal phase invariant missing: {marker}")

          print(json.dumps({
              "classification":"SUPPORTED",
              "seed":{"master":os.environ["SEED_MASTER"],"control":os.environ["SEED_CONTROL"],"phase":"native-first-boot"},
              "terminal":{"master":os.environ["TERMINAL_MASTER"],"control":os.environ["TERMINAL_CONTROL"],"seed_phase":"native-first-boot","cell_phase":"exact-product-repair"},
              "projection_identity_sha256":os.environ["EXPECTED_PROJECTION"],
          },sort_keys=True))
          PY
