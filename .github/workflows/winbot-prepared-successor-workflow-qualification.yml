name: WinBot Prepared Successor Workflow Qualification

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-prepared-successor-workflow-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEED_WORKFLOW_BLOB: '89adbcf7e1fd8e382adba31dfe03902b31bd9db6'
      TERMINAL_WORKFLOW_BLOB: '6067d5624e424ccf91af26047bd60e035f22e2de'
    steps:
      - name: Qualify prepared successor workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request, re
          repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GH_TOKEN"]
          def blob(sha):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},
              )
              with urllib.request.urlopen(req,timeout=60) as r: obj=json.load(r)
              raw=base64.b64decode(obj["content"])
              if obj.get("sha")!=sha or hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()!=sha:
                  raise SystemExit(f"blob identity mismatch: {sha}")
              return raw.decode("utf-8-sig")

          seed=blob(os.environ["SEED_WORKFLOW_BLOB"])
          term=blob(os.environ["TERMINAL_WORKFLOW_BLOB"])

          seed_required=[
              "MASTER_MANIFEST_SHA: '2fcd7f1bc90e5770bcfe7334546b1016f3cfa0e1'",
              "EXPECTED_SOURCE_REVISION: '8c1738806d44c082f43a5363531837d6a6216ab7'",
              "EXPECTED_PROJECTION_IDENTITY: '5b0ed1ae4f6b6d9b7fd7d68ccb5e5f735c7ca9be20fa1ca99eedf339c2c31b32'",
              "EXPECTED_CONTROL_MANIFEST_SHA: '693e47ff7f272ff30e2795d874ef4b99dab5b05f'",
              "EXPECTED_SEED_CONTROL_BLOB: '291d61f1522dff4a6a9ee66597e90316cbbb08c7'",
              "winbot-seed-finalization-hosted-nat.yml",
          ]
          term_required=[
              "MASTER_MANIFEST_SHA: 'fd1b4816602d871db11be20056af7b3b9f62f268'",
              "EXPECTED_SOURCE_REVISION: '8c1738806d44c082f43a5363531837d6a6216ab7'",
              "EXPECTED_PROJECTION_IDENTITY: '5b0ed1ae4f6b6d9b7fd7d68ccb5e5f735c7ca9be20fa1ca99eedf339c2c31b32'",
              "EXPECTED_CONTROL_MANIFEST_SHA: 'bab46cfc6ab81781f0a3d4b6f05b6a57c8f733bf'",
              "EXPECTED_TERMINAL_CONTROL_BLOB: '8eaf889dc19cea30ec9dbdd4127a83ab759db13a'",
              "winbot-terminal-fullrdte-hosted-nat.yml",
          ]
          for marker in seed_required:
              if marker not in seed: raise SystemExit(f"seed workflow invariant missing: {marker}")
          for marker in term_required:
              if marker not in term: raise SystemExit(f"terminal workflow invariant missing: {marker}")

          stale=[
              "d623e0b0a6503457754d48adbfb737135500ebbe",
              "7327a8de5927da3dbe52db0756012a2c6b24b2236dc7f471425880d139bfc3e7",
              "84457ddd53b390875849e02d3746b2c3145d0897",
              "6ee302a111fc99032df9d24bfb9d09d32a1aa4e1",
          ]
          for old in stale:
              if old in seed or old in term: raise SystemExit(f"stale successor identity remains: {old}")

          print(json.dumps({
              "classification":"SUPPORTED",
              "seed_workflow_blob":os.environ["SEED_WORKFLOW_BLOB"],
              "terminal_workflow_blob":os.environ["TERMINAL_WORKFLOW_BLOB"],
              "source_revision":"8c1738806d44c082f43a5363531837d6a6216ab7",
              "projection_identity_sha256":"5b0ed1ae4f6b6d9b7fd7d68ccb5e5f735c7ca9be20fa1ca99eedf339c2c31b32",
          },sort_keys=True))
          PY
