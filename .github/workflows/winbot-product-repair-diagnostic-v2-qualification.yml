name: WinBot Product Repair Diagnostic V2 Qualification

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-product-repair-diagnostic-v2-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 8
    env:
      CONTROL_BLOB_SHA: '48c3106607c97602c7da9046cd1f08feafda67f2'
      PRODUCT_REPAIR_BLOB: 'c34b8e891220ba4ceab9f4e08c415f26d1490741'
    steps:
      - name: Qualify exact bounded product-repair diagnostic control
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          function Get-BlobBytes([string]$sha) {
            $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/blobs/$sha"
            $blob=Invoke-RestMethod -Headers $headers -Uri $uri
            if([string]$blob.sha -ne $sha -or [string]$blob.encoding -ne 'base64'){throw "blob identity mismatch: $sha"}
            $raw=[Convert]::FromBase64String(([string]$blob.content -replace '\s',''))
            if($raw.Length -ne [int]$blob.size){throw "blob size mismatch: $sha"}
            return $raw
          }
          $raw=Get-BlobBytes $env:CONTROL_BLOB_SHA
          $repair=Get-BlobBytes $env:PRODUCT_REPAIR_BLOB
          $path=Join-Path $env:RUNNER_TEMP 'product-repair-diagnostic-v2.ps1'
          [IO.File]::WriteAllBytes($path,$raw)
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){throw 'diagnostic v2 control parse failed'}
          $text=[Text.Encoding]::UTF8.GetString($raw)
          $repairText=[Text.Encoding]::UTF8.GetString($repair)
          foreach($needle in @(
            "profile = 'AuthorityRepairDiagnosticV2'",
            $env:PRODUCT_REPAIR_BLOB,
            "repair_log_signal='no-python'",
            "repair_log_signal='api-payload-missing'",
            "repair_log_signal='task-register-failed'",
            'AuthorityPythonPresentBefore',
            'AuthorityPythonPresentAfter',
            'AuthorityRepairLogSignal'
          )){
            if(-not $text.Contains($needle)){throw "diagnostic v2 invariant missing: $needle"}
          }
          foreach($repairNeedle in @(
            '$ErrorActionPreference = "Stop"',
            'No Python found. Install Python manually and retry.',
            'ERROR: C:\WinBot\api\main.py not found! Deploy code first.',
            'Failed to create Scheduled Task:',
            'API process exited immediately',
            'API not responding:'
          )){
            if(-not $repairText.Contains($repairNeedle)){throw "product repair signal missing: $repairNeedle"}
          }
          foreach($forbidden in @(
            'New-WinBotWorkCell -CustomName $vmNameB',
            'canary_survived_rematerialization',
            'pytest',
            'Invoke-SeedFinalization'
          )){
            if($text.Contains($forbidden)){throw "A-only diagnostic boundary violation: $forbidden"}
          }
          Write-Host 'classification=SUPPORTED'
          Write-Host "control_blob=$env:CONTROL_BLOB_SHA"
          Write-Host 'bounded_product_repair_signal=true'
          Write-Host 'raw_repair_log_published=false'
