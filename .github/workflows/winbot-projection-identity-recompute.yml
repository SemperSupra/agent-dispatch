name: WinBot Projection Identity Recompute

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-projection-identity-recompute.yml'

permissions:
  contents: read

jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OLD_MASTER_MANIFEST_SHA: 'bbf4bf113e8bb8e87cfe5b8d3999de7872a3a93c'
      NEW_SOURCE_REVISION: '0283e44337705aab350ea506758dcb312c43aef7'
      NEW_HOST_BLOB_SHA: '3cc498696e006dcb8dafd28045999ddaf6e1460f'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Recompute exact projection identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, urllib.request

          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          master_sha=os.environ["OLD_MASTER_MANIFEST_SHA"]
          new_rev=os.environ["NEW_SOURCE_REVISION"]
          new_host=os.environ["NEW_HOST_BLOB_SHA"]

          def blob(sha):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={
                      "Authorization":f"Bearer {token}",
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                  },
              )
              with urllib.request.urlopen(req,timeout=60) as r:
                  obj=json.load(r)
              if obj.get("sha")!=sha or obj.get("encoding")!="base64":
                  raise SystemExit(f"blob identity mismatch {sha}")
              raw=base64.b64decode(obj["content"])
              if len(raw)!=int(obj["size"]):
                  raise SystemExit(f"blob size mismatch {sha}")
              actual=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
              if actual!=sha:
                  raise SystemExit(f"git object digest mismatch {sha}")
              return raw

          master=json.loads(blob(master_sha))
          entries=[]
          for bsha in master["source_batch_manifests"]:
              batch=json.loads(blob(bsha))
              entries.extend(batch["entries"])

          if len(entries)!=80 or len({e["path"] for e in entries})!=80:
              raise SystemExit("expected exactly 80 unique projected paths")
          host=[e for e in entries if e["path"]=="host/WinBot.psm1"]
          if len(host)!=1:
              raise SystemExit("host module entry cardinality mismatch")
          host[0]["git_blob_sha"]=new_host
          host[0].pop("size",None)

          sensitive={
              "private_key":re.compile(rb"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              "github_token":re.compile(rb"gh[pousr]_[A-Za-z0-9]{20,}"),
              "aws_access_key":re.compile(rb"AKIA[0-9A-Z]{16}"),
              "openai_style_key":re.compile(rb"sk-[A-Za-z0-9_-]{20,}"),
          }
          projected=[]
          total=0
          for e in sorted(entries,key=lambda x:x["path"]):
              raw=blob(e["git_blob_sha"])
              if len(raw)>512*1024:
                  raise SystemExit(f"per-file bound exceeded: {e['path']}")
              for name,pat in sensitive.items():
                  if pat.search(raw):
                      raise SystemExit(f"sensitive marker {name}: {e['path']}")
              total+=len(raw)
              projected.append({
                  "path":e["path"],
                  "bytes":len(raw),
                  "sha256":hashlib.sha256(raw).hexdigest(),
              })
          if total>8*1024*1024:
              raise SystemExit("projection byte bound exceeded")
          obj={"source_revision":new_rev,"projected_files":projected}
          identity=hashlib.sha256(
              json.dumps(obj,sort_keys=True,separators=(",",":")).encode()
          ).hexdigest()

          result={
              "schema_version":1,
              "source_revision":new_rev,
              "projection_identity_sha256":identity,
              "projected_file_count":len(projected),
              "projected_bytes":total,
              "new_host_blob_sha":new_host,
              "sensitive_scan":"PASS",
              "projected_files":projected,
          }
          pathlib.Path("projection-review.json").write_text(
              json.dumps(result,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          print("source_revision="+new_rev)
          print("projection_identity_sha256="+identity)
          print("projected_file_count="+str(len(projected)))
          print("projected_bytes="+str(total))
          print("sensitive_scan=PASS")
          PY

      - name: Upload projection review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winbot-projection-review-${{ github.run_id }}
          path: projection-review.json
          if-no-files-found: error
          retention-days: 14
