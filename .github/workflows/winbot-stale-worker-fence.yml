name: WinBot stale-owner downstream fencing (public synthetic)
on:
  push:
    branches: [experiment/winbot-stale-actor-fence-20261021]
    paths:
      - scripts/winbot_public_stale_worker_fencing.py
      - .github/workflows/winbot-stale-worker-fence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stale-owner-fencing:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare synthetic journal receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:WINBOT_PUBLIC_RECEIPT_DIR = Join-Path $env:RUNNER_TEMP 'winbot-stale-owner'
          python -m scripts.winbot_public_stale_worker_fencing
          if ($LASTEXITCODE -ne 0) { throw 'Fail closed: synthetic generation fencing failed' }
          $receipt = Get-Content (Join-Path $env:WINBOT_PUBLIC_RECEIPT_DIR 'stale-worker-fence.json') -Raw | ConvertFrom-Json
          if (!$receipt.stale_worker_after_supersession_refused -or
              !$receipt.single_current_generation_winner -or
              !$receipt.commit_before_ack_replay_refused -or
              $receipt.native_vm_mutation_admitted -or
              $receipt.private_winbot_source_executed) { throw 'Invalid non-admission receipt' }
      - name: Retain independent platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winbot-stale-fence-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/winbot-stale-owner/
