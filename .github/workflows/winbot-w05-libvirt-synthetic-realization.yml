name: WinBot W0.6 real disk safety preflight on synthetic KVM RDTE
on:
  push:
    branches:
      - experiment/winbot-w1-disk0-safety-20261020
    paths:
      - scripts/windows_w1_libvirt_disk_guard.py
      - tests/test_windows_w1_libvirt_disk_guard.py
      - scripts/winbot_w05_synthetic_realization.py
      - .github/workflows/winbot-w05-libvirt-synthetic-realization.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-dispatch-heavyweight-rdte
  cancel-in-progress: false
jobs:
  one-disposable-owned-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run independent fail-closed disk-zero guard adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests/test_windows_w1_libvirt_disk_guard.py
      - name: Observe free runner and install only synthetic lab prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo test -c /dev/kvm
          test "$(free -m | awk '/Mem:/ {print $7}')" -ge 6144
          test "$(df -Pk / | awk 'NR==2 {print $4}')" -ge 10485760
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils libvirt-daemon-system libvirt-clients ovmf swtpm swtpm-tools xorriso libxml2-utils
          sudo systemctl start libvirtd
          sudo virsh -c qemu:///system domcapabilities --virttype kvm --arch x86_64 > /tmp/winbot-w05-domcap.xml
          test -s /usr/share/OVMF/OVMF_CODE_4M.secboot.fd
          test -s /usr/share/OVMF/OVMF_VARS_4M.ms.fd
      - name: Exercise exact owned Q35/SATA/CDROM/TPM2/net fixture; teardown
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 -m scripts.winbot_w05_synthetic_realization
      - name: Preserve guest and cleanup evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winbot-w06-real-disk-guard
          retention-days: 7
          if-no-files-found: error
          path: /tmp/winbot-w05-receipt/
