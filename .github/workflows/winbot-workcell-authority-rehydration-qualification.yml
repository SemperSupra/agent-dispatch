name: WinBot Work-Cell Authority Rehydration Qualification

on:
  push:
    branches:
      - 'exp/windows-sealed-public-execution'
    paths:
      - '.github/workflows/winbot-workcell-authority-rehydration-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 8
    env:
      CONTROL_BLOB_SHA: '35d0c34ecb91933026d609546f20074f73e36029'
    steps:
      - name: Parse and inspect exact authority-rehydration control
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/blobs/$env:CONTROL_BLOB_SHA"
          $blob=Invoke-RestMethod -Headers $headers -Uri $uri
          if([string]$blob.sha -ne $env:CONTROL_BLOB_SHA -or [string]$blob.encoding -ne 'base64'){throw 'control blob identity mismatch'}
          $raw=[Convert]::FromBase64String(([string]$blob.content -replace '\s',''))
          if($raw.Length -ne [int]$blob.size){throw 'control blob size mismatch'}
          $path=Join-Path $env:RUNNER_TEMP 'authority-rehydration.ps1'
          [IO.File]::WriteAllBytes($path,$raw)

          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){
            $errors | ForEach-Object { Write-Error ("{0}:{1}: {2}" -f $path,$_.Extent.StartLineNumber,$_.Message) }
            throw 'authority-rehydration control parse failed'
          }

          $text=[IO.File]::ReadAllText($path)
          foreach($needle in @(
            'function Invoke-WorkCellAuthorityRehydration',
            "Test-Path -LiteralPath 'C:\WinBot\.provisioned'",
            "C:\WinBot\.api_token",
            'RandomNumberGenerator',
            'Register-ScheduledTask -TaskName $taskName',
            'Start-ScheduledTask -TaskName $taskName',
            'AuthorityRehydrationApplicable',
            'AuthorityRehydrationAttempted',
            'AuthorityRehydrationSucceeded',
            'function Get-HostedNatPlacement',
            'NetworkCorrectionApplied'
          )){
            if(-not $text.Contains($needle)){throw "rehydration invariant missing: $needle"}
          }

          $helperCount=([regex]::Matches($text,'function Invoke-WorkCellAuthorityRehydration')).Count
          if($helperCount -ne 1){throw "expected one rehydration helper; observed $helperCount"}

          if($text -match 'api_token\s*=\s*[''"][0-9a-fA-F]{32,}'){
            throw 'static API token literal detected'
          }

          Write-Host "classification=SUPPORTED"
          Write-Host "control_blob=$env:CONTROL_BLOB_SHA"
          Write-Host "rehydration_helper_count=$helperCount"
