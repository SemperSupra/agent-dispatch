name: Winnow G1 R32 independent paired native dispatch
run-name: winnow-g1-r32-${{ github.sha }}
on:
  push:
    branches: [rdte/winnow-g1-r32-independent-paired-20261111]
    paths:
      - '.github/workflows/winnow-g1-r32-independent-paired.yml'
      - 'experiments/winnow-g1-r32-paired/**'
permissions:
  contents: read
jobs:
  paired-offline-native:
    name: "paired native dispatch / ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Assert public repo, branch, exact SHA and native architecture
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository }}" = "SemperSupra/agent-dispatch"
          test "${{ github.ref }}" = "refs/heads/rdte/winnow-g1-r32-independent-paired-20261111"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "${{ matrix.arch }}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo 'R32_ARCH_MISMATCH'; exit 1 ;;
          esac
          echo "R32_SOURCE_SHA=$GITHUB_SHA ARCH=${{ matrix.arch }}"
      - name: Install verified public wheels and execute offline paired matrix
        shell: bash
        run: |
          set -euo pipefail
          bash experiments/winnow-g1-r32-paired/run.sh
          echo "R32_PAIRED_NATIVE_COMPLETE_SHA=$GITHUB_SHA"
      - name: Upload sanitized paired result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winnow-g1-r32-paired-${{ matrix.arch }}-${{ github.run_id }}
          path: winnow-g1-r32-evidence/
          if-no-files-found: warn
          retention-days: 7
