name: Winnow G1 R40 real native REST child identity parser
run-name: winnow-g1-r40-${{ github.sha }}
on:
  push:
    branches:
      - rdte/winnow-g1-r40-native-identity-parser-20261111
    paths:
      - '.github/workflows/winnow-g1-r40-identity.yml'
      - 'experiments/winnow-g1-r40-identity/**'
permissions:
  contents: read
jobs:
  native-upstream-parser:
    name: "${{ matrix.candidate }} / ${{ matrix.arch }} synthetic REST identity"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 9
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64, candidate: gallery }
          - { runner: ubuntu-24.04-arm, arch: arm64, candidate: gallery }
          - { runner: ubuntu-24.04, arch: amd64, candidate: parth }
          - { runner: ubuntu-24.04-arm, arch: arm64, candidate: parth }
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Verify exact G1 public source, branch, native runner
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.repository }}" = "SemperSupra/agent-dispatch"
          test "${{ github.ref }}" = "refs/heads/rdte/winnow-g1-r40-native-identity-parser-20261111"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "${{ matrix.arch }}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo R40_NATIVE_ARCH_FAIL; exit 1 ;;
          esac
          echo "R40_SOURCE_SHA=$GITHUB_SHA candidate=${{ matrix.candidate }} arch=${{ matrix.arch }}"
      - name: Verify published wheel hash and exercise native REST parser offline
        shell: bash
        run: |
          set -euo pipefail
          bash experiments/winnow-g1-r40-identity/run.sh "${{ matrix.candidate }}"
          echo "R40_3_PERMUTATIONS_NATIVE_PARSER_PASS=$GITHUB_SHA candidate=${{ matrix.candidate }}"
      - name: Preserve synthetic-only parser receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winnow-g1-r40-${{ matrix.candidate }}-${{ matrix.arch }}-${{ github.run_id }}
          path: winnow-g1-r40-evidence/
          if-no-files-found: warn
          retention-days: 7
