name: Winnow R56 synthetic crash-safe generation pointer
run-name: winnow-r56-${{ github.sha }}
on:
  push:
    branches:
      - rdte/winnow-r56-public-batch-pointer-20261112
    paths:
      - '.github/workflows/winnow-r56-batch-pointer.yml'
      - 'experiments/winnow-r56-batch-pointer/**'
permissions:
  contents: read
jobs:
  pointer-crash:
    name: "generation pointer crash / ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Verify exact public source and native architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "SemperSupra/agent-dispatch"
          test "$GITHUB_REF" = "refs/heads/rdte/winnow-r56-public-batch-pointer-20261112"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "${{ matrix.arch }}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "R56_WRONG_ARCH"; exit 1 ;;
          esac
          echo "R56_EXACT_SHA=$GITHUB_SHA arch=${{ matrix.arch }}"
      - name: Execute network-isolated synthetic commit-pointer crash cases
        shell: bash
        run: |
          set -euo pipefail
          for b in sudo unshare setpriv python3; do command -v "$b" >/dev/null || { echo "R56_MISSING=$b"; exit 2; }; done
          TMP="$(mktemp -d /tmp/r56.XXXXXX)"
          trap 'rm -rf -- "$TMP"' EXIT
          chmod 0755 "$TMP"
          mkdir "$TMP/work"
          chmod 0777 "$TMP/work"
          install -m 0644 experiments/winnow-r56-batch-pointer/probe.py "$TMP/probe.py"
          HN="$(readlink /proc/self/ns/net)"
          sudo -n unshare --net -- /usr/bin/setpriv --reuid=65534 --regid=65534 --clear-groups \
            python3 -B "$TMP/probe.py" "$HN" "$TMP/work" | tee r56-result.txt
          grep -F "R56_SYNTHETIC_BATCH_POINTER_CRASH_PASS" r56-result.txt
          echo "R56_PUBLIC_NATIVE_PASS=$GITHUB_SHA"
      - name: Preserve sanitized results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winnow-r56-${{ matrix.arch }}-${{ github.run_id }}
          path: r56-result.txt
          if-no-files-found: warn
          retention-days: 7
