name: Winnow R58 public detached-child process-group red team
run-name: winnow-r58-${{ github.sha }}
on:
  push:
    branches:
      - rdte/winnow-r58-public-detached-process-redteam-20261112
    paths:
      - '.github/workflows/winnow-r58-detached-redteam.yml'
      - 'experiments/winnow-r58-detached-redteam/**'
permissions:
  contents: read
jobs:
  detached-process-redteam:
    name: "setsid negative witness / ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Verify public exact head and architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "SemperSupra/agent-dispatch"
          test "$GITHUB_REF" = "refs/heads/rdte/winnow-r58-public-detached-process-redteam-20261112"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "${{ matrix.arch }}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo R58_ARCH_MISMATCH; exit 1 ;;
          esac
          echo "R58_EXACT_HEAD=$GITHUB_SHA arch=${{ matrix.arch }}"
      - name: Observe negative detached-child group-kill witness and clean up
        shell: bash
        run: |
          set -euo pipefail
          for b in sudo unshare setpriv python3; do command -v "$b" >/dev/null || { echo "R58_MISSING=$b"; exit 2; }; done
          TMP="$(mktemp -d /tmp/winnow-r58.XXXXXX)"
          trap 'rm -rf -- "$TMP"' EXIT
          chmod 0755 "$TMP"
          mkdir "$TMP/work"
          chmod 0777 "$TMP/work"
          install -m 0644 experiments/winnow-r58-detached-redteam/probe.py "$TMP/probe.py"
          HN="$(readlink /proc/self/ns/net)"
          sudo -n unshare --net -- /usr/bin/setpriv --reuid=65534 --regid=65534 --clear-groups \
            python3 -B "$TMP/probe.py" "$HN" "$TMP/work" | tee r58-result.txt
          grep -F 'R58_SETSID_PROCESS_GROUP_ESCAPE_WITNESS_PASS' r58-result.txt
          echo "R58_PUBLIC_NATIVE_WITNESS_PASS=$GITHUB_SHA"
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winnow-r58-${{ matrix.arch }}-${{ github.run_id }}
          path: r58-result.txt
          if-no-files-found: warn
          retention-days: 7
