name: Winnow R59 public two-writer lost-update red team
run-name: winnow-r59-${{ github.sha }}
on:
  push:
    branches:
      - rdte/winnow-r59-public-multiwriter-redteam-20261112
    paths:
      - '.github/workflows/winnow-r59-multiwriter-redteam.yml'
      - 'experiments/winnow-r59-multiwriter-redteam/**'
permissions:
  contents: read
jobs:
  multiwriter-negative:
    name: "two-writer lost-update / ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Verify exact head and public architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "SemperSupra/agent-dispatch"
          test "$GITHUB_REF" = "refs/heads/rdte/winnow-r59-public-multiwriter-redteam-20261112"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "${{ matrix.arch }}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo R59_ARCH_MISMATCH; exit 1 ;;
          esac
          echo "R59_EXACT_HEAD=$GITHUB_SHA arch=${{ matrix.arch }}"
      - name: Demonstrate deterministic two-writer lost update in isolated scratch
        shell: bash
        run: |
          set -euo pipefail
          for b in sudo unshare setpriv python3; do command -v "$b" >/dev/null || { echo "R59_MISSING=$b"; exit 2; }; done
          TMP="$(mktemp -d /tmp/winnow-r59.XXXXXX)"
          trap 'rm -rf -- "$TMP"' EXIT
          chmod 0755 "$TMP"
          mkdir "$TMP/work"
          chmod 0777 "$TMP/work"
          install -m 0644 experiments/winnow-r59-multiwriter-redteam/probe.py "$TMP/probe.py"
          HN="$(readlink /proc/self/ns/net)"
          sudo -n unshare --net -- /usr/bin/setpriv --reuid=65534 --regid=65534 --clear-groups \
            python3 -B "$TMP/probe.py" "$HN" "$TMP/work" | tee r59-result.txt
          grep -F 'R59_TWO_WRITER_LOST_UPDATE_WITNESS_PASS' r59-result.txt
          echo "R59_PUBLIC_NATIVE_WITNESS_PASS=$GITHUB_SHA"
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winnow-r59-${{ matrix.arch }}-${{ github.run_id }}
          path: r59-result.txt
          if-no-files-found: warn
          retention-days: 7
