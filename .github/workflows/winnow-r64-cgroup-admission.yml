name: Winnow R64 public cgroup v2 controller admission
run-name: winnow-r64-${{ github.sha }}
on:
  push:
    branches: [rdte/winnow-r64-public-cgroup-admission-20261112]
    paths:
      - '.github/workflows/winnow-r64-cgroup-admission.yml'
      - 'experiments/winnow-r64-cgroup-admission/**'
permissions:
  contents: read
jobs:
  cgroup-admission:
    name: "cgroup v2 admission / ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Verify exact public checkout and native arch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "SemperSupra/agent-dispatch"
          test "$GITHUB_REF" = "refs/heads/rdte/winnow-r64-public-cgroup-admission-20261112"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "${{ matrix.arch }}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo R64_ARCH_INVALID; exit 1 ;;
          esac
          echo "R64_EXACT_SHA=$GITHUB_SHA arch=${{ matrix.arch }}"
      - name: Fail-closed cgroup v2 control provisioning admission (no child processes)
        shell: bash
        run: |
          set -euo pipefail
          command -v sudo >/dev/null
          command -v python3 >/dev/null
          sudo -n python3 -B experiments/winnow-r64-cgroup-admission/probe.py | tee r64-result.txt
          grep -F 'R64_CGROUP_V2_PROVISIONING_ADMITTED' r64-result.txt
          echo "R64_PUBLIC_PROVISIONING_PASS=$GITHUB_SHA"
      - name: Retain only sanitized public admission evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winnow-r64-${{ matrix.arch }}-${{ github.run_id }}
          path: r64-result.txt
          if-no-files-found: warn
          retention-days: 7
