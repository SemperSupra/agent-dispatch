name: Winnow R66 public cgroup kernel PID memory denial
run-name: winnow-r66-${{ github.sha }}
on:
  push:
    branches: [rdte/winnow-r66-public-cgroup-enforcement-20261112]
    paths:
      - '.github/workflows/winnow-r66-cgroup-enforcement.yml'
      - 'experiments/winnow-r66-cgroup-enforcement/**'
permissions:
  contents: read
jobs:
  kernel-cgroup-denial:
    name: "pids+memory kernel denial / ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Verify exact public ref and native architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "SemperSupra/agent-dispatch"
          test "$GITHUB_REF" = "refs/heads/rdte/winnow-r66-public-cgroup-enforcement-20261112"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "${{ matrix.arch }}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo R66_ARCH_INVALID; exit 1 ;;
          esac
          echo "R66_EXACT_SHA=$GITHUB_SHA arch=${{ matrix.arch }}"
      - name: Kernel-denied synthetic pids and memory workloads with clean cgroup teardown
        shell: bash
        run: |
          set -euo pipefail
          command -v sudo >/dev/null
          command -v unshare >/dev/null
          command -v python3 >/dev/null
          HN="$(readlink /proc/self/ns/net)"
          sudo -n unshare --net -- python3 -B experiments/winnow-r66-cgroup-enforcement/probe.py "$HN" | tee r66-result.txt
          grep -F 'R66_CGROUP_KERNEL_PID_MEMORY_DENIAL_PASS' r66-result.txt
          echo "R66_PUBLIC_KERNEL_ENFORCEMENT_PASS=$GITHUB_SHA"
      - name: Preserve sanitized public-only kernel event evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winnow-r66-${{ matrix.arch }}-${{ github.run_id }}
          path: r66-result.txt
          if-no-files-found: warn
          retention-days: 7
