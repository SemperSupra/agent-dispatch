name: Winnow R69 public per-process address-space and aggregate escape
run-name: winnow-r69-${{ github.sha }}
on:
  push:
    branches: [rdte/winnow-r69-public-rlimit-as-20261112]
    paths:
      - '.github/workflows/winnow-r69-rlimit-as.yml'
      - 'experiments/winnow-r69-rlimit-as/**'
permissions:
  contents: read
jobs:
  rlimit:
    name: "RLIMIT_AS and aggregate escape / ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Verify public exact SHA and native arch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "SemperSupra/agent-dispatch"
          test "$GITHUB_REF" = "refs/heads/rdte/winnow-r69-public-rlimit-as-20261112"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "${{ matrix.arch }}:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo R69_ARCH_INVALID; exit 1 ;;
          esac
          echo "R69_EXACT_SHA=$GITHUB_SHA arch=${{ matrix.arch }}"
      - name: Isolate network and execute nonroot RLIMIT_AS 3-rep contrasts
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d /tmp/winnow-r69.XXXXXX)"
          trap 'rm -rf -- "$TMP"' EXIT
          chmod 0755 "$TMP"
          mkdir "$TMP/work"
          chmod 0777 "$TMP/work"
          install -m 0644 experiments/winnow-r69-rlimit-as/probe.py "$TMP/probe.py"
          HN="$(readlink /proc/self/ns/net)"
          sudo -n unshare --net -- /usr/bin/setpriv --reuid=65534 --regid=65534 --clear-groups \
            python3 -B "$TMP/probe.py" "$HN" "$TMP/work" | tee r69-result.txt
          grep -F R69_RLIMIT_AS_LOCAL_AND_AGGREGATE_ESCAPE_PASS r69-result.txt
          echo "R69_PUBLIC_PASS=$GITHUB_SHA"
      - name: Preserve sanitized public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winnow-r69-${{ matrix.arch }}-${{ github.run_id }}
          path: r69-result.txt
          if-no-files-found: warn
          retention-days: 7
