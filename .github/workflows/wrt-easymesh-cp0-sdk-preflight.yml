name: WRT EasyMesh CP0 Compile V2

on:
  push:
    branches:
      - wrt-easymesh-cp0-compile-v2-20261004
    paths:
      - '.github/workflows/wrt-easymesh-cp0-sdk-preflight.yml'

permissions:
  contents: read

jobs:
  cp0-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Build prplMesh 6.0.1 against OpenWrt 25.12.5 SDK
        shell: bash
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/cp0/out"
          cd "$RUNNER_TEMP/cp0"

          SDK_NAME='openwrt-sdk-25.12.5-mvebu-cortexa9_gcc-14.3.0_musl_eabi.Linux-x86_64'
          SDK_ARCHIVE="$SDK_NAME.tar.zst"
          SDK_URL="https://downloads.openwrt.org/releases/25.12.5/targets/mvebu/cortexa9/$SDK_ARCHIVE"
          SDK_SHA='6b24abad1feee5f071a53872ed355ae4c2a90017b00ff99907183b56b31d995a'
          PRPL_SHA='8ceef1b0f70a90c4b30b9ce57a99d064283f9638'
          FEED_SHA='8003bb660da7c4e1980bed34c1e2a2dda43ab8ce'

          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git curl zstd rsync gawk gettext libncurses-dev unzip file jq python3-setuptools >/dev/null

          curl -fL --retry 2 --connect-timeout 20 "$SDK_URL" -o "$SDK_ARCHIVE"
          got=$(sha256sum "$SDK_ARCHIVE" | awk '{print $1}')
          echo "sdk_observed_sha256=$got" > out/identity.txt
          test "$got" = "$SDK_SHA" || { echo "SDK hash mismatch" >> out/identity.txt; exit 2; }

          tar --use-compress-program=unzstd -xf "$SDK_ARCHIVE"
          SDK="$RUNNER_TEMP/cp0/$SDK_NAME"

          git clone -q https://gitlab.com/prpl-foundation/prplmesh/prplMesh.git prplMesh
          git -C prplMesh checkout -q "$PRPL_SHA"
          git -C prplMesh rev-parse HEAD > out/prplmesh_sha.txt

          git clone -q https://gitlab.com/prpl-foundation/prplos/feeds/feed-prplmesh.git feed-prplmesh
          git -C feed-prplmesh checkout -q "$FEED_SHA"
          git -C feed-prplmesh rev-parse HEAD > out/feed_prplmesh_sha.txt

          # Keep the package recipe and source revision coherent.  Avoid a
          # global USE_SOURCE_DIR override because it propagates into deps.
          PRPL_RECIPE="$RUNNER_TEMP/cp0/feed-prplmesh/services/prplmesh/Makefile"
          sed -i \
            -e "s/^PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=$PRPL_SHA/" \
            -e 's/^PKG_SOURCE_DATE:=.*/PKG_SOURCE_DATE:=2026-06-25/' \
            -e 's/^PKG_MIRROR_HASH:=.*/PKG_MIRROR_HASH:=skip/' \
            "$PRPL_RECIPE"
          cp "$PRPL_RECIPE" out/prplmesh-feed-Makefile-pinned.txt

          cd "$SDK"
          cp feeds.conf.default feeds.conf
          printf '\nsrc-link prplmesh %s\n' "$RUNNER_TEMP/cp0/feed-prplmesh" >> feeds.conf
          cp feeds.conf "$RUNNER_TEMP/cp0/out/feeds.conf"

          set +e
          ./scripts/feeds update -a > "$RUNNER_TEMP/cp0/out/feeds_update.log" 2>&1
          feeds_update_rc=$?
          if [ "$feeds_update_rc" -eq 0 ]; then
            ./scripts/feeds install -a > "$RUNNER_TEMP/cp0/out/feeds_install.log" 2>&1
            feeds_install_rc=$?
          else
            feeds_install_rc=99
          fi
          set -e

          target='package/feeds/prplmesh/prplmesh'
          target_present=0
          if [ -e "$target/Makefile" ]; then
            target_present=1
            cp -L "$target/Makefile" "$RUNNER_TEMP/cp0/out/prplmesh-package-Makefile.txt"
            [ ! -e "$target/Config.in" ] || cp -L "$target/Config.in" "$RUNNER_TEMP/cp0/out/prplmesh-package-Config.in.txt"
          fi

          defconfig_rc=99
          prepare_rc=99
          compile_rc=99

          if [ "$feeds_update_rc" -eq 0 ] && [ "$feeds_install_rc" -eq 0 ] && [ "$target_present" -eq 1 ]; then
            # Materialize and then explicitly force the minimal CP0
            # feature set.  The second defconfig catches dependency rewrites.
            printf '%s\n' 'CONFIG_PACKAGE_prplmesh=m' >> .config
            set +e
            make defconfig > "$RUNNER_TEMP/cp0/out/defconfig-initial.log" 2>&1
            initial_defconfig_rc=$?
            if [ "$initial_defconfig_rc" -eq 0 ]; then
              ./scripts/config \
                --module PACKAGE_prplmesh \
                --disable PRPLMESH_ENABLE_UNIT_TESTS \
                --disable PRPLMESH_ENABLE_AMBIORIX_UBUS_BACKEND \
                --disable USE_PRPLMESH_WHM
              make defconfig > "$RUNNER_TEMP/cp0/out/defconfig.log" 2>&1
              defconfig_rc=$?
            else
              defconfig_rc=$initial_defconfig_rc
            fi
            if [ "$defconfig_rc" -eq 0 ]; then
              cp .config "$RUNNER_TEMP/cp0/out/openwrt-sdk.config"
              grep -E '^(CONFIG_PACKAGE_prplmesh=|CONFIG_PRPLMESH_ENABLE_UNIT_TESTS=|CONFIG_PRPLMESH_ENABLE_AMBIORIX_UBUS_BACKEND=|CONFIG_USE_PRPLMESH_WHM=|# CONFIG_PRPLMESH_ENABLE_UNIT_TESTS|# CONFIG_PRPLMESH_ENABLE_AMBIORIX_UBUS_BACKEND|# CONFIG_USE_PRPLMESH_WHM)' .config \
                > "$RUNNER_TEMP/cp0/out/prplmesh-config-selection.txt" || true
              if grep -q '^CONFIG_PRPLMESH_ENABLE_UNIT_TESTS=y' .config; then
                echo 'unit tests unexpectedly enabled' > "$RUNNER_TEMP/cp0/out/config-assertion-failure.txt"
                prepare_rc=98
              else
                make -j2 "$target/prepare" V=s > "$RUNNER_TEMP/cp0/out/prepare.log" 2>&1
                prepare_rc=$?
                if [ "$prepare_rc" -eq 0 ]; then
                  make -j2 "$target/compile" V=s > "$RUNNER_TEMP/cp0/out/compile.log" 2>&1
                  compile_rc=$?
                fi
              fi
            fi
            set -e
          fi

          find "$SDK/bin/packages" -type f -name '*.ipk' -printf '%P\t%s\n' 2>/dev/null | sort > "$RUNNER_TEMP/cp0/out/ipks.txt" || true

          export feeds_update_rc feeds_install_rc target_present defconfig_rc prepare_rc compile_rc
          python3 - <<'PY' > "$RUNNER_TEMP/cp0/out/verdict.json"
          import json, os
          d = {}
          for k in ["feeds_update_rc","feeds_install_rc","target_present","defconfig_rc","prepare_rc","compile_rc"]:
              d[k] = int(os.environ[k])
          d["schema"] = "wrt-easymesh-cp0-compile/v2"
          d["prepare_attempted"] = d["defconfig_rc"] == 0
          d["compile_attempted"] = d["prepare_rc"] == 0
          d["passed"] = d["compile_rc"] == 0
          print(json.dumps(d, indent=2, sort_keys=True))
          PY

          cat "$RUNNER_TEMP/cp0/out/verdict.json" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload CP0 compile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrt-easymesh-cp0-compile-v2-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cp0/out
          if-no-files-found: error
          retention-days: 7
