name: WRT EasyMesh E1 OpenWrt hwsim Oracle

on:
  push:
    branches:
      - wrt-easymesh-e1-hwsim-20261005
    paths:
      - '.github/waves/wrt-easymesh-e1-trigger.json'

permissions:
  contents: read

jobs:
  e1-hwsim:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Boot OpenWrt with mac80211_hwsim and exercise nl80211 hostapd wpa
        shell: bash
        run: |
          set -u
          ROOT="$RUNNER_TEMP/wrt-e1"
          OUT="$ROOT/out"
          mkdir -p "$OUT"
          cd "$ROOT"

          IB_NAME='openwrt-imagebuilder-25.12.5-x86-64.Linux-x86_64'
          IB_ARCHIVE="$IB_NAME.tar.zst"
          IB_URL="https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/$IB_ARCHIVE"
          IB_SHA='313221253d9bac534e4a4ee6492a4941b4ba0f43200eceb8d16a4785470ae9df'

          sudo apt-get update -qq
          sudo apt-get install -y -qq curl zstd qemu-system-x86 qemu-utils >/dev/null
          curl -fL --retry 2 --connect-timeout 20 "$IB_URL" -o "$IB_ARCHIVE"
          got=$(sha256sum "$IB_ARCHIVE" | awk '{print $1}')
          printf 'imagebuilder_sha=%s\n' "$got" > "$OUT/identity.txt"
          test "$got" = "$IB_SHA" || exit 2
          tar --use-compress-program=unzstd -xf "$IB_ARCHIVE"
          IB="$ROOT/$IB_NAME"

          OVERLAY="$ROOT/overlay"
          mkdir -p "$OVERLAY/etc"
          cat > "$OVERLAY/etc/rc.local" <<'EOS'
          #!/bin/sh
          (
            sleep 12
            echo E1_STATE_BEGIN > /dev/ttyS0
            echo E1_KERNEL=$(uname -r) > /dev/ttyS0
            rmmod mac80211_hwsim 2>/dev/null || true
            modprobe mac80211_hwsim radios=2 2>/tmp/e1-modprobe.err || true
            sleep 2
            cat /tmp/e1-modprobe.err > /dev/ttyS0 2>&1 || true
            lsmod | grep -E 'mac80211_hwsim|mac80211|cfg80211' > /dev/ttyS0 2>&1 || true
            iw phy > /dev/ttyS0 2>&1 || true

            PHYS=$(iw phy 2>/dev/null | awk '$1=="Wiphy"{print $2}' | head -2 | tr '\n' ' ')
            set -- $PHYS
            P0="$1"; P1="$2"
            [ -n "$P0" ] && iw phy "$P0" interface add wlan0 type managed 2>/tmp/e1-if0.err || true
            [ -n "$P1" ] && iw phy "$P1" interface add wlan1 type managed 2>/tmp/e1-if1.err || true
            cat /tmp/e1-if0.err /tmp/e1-if1.err > /dev/ttyS0 2>&1 || true
            iw dev > /tmp/e1-iw-dev 2>&1 || true
            cat /tmp/e1-iw-dev > /dev/ttyS0

            AP='wlan0'; STA='wlan1'
            echo E1_IFACES=$AP,$STA > /dev/ttyS0
            assoc=0; pingok=0; scanok=0; staok=0; surveyok=0

            if iw dev "$AP" info >/dev/null 2>&1 && iw dev "$STA" info >/dev/null 2>&1; then
              ip link set "$AP" down 2>/dev/null || true
              ip link set "$STA" down 2>/dev/null || true

              cat > /tmp/e1-hostapd.conf <<EOF
          interface=$AP
          driver=nl80211
          ssid=rdte-e1
          hw_mode=g
          channel=1
          auth_algs=1
          wmm_enabled=1
          ctrl_interface=/var/run/e1-hostapd
          EOF
              cat > /tmp/e1-wpa.conf <<EOF
          ctrl_interface=/var/run/e1-wpa
          network={
            ssid="rdte-e1"
            key_mgmt=NONE
            scan_ssid=1
          }
          EOF

              echo E1_STAGE=hostapd-start > /dev/ttyS0
              hostapd -B -P /tmp/e1-hostapd.pid /tmp/e1-hostapd.conf > /tmp/e1-hostapd.log 2>&1 || true
              sleep 3
              ip addr add 192.0.2.1/24 dev "$AP" 2>/dev/null || true
              ip link set "$AP" up 2>/dev/null || true
              echo E1_STAGE=hostapd-ready > /dev/ttyS0

              ip link set "$STA" up 2>/dev/null || true
              echo E1_STAGE=scan-trigger > /dev/ttyS0
              iw dev "$STA" scan trigger > /tmp/e1-scan-trigger 2>&1 || true
              sleep 3
              iw dev "$STA" scan dump > /tmp/e1-scan 2>&1 || true
              grep -q 'SSID: rdte-e1' /tmp/e1-scan && scanok=1 || true
              echo E1_STAGE=scan-done > /dev/ttyS0
              cat /tmp/e1-hostapd.log > /dev/ttyS0 2>&1 || true
              cat /tmp/e1-scan-trigger > /dev/ttyS0 2>&1 || true
              cat /tmp/e1-scan > /dev/ttyS0 2>&1 || true

              mkdir -p /var/run/e1-wpa
              echo E1_STAGE=wpa-start > /dev/ttyS0
              wpa_supplicant -Dnl80211 -i "$STA" -c /tmp/e1-wpa.conf > /tmp/e1-wpa.log 2>&1 &
              wpa_pid=$!
              echo E1_WPA_PID=$wpa_pid > /dev/ttyS0
              i=0
              while [ "$i" -lt 20 ]; do
                iw dev "$STA" link > /tmp/e1-link 2>&1 || true
                grep -q '^Connected to ' /tmp/e1-link && { assoc=1; break; }
                sleep 1
                i=$((i+1))
              done
              wpa_cli -p /var/run/e1-wpa -i "$STA" status > /tmp/e1-wpa-status 2>&1 || true
              grep -q '^wpa_state=COMPLETED' /tmp/e1-wpa-status && assoc=1 || true
              echo E1_STAGE=association-done > /dev/ttyS0

              # Observe station/survey while the association is still alive.
              # Prior reps killed wpa_supplicant first, which legitimately
              # removed the AP station before the station-dump oracle ran.
              iw dev "$AP" station dump > /tmp/e1-stations 2>&1 || true
              iw dev "$AP" survey dump > /tmp/e1-survey 2>&1 || true
              grep -q '^Station ' /tmp/e1-stations && staok=1 || true
              grep -q '^Survey data from ' /tmp/e1-survey && surveyok=1 || true

              kill "$wpa_pid" 2>/dev/null || true
              wait "$wpa_pid" 2>/dev/null || true

              ip addr add 192.0.2.2/24 dev "$STA" 2>/dev/null || true
              ping -c 3 -W 1 192.0.2.1 > /tmp/e1-ping 2>&1 || true
              grep -Eq '3 packets transmitted, 3 packets received|3 packets transmitted, 3 received' /tmp/e1-ping && pingok=1 || true

              cat /tmp/e1-hostapd.log > /dev/ttyS0 2>&1
              cat /tmp/e1-wpa.log > /dev/ttyS0 2>&1
              cat /tmp/e1-wpa-status > /dev/ttyS0 2>&1
              cat /tmp/e1-link > /dev/ttyS0 2>&1
              cat /tmp/e1-stations > /dev/ttyS0 2>&1
              cat /tmp/e1-survey > /dev/ttyS0 2>&1
              cat /tmp/e1-scan > /dev/ttyS0 2>&1
              cat /tmp/e1-ping > /dev/ttyS0 2>&1
            fi

            echo E1_ASSOC=$assoc > /dev/ttyS0
            echo E1_PING=$pingok > /dev/ttyS0
            echo E1_SCAN=$scanok > /dev/ttyS0
            echo E1_STATION=$staok > /dev/ttyS0
            echo E1_SURVEY=$surveyok > /dev/ttyS0
            echo E1_STATE_END > /dev/ttyS0
          ) &
          exit 0
          EOS
          chmod +x "$OVERLAY/etc/rc.local"

          cd "$IB"
          image_rc=0
          set +e
          make image PROFILE=generic PACKAGES="kmod-mac80211-hwsim iw-full wpad-openssl wpa-cli ip-full -wpad-basic-mbedtls" FILES="$OVERLAY" > "$OUT/imagebuilder.log" 2>&1
          image_rc=$?
          set -e

          boot_attempted=0; hwsim_seen=0; assoc=0; pingok=0; scanok=0; staok=0; surveyok=0
          image=$(find "$IB/bin/targets/x86/64" -type f -name '*generic-ext4-combined.img.gz' -print -quit 2>/dev/null)
          if [ "$image_rc" -eq 0 ] && [ -n "$image" ]; then
            cp "$image" "$OUT/"
            sha256sum "$image" > "$OUT/image-sha256.txt"
            gzip -dc "$image" > "$ROOT/openwrt.img"
            boot_attempted=1
            set +e
            timeout 80 qemu-system-x86_64 -machine pc -m 512 -nographic -drive file="$ROOT/openwrt.img",format=raw,if=virtio -netdev user,id=net0 -device virtio-net-pci,netdev=net0 > "$OUT/qemu-serial.log" 2>&1
            qemu_rc=$?
            set -e
            grep -q 'mac80211_hwsim' "$OUT/qemu-serial.log" && hwsim_seen=1 || true
            assoc=$(sed -n 's/^E1_ASSOC=//p' "$OUT/qemu-serial.log" | tail -1); assoc=${assoc:-0}
            pingok=$(sed -n 's/^E1_PING=//p' "$OUT/qemu-serial.log" | tail -1); pingok=${pingok:-0}
            scanok=$(sed -n 's/^E1_SCAN=//p' "$OUT/qemu-serial.log" | tail -1); scanok=${scanok:-0}
            staok=$(sed -n 's/^E1_STATION=//p' "$OUT/qemu-serial.log" | tail -1); staok=${staok:-0}
            surveyok=$(sed -n 's/^E1_SURVEY=//p' "$OUT/qemu-serial.log" | tail -1); surveyok=${surveyok:-0}
            printf 'qemu_rc=%s\n' "$qemu_rc" > "$OUT/qemu-verdict.txt"
          fi

          export image_rc boot_attempted hwsim_seen assoc pingok scanok staok surveyok
          python3 - <<'PY' > "$OUT/verdict.json"
          import json,os
          ks=['image_rc','boot_attempted','hwsim_seen','assoc','pingok','scanok','staok','surveyok']
          d={k:int(os.environ[k]) for k in ks}
          d['schema']='wrt3200acm-easymesh-e1-openwrt-hwsim/v2'
          d['qemu_mode']='tcg'
          d['passed_nl80211_oracle']=bool(d['image_rc']==0 and d['boot_attempted'] and d['hwsim_seen'] and d['assoc'] and d['scanok'] and d['staok'])
          d['survey_support_observed']=bool(d['surveyok'])
          d['same_namespace_ping_supporting_only']=bool(d['pingok'])
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
          echo '--- E1_SEMANTIC_VERDICT_BEGIN ---'
          cat "$OUT/verdict.json"
          echo '--- E1_SEMANTIC_VERDICT_END ---'
          cat "$OUT/verdict.json" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload E1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrt-easymesh-e1-hwsim-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wrt-e1/out
          if-no-files-found: error
          retention-days: 7
