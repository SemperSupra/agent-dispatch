name: WRT EasyMesh E2 QEMU Preflight

on:
  push:
    branches:
      - wrt-easymesh-e2-qemu-20261005
    paths:
      - '.github/waves/wrt-easymesh-e2-trigger.json'

permissions:
  contents: read

jobs:
  e2-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe QEMU/KVM system-emulation capability
        shell: bash
        run: |
          set -u
          OUT="$RUNNER_TEMP/wrt-e2/out"
          mkdir -p "$OUT"

          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils jq >/dev/null

          uname -a > "$OUT/uname.txt"
          qemu-system-x86_64 --version > "$OUT/qemu-version.txt" 2>&1 || true
          qemu-img --version > "$OUT/qemu-img-version.txt" 2>&1 || true
          (ls -l /dev/kvm || true) > "$OUT/kvm.txt" 2>&1
          (grep -E 'vmx|svm' /proc/cpuinfo | head -1 || true) > "$OUT/cpu-virt.txt" 2>&1

          qemu_ok=0
          kvm_ok=0
          command -v qemu-system-x86_64 >/dev/null 2>&1 && qemu_ok=1
          [ -r /dev/kvm ] && [ -w /dev/kvm ] && kvm_ok=1 || true

          export qemu_ok kvm_ok
          python3 -c 'import json,os; q=int(os.environ["qemu_ok"]); k=int(os.environ["kvm_ok"]); print(json.dumps({"schema":"wrt3200acm-easymesh-e2-qemu-preflight/v1","qemu_present":bool(q),"kvm_available":bool(k),"ready_for_tcg":bool(q),"ready_for_kvm":bool(q and k)},indent=2,sort_keys=True))' > "$OUT/verdict.json"

          echo '--- E2_SEMANTIC_VERDICT_BEGIN ---'


          cat "$OUT/verdict.json"


          echo '--- E2_SEMANTIC_VERDICT_END ---'


          cat "$OUT/verdict.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2 preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrt-easymesh-e2-qemu-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wrt-e2/out
          if-no-files-found: error
          retention-days: 7
