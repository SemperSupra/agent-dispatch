name: WRT EasyMesh E3 Hybrid OpenWrt hwsim

on:
  push:
    branches:
      - wrt-easymesh-e3-hybrid-20261005
    paths:
      - '.github/waves/wrt-easymesh-e3-trigger.json'

permissions:
  contents: read
  actions: read

jobs:
  e3-hybrid:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Boot stock prplMesh in OpenWrt hwsim guest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          ROOT="$RUNNER_TEMP/wrt-e3"
          OUT="$ROOT/out"
          mkdir -p "$OUT"
          cd "$ROOT"

          E2_ARTIFACT_ID='11336174982'
          PRPL_SHA='ce91228d204b68cf37d0c46bf5f7492cfe3ac9d83463cb5d47cafb84197336d7'
          IB_NAME='openwrt-imagebuilder-25.12.5-x86-64.Linux-x86_64'
          IB_ARCHIVE="$IB_NAME.tar.zst"
          IB_URL="https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/$IB_ARCHIVE"
          IB_SHA='313221253d9bac534e4a4ee6492a4941b4ba0f43200eceb8d16a4785470ae9df'

          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip zstd qemu-system-x86 qemu-utils >/dev/null

          curl -fL --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$E2_ARTIFACT_ID/zip" -o e2.zip
          unzip -q e2.zip -d e2
          pkg=$(find e2 -type f -name 'prplmesh-6.0.1-r1.apk' -print -quit)
          [ -n "$pkg" ] || { echo 'E2 prplMesh package missing' > "$OUT/blocker.txt"; exit 2; }
          got_pkg=$(sha256sum "$pkg" | awk '{print $1}')
          printf 'e2_artifact_id=%s\nprplmesh_sha=%s\n' "$E2_ARTIFACT_ID" "$got_pkg" > "$OUT/identity.txt"
          test "$got_pkg" = "$PRPL_SHA" || exit 2

          curl -fL --retry 2 --connect-timeout 20 "$IB_URL" -o "$IB_ARCHIVE"
          got_ib=$(sha256sum "$IB_ARCHIVE" | awk '{print $1}')
          printf 'imagebuilder_sha=%s\n' "$got_ib" >> "$OUT/identity.txt"
          test "$got_ib" = "$IB_SHA" || exit 2
          tar --use-compress-program=unzstd -xf "$IB_ARCHIVE"
          IB="$ROOT/$IB_NAME"
          mkdir -p "$IB/packages"
          cp "$pkg" "$IB/packages/"

          OVERLAY="$ROOT/overlay"
          mkdir -p "$OVERLAY/etc"
          cat > "$OVERLAY/etc/rc.local" <<'EOS'
          #!/bin/sh
          (
            sleep 12
            echo E3_STATE_BEGIN > /dev/ttyS0
            echo E3_KERNEL=$(uname -r) > /dev/ttyS0
            # OpenWrt auto-loads kmod-mac80211-hwsim before rc.local.
            # Preserve those original PHY identities: unloading/reloading here
            # advances the wiphy indices and races netifd/hostapd radio mapping.
            if ! lsmod | grep -q '^mac80211_hwsim'; then
              modprobe mac80211_hwsim radios=2 2>/tmp/e3-modprobe.err || true
            fi
            sleep 2
            cat /tmp/e3-modprobe.err > /dev/ttyS0 2>&1 || true

            rm -f /etc/config/wireless
            wifi config > /tmp/e3-wifi-config.log 2>&1 || true
            cat /tmp/e3-wifi-config.log > /dev/ttyS0 2>&1
            uci show wireless > /tmp/e3-wireless-before 2>&1 || true
            cat /tmp/e3-wireless-before > /dev/ttyS0

            radio=$(uci show wireless 2>/dev/null | sed -n 's/^wireless\.\([^.=]*\)=wifi-device.*/\1/p' | head -1)
            iface=$(uci show wireless 2>/dev/null | sed -n 's/^wireless\.\([^.=]*\)=wifi-iface.*/\1/p' | head -1)
            if [ -n "$radio" ] && [ -n "$iface" ]; then
              uci set wireless.$radio.disabled='0'
              uci set wireless.$radio.channel='1'
              uci set wireless.$radio.band='2g'
              uci set wireless.$radio.htmode='HT20'
              uci -q delete wireless.$radio.country 2>/dev/null || true
              uci set wireless.$iface.device="$radio"
              uci set wireless.$iface.disabled='0'
              uci set wireless.$iface.mode='ap'
              uci set wireless.$iface.network='lan'
              uci set wireless.$iface.ssid='rdte-e3'
              uci set wireless.$iface.encryption='none'
              uci set wireless.$iface.ifname='wlan0'
              uci commit wireless
              echo E3_WIRELESS_AFTER_CONFIG > /dev/ttyS0
              uci show wireless > /dev/ttyS0 2>&1 || true
              iw reg get > /dev/ttyS0 2>&1 || true
              /etc/init.d/network restart > /tmp/e3-network-restart.log 2>&1 || true
              cat /tmp/e3-network-restart.log > /dev/ttyS0 2>&1 || true
            fi
            sleep 8
            iw dev > /tmp/e3-iw-dev 2>&1 || true
            cat /tmp/e3-iw-dev > /dev/ttyS0
            ubus list 'hostapd.*' > /tmp/e3-hostapd-ubus 2>&1 || true
            cat /tmp/e3-hostapd-ubus > /dev/ttyS0
            ls -l /var/run/hostapd > /tmp/e3-hostapd-sockets 2>&1 || true
            cat /tmp/e3-hostapd-sockets > /dev/ttyS0

            actual=$(iw dev 2>/dev/null | awk '$1=="Interface"{print $2}' | head -1)
            [ -n "$actual" ] || actual='wlan0'
            uci set prplmesh.config.enabled='1'
            uci set prplmesh.config.management_mode='Multi-AP-Controller-and-Agent'
            uci set prplmesh.config.mandatory_interfaces="$actual"
            uci set prplmesh.config.backhaul_wire_iface='br-lan'
            uci set prplmesh.main_24_5.ssid='rdte-e3'
            uci set prplmesh.main_24_5.key='rdte-e3-pass'
            uci set prplmesh.main_24_5.encryption='psk2'
            uci commit prplmesh
            /etc/init.d/prplmesh restart > /tmp/e3-prplmesh-restart.log 2>&1 || true
            sleep 15

            echo E3_ACTUAL_IFACE=$actual > /dev/ttyS0
            uci show prplmesh > /dev/ttyS0 2>&1
            /etc/init.d/prplmesh status > /dev/ttyS0 2>&1 || true
            ps w > /tmp/e3-ps 2>&1 || true
            cat /tmp/e3-ps > /dev/ttyS0
            logread | grep -Ei 'prplmesh|beerocks|ieee1905|hostapd|wpa' > /tmp/e3-logread 2>&1 || true
            cat /tmp/e3-logread > /dev/ttyS0
            iw dev > /dev/ttyS0 2>&1 || true
            echo E3_STATE_END > /dev/ttyS0
          ) &
          exit 0
          EOS
          chmod +x "$OVERLAY/etc/rc.local"

          cd "$IB"
          image_rc=0
          set +e
          make image PROFILE=generic PACKAGES="prplmesh kmod-mac80211-hwsim iw-full wpad-openssl ip-full -wpad-basic-mbedtls" FILES="$OVERLAY" > "$OUT/imagebuilder.log" 2>&1
          image_rc=$?
          set -e

          boot_attempted=0; radio_seen=0; hostapd_seen=0; transport_seen=0; controller_seen=0; agent_seen=0; state_end=0
          image=$(find "$IB/bin/targets/x86/64" -type f -name '*generic-ext4-combined.img.gz' -print -quit 2>/dev/null)
          if [ "$image_rc" -eq 0 ] && [ -n "$image" ]; then
            cp "$image" "$OUT/"
            sha256sum "$image" > "$OUT/image-sha256.txt"
            gzip -dc "$image" > "$ROOT/openwrt.img"
            boot_attempted=1
            set +e
            timeout 90 qemu-system-x86_64 -machine pc -m 768 -nographic -drive file="$ROOT/openwrt.img",format=raw,if=virtio -netdev user,id=net0 -device virtio-net-pci,netdev=net0 > "$OUT/qemu-serial.log" 2>&1
            qemu_rc=$?
            set -e
            grep -q 'Interface ' "$OUT/qemu-serial.log" && radio_seen=1 || true
            grep -Eq 'hostapd\.|/var/run/hostapd|hostapd -' "$OUT/qemu-serial.log" && hostapd_seen=1 || true
            grep -q 'ieee1905_transport' "$OUT/qemu-serial.log" && transport_seen=1 || true
            grep -q 'beerocks_controller' "$OUT/qemu-serial.log" && controller_seen=1 || true
            grep -q 'beerocks_agent' "$OUT/qemu-serial.log" && agent_seen=1 || true
            grep -q 'E3_STATE_END' "$OUT/qemu-serial.log" && state_end=1 || true
            printf 'qemu_rc=%s\n' "$qemu_rc" > "$OUT/qemu-verdict.txt"
          fi

          export image_rc boot_attempted radio_seen hostapd_seen transport_seen controller_seen agent_seen state_end
          python3 - <<'PY' > "$OUT/verdict.json"
          import json,os
          ks=['image_rc','boot_attempted','radio_seen','hostapd_seen','transport_seen','controller_seen','agent_seen','state_end']
          d={k:int(os.environ[k]) for k in ks}
          d['schema']='wrt3200acm-easymesh-e3-openwrt-hwsim/v1'
          d['qemu_mode']='tcg'
          d['passed_hybrid_integration']=bool(d['image_rc']==0 and d['boot_attempted'] and d['radio_seen'] and d['hostapd_seen'] and d['transport_seen'] and d['controller_seen'] and d['agent_seen'] and d['state_end'])
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
          echo '--- E3_SEMANTIC_VERDICT_BEGIN ---'
          cat "$OUT/verdict.json"
          echo '--- E3_SEMANTIC_VERDICT_END ---'
          cat "$OUT/verdict.json" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload E3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrt-easymesh-e3-hybrid-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wrt-e3/out
          if-no-files-found: error
          retention-days: 7
