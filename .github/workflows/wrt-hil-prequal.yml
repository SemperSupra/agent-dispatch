name: WRT3200ACM Pre-HIL Artifact Qualification

on:
  push:
    branches:
      - wrt-hil-prequal-20261005
    paths:
      - '.github/waves/wrt-hil-prequal-trigger.json'

permissions:
  contents: read
  actions: read

jobs:
  ubuntu-prequal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download physical-target CP0 package evidence
        uses: actions/download-artifact@v4
        with:
          run-id: 37273250460
          name: wrt-easymesh-cp0-openwrt-stock-1
          path: cp0
          github-token: ${{ github.token }}

      - name: Download x86 E2 prplMesh package
        uses: actions/download-artifact@v4
        with:
          run-id: 37288725640
          name: wrt-easymesh-e2-qemu-1
          path: e2
          github-token: ${{ github.token }}

      - name: Build and qualify USB plus DUT twins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wrt-prehil-out"
          bash tools/wrt_hil_prequal/run_prequal.sh "$GITHUB_WORKSPACE/cp0" "$GITHUB_WORKSPACE/e2" "$RUNNER_TEMP/wrt-prehil-out"
          cat "$RUNNER_TEMP/wrt-prehil-out/verdict.json" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ["RUNNER_TEMP"],"wrt-prehil-out","verdict.json")
          v=json.load(open(p))
          if not v.get("passed"): raise SystemExit("semantic pre-HIL verdict RED")
          PY

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrt-prehil-qualification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wrt-prehil-out
          if-no-files-found: error
          retention-days: 14

  windows-check:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell helpers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files = @(
            'tools/wrt_hil_prequal/Install-HilHost.ps1',
            'tools/wrt_hil_prep/payload/scripts/Find-SerialPorts.ps1',
            'tools/wrt_hil_prep/payload/scripts/Verify-Bundle.ps1'
          )
          foreach ($f in $files) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw "$f parse errors: $($errors | Out-String)" }
          }
      - name: Execute Windows host check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\wrt-prehil-win" | Out-Null
          & ./tools/wrt_hil_prequal/Install-HilHost.ps1 -CheckOnly |
            Tee-Object -FilePath "$env:RUNNER_TEMP\wrt-prehil-win\windows-host-check.json"
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrt-prehil-windows-${{ github.run_attempt }}
          path: ${{ runner.temp }}\wrt-prehil-win
          if-no-files-found: error
          retention-days: 14
