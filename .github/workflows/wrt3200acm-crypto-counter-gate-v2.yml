name: WRT3200ACM Crypto Counter Gate v2

on:
  pull_request:
    paths:
      - '.github/workflows/wrt3200acm-crypto-counter-gate-v2.yml'
      - 'scripts/wrt3200acm_crypto_counter_gate_v2.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wrt3200acm-crypto-counter-gate-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  FW_URL: https://raw.githubusercontent.com/kaloz/mwlwifi/b0aeee507f1534ae40fab9d2420a6319e1f33de5/bin/firmware/88W8964.bin
  FW_SHA256: ca23f5bb730fde399359a716481651c120e09c299d4e6bbec6fe718c6e87e751

jobs:
  counter-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install bounded ARM analysis dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-arm-linux-gnueabi curl >/dev/null
      - name: Run corrected exact counter gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          curl -fL --retry 3 --retry-all-errors "$FW_URL" -o "$RUNNER_TEMP/fw.bin"
          echo "$FW_SHA256  $RUNNER_TEMP/fw.bin" | sha256sum -c -
          python3 scripts/wrt3200acm_fw_to_elf.py \
            "$RUNNER_TEMP/fw.bin" \
            "$RUNNER_TEMP/fw.elf" \
            "$RUNNER_TEMP/evidence/elf-map.json"
          python3 scripts/wrt3200acm_crypto_counter_gate_v2.py \
            --elf "$RUNNER_TEMP/fw.elf" \
            --out "$RUNNER_TEMP/evidence"
      - name: Verify derived-only evidence
        shell: bash
        run: |
          set -euo pipefail
          if find "$RUNNER_TEMP/evidence" -type f \( -name '*.bin' -o -name '*.elf' -o -name '*.img' \) | grep -q .; then
            echo "firmware-bearing file leaked into evidence mailbox" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wrt-crypto-counter-gate-v2
          path: ${{ runner.temp }}/evidence
          retention-days: 7
