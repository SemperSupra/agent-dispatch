name: WRT3200ACM Crypto Deep Frontier

on:
  pull_request:
    paths:
      - '.github/workflows/wrt3200acm-crypto-deep-frontier.yml'
      - 'scripts/wrt3200acm_w8964_crypto_source_contract.py'
      - 'scripts/wrt3200acm_crypto_deep_rehost.py'
      - 'scripts/wrt3200acm_crypto_state_region.py'
      - 'scripts/wrt3200acm_runtime_window_init.py'
      - 'scripts/wrt3200acm_selector3_anchor_field_map.py'
      - 'scripts/wrt3200acm_runtime_anchor_initializers.py'
      - 'scripts/wrt3200acm_runtime_field_identity.py'
      - 'scripts/wrt3200acm_runtime_hash_object_recovery.py'
      - 'scripts/wrt3200acm_set_new_stn_producer.py'
      - 'scripts/wrt3200acm_rom_import_semantics.py'
      - 'scripts/wrt3200acm_runtime_allocator_semantics.py'
      - 'scripts/wrt3200acm_txqueue_source_correlation.py'
      - 'scripts/wrt3200acm_allocator_core.py'
      - 'scripts/wrt3200acm_runtime_anchor_direct_writers.py'
      - 'scripts/wrt3200acm_dispatch_probe.py'
      - 'scripts/wrt3200acm_fw_to_elf.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  FW_URL: https://raw.githubusercontent.com/kaloz/mwlwifi/b0aeee507f1534ae40fab9d2420a6319e1f33de5/bin/firmware/88W8964.bin
  FW_SHA256: ca23f5bb730fde399359a716481651c120e09c299d4e6bbec6fe718c6e87e751

jobs:
  w8964-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Recover W8964 crypto host-source contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 scripts/wrt3200acm_w8964_crypto_source_contract.py             --out "$RUNNER_TEMP/evidence/w8964-crypto-source-contract.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrt-w8964-crypto-source-contract
          path: ${{ runner.temp }}/evidence
          retention-days: 7


  runtime-state-correlation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install ARM analysis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-arm-linux-gnueabi curl >/dev/null
      - name: Correlate first missing state with selector3 window
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          curl -fL --retry 3 --retry-all-errors "$FW_URL" -o "$RUNNER_TEMP/fw.bin"
          echo "$FW_SHA256  $RUNNER_TEMP/fw.bin" | sha256sum -c -
          python3 scripts/wrt3200acm_fw_to_elf.py             "$RUNNER_TEMP/fw.bin"             "$RUNNER_TEMP/fw.elf"             "$RUNNER_TEMP/evidence/elf-map.json"
          python3 scripts/wrt3200acm_crypto_state_region.py             --elf "$RUNNER_TEMP/fw.elf"             --out "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrt-crypto-runtime-state-region
          path: ${{ runner.temp }}/evidence
          retention-days: 7


  runtime-window-init-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install ARM analysis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-arm-linux-gnueabi curl >/dev/null
      - name: Search selector3 runtime-window initialization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          curl -fL --retry 3 --retry-all-errors "$FW_URL" -o "$RUNNER_TEMP/fw.bin"
          echo "$FW_SHA256  $RUNNER_TEMP/fw.bin" | sha256sum -c -
          python3 scripts/wrt3200acm_fw_to_elf.py             "$RUNNER_TEMP/fw.bin"             "$RUNNER_TEMP/fw.elf"             "$RUNNER_TEMP/evidence/elf-map.json"
          python3 scripts/wrt3200acm_runtime_window_init.py             --elf "$RUNNER_TEMP/fw.elf"             --out "$RUNNER_TEMP/evidence"
          echo '--- top candidate 00 ---'
          cat "$RUNNER_TEMP/evidence/candidate-pair-00.txt"
          echo '--- top candidate 02 ---'
          cat "$RUNNER_TEMP/evidence/candidate-pair-02.txt"
          echo '--- top candidate 03 ---'
          cat "$RUNNER_TEMP/evidence/candidate-pair-03.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrt-runtime-window-init-search
          path: ${{ runner.temp }}/evidence
          retention-days: 7


