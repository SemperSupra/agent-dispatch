name: WRT3200ACM Ghidra Recovery


concurrency:
  group: wrt3200acm-ghidra-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ghidra-88w8964:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-21-jdk-headless unzip curl binutils >/dev/null
          java -version

      - name: Test firmware reconstruction
        run: python3 -m unittest -v tests/test_wrt3200acm_fw_to_elf.py

      - name: Acquire pinned Ghidra 12.1.4
        shell: bash
        env:
          GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
          GHIDRA_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors "$GHIDRA_URL" -o "$RUNNER_TEMP/ghidra.zip"
          echo "$GHIDRA_SHA256  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          find "$RUNNER_TEMP/ghidra" -maxdepth 2 -name analyzeHeadless -o -name support

      - name: Acquire and reconstruct 88W8964
        shell: bash
        env:
          FW_URL: https://raw.githubusercontent.com/kaloz/mwlwifi/db97edf20fadea2617805006f5230665fadc6a8c/bin/firmware/88W8964.bin
          FW_SHA256: ca23f5bb730fde399359a716481651c120e09c299d4e6bbec6fe718c6e87e751
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wrt-ghidra-evidence"
          curl -fL --retry 3 --retry-all-errors "$FW_URL" -o "$RUNNER_TEMP/88W8964.bin"
          echo "$FW_SHA256  $RUNNER_TEMP/88W8964.bin" | sha256sum -c -
          python3 scripts/wrt3200acm_fw_to_elf.py             "$RUNNER_TEMP/88W8964.bin"             "$RUNNER_TEMP/88W8964.elf"             "$RUNNER_TEMP/wrt-ghidra-evidence/elf-map.json"
          readelf -h -l "$RUNNER_TEMP/88W8964.elf" | tee "$RUNNER_TEMP/wrt-ghidra-evidence/readelf.txt"

      - name: Headless ARMv7-A analysis
        shell: bash
        run: |
          set -euo pipefail
          GHIDRA_HOME="$(find "$RUNNER_TEMP/ghidra" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*' | head -1)"
          test -x "$GHIDRA_HOME/support/analyzeHeadless"
          mkdir -p "$RUNNER_TEMP/ghidra-project"
          "$GHIDRA_HOME/support/analyzeHeadless"             "$RUNNER_TEMP/ghidra-project" wrt8964             -import "$RUNNER_TEMP/88W8964.elf"             -processor ARM:LE:32:v7             -analysisTimeoutPerFile 900             -scriptPath "$GITHUB_WORKSPACE/scripts/ghidra"             -postScript WrtRecoveryReport.java "$RUNNER_TEMP/wrt-ghidra-evidence/ghidra-report.json"             -postScript WrtCandidateReport.java "$RUNNER_TEMP/wrt-ghidra-evidence/command-candidates.json"             -deleteProject             | tee "$RUNNER_TEMP/wrt-ghidra-evidence/ghidra-headless.log"

      - name: Assert public-safe evidence only
        shell: bash
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/wrt-ghidra-evidence/elf-map.json"
          python3 -m json.tool "$RUNNER_TEMP/wrt-ghidra-evidence/ghidra-report.json" >/dev/null
          python3 -m json.tool "$RUNNER_TEMP/wrt-ghidra-evidence/command-candidates.json" >/dev/null
          if find "$RUNNER_TEMP/wrt-ghidra-evidence" -type f \( -name '*.bin' -o -name '*.elf' -o -name '*.img' \) | grep -q .; then
            echo "firmware-bearing file leaked into evidence mailbox" >&2
            exit 1
          fi

      - name: Upload derived Ghidra evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrt3200acm-ghidra-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wrt-ghidra-evidence
          if-no-files-found: warn
          retention-days: 7
