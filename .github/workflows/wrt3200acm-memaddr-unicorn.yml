name: WRT3200ACM MEM_ADDR_ACCESS Unicorn Rehost

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instruction-level-rehost:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned Unicorn
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir unicorn==2.1.4
          python3 - <<'PY'
          import unicorn
          print("unicorn",unicorn.__version__)
          assert unicorn.__version__=="2.1.4"
          PY

      - name: Acquire and reconstruct pinned 88W8964
        shell: bash
        env:
          FW_URL: https://raw.githubusercontent.com/kaloz/mwlwifi/b0aeee507f1534ae40fab9d2420a6319e1f33de5/bin/firmware/88W8964.bin
          FW_SHA256: ca23f5bb730fde399359a716481651c120e09c299d4e6bbec6fe718c6e87e751
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wrt-unicorn/evidence"
          curl -fL --retry 3 --retry-all-errors "$FW_URL" -o "$RUNNER_TEMP/wrt-unicorn/88W8964.bin"
          echo "$FW_SHA256  $RUNNER_TEMP/wrt-unicorn/88W8964.bin" | sha256sum -c -
          python3 scripts/wrt3200acm_fw_to_elf.py \
            "$RUNNER_TEMP/wrt-unicorn/88W8964.bin" \
            "$RUNNER_TEMP/wrt-unicorn/88W8964.elf" \
            "$RUNNER_TEMP/wrt-unicorn/evidence/elf-map.json"

      - name: Differentially execute recovered handler
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/wrt3200acm_memaddr_unicorn.py \
            --elf "$RUNNER_TEMP/wrt-unicorn/88W8964.elf" \
            --out "$RUNNER_TEMP/wrt-unicorn/evidence"
          python3 -m json.tool "$RUNNER_TEMP/wrt-unicorn/evidence/memaddr-unicorn-differential.json" >/dev/null

      - name: Verify derived-only mailbox
        shell: bash
        run: |
          set -euo pipefail
          if find "$RUNNER_TEMP/wrt-unicorn/evidence" -type f \( -name '*.bin' -o -name '*.elf' -o -name '*.img' \) | grep -q .; then
            echo "firmware-bearing file leaked into evidence mailbox" >&2
            exit 1
          fi

      - name: Upload instruction-level rehost evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrt3200acm-memaddr-unicorn-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wrt-unicorn/evidence
          if-no-files-found: warn
          retention-days: 7
