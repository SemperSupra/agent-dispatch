name: WRT3200ACM Stock W8964 Lineage

on:
  pull_request:
    paths:
      - '.github/workflows/wrt3200acm-stock-w8964-lineage.yml'
      - 'scripts/wrt3200acm_stock_w8964_lineage.py'
      - 'scripts/jffs2_target_extract.py'
      - 'tests/test_wrt3200acm_stock_w8964_lineage.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identify-stock-w8964:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Confirm required tools
        shell: bash
        run: |
          set -euo pipefail
          command -v curl

      - name: Test lineage tooling
        run: python3 -m unittest -v tests/test_wrt3200acm_stock_w8964_lineage.py

      - name: Acquire pinned stock image and extract W8964 transiently
        shell: bash
        env:
          FW_URL: https://downloads.linksys.com/support/assets/firmware/FW_WRT3200ACM_1.0.9.211585_prod.img
          FW_SHA256: 4c4cdeec1f4c3eb15ae597b225dd75874eff1893dbe0fafc67ddd0b03e17198c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wrt-lineage/evidence"
          curl -fL --retry 3 --retry-all-errors "$FW_URL" -o "$RUNNER_TEMP/wrt-lineage/stock.img"
          echo "$FW_SHA256  $RUNNER_TEMP/wrt-lineage/stock.img" | sha256sum -c -
          tail -c +6291457 "$RUNNER_TEMP/wrt-lineage/stock.img" > "$RUNNER_TEMP/wrt-lineage/rootfs.jffs2"
          python3 scripts/jffs2_target_extract.py "$RUNNER_TEMP/wrt-lineage/rootfs.jffs2" \
            --path /lib/modules/3.10.70/W8964.bin \
            --output "$RUNNER_TEMP/wrt-lineage/W8964.bin" \
            --metadata "$RUNNER_TEMP/wrt-lineage/evidence/W8964.jffs2-reconstruction.json"
          echo "ca23f5bb730fde399359a716481651c120e09c299d4e6bbec6fe718c6e87e751  $RUNNER_TEMP/wrt-lineage/W8964.bin" | sha256sum -c -

      - name: Compare stock firmware against public history
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/wrt3200acm_stock_w8964_lineage.py \
            "$RUNNER_TEMP/wrt-lineage/W8964.bin" \
            --out "$RUNNER_TEMP/wrt-lineage/evidence/stock-w8964-lineage.json"
          python3 -m json.tool "$RUNNER_TEMP/wrt-lineage/evidence/stock-w8964-lineage.json" >/dev/null

      - name: Verify metadata-only mailbox
        shell: bash
        run: |
          set -euo pipefail
          if find "$RUNNER_TEMP/wrt-lineage/evidence" -type f \( -name '*.bin' -o -name '*.img' -o -name '*.elf' \) | grep -q .; then
            echo "firmware-bearing file leaked into evidence mailbox" >&2
            exit 1
          fi

      - name: Upload lineage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrt3200acm-stock-w8964-lineage-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wrt-lineage/evidence
          if-no-files-found: warn
          retention-days: 7
