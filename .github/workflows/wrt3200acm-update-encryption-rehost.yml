name: WRT3200ACM UPDATE_ENCRYPTION Rehost

on:
  pull_request:
    paths:
      - '.github/workflows/wrt3200acm-update-encryption-rehost.yml'
      - 'scripts/wrt3200acm_update_encryption_unicorn.py'
      - 'tests/test_wrt3200acm_update_encryption_unicorn.py'
      - 'scripts/wrt3200acm_fw_to_elf.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-action-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install bounded execution tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl >/dev/null
          python3 -m pip install --disable-pip-version-check --no-cache-dir unicorn==2.1.4 >/dev/null
          python3 - <<'PY'
          import unicorn
          assert unicorn.__version__ == "2.1.4"
          print("unicorn",unicorn.__version__)
          PY

      - name: Test UPDATE_ENCRYPTION boundary model
        run: python3 -m unittest -v tests/test_wrt3200acm_update_encryption_unicorn.py

      - name: Acquire and reconstruct pinned W8964
        shell: bash
        env:
          FW_URL: https://raw.githubusercontent.com/kaloz/mwlwifi/b0aeee507f1534ae40fab9d2420a6319e1f33de5/bin/firmware/88W8964.bin
          FW_SHA256: ca23f5bb730fde399359a716481651c120e09c299d4e6bbec6fe718c6e87e751
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wrt-updenc-rehost/evidence"
          curl -fL --retry 3 --retry-all-errors "$FW_URL" -o "$RUNNER_TEMP/wrt-updenc-rehost/88W8964.bin"
          echo "$FW_SHA256  $RUNNER_TEMP/wrt-updenc-rehost/88W8964.bin" | sha256sum -c -
          python3 scripts/wrt3200acm_fw_to_elf.py \
            "$RUNNER_TEMP/wrt-updenc-rehost/88W8964.bin" \
            "$RUNNER_TEMP/wrt-updenc-rehost/88W8964.elf" \
            "$RUNNER_TEMP/wrt-updenc-rehost/evidence/elf-map.json"

      - name: Execute recovered UPDATE_ENCRYPTION action boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/wrt3200acm_update_encryption_unicorn.py \
            --elf "$RUNNER_TEMP/wrt-updenc-rehost/88W8964.elf" \
            --out "$RUNNER_TEMP/wrt-updenc-rehost/evidence"
          python3 -m json.tool "$RUNNER_TEMP/wrt-updenc-rehost/evidence/update-encryption-unicorn-boundary.json" >/dev/null

      - name: Verify derived-only evidence
        shell: bash
        run: |
          set -euo pipefail
          if find "$RUNNER_TEMP/wrt-updenc-rehost/evidence" -type f \( -name '*.bin' -o -name '*.elf' -o -name '*.img' \) | grep -q .; then
            echo "firmware-bearing file leaked into evidence mailbox" >&2
            exit 1
          fi

      - name: Upload UPDATE_ENCRYPTION rehost evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrt3200acm-update-encryption-rehost-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wrt-updenc-rehost/evidence
          if-no-files-found: warn
          retention-days: 7
