{% set tpl = ix_lib.base.render.Render(values) %}
{% set c = tpl.add_container(values.consts.container_name, "image") %}

{% do c.environment.add_env("SEMPER_SECRET_DIR", values.consts.secret_dir) %}
{% do c.add_storage(values.consts.config_dir, dict(values.storage.config, **{"read_only": true})) %}
{% do c.add_storage(values.consts.secret_dir, dict(values.storage.provider_secrets, **{"read_only": true})) %}
{% do c.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}

{% do c.healthcheck.set_test("http", {"port": values.consts.internal_web_port, "path": "/health/liveliness"}) %}
{% do c.healthcheck.set_interval(30) %}
{% do c.healthcheck.set_timeout(5) %}
{% do c.healthcheck.set_start_period(120) %}
{% do c.healthcheck.set_retries(5) %}

{% do tpl.portals.add(values.network.web_port, {"name": "LiteLLM API", "scheme": "http"}) %}

{{ tpl.render() | tojson }}
